<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Mark — Skydive</title>
  <script src="/assets/disable-native-zoom.js"></script>
  <script src="https://unpkg.com/@zenberry/quico@latest/dist/quico.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap");

    @font-face {
      font-family: "Myriad Pro";
      src: url("https://res.cloudinary.com/zenberry/raw/upload/v1752586755/fonts/myriadpro_light.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    #chat {
      width: min(900px, 100%);
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0) max(24px, env(safe-area-inset-right, 0)) env(safe-area-inset-bottom, 0) max(24px, env(safe-area-inset-left, 0));
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 38px;
      padding: clamp(42px, 10vh, 96px) 0 48px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      display: none;
    }

    .message {
      width: min(76%, 620px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.mark {
      align-self: flex-start;
      text-align: left;
    }

    .message.you {
      align-self: flex-end;
      text-align: right;
    }

    .speaker {
      margin-bottom: 6px;
      color: #777;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .content {
      font-size: clamp(18px, 2.15vw, 22px);
      font-weight: 400;
      line-height: 1.42;
    }

    .content a {
      color: inherit;
      text-decoration-thickness: 0.06em;
      text-underline-offset: 0.16em;
    }

    .content.secret-content {
      cursor: pointer;
      -webkit-text-security: disc;
    }

    .content.secret-content.revealed {
      -webkit-text-security: none;
    }

    .message.pending .content {
      color: #999;
      animation: breathe 1.25s ease-in-out infinite alternate;
    }

    #version-counter {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      z-index: 1000;
      padding: 4px 7px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      color: #6b7280;
      font: 500 12px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      pointer-events: none;
    }

    #version-counter[hidden] {
      display: none;
    }

    @keyframes breathe {
      to { opacity: 0.35; }
    }

    #composer {
      flex: none;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      column-gap: 14px;
      border-top: 1px solid #dedede;
      padding: 18px 0 max(22px, env(safe-area-inset-bottom, 0));
      background: #fff;
    }

    #attachment-tray {
      grid-column: 2 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 0;
      margin-bottom: 8px;
    }

    #attachment-tray[hidden] {
      display: none;
    }

    .attachment-chip {
      max-width: min(100%, 320px);
      overflow: hidden;
      border: 1px solid #d7d7d7;
      border-radius: 7px;
      padding: 4px 8px 5px;
      background: #fafafa;
      color: #555;
      font-size: 13px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #current-user-bullet {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--user-bullet-border, #111);
      border-radius: 50%;
      background: var(--user-bullet-bg, #111);
      color: var(--user-bullet-fg, #fff);
      font: 700 10px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      user-select: none;
    }

    #current-user-bullet.has-bullet-image {
      border: 0;
      background: transparent var(--user-bullet-image) center / contain no-repeat;
      color: transparent;
      font-size: 0;
    }

    #prompt {
      width: 100%;
      min-height: 30px;
      max-height: 150px;
      resize: none;
      overflow-y: auto;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111;
      font-family: inherit;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.45;
    }

    #prompt::placeholder {
      color: #aaa;
      opacity: 1;
    }

    #prompt.concealed {
      -webkit-text-security: disc;
    }

    #visibility {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
    }

    #visibility svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    #visibility .eye-slash {
      display: none;
    }

    #visibility[aria-pressed="true"] .eye-slash {
      display: block;
    }

    #send {
      min-width: 32px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #111;
      font-family: inherit;
      font-size: 19px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
    }

    #send:disabled {
      color: #bbb;
      cursor: default;
    }

    @media (max-width: 600px) {
      #chat {
        padding-left: max(18px, env(safe-area-inset-left, 0));
        padding-right: max(18px, env(safe-area-inset-right, 0));
      }

      #messages {
        gap: 30px;
        padding-top: 34px;
        padding-bottom: 34px;
      }

      .message {
        width: 86%;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      #messages { scroll-behavior: auto; }
      .message.pending .content { animation: none; }
    }
  </style>
</head>
<body>
  <quico hidden>M</quico>
  <div id="version-counter" aria-label="Application version" hidden></div>
  <main id="chat">
    <section id="messages" aria-live="polite" aria-label="Conversation with Mark"></section>
    <form id="composer">
      <div id="attachment-tray" aria-label="Pending attachments" hidden></div>
      <div id="current-user-bullet" aria-label="Current user" title="Logged out">?</div>
      <textarea id="prompt" rows="1" maxlength="8000" autocomplete="off" placeholder="Message Mark" aria-label="Message Mark"></textarea>
      <button id="visibility" type="button" aria-label="Hide input" aria-pressed="false" title="Hide input">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
          <circle cx="12" cy="12" r="2.5"></circle>
          <path class="eye-slash" d="M4 4l16 16"></path>
        </svg>
      </button>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </main>

  <script>
    const messagesElement = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const attachmentTray = document.getElementById("attachment-tray");
    const currentUserBullet = document.getElementById("current-user-bullet");
    const versionCounter = document.getElementById("version-counter");
    const prompt = document.getElementById("prompt");
    const visibility = document.getElementById("visibility");
    const send = document.getElementById("send");
    const params = new URLSearchParams(window.location.search);
    const markDebug = params.get("debug") === "true";
    const history = [];
    let waiting = false;
    let secretExpected = false;
    let concealed = false;
    let currentUser = null;
    let bookContext = null;
    let pendingAttachments = [];
    let restoredBookHistory = false;

    async function loadAppVersion() {
      try {
        const response = await fetch("/", { headers: { "Accept": "text/html" }, cache: "no-store" });
        const html = await response.text();
        const match = html.match(/\bconst\s+APP_VERSION\s*=\s*(\d+)\b/);
        if (response.ok && match) {
          versionCounter.textContent = `v${match[1]}`;
          return;
        }
      } catch (error) {
        console.error("Version lookup failed:", error);
      }
      versionCounter.textContent = "v?";
    }

    function boundedText(value, limit = 5000) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text.length > limit ? `${text.slice(0, limit).trim()}...` : text;
    }

    function normalizeBookContext(value) {
      if (!value || typeof value !== "object") return null;
      const title = boundedText(value.title || value.name || "", 240);
      const id = Number(value.id);
      return title ? {
        title,
        ...(Number.isInteger(id) && id > 0 ? { id } : {}),
        markHistory: normalizeBookHistory(value.markHistory)
      } : null;
    }

    function normalizeBookHistory(value) {
      const list = Array.isArray(value) ? value : [];
      return list.map((message) => {
        if (!message || typeof message !== "object") return null;
        const role = message.role === "assistant" ? "assistant" : message.role === "user" ? "user" : "";
        const content = String(message.content || "").trim();
        return role && content ? { role, content } : null;
      }).filter(Boolean).slice(-80);
    }

    function notifyBookHistoryChanged() {
      if (!bookContext || !bookContext.id || window.parent === window) return;
      window.parent.postMessage({
        type: "skydive:mark-history",
        book: { id: bookContext.id, title: bookContext.title },
        history: normalizeBookHistory(history)
      }, window.location.origin);
    }

    function restoreBookHistory(nextHistory) {
      const normalized = normalizeBookHistory(nextHistory);
      if (!normalized.length || restoredBookHistory) return;
      restoredBookHistory = true;
      history.splice(0, history.length, ...normalized);
      messagesElement.replaceChildren();
      normalized.forEach((message) => {
        addMessage(message.role, message.content, {
          speaker: message.role === "assistant" ? currentAssistantName() : undefined
        });
      });
    }

    function renderAttachmentTray() {
      attachmentTray.replaceChildren();
      pendingAttachments.forEach((attachment) => {
        const chip = document.createElement("div");
        chip.className = "attachment-chip";
        chip.textContent = attachment.title;
        chip.title = attachment.title;
        attachmentTray.append(chip);
      });
      attachmentTray.hidden = pendingAttachments.length === 0;
    }

    function addPendingAttachments(attachments) {
      const next = Array.isArray(attachments) ? attachments : [];
      const normalized = next.map((attachment) => {
        const title = boundedText(attachment && attachment.title, 160);
        const text = boundedText(attachment && attachment.text, 6000);
        return title && text ? { title, text } : null;
      }).filter(Boolean);
      if (!normalized.length) return;
      pendingAttachments = [...pendingAttachments, ...normalized].slice(-6);
      renderAttachmentTray();
      prompt.focus();
    }

    function buildContextualMessage(content, attachments) {
      const sections = [];
      if (bookContext && bookContext.title) sections.push(`Current book: ${bookContext.title}`);
      attachments.forEach((attachment) => {
        sections.push(`${attachment.title}:\n${attachment.text}`);
      });
      return sections.length ? `${sections.join("\n\n")}\n\nUser message:\n${content}` : content;
    }

    function normalizeAvatarColor(value) {
      const match = String(value || "").trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!match) return "";
      const hex = match[1].toLowerCase();
      return hex.length === 3
        ? `#${hex.split("").map((digit) => digit + digit).join("")}`
        : `#${hex}`;
    }

    function normalizeUser(value) {
      if (!value || typeof value !== "object") return null;
      const id = typeof value.id === "string" ? value.id.trim() : "";
      const nickname = typeof value.nickname === "string" ? value.nickname.trim() : "";
      const accentColor = normalizeAvatarColor(value.accentColor);
      return id && nickname ? { id, nickname, ...(accentColor ? { accentColor } : {}) } : null;
    }

    function avatarRgb(hex) {
      const color = normalizeAvatarColor(hex) || "#111111";
      const value = color.slice(1);
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function avatarHex({ r, g, b }) {
      return `#${[r, g, b].map((channel) => (
        Math.max(0, Math.min(255, Math.round(channel))).toString(16).padStart(2, "0")
      )).join("")}`;
    }

    function avatarLuminance(hex) {
      const { r, g, b } = avatarRgb(hex);
      return [r, g, b].map((channel) => {
        const value = channel / 255;
        return value <= 0.03928 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
      }).reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0);
    }

    function mixAvatarColor(hex, targetHex, amount) {
      const source = avatarRgb(hex);
      const target = avatarRgb(targetHex);
      return avatarHex({
        r: source.r + (target.r - source.r) * amount,
        g: source.g + (target.g - source.g) * amount,
        b: source.b + (target.b - source.b) * amount
      });
    }

    function drawQuicoAvatarDataUrl(character, palette) {
      const glyph = Array.from(String(character || "").trim())[0] || "?";
      const cacheKey = [glyph, palette.background, palette.border, palette.foreground].join("|");
      const cache = drawQuicoAvatarDataUrl.cache || (drawQuicoAvatarDataUrl.cache = new Map());
      if (cache.has(cacheKey)) return cache.get(cacheKey);

      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext("2d");
      if (!context) return "";

      const center = size / 2;
      const radius = size * 0.44;
      context.clearRect(0, 0, size, size);
      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.closePath();
      context.fillStyle = palette.background;
      context.fill();
      context.lineWidth = 24;
      context.strokeStyle = palette.border;
      context.stroke();

      const fontSize = Math.round(size * 0.56);
      context.fillStyle = palette.foreground;
      context.textAlign = "left";
      context.textBaseline = "alphabetic";
      context.font = `700 ${fontSize}px Roboto, "Helvetica Neue", Arial, sans-serif`;

      const metrics = context.measureText(glyph);
      const left = Number.isFinite(metrics.actualBoundingBoxLeft) ? metrics.actualBoundingBoxLeft : 0;
      const right = Number.isFinite(metrics.actualBoundingBoxRight) ? metrics.actualBoundingBoxRight : metrics.width;
      const ascent = Number.isFinite(metrics.actualBoundingBoxAscent) ? metrics.actualBoundingBoxAscent : fontSize * 0.5;
      const descent = Number.isFinite(metrics.actualBoundingBoxDescent) ? metrics.actualBoundingBoxDescent : fontSize * 0.5;
      context.fillText(glyph, center + (left - right) / 2, center + (ascent - descent) / 2);

      const dataUrl = canvas.toDataURL("image/png");
      cache.set(cacheKey, dataUrl);
      return dataUrl;
    }

    function getAvatarPalette(accentColor) {
      const background = normalizeAvatarColor(accentColor) || "#111111";
      const luminance = avatarLuminance(background);
      const foreground = luminance > 0.58 ? "#111111" : "#ffffff";
      const border = luminance > 0.72
        ? "#111111"
        : luminance < 0.18
          ? mixAvatarColor(background, "#000000", 0.45)
          : mixAvatarColor(background, "#000000", 0.36);
      return { background, foreground, border };
    }

    function renderCurrentUserBullet() {
      const palette = getAvatarPalette(currentUser && currentUser.accentColor);
      const glyph = currentUser ? Array.from(currentUser.nickname)[0] || "?" : "?";
      const dataUrl = drawQuicoAvatarDataUrl(glyph, palette);
      currentUserBullet.style.setProperty("--user-bullet-bg", palette.background);
      currentUserBullet.style.setProperty("--user-bullet-border", palette.border);
      currentUserBullet.style.setProperty("--user-bullet-fg", palette.foreground);
      currentUserBullet.textContent = glyph;
      if (dataUrl) {
        currentUserBullet.classList.add("has-bullet-image");
        currentUserBullet.style.setProperty("--user-bullet-image", `url("${dataUrl}")`);
      } else {
        currentUserBullet.classList.remove("has-bullet-image");
        currentUserBullet.style.removeProperty("--user-bullet-image");
      }
      currentUserBullet.title = currentUser ? currentUser.nickname : "Logged out";
      currentUserBullet.setAttribute("aria-label", currentUser ? `Current user: ${currentUser.nickname}` : "Logged out");
    }

    function setCurrentUser(value) {
      currentUser = normalizeUser(value);
      renderCurrentUserBullet();
    }

    async function loadCurrentUser() {
      try {
        const response = await fetch("/api/mark", { method: "GET", headers: { "Accept": "application/json" } });
        const data = await response.json().catch(() => ({}));
        if (response.ok && Object.prototype.hasOwnProperty.call(data, "user")) setCurrentUser(data.user);
      } catch (error) {
        console.error("Current user lookup failed:", error);
      }
    }

    function currentAssistantName() {
      return "Mark";
    }

    function appendLinkedText(parent, text) {
      const source = String(text || "");
      const pattern = /\[([^\]\n]{1,240})\]\((\/[^)\s]{0,1000})\)/g;
      let lastIndex = 0;
      let match;
      while ((match = pattern.exec(source)) !== null) {
        if (match.index > lastIndex) parent.append(document.createTextNode(source.slice(lastIndex, match.index)));
        const link = document.createElement("a");
        link.href = match[2];
        link.textContent = match[1].replace(/\\([[\]\\])/g, "$1");
        parent.append(link);
        lastIndex = pattern.lastIndex;
      }
      if (lastIndex < source.length) parent.append(document.createTextNode(source.slice(lastIndex)));
    }

    function addMessage(role, content, options = {}) {
      const article = document.createElement("article");
      article.className = `message ${role === "assistant" ? "mark" : "you"}${options.pending ? " pending" : ""}`;

      const speaker = document.createElement("div");
      speaker.className = "speaker";
      speaker.textContent = role === "assistant" ? (options.speaker || currentAssistantName()) : "You";

      const body = document.createElement("div");
      body.className = "content";
      if (role === "assistant") appendLinkedText(body, content);
      else body.textContent = content;
      if (options.secret) {
        body.classList.add("secret-content");
        body.title = "Click to show or hide";
        body.tabIndex = 0;
        const toggle = () => body.classList.toggle("revealed");
        body.addEventListener("click", toggle);
        body.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          toggle();
        });
      }

      article.append(speaker, body);
      messagesElement.append(article);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return article;
    }

    function assistantHistoryContent(reply) {
      const withoutDebug = String(reply || "").replace(/\n\nDebug error:\n[\s\S]*$/, "").trim();
      const bulletCount = (withoutDebug.match(/^• /gm) || []).length;
      if (/^Here are your active Skydive spaces:/m.test(withoutDebug) && bulletCount) {
        return `[Mark listed ${bulletCount} active Skydive spaces.]`;
      }
      if (/^Links from nodes created on /m.test(withoutDebug) && bulletCount) {
        return `[Mark listed ${bulletCount} links from nodes created on the requested date.]`;
      }
      if (/^Nodes created on /m.test(withoutDebug) && bulletCount) {
        return `[Mark listed ${bulletCount} nodes created on the requested date.]`;
      }
      if (/^Nodes containing /m.test(withoutDebug) && bulletCount) {
        return `[Mark listed ${bulletCount} nodes matching the requested search.]`;
      }
      return withoutDebug.length > 1200
        ? `${withoutDebug.slice(0, 1200).trim()}\n[Previous assistant reply truncated for context.]`
        : withoutDebug;
    }

    function userHistoryContent(content) {
      const text = String(content || "").trim();
      return text.length > 2400
        ? `${text.slice(0, 2400).trim()}\n[Previous user message truncated for context.]`
        : text;
    }

    function messageForRequest(message) {
      if (!message || typeof message !== "object") return null;
      if (message.role === "assistant") return { role: "assistant", content: assistantHistoryContent(message.content) };
      if (message.role === "user") return { role: "user", content: userHistoryContent(message.content) };
      return null;
    }

    function parseResponseBody(text) {
      try {
        return text ? JSON.parse(text) : {};
      } catch (error) {
        return {};
      }
    }

    function httpErrorMessage(response, data, rawText, assistantName) {
      const base = data.error || data.reply || (response.status === 504
        ? `${assistantName}’s request took too long. Please try a narrower question.`
        : `${assistantName} could not answer right now.`);
      if (!markDebug) return base;
      const details = rawText && !data.error && !data.reply ? `\n\nResponse body:\n${rawText.slice(0, 4000)}` : "";
      return `${base}\n\nHTTP debug:\nstatus=${response.status} ${response.statusText || ""}${details}`;
    }

    function resizePrompt() {
      prompt.style.height = "auto";
      prompt.style.height = `${Math.min(prompt.scrollHeight, 150)}px`;
      const hasContent = secretExpected || concealed ? prompt.value.length > 0 : Boolean(prompt.value.trim());
      send.disabled = waiting || !hasContent;
    }

    function setConcealed(nextConcealed) {
      concealed = Boolean(nextConcealed);
      prompt.classList.toggle("concealed", concealed);
      visibility.setAttribute("aria-pressed", String(concealed));
      visibility.setAttribute("aria-label", concealed ? "Show input" : "Hide input");
      visibility.title = concealed ? "Show input" : "Hide input";
    }

    function setSecretExpected(expected) {
      secretExpected = Boolean(expected);
      setConcealed(secretExpected);
    }

    async function submitMessage() {
      const rawContent = prompt.value;
      const submittedSecret = secretExpected || concealed;
      const content = submittedSecret ? rawContent : rawContent.trim();
      if ((!submittedSecret && !content) || waiting) return;

      waiting = true;
      const attachments = pendingAttachments;
      pendingAttachments = [];
      renderAttachmentTray();
      prompt.value = "";
      resizePrompt();
      addMessage("user", content, { secret: submittedSecret });
      const contextualContent = submittedSecret ? content : buildContextualMessage(content, attachments);
      const requestHistory = [
        ...history.map(messageForRequest).filter(Boolean),
        { role: "user", content: contextualContent }
      ];
      history.push({ role: "user", content: submittedSecret ? "[hidden input]" : content });
      notifyBookHistoryChanged();
      const assistantName = currentAssistantName();
      const pending = addMessage("assistant", "…", { pending: true, speaker: assistantName });

      try {
        const response = await fetch("/api/mark", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: requestHistory.slice(-24),
            debug: markDebug,
            secret: submittedSecret,
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"
          })
        });
        const rawResponseText = await response.text();
        const data = parseResponseBody(rawResponseText);
        if (!response.ok) {
          throw new Error(httpErrorMessage(response, data, rawResponseText, assistantName));
        }

        const reply = typeof data.reply === "string" ? data.reply.trim() : "";
        if (!reply) throw new Error(`${assistantName} returned an empty response.`);
        if (Object.prototype.hasOwnProperty.call(data, "user")) setCurrentUser(data.user);
        history.push({ role: "assistant", content: reply });
        pending.remove();
        addMessage("assistant", reply, { speaker: assistantName });
        notifyBookHistoryChanged();
        setSecretExpected(data.secretInput === true);
      } catch (error) {
        pending.classList.remove("pending");
        const pendingContent = pending.querySelector(".content");
        pendingContent.replaceChildren();
        pendingContent.textContent = error.message || `${assistantName} could not answer right now.`;
        history.push({ role: "assistant", content: pendingContent.textContent });
        notifyBookHistoryChanged();
      } finally {
        waiting = false;
        resizePrompt();
        prompt.focus();
      }
    }

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      submitMessage();
    });

    prompt.addEventListener("input", resizePrompt);
    visibility.addEventListener("click", () => {
      setConcealed(!concealed);
      resizePrompt();
      prompt.focus();
    });
    prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        submitMessage();
      }
    });
    window.addEventListener("keydown", (event) => {
      if (
        event.key === "Tab" &&
        !event.altKey &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.shiftKey
      ) {
        event.preventDefault();
        versionCounter.hidden = !versionCounter.hidden;
      }
    });

    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin || !event.data || typeof event.data !== "object") return;
      if (event.data.type === "skydive:book-context") {
        bookContext = normalizeBookContext(event.data.book);
        if (bookContext) restoreBookHistory(bookContext.markHistory);
        return;
      }
      if (event.data.type === "skydive:mark-attachments") {
        bookContext = normalizeBookContext(event.data.book) || bookContext;
        addPendingAttachments(event.data.attachments);
      }
    });

    if (params.has("book")) {
      bookContext = normalizeBookContext({ title: params.get("book") || "" });
    }

    void loadAppVersion();
    const greeting = params.get("notice") || "Hi. I’m Mark. Ask me anything—or ask me to work with a Skydive space.";
    renderCurrentUserBullet();
    addMessage("assistant", greeting, { speaker: currentAssistantName() });
    void loadCurrentUser();
    prompt.focus();
  </script>
</body>
</html>
