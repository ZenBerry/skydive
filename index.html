      if (!mobilePointerSession) return;
      const session = mobilePointerSession;
      if (mobilePointerSession.longPressTimer !== null) {
        clearTimeout(mobilePointerSession.longPressTimer);
      }
      mobilePointerSession.longPressTimer = null;
      mobilePointerSession = null;
      cancelMobileTargetPointer(session);
    }

    function getMobileTouchEntries() {
      return Array.from(mobileTouchPoints.entries());
    }

    function getMobileTouchDistance(first, second) {
      return Math.hypot(first.clientX - second.clientX, first.clientY - second.clientY);
    }

    function getMobileTouchCenter(first, second) {
      return {
        clientX: (first.clientX + second.clientX) / 2,
        clientY: (first.clientY + second.clientY) / 2
      };
    }

    function cancelMobileAttitudeRotation() {
      if (!mobileAttitudeSession) return;
      const pointerId = mobileAttitudeSession.pointerId;
      if (viewport.hasPointerCapture(pointerId)) {
        viewport.releasePointerCapture(pointerId);
      }
      mobileAttitudeSession = null;
    }

    function beginMobilePinchGesture() {
      if (!IS_MOBILE_DEVICE || nativeGestureActive || Date.now() < suppressMobilePointerPinchUntil) return;
      const entries = getMobileTouchEntries();
      if (entries.length < 2 || mobilePinchSession) return;

      const [[firstPointerId, first], [secondPointerId, second]] = entries;
      const startDistance = getMobileTouchDistance(first, second);
      if (!Number.isFinite(startDistance) || startDistance <= 0) return;

      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      cancelMobileCanvasSessions(firstPointerId);
      cancelMobileCanvasSessions(secondPointerId);
      cancelMobilePointerTrackingSession();
      cancelMobileAttitudeRotation();

      const center = getMobileTouchCenter(first, second);
      mobilePinchSession = {
        pointerIds: new Set([firstPointerId, secondPointerId]),
        startDistance,
        startScale: camera.scale,
        startRotation: camera.rotation,
        centerWorld: screenToWorld(center.clientX, center.clientY)
      };
    }

    function updateMobilePinchGesture(event) {
      if (!mobilePinchSession) return false;
      if (!mobilePinchSession.pointerIds.has(event.pointerId)) return false;

      const points = Array.from(mobilePinchSession.pointerIds)
        .map((pointerId) => mobileTouchPoints.get(pointerId))
        .filter(Boolean);
      if (points.length !== 2) {
        mobilePinchSession = null;
        return false;
      }

      const distance = getMobileTouchDistance(points[0], points[1]);
      if (!Number.isFinite(distance) || distance <= 0) return true;

      const center = getMobileTouchCenter(points[0], points[1]);
      setCameraTransformForWorldPoint(
        mobilePinchSession.centerWorld,
        center.clientX,
        center.clientY,
        mobilePinchSession.startScale * (distance / mobilePinchSession.startDistance),
        mobilePinchSession.startRotation
      );
      event.preventDefault();
      event.stopPropagation();
      return true;
    }

    function endMobilePinchGesture(event) {
      if (!mobilePinchSession || !mobilePinchSession.pointerIds.has(event.pointerId)) return;
      mobilePinchSession = null;
    }

    function recordMobileTouchPoint(event) {
      if (
        event.pointerType !== "touch" ||
        !(event.target instanceof Node) ||
        !viewport.contains(event.target)
      ) return;
      mobileTouchPoints.set(event.pointerId, {
        clientX: event.clientX,
        clientY: event.clientY
      });
      beginMobilePinchGesture();
      if (mobilePinchSession && mobilePinchSession.pointerIds.has(event.pointerId)) {
        event.preventDefault();
        event.stopPropagation();
      }
    }

    function updateMobileTouchPoint(event) {
      if (event.pointerType !== "touch" || !mobileTouchPoints.has(event.pointerId)) return;
      mobileTouchPoints.set(event.pointerId, {
        clientX: event.clientX,
        clientY: event.clientY
      });
      updateMobilePinchGesture(event);
    }

    function removeMobileTouchPoint(event) {
      if (event.pointerType !== "touch") return;
      endMobilePinchGesture(event);
      mobileTouchPoints.delete(event.pointerId);
    }

    function cancelMobileSessionsForPinch() {
      const pointerIds = new Set([
        panSession ? panSession.pointerId : null,
        marqueeSession ? marqueeSession.pointerId : null
      ]);
      pointerIds.delete(null);
      for (const pointerId of pointerIds) {
        cancelMobileCanvasSessions(pointerId);
      }
      cancelMobileAttitudeRotation();
      cancelMobilePointerTrackingSession();
    }

    function getGestureZoomCenter(event) {
      if (IS_MOBILE_DEVICE) {
        const touches = event.touches && event.touches.length >= 2
          ? Array.from(event.touches).slice(0, 2).map((touch) => ({
              clientX: touch.clientX,
              clientY: touch.clientY
            }))
          : Array.from(mobileTouchPoints.values()).slice(0, 2);
        if (touches.length === 2) {
          return {
            clientX: (touches[0].clientX + touches[1].clientX) / 2,
            clientY: (touches[0].clientY + touches[1].clientY) / 2
          };
        }
      }

      return {
        clientX: event.clientX || window.innerWidth / 2,
        clientY: event.clientY || window.innerHeight / 2
      };
    }

    function cancelMobileTargetPointer(session) {
      if (!(session.target instanceof Element)) return;
      const node = session.target.closest(".text-node");
      if (!node || !world.contains(node) || typeof PointerEvent !== "function") return;

      session.target.dispatchEvent(new PointerEvent("pointercancel", {
        bubbles: true,
        cancelable: false,
        pointerId: session.pointerId,
        pointerType: "touch",
        clientX: session.clientX,
        clientY: session.clientY
      }));
    }

    function triggerMobileLongPress(session) {
      if (!session || session.moved || mobilePointerSession !== session) return;
      session.longPressed = true;
      lastMobileTap = null;
      mobileLongPressPointerIds.add(session.pointerId);
      suppressMobileClickUntil = Date.now() + 3000;
      mobileSuppressedClickTarget = session.target;
      cancelMobileCanvasSessions(session.pointerId, { restorePanPosition: true });
      setSelectedNodes(session.selectedNodes);
      if (
        session.node &&
        world.contains(session.node) &&
        Number.isFinite(session.nodeX) &&
        Number.isFinite(session.nodeY)
      ) {
        setNodePosition(session.node, session.nodeX, session.nodeY);
      }
      cancelMobileTargetPointer(session);

      if (!(session.target instanceof Element) || !document.contains(session.target)) return;
      session.target.dispatchEvent(new MouseEvent("contextmenu", {
        bubbles: true,
        cancelable: true,
        view: window,
        button: 2,
        buttons: 0,
        clientX: session.clientX,
        clientY: session.clientY
      }));
    }

    function beginMobilePointerTracking(event) {
      if (
        event.pointerType !== "touch" ||
        event.button !== 0 ||
        event.isPrimary === false ||
        !(event.target instanceof Node) ||
        !viewport.contains(event.target)
      ) return;

      if (mobilePointerSession && mobilePointerSession.longPressTimer !== null) {
        clearTimeout(mobilePointerSession.longPressTimer);
      }

      const node = event.target instanceof Element
        ? event.target.closest(".text-node")
        : null;
      const session = {
        pointerId: event.pointerId,
        target: event.target,
        node: node && world.contains(node) ? node : null,
        nodeX: node && world.contains(node) ? Number(node.dataset.x) : NaN,
        nodeY: node && world.contains(node) ? Number(node.dataset.y) : NaN,
        selectedNodes: Array.from(selectedNodes),
        startClientX: event.clientX,
        startClientY: event.clientY,
        clientX: event.clientX,
        clientY: event.clientY,
        moved: false,
        longPressed: false,
        longPressTimer: null
      };
      session.longPressTimer = setTimeout(
        () => triggerMobileLongPress(session),
        MOBILE_LONG_PRESS_MS
      );
      mobilePointerSession = session;
    }

    function updateMobilePointerTracking(event) {
      const session = mobilePointerSession;
      if (!session || event.pointerId !== session.pointerId) return;
      session.clientX = event.clientX;
      session.clientY = event.clientY;
      if (
        Math.hypot(
          session.clientX - session.startClientX,
          session.clientY - session.startClientY
        ) > MOBILE_GESTURE_MOVE_TOLERANCE_PX
      ) {
        session.moved = true;
        if (session.longPressTimer !== null) {
          clearTimeout(session.longPressTimer);
          session.longPressTimer = null;
        }
      }
    }

    function endMobilePointerTracking(event, cancelled = false) {
      const session = mobilePointerSession;
      if (!session || event.pointerId !== session.pointerId) return;
      if (session.longPressTimer !== null) clearTimeout(session.longPressTimer);
      session.longPressTimer = null;
      session.clientX = event.clientX;
      session.clientY = event.clientY;

      const movedDistance = Math.hypot(
        session.clientX - session.startClientX,
        session.clientY - session.startClientY
      );
      if (
        !cancelled &&
        !session.longPressed &&
        !session.moved &&
        movedDistance <= MOBILE_GESTURE_MOVE_TOLERANCE_PX
      ) {
        registerMobileTap(session.target, session.clientX, session.clientY);
      }

      mobilePointerSession = null;
      if (session.longPressed) {
        setTimeout(() => mobileLongPressPointerIds.delete(session.pointerId), 0);
      }
    }

    function suppressMobileNativeDblClick(event) {
      if (!(event.target instanceof Node) || !viewport.contains(event.target)) return;
      event.preventDefault();
      if (Date.now() > suppressMobileNativeDblClickUntil) return;
      event.stopImmediatePropagation();
    }

    function suppressMobileClickAfterLongPress(event) {
      if (
        Date.now() > suppressMobileClickUntil ||
        !mobileSuppressedClickTarget ||
        !(event.target instanceof Node) ||
        !viewport.contains(event.target)
      ) {
        if (Date.now() > suppressMobileClickUntil) mobileSuppressedClickTarget = null;
        return;
      }
      const suppressedElement = mobileSuppressedClickTarget instanceof Element
        ? mobileSuppressedClickTarget
        : null;
      if (
        event.target !== mobileSuppressedClickTarget &&
        !(suppressedElement && suppressedElement.contains(event.target)) &&
        !(event.target instanceof Element && event.target.contains(mobileSuppressedClickTarget))
      ) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      mobileSuppressedClickTarget = null;
      suppressMobileClickUntil = 0;
    }

    function initializeMobileExperience() {
      if (!IS_MOBILE_DEVICE) return;
      document.body.classList.add("mobile-device");
      mobileToolbar.hidden = false;
      updateMobileInteractionControls();
      updateMobileHistoryControls();
      updateMobileSelectionControls();

      mobilePanBtn.addEventListener("click", () => setMobileInteractionMode("pan"));
      mobileSelectBtn.addEventListener("click", () => setMobileInteractionMode("select"));
      mobileAttitudeBtn.addEventListener("click", () => setMobileInteractionMode("attitude"));
      mobileUndoBtn.addEventListener("click", () => undoHistory());
      mobileRedoBtn.addEventListener("click", () => redoHistory());
      mobileDeleteBtn.addEventListener("click", () => deleteSelectedNodes());

      window.addEventListener("pointerdown", recordMobileTouchPoint, { capture: true });
      window.addEventListener("pointermove", updateMobileTouchPoint, { capture: true });
      window.addEventListener("pointerup", removeMobileTouchPoint, { capture: true });
      window.addEventListener("pointercancel", removeMobileTouchPoint, { capture: true });
      window.addEventListener("pointerdown", beginMobilePointerTracking, { capture: true });
      window.addEventListener("pointermove", updateMobilePointerTracking, { capture: true });
      window.addEventListener("pointerup", (event) => endMobilePointerTracking(event), { capture: true });
      window.addEventListener("pointercancel", (event) => endMobilePointerTracking(event, true), { capture: true });
      window.addEventListener("dblclick", suppressMobileNativeDblClick, { capture: true });
      window.addEventListener("click", suppressMobileClickAfterLongPress, { capture: true });
    }

    function beginGroupTransform(event, mode, captureElement) {
      if (event.button !== 0) return;
      if (selectedNodes.size === 0 || !selectionBoundsWorld) return;

      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

      const selectionRotation = selectionOverlayRotation;
      const boundsCenterLocal = getBoundsCenter(selectionBoundsWorld);
      const boundsCenter = selectionLocalToWorld(boundsCenterLocal, selectionRotation);
      const startPointer = screenToWorld(event.clientX, event.clientY);
      groupTransform = {
        pointerId: event.pointerId,
        mode,
        captureElement,
        handle: captureElement.dataset.handle || "se",
        selectionRotation,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startPointer,
        startPointerLocal: worldToSelectionLocal(startPointer, selectionRotation),
        startAngle: Math.atan2(startPointer.y - boundsCenter.y, startPointer.x - boundsCenter.x),
        center: boundsCenter,
        initialBounds: { ...selectionBoundsWorld },
        moved: false,
        nodeSnapshots: Array.from(selectedNodes).map((node) => {
          const center = getNodeWorldCenter(node);
          return {
            node,
            x: Number(node.dataset.x),
            y: Number(node.dataset.y),
            localX: worldToSelectionLocal({ x: Number(node.dataset.x), y: Number(node.dataset.y) }, selectionRotation).x,
            localY: worldToSelectionLocal({ x: Number(node.dataset.x), y: Number(node.dataset.y) }, selectionRotation).y,
            centerX: center ? center.x : Number(node.dataset.x),
            centerY: center ? center.y : Number(node.dataset.y),
            baseFontSize: Number(node.dataset.baseFontSize),
            rotation: getNodeRotation(node)
          };
        })
      };

      captureElement.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopPropagation();
    }

    function getResizeTransformDeltas(transform, pointer) {
      const pointerLocal = worldToSelectionLocal(pointer, transform.selectionRotation);
      const dx = pointerLocal.x - transform.startPointerLocal.x;
      const dy = pointerLocal.y - transform.startPointerLocal.y;
      const handle = transform.handle;
      return {
        x: handle.includes("w") ? -dx : handle.includes("e") ? dx : 0,
        y: handle.includes("n") ? -dy : handle.includes("s") ? dy : 0
      };
    }

    function getResizeAnchor(bounds, handle) {
      return {
        x: handle.includes("w") ? bounds.maxX : bounds.minX,
        y: handle.includes("n") ? bounds.maxY : bounds.minY
      };
    }

    function updateGroupTransform(event) {
      if (!groupTransform || event.pointerId !== groupTransform.pointerId) return;
      if (
        event.type === "pointermove" &&
        event.pointerType === "mouse" &&
        (event.buttons & 1) === 0
      ) {
        endGroupTransform(event);
        return;
      }

      const pointer = screenToWorld(event.clientX, event.clientY);
      const dx = pointer.x - groupTransform.startPointer.x;
      const dy = pointer.y - groupTransform.startPointer.y;
      if (!groupTransform.moved && Math.hypot(
        event.clientX - groupTransform.startClientX,
        event.clientY - groupTransform.startClientY
      ) >= MARQUEE_DRAG_THRESHOLD_PX) {
        groupTransform.moved = true;
      }

      if (groupTransform.mode === "drag") {
        for (const snapshot of groupTransform.nodeSnapshots) {
          setNodePosition(snapshot.node, snapshot.x + dx, snapshot.y + dy, { skipSelectionUpdate: true });
        }
        refreshSelectionBounds();
        return;
      }

      if (groupTransform.mode === "rotate") {
        const nextAngle = Math.atan2(
          pointer.y - groupTransform.center.y,
          pointer.x - groupTransform.center.x
        );
        const rotationDelta = normalizeRotation(nextAngle - groupTransform.startAngle);
        selectionOverlayRotation = normalizeRotation(groupTransform.selectionRotation + rotationDelta);
        for (const snapshot of groupTransform.nodeSnapshots) {
          const nextCenter = rotatePointAround(
            { x: snapshot.centerX, y: snapshot.centerY },
            groupTransform.center,
            rotationDelta
          );
          const nextRotation = normalizeRotation(snapshot.rotation + rotationDelta);
          if (Math.abs(nextRotation) >= 0.000001) {
            snapshot.node.dataset.rotation = String(nextRotation);
          } else {
            delete snapshot.node.dataset.rotation;
          }
          setNodeCenteredAtWorldPoint(snapshot.node, nextCenter.x, nextCenter.y, { skipSelectionUpdate: true });
        }
        refreshSelectionBounds();
        return;
      }

      const initialWidth = Math.max(0.001, groupTransform.initialBounds.width);
      const initialHeight = Math.max(0.001, groupTransform.initialBounds.height);
      const deltas = getResizeTransformDeltas(groupTransform, pointer);
      const nextWidth = Math.max(0.001, initialWidth + deltas.x);
      const nextHeight = Math.max(0.001, initialHeight + deltas.y);
      const scaleX = nextWidth / initialWidth;
      const scaleY = nextHeight / initialHeight;
      const fontScale = Math.sqrt(scaleX * scaleY);
      const anchor = getResizeAnchor(groupTransform.initialBounds, groupTransform.handle);

      for (const snapshot of groupTransform.nodeSnapshots) {
        const nextLocal = {
          x: anchor.x + (snapshot.localX - anchor.x) * scaleX,
          y: anchor.y + (snapshot.localY - anchor.y) * scaleY
        };
        const nextWorld = selectionLocalToWorld(nextLocal, groupTransform.selectionRotation);
        snapshot.node.dataset.baseFontSize = String(
          Math.max(0.001, snapshot.baseFontSize * fontScale)
        );
        setNodePosition(snapshot.node, nextWorld.x, nextWorld.y, { skipSelectionUpdate: true });
      }

      refreshSelectionBounds();
    }

    function endGroupTransform(event) {
      if (!groupTransform || event.pointerId !== groupTransform.pointerId) return;
      const { captureElement, pointerId } = groupTransform;
      const shouldToggleMode = groupTransform.mode === "drag" && !groupTransform.moved;
      if (captureElement.hasPointerCapture(pointerId)) {
        captureElement.releasePointerCapture(pointerId);
      }
      if (groupTransform.moved) suppressSelectionModeToggleUntil = Date.now() + 250;
      groupTransform = null;
      if (shouldToggleMode) toggleSelectionHandleMode();
      refreshSelectionBounds();
      if (!shouldToggleMode) scheduleAutosave();
    }

    function render() {
      for (const node of world.children) {
        renderNode(node);
      }
      renderLineConnections();
      renderGroupSelectionBox();
      renderNavigationFitMarkers();
    }

    function screenToWorld(clientX, clientY) {
      const scale = getCameraScale();
      const basis = getCameraBasis();
      const dx = clientX - camera.x;
      const dy = clientY - camera.y;
      return {
        x: (dx * basis.cos + dy * basis.sin) / scale,
        y: (-dx * basis.sin + dy * basis.cos) / scale
      };
    }

    function setNodePosition(node, x, y, options = {}) {
      const { skipSelectionUpdate = false } = options;
      node.dataset.x = String(x);
      node.dataset.y = String(y);
      renderNode(node);
      requestLineRender();
      if (!skipSelectionUpdate && selectedNodes.has(node)) {
        refreshSelectionBounds();
      }
    }

    function setNodeCenteredAtWorldPoint(node, centerX, centerY, options = {}) {
      const size = getNodeWorldSize(node);
      const rotation = getNodeRotation(node);
      const basis = getCameraBasis(rotation);
      const offsetX = size.width * 0.5 * basis.cos - size.height * 0.5 * basis.sin;
      const offsetY = size.width * 0.5 * basis.sin + size.height * 0.5 * basis.cos;
      setNodePosition(node, centerX - offsetX, centerY - offsetY, options);
    }

    function renderNode(node) {
      const worldX = Number(node.dataset.x);
      const worldY = Number(node.dataset.y);
      const metrics = getNodeRenderMetrics(node);
      const scale = metrics.cameraScale;
      const rotation = getCameraRotation();
      const nodeRotation = getNodeRotation(node);
      const totalRotation = normalizeRotation(rotation + nodeRotation);
      const screenPoint = worldToScreen(worldX, worldY, scale, rotation);
      node.style.left = `${screenPoint.x}px`;
      node.style.top = `${screenPoint.y}px`;
      node.style.setProperty("--camera-scale", String(metrics.screenScale));
      if (isCommandNode(node)) {
        node.style.fontSize = `${metrics.layoutFontPx}px`;
        node.style.minWidth = "0px";
        node.style.transform = `rotate(${totalRotation}rad) scale(${metrics.screenScale})`;
        node.style.transformOrigin = "top left";
      } else {
        node.style.fontSize = `${metrics.layoutFontPx}px`;
        node.style.minWidth = `${getTextNodeMinWidthScreenPx(metrics.visualFontPx) / metrics.screenScale}px`;
        node.style.transform = `rotate(${totalRotation}rad) scale(${metrics.screenScale})`;
        node.style.transformOrigin = "top left";
      }
    }

    function zoomTo(newScale, clientX, clientY) {
      setCameraTransformAt(clientX, clientY, newScale, camera.rotation);

    function rotateTo(newRotation, clientX, clientY) {
      setCameraTransformAt(clientX, clientY, camera.scale, newRotation);

    function cancelPhysicalWheelZoomAnimation() {
      if (physicalWheelZoomAnimationFrame !== null) {
        cancelAnimationFrame(physicalWheelZoomAnimationFrame);
      }
      physicalWheelZoomAnimationFrame = null;
      physicalWheelZoomAnimation = null;
    }

    function runPhysicalWheelZoomAnimation(now) {
      if (!physicalWheelZoomAnimation) {
        physicalWheelZoomAnimationFrame = null;
        return;
      }

      const animation = physicalWheelZoomAnimation;
      const progress = clamp(
        (now - animation.startTime) / PHYSICAL_WHEEL_ZOOM_DURATION_MS,
        0,
        1
      );
      const eased = 1 - Math.pow(1 - progress, 3);
      camera.x = animation.startX + (animation.targetX - animation.startX) * eased;
      camera.y = animation.startY + (animation.targetY - animation.startY) * eased;
      camera.scale = animation.startScale + (animation.targetScale - animation.startScale) * eased;
      render();

      if (progress < 1) {
        physicalWheelZoomAnimationFrame = requestAnimationFrame(runPhysicalWheelZoomAnimation);
        return;
      }

      physicalWheelZoomAnimation = null;
      physicalWheelZoomAnimationFrame = null;
      scheduleViewportSave();
    }

    function smoothPhysicalWheelZoom(factor, clientX, clientY) {
      const accumulatedScale = physicalWheelZoomAnimation
        ? physicalWheelZoomAnimation.targetScale
        : camera.scale;
      const targetScale = accumulatedScale * factor;
      if (!Number.isFinite(targetScale) || targetScale <= 0) return;

      const worldPoint = screenToWorld(clientX, clientY);
      const targetOffset = getCameraScreenOffset(worldPoint.x, worldPoint.y, targetScale, camera.rotation);
      physicalWheelZoomAnimation = {
        startTime: performance.now(),
        startX: camera.x,
        startY: camera.y,
        startScale: camera.scale,
        targetX: clientX - targetOffset.x,
        targetY: clientY - targetOffset.y,
        targetScale
      };

      if (physicalWheelZoomAnimationFrame === null) {
        physicalWheelZoomAnimationFrame = requestAnimationFrame(runPhysicalWheelZoomAnimation);
      }
    }

    function selectAllText(node) {
      const selection = window.getSelection();

      range.selectNodeContents(node);
      selection.removeAllRanges();

    function startEditing(node, selectAll = false) {

        lines: lineConnections.map(serializeLineConnection)

      const titleHook = getTitleHookState();

    function getSharedSpaceUrl(slug = SHARED_SPACE_SLUG) {
      const params = new URLSearchParams({ slug });
      return `/.netlify/functions/spaces?${params.toString()}`;
    }

    async function readJsonResponse(response, onDownloadProgress) {
      const reportProgress = typeof onDownloadProgress === "function" ? onDownloadProgress : null;
      const contentLength = Number(response.headers.get("Content-Length")) || 0;
      if (!response.body || typeof TextDecoder !== "function") {
        const data = await response.json();
        if (reportProgress) reportProgress(1);
        return data;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      const chunks = [];
      let loaded = 0;

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(decoder.decode(value, { stream: true }));
          loaded += value.byteLength;
          if (reportProgress && contentLength > 0) {
            reportProgress(Math.min(0.98, loaded / contentLength));
          }
        }
      } finally {
        reader.releaseLock();
      }

      chunks.push(decoder.decode());
      if (reportProgress) reportProgress(1);
      return JSON.parse(chunks.join(""));
    }

    async function requestSharedSpace(options = {}) {
      const { slug = SHARED_SPACE_SLUG, onDownloadProgress = null, ...fetchOptions } = options;
      const response = await fetch(getSharedSpaceUrl(slug), {
        headers: {
          "Accept": "application/json",
          ...(fetchOptions.body ? { "Content-Type": "application/json" } : {})
        },
        ...fetchOptions
      });

      if (!response.ok) {
        throw new Error(`Shared space request failed: ${response.status}`);
      }

      return readJsonResponse(response, onDownloadProgress);
    }

    async function saveCurrentState() {

          if (Object.prototype.hasOwnProperty.call(data, "viewer")) setCurrentUser(data.viewer);
          resetSharedPollingCadence();
          scheduleSharedPoll(getSharedPollDelay());
        } finally {
          savingSharedState = false;
        }
        return;

      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function getHistorySnapshot() {

    function resetHistoryToCurrentState() {
      clearTimeout(historyTimer);
      historyTimer = null;
      currentHistorySnapshot = getHistorySnapshot();
      undoStack = [currentHistorySnapshot];
      redoStack = [];
      updateMobileHistoryControls();
    }

    function commitHistorySnapshot(options = {}) {
      if (suppressAutosave || applyingSharedState || applyingHistoryState) return false;

      const { clearRedo = true } = options;
      const snapshot = getHistorySnapshot();
      if (snapshot === currentHistorySnapshot) {
        updateMobileHistoryControls();
        return false;
      }

      undoStack.push(snapshot);
      currentHistorySnapshot = snapshot;
      if (undoStack.length > HISTORY_LIMIT) {
        undoStack.splice(0, undoStack.length - HISTORY_LIMIT);
      }
      if (clearRedo) redoStack = [];
      updateMobileHistoryControls();
      return true;
    }

    function scheduleHistoryCommit() {
      if (suppressAutosave || applyingSharedState || applyingHistoryState) return;
      clearTimeout(historyTimer);
      historyTimer = setTimeout(() => {
        historyTimer = null;
        commitHistorySnapshot();
      }, HISTORY_COMMIT_DELAY_MS);
      updateMobileHistoryControls();
    }

    function flushHistoryCommit() {
      if (historyTimer !== null) {
        clearTimeout(historyTimer);
        historyTimer = null;
      }
      commitHistorySnapshot();
    }

    function restoreHistorySnapshot(snapshot) {
      if (!snapshot) return false;

      try {
        applyingHistoryState = true;
        const state = JSON.parse(snapshot);
        loadState(state, { autosave: false });
      } catch (error) {
        console.error("History restore failed:", error);
        return false;
      } finally {
        applyingHistoryState = false;
      }

      currentHistorySnapshot = snapshot;
      scheduleAutosave();
      return true;
    }

    function undoHistory() {
      flushHistoryCommit();
      if (undoStack.length <= 1) return false;

      const currentSnapshot = undoStack[undoStack.length - 1];
      const previousSnapshot = undoStack[undoStack.length - 2];
      if (!restoreHistorySnapshot(previousSnapshot)) return false;

      undoStack.pop();
      redoStack.push(currentSnapshot);
      if (IS_MOBILE_DEVICE) clearPendingHistoryCommit();
      updateMobileHistoryControls();
      return true;
    }

    function redoHistory() {
      flushHistoryCommit();
      if (redoStack.length === 0) return false;

      const nextSnapshot = redoStack[redoStack.length - 1];
      if (!restoreHistorySnapshot(nextSnapshot)) return false;

      redoStack.pop();
      undoStack.push(nextSnapshot);
      if (IS_MOBILE_DEVICE) clearPendingHistoryCommit();
      updateMobileHistoryControls();
      return true;
    }

    function scheduleAutosave() {
      if (suppressAutosave || applyingSharedState) return;
      markDeloreanModified();
      scheduleHistoryCommit();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        void saveCurrentState().catch((error) => {
          console.error("Autosave failed:", error);
        });
      }, 120);
    }

    function saveViewportToSession() {

    function loadViewportFromSession() {
      let raw = "";
      try {
        raw = sessionStorage.getItem(getViewportStorageKey()) || "";
      } catch (error) {
        console.error("Viewport restore failed:", error);
        return false;
      }
      if (!raw) return false;

      try {
        const nextCamera = JSON.parse(raw);
        const x = Number(nextCamera.x);
        const y = Number(nextCamera.y);
        const scale = Number(nextCamera.scale);
        const rotation = Number(nextCamera.rotation || 0);
        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(scale) || scale <= 0 || !Number.isFinite(rotation)) {
          throw new Error("Invalid viewport state.");
        }
        camera.x = x;
        camera.y = y;
        camera.scale = scale;
        camera.rotation = normalizeRotation(rotation);
        return true;
      } catch (error) {
        console.error("Viewport restore failed:", error);
        try {
          sessionStorage.removeItem(getViewportStorageKey());
        } catch (storageError) {
          console.error("Viewport cleanup failed:", storageError);

    function restoreStateNode(entry) {
      const x = Number.isFinite(Number(entry.x)) ? Number(entry.x) : 0;
      const y = Number.isFinite(Number(entry.y)) ? Number(entry.y) : 0;
      const text = typeof entry.text === "string" ? entry.text : "";
      const html = typeof entry.html === "string" ? sanitizeNodeHtml(entry.html) : null;
      const id = typeof entry.id === "string" ? entry.id : "";
      const baseFontSize = Number.isFinite(Number(entry.baseFontSize)) && Number(entry.baseFontSize) > 0
        ? Number(entry.baseFontSize)
        : BASE_TEXT_PX / camera.scale;
      const rotation = Number.isFinite(Number(entry.rotation))
        ? normalizeRotation(Number(entry.rotation))
        : 0;
      if (entry.kind === "command") {
        const commandId = typeof entry.commandId === "string" ? entry.commandId : "";
        const commandVersion = typeof entry.commandVersion === "string" ? entry.commandVersion : "";
        const commandState = entry.commandState && typeof entry.commandState === "object"
          ? entry.commandState
          : {};
        createCommandNode(x, y, commandId, commandState, baseFontSize, id, commandVersion, {
          createdAt: entry.createdAt,
          deletedAt: entry.deletedAt,
          createdBy: entry.createdBy,
          rotation,

        });
      } else {
        createTextNode(x, y, text, baseFontSize, id, html, {
          createdAt: entry.createdAt,
          deletedAt: entry.deletedAt,
          createdBy: entry.createdBy,

        });

    }

    function loadState(state, options = {}) {
      if (!state || typeof state !== "object") {
        throw new Error("Invalid state file.");
      }

      if (options.incremental === true) {
        return loadStateIncrementally(state, options);
      }

      const { autosave = true, onProgress = null } = options;
      const nextNodes = Array.isArray(state.nodes) ? state.nodes : [];
      const nextLines = Array.isArray(state.lines) ? state.lines : [];
      const nextTitleHook = state.titleHook && typeof state.titleHook === "object"
        ? normalizeTitleHookNodeId(state.titleHook.nodeId)
        : "";
      const nextMeta = state.meta && typeof state.meta === "object" ? cloneJson(state.meta, {}) : {};
      const reportProgress = typeof onProgress === "function" ? onProgress : null;

      suppressAutosave = true;
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      cancelLineDraft();
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      closeLinkNodeDialog();
      closeSlashCommandMenu();
      clearSelection();
      hideMarqueeRect();
      marqueeSession = null;
      panSession = null;
      viewport.classList.remove("panning");
      groupTransform = null;
      navigationFitTargetNode = null;
      for (const node of Array.from(world.children)) {
        destroyCommandNodeContent(node);
        unobserveNodeForLines(node);
      }
      world.innerHTML = "";
      nextNodeNumber = 1;
      nextLineNumber = 1;
      lineConnections = [];
      titleHookNodeId = nextTitleHook;
      spaceMeta = nextMeta;
      deloreanModified = Boolean(
        DELOREAN_SPACE_INFO.active &&
        spaceMeta.delorean &&
        typeof spaceMeta.delorean === "object" &&
        spaceMeta.delorean.modifiedAt
      );
      updateDocumentTitle();

      nextNodes.forEach((entry, index) => {
        restoreStateNode(entry);
        if (reportProgress) reportProgress((index + 1) / Math.max(1, nextNodes.length));
      });

      loadLineConnections(nextLines);
      updateDocumentTitle();

      if (nextNodes.length === 0 && reportProgress) reportProgress(1);

      suppressAutosave = false;
      render();
      if (autosave) scheduleAutosave();
    }

    async function loadStateIncrementally(state, options = {}) {
      if (!state || typeof state !== "object") {
        throw new Error("Invalid state file.");
      }

      const { autosave = true, onProgress = null } = options;
      const nextNodes = Array.isArray(state.nodes) ? state.nodes : [];
      const nextLines = Array.isArray(state.lines) ? state.lines : [];
      const nextTitleHook = state.titleHook && typeof state.titleHook === "object"
        ? normalizeTitleHookNodeId(state.titleHook.nodeId)
        : "";
      const nextMeta = state.meta && typeof state.meta === "object" ? cloneJson(state.meta, {}) : {};
      const reportProgress = typeof onProgress === "function" ? onProgress : null;
      const reportClearing = createLoadingProgressRange(0, 0.1, reportProgress);
      const reportNodes = createLoadingProgressRange(0.1, 0.76, reportProgress);
      const reportLines = createLoadingProgressRange(0.76, 0.9, reportProgress);
      const reportRender = createLoadingProgressRange(0.9, 1, reportProgress);
      const yieldEvery = Math.max(1, Number(options.yieldEvery) || 40);

      suppressAutosave = true;
      try {
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        cancelLineDraft();
        closeNodeContextMenu();
        closeLineContextMenu();
        closeCanvasContextMenu();
        closeLinkNodeDialog();
        closeSlashCommandMenu();
        clearSelection();
        hideMarqueeRect();
        marqueeSession = null;
        panSession = null;
        viewport.classList.remove("panning");
        groupTransform = null;
        navigationFitTargetNode = null;

        const currentNodes = Array.from(world.children);
        for (let index = 0; index < currentNodes.length; index += 1) {
          const node = currentNodes[index];
          destroyCommandNodeContent(node);
          unobserveNodeForLines(node);
          if (reportClearing) reportClearing((index + 1) / Math.max(1, currentNodes.length));
          if ((index + 1) % yieldEvery === 0) await waitForLoadingFrame();
        }
        world.innerHTML = "";
        if (reportClearing) reportClearing(1);
        await waitForLoadingFrame();

        nextNodeNumber = 1;
        nextLineNumber = 1;
        lineConnections = [];
        titleHookNodeId = nextTitleHook;
        spaceMeta = nextMeta;
        deloreanModified = Boolean(
          DELOREAN_SPACE_INFO.active &&
          spaceMeta.delorean &&
          typeof spaceMeta.delorean === "object" &&
          spaceMeta.delorean.modifiedAt
        );
        updateDocumentTitle();

        for (let index = 0; index < nextNodes.length; index += 1) {
          restoreStateNode(nextNodes[index]);
          if (reportNodes) reportNodes((index + 1) / Math.max(1, nextNodes.length));
          if ((index + 1) % yieldEvery === 0) await waitForLoadingFrame();
        }
        if (reportNodes) reportNodes(1);
        await waitForLoadingFrame();

        loadLineConnections(nextLines, { onProgress: reportLines });
        updateDocumentTitle();
        await waitForLoadingFrame();

        if (reportRender) reportRender(0.4);
        render();
        if (reportRender) reportRender(1);
      } finally {
        suppressAutosave = false;
      }

      if (autosave) scheduleAutosave();
    }

    function getFileExtension(fileName) {
      const name = typeof fileName === "string" ? fileName.trim() : "";
      const dotIndex = name.lastIndexOf(".");
      if (dotIndex <= 0 || dotIndex === name.length - 1) return "";
      return name.slice(dotIndex + 1).toLowerCase();
    }

    function getCloudinaryAttachmentUrl(url) {
      const href = normalizeExternalHref(url);
      if (!href) return "";

      const marker = "/upload/";
      const markerIndex = href.indexOf(marker);
      if (markerIndex === -1) return href;

      return `${href.slice(0, markerIndex + marker.length)}fl_attachment/${href.slice(markerIndex + marker.length)}`;
    }

    function getUploadErrorMessage(error) {
      const message = error && error.message ? String(error.message).trim() : "";
      return (message || "Upload failed.").slice(0, 180);

    function createUploadingFileState(file) {
      const fileName = file && file.name ? file.name : "Untitled file";
      return {
        status: "uploading",
        progress: 0,
        fileName,
        extension: getFileExtension(fileName),
        mimeType: file && file.type ? file.type : "",
        bytes: file && Number.isFinite(Number(file.size)) ? Number(file.size) : 0,
        url: "",
        downloadUrl: "",
        resourceType: "",
        startedAt: Date.now()
      };
    }

    function createUploadedFileState(file, upload) {
      const fileName = file && file.name ? file.name : "Untitled file";
      const url = normalizeExternalHref(upload.secure_url || upload.url || "");
      if (!url) throw new Error("Cloudinary did not return a file URL.");

      return {
        status: "uploaded",
        progress: 100,
        fileName,
        extension: getFileExtension(fileName) || String(upload.format || "").toLowerCase(),
        mimeType: file && file.type ? file.type : "",
        bytes: Number.isFinite(Number(upload.bytes)) ? Number(upload.bytes) : Number(file.size) || 0,
        url,
        downloadUrl: getCloudinaryAttachmentUrl(url),
        resourceType: typeof upload.resource_type === "string" ? upload.resource_type : "",
        publicId: typeof upload.public_id === "string" ? upload.public_id : "",
        width: Number.isFinite(Number(upload.width)) ? Number(upload.width) : null,
        height: Number.isFinite(Number(upload.height)) ? Number(upload.height) : null,
        uploadedAt: Date.now()
      };
    }

    function createFailedFileState(file, error) {
      return {
        ...createUploadingFileState(file),
        status: "error",
        progress: 0,
        error: getUploadErrorMessage(error),
        failedAt: Date.now()
      };
    }

    async function requestCloudinaryUploadSignature(file) {
      const response = await fetch(CLOUDINARY_SIGNATURE_URL, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fileName: file.name || "",
          mimeType: file.type || "",
          bytes: Number(file.size) || 0,
          lastModified: Number(file.lastModified) || 0
        })
      });

      let data = null;
      try {
        data = await response.json();
      } catch (error) {
        data = null;
      }

      if (!response.ok) {
        throw new Error(data && data.error ? data.error : `Upload signature failed: ${response.status}`);
      }

      if (!data || !data.uploadUrl || !data.params || typeof data.params !== "object") {
        throw new Error("Upload signature response was incomplete.");
      }

      return data;
    }

    async function uploadFileToCloudinary(file, onProgress) {
      const signature = await requestCloudinaryUploadSignature(file);
      const formData = new FormData();

      for (const [key, value] of Object.entries(signature.params)) {
        formData.append(key, String(value));
      }
      formData.append("file", file);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", signature.uploadUrl);
        xhr.responseType = "json";

        xhr.upload.addEventListener("progress", (event) => {
          if (!event.lengthComputable || event.total <= 0) return;
          const progress = Math.min(99, Math.round((event.loaded / event.total) * 100));
          onProgress(progress);
        });

        xhr.addEventListener("load", () => {
          const body = xhr.response || {};
          if (xhr.status >= 200 && xhr.status < 300) {
            onProgress(100);
            resolve(body);
            return;
          }

          const cloudinaryMessage = body.error && body.error.message ? body.error.message : "";
          reject(new Error(cloudinaryMessage || `Cloudinary upload failed: ${xhr.status}`));
        });

        xhr.addEventListener("error", () => {
          reject(new Error("Network error while uploading file."));
        });

        xhr.addEventListener("abort", () => {
          reject(new Error("Upload was canceled."));
        });

        xhr.send(formData);
      });
    }

    function createFileUploadNode(file, worldX, worldY) {
      return createCommandNode(
        worldX,
        worldY,
        FILE_WIDGET_COMMAND_ID,
        createUploadingFileState(file),
        BASE_TEXT_PX / camera.scale
      );
    }

    function isAudioFile(file) {
      const mimeType = file && typeof file.type === "string" ? file.type.toLowerCase() : "";
      if (mimeType.startsWith("audio/")) return true;
      const extension = getFileExtension(file && file.name);
      return new Set(["aac", "aif", "aiff", "caf", "flac", "m4a", "mp3", "oga", "ogg", "opus", "wav", "wave", "webm"]).has(extension);
    }

    function createAudioUploadNode(file, worldX, worldY) {
      return createCommandNode(
        worldX,
        worldY,
        AUDIO_WIDGET_COMMAND_ID,
        {
          ...createUploadingFileState(file),
          label: file.name || "Audio",
          showSpeedControl: false,
          source: "drop"
        },
        BASE_TEXT_PX / camera.scale
      );
    }

    async function uploadFileForNode(file, node) {
      try {
        const upload = await uploadFileToCloudinary(file, (progress) => {
          const state = readCommandState(node);
          updateCommandNodeState(node, {
            ...state,
            status: "uploading",
            progress
          });
        });

        updateCommandNodeState(node, createUploadedFileState(file, upload));
      } catch (error) {
        console.error("File upload failed:", error);
        updateCommandNodeState(node, createFailedFileState(file, error));
      }
    }

    async function uploadAudioForNode(file, node) {
      try {
        const upload = await uploadFileToCloudinary(file, (progress) => {
          const state = readCommandState(node);
          updateCommandNodeState(node, {
            ...state,
            status: "uploading",
            progress,
            label: state.label || file.name || "Audio",
            showSpeedControl: false,
            source: "drop"
          });
        });

        updateCommandNodeState(node, {
          ...createUploadedFileState(file, upload),
          label: file.name || "Audio",
          showSpeedControl: false,
          source: "drop"
        });
      } catch (error) {
        console.error("Audio upload failed:", error);
        updateCommandNodeState(node, {
          ...createFailedFileState(file, error),
          label: file.name || "Audio",
          showSpeedControl: false,
          source: "drop"
        });
      }
    }

    function isFileDragEvent(event) {
      const transfer = event.dataTransfer;
      if (!transfer || !transfer.types) return false;
      return Array.from(transfer.types).includes("Files");
    }

    function getDroppedFiles(event) {
      const transfer = event.dataTransfer;
      if (!transfer || !transfer.files) return [];
      return Array.from(transfer.files).filter((file) => file && typeof file.name === "string");
    }

    function handleDroppedFiles(files, clientX, clientY) {
      if (files.length === 0) return;

      const point = screenToWorld(clientX, clientY);
      const offset = 18 / camera.scale;
      files.forEach((file, index) => {
        const x = point.x + index * offset;
        const y = point.y + index * offset;
        if (isAudioFile(file)) {
          const node = createAudioUploadNode(file, x, y);
          void uploadAudioForNode(file, node);
          return;
        }
        const node = createFileUploadNode(file, x, y);
        void uploadFileForNode(file, node);
      });
    }

    function attachNodeHandlers(node) {
      let dragPointerId = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let dragStartClientX = 0;
      let dragStartClientY = 0;
      let dragMoved = false;
      let pendingExternalLinkHref = "";
      let suppressExternalLinkVisit = false;

      node.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || node.classList.contains("editing")) return;
        if (event.target instanceof Element && event.target.closest(".internal-link")) return;
        if (event.target instanceof Element) {
          const externalLinkCard = event.target.closest(".external-link-card");
          if (externalLinkCard && event.target.closest("button, input, textarea, select")) return;
          pendingExternalLinkHref = normalizeExternalHref(externalLinkCard ? externalLinkCard.dataset.href : "");
        }
        if (isCommandNode(node) && isCommandInteractiveTarget(event.target)) return;
        if (selectedNodes.size > 0 && !selectedNodes.has(node)) {
          clearSelection();
        }
        closeNodeContextMenu();
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        dragPointerId = event.pointerId;
        node.setPointerCapture(dragPointerId);
        dragStartClientX = event.clientX;
        dragStartClientY = event.clientY;
        dragMoved = false;
        const pointer = screenToWorld(event.clientX, event.clientY);
        dragOffsetX = Number(node.dataset.x) - pointer.x;
        dragOffsetY = Number(node.dataset.y) - pointer.y;
        event.preventDefault();
        event.stopPropagation();
      });

      node.addEventListener("pointermove", (event) => {
        if (event.pointerId !== dragPointerId) return;
        if (!dragMoved && Math.hypot(event.clientX - dragStartClientX, event.clientY - dragStartClientY) >= MARQUEE_DRAG_THRESHOLD_PX) {
          dragMoved = true;
        }
        const pointer = screenToWorld(event.clientX, event.clientY);
        setNodePosition(node, pointer.x + dragOffsetX, pointer.y + dragOffsetY);
      });

      function endDrag(event) {
        if (event.pointerId !== dragPointerId) return;
        const wasMobileLongPress = mobileLongPressPointerIds.has(event.pointerId);
        if (node.hasPointerCapture(dragPointerId)) {
          node.releasePointerCapture(dragPointerId);
        }
        if (event.type === "pointerup" && pendingExternalLinkHref && !dragMoved && !wasMobileLongPress) {
          openExternalHref(pendingExternalLinkHref);
          suppressExternalLinkVisit = true;
        } else if (wasMobileLongPress) {
          suppressExternalLinkVisit = true;
        } else {
          suppressExternalLinkVisit = Boolean(pendingExternalLinkHref && dragMoved);
        }
        dragPointerId = null;
        pendingExternalLinkHref = "";
        scheduleAutosave();
      }

      node.addEventListener("pointerup", endDrag);
      node.addEventListener("pointercancel", endDrag);

      node.addEventListener("dblclick", (event) => {
        event.stopPropagation();
        if (isCommandNode(node)) return;
        if (isCalcVariableNode(node)) return;
        clearSelection();
        startEditing(node);
      });

      node.addEventListener("click", (event) => {
        if (handleExternalLinkAction(node, event)) return;
        if (suppressExternalLinkVisit) {
          suppressExternalLinkVisit = false;
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (handleExternalLinkVisit(node, event)) return;
        if (node.classList.contains("editing")) return;
        if (!(event.target instanceof Element)) return;
        const link = event.target.closest(".internal-link");
        if (selectedNodes.has(node) && !dragMoved && (!link || !node.contains(link))) {
          toggleSelectionHandleMode();
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (!link || !node.contains(link)) return;

        const targetId = (link.dataset.targetId || "").trim();
        if (!targetId) return;
        const targetNode = getNodeById(targetId);
        if (!targetNode) {
          alert(`Could not find node "${targetId}".`);
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        focusNodeFullScreen(targetNode);
      });

      node.addEventListener("input", () => {
        if (isCalcVariableNode(node)) return;
        autoLinkExternalUrls(node, { moveCaretToEnd: true });
        updateCalcVariables();
        updateDocumentTitle();
        scheduleAutosave();
        updateSlashMenuForNode(node);
      });

      node.addEventListener("paste", (event) => {
        if (isCalcVariableNode(node)) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        if (!insertSanitizedPaste(node, getSanitizedPasteHtml(event))) return;
        autoLinkExternalUrls(node, { force: true, moveCaretToEnd: true });
        updateCalcVariables();
        updateDocumentTitle();
        scheduleAutosave();
        updateSlashMenuForNode(node);
      });

      node.addEventListener("blur", () => {
        if (isCommandNode(node)) return;
        if (isCalcVariableNode(node)) return;
        autoLinkExternalUrls(node, { force: true });
        stopEditing(node);
        updateCalcVariables();
        closeSlashCommandMenu();
        updateDocumentTitle();
        scheduleAutosave();
      });

      node.addEventListener("keydown", (event) => {
        if (handleExternalLinkKeydown(node, event)) return;

        if (slashCommandSession && slashCommandSession.node === node) {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            slashCommandSelectedIndex = (slashCommandSelectedIndex + 1) % slashCommandSession.commands.length;
            renderSlashCommandMenu();
            return;
          }

          if (event.key === "ArrowUp") {
            event.preventDefault();
            slashCommandSelectedIndex =
              (slashCommandSelectedIndex - 1 + slashCommandSession.commands.length) % slashCommandSession.commands.length;
            renderSlashCommandMenu();
            return;
          }

          if (event.key === "Enter" || event.key === "Tab") {
            event.preventDefault();
            executeSlashCommand();
            return;
          }
        }

        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          node.blur();
        }

        if (event.key === "Escape") {
          event.preventDefault();
          if (slashCommandSession) {
            closeSlashCommandMenu();
            return;
          }
          node.blur();
        }
      });
    }

    function createTextNode(
      worldX,
      worldY,
      initialText = "",
      baseFontSize = BASE_TEXT_PX / camera.scale,
      preferredId = "",
      initialHtml = null,
      options = {}
    ) {
      const node = document.createElement("div");
      node.className = "text-node";
      node.dataset.nodeId = resolveNodeId(preferredId);
      if (typeof initialHtml === "string") {
        node.innerHTML = sanitizeNodeHtml(initialHtml);
      } else {
        node.textContent = initialText;
      }
      normalizeNodeMarkup(node);
      node.contentEditable = "false";

      // Keeps newly-created text visually consistent regardless of current zoom.
      node.dataset.baseFontSize = String(baseFontSize);
      const rotation = Object.prototype.hasOwnProperty.call(options, "rotation")
        ? Number(options.rotation)
        : getNewNodeRotation();
      const normalizedRotation = normalizeRotation(rotation);
      if (Math.abs(normalizedRotation) >= 0.000001) node.dataset.rotation = String(normalizedRotation);
      setNodeTimestamps(node, options);
      setNodeCreator(node, options.createdBy || (!options.preserveTimestamps ? currentUser : null));
      setNodePosition(node, worldX, worldY);
      if (options.variable === true) setCalcVariableNode(node, true);
      attachNodeHandlers(node);
      world.appendChild(node);
      if (!isNodeDeleted(node)) observeNodeForLines(node);
      scheduleAutosave();
      return node;
    }

    function createCommandNode(
      worldX,
      worldY,
      commandId,
      commandState = {},
      baseFontSize = BASE_TEXT_PX / camera.scale,
      preferredId = "",
      commandVersion = "",
      options = {}
    ) {
      const node = document.createElement("div");
      node.className = "text-node command-node";
      node.dataset.kind = "command";
      node.dataset.nodeId = resolveNodeId(preferredId);
      node.dataset.commandId = commandId;
      if (commandVersion) node.dataset.commandVersion = commandVersion;
      writeCommandState(node, commandState);
      node.contentEditable = "false";
      node.dataset.baseFontSize = String(baseFontSize);
      const rotation = Object.prototype.hasOwnProperty.call(options, "rotation")
        ? Number(options.rotation)
        : getNewNodeRotation();
      const normalizedRotation = normalizeRotation(rotation);
      if (Math.abs(normalizedRotation) >= 0.000001) node.dataset.rotation = String(normalizedRotation);
      setNodeTimestamps(node, options);
      setNodeCreator(node, options.createdBy || (!options.preserveTimestamps ? currentUser : null));
      setNodePosition(node, worldX, worldY);
      if (!isNodeDeleted(node)) renderCommandNodeContent(node);
      attachNodeHandlers(node);
      world.appendChild(node);
      if (!isNodeDeleted(node)) observeNodeForLines(node);
      scheduleAutosave();
      return node;
    }

    world.addEventListener("contextmenu", (event) => {
      if (!(event.target instanceof Element)) return;
      const node = event.target.closest(".text-node");
      if (!node || !world.contains(node)) return;

    drawLineBtn.addEventListener("click", (event) => {

      const menuRect = nodeContextMenu.getBoundingClientRect();
      const hasPointerLocation =
        Number.isFinite(event.clientX) &&
        Number.isFinite(event.clientY) &&
        event.clientX > 0 &&
        event.clientY > 0;
      const startX = hasPointerLocation ? event.clientX : menuRect.left + 12;

    linkSelectionBtn.addEventListener("click", (event) => {
      const sourceNode = contextMenuNode;
      const selectionRange = contextMenuSelectionRange;
      const menuRect = nodeContextMenu.getBoundingClientRect();
      const hasPointerLocation =
        Number.isFinite(event.clientX) &&
        Number.isFinite(event.clientY) &&
        event.clientX > 0 &&
        event.clientY > 0;
      const spawnX = hasPointerLocation ? event.clientX : menuRect.left + 12;
      const spawnY = hasPointerLocation ? event.clientY : menuRect.top + 12;
      closeNodeContextMenu();
      if (!sourceNode || !selectionRange) {

      openLinkNodeDialog(sourceNode, selectionRange, spawnX, spawnY);

    linkNodeDialogCancelBtn.addEventListener("click", () => {
      closeLinkNodeDialog();

    linkNodeDialogConfirmBtn.addEventListener("click", () => {

    linkNodeDialogInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {

        submitLinkNodeDialog();

      if (event.key === "Escape") {

        closeLinkNodeDialog();
      }
    });

    linkNodeDialogTitle.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || linkNodeDialog.hidden) return;
      const rect = linkNodeDialog.getBoundingClientRect();
      linkDialogDrag = {
        pointerId: event.pointerId,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top
      };
      linkNodeDialogTitle.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopPropagation();
    });

    linkNodeDialogTitle.addEventListener("pointermove", (event) => {
      if (!linkDialogDrag || event.pointerId !== linkDialogDrag.pointerId) return;
      positionLinkNodeDialog(
        event.clientX - linkDialogDrag.offsetX,
        event.clientY - linkDialogDrag.offsetY
      );
      event.preventDefault();
    });

    function endLinkNodeDialogDrag(event) {
      if (!linkDialogDrag || event.pointerId !== linkDialogDrag.pointerId) return;
      if (linkNodeDialogTitle.hasPointerCapture(linkDialogDrag.pointerId)) {
        linkNodeDialogTitle.releasePointerCapture(linkDialogDrag.pointerId);
      }
      linkDialogDrag = null;
    }

    linkNodeDialogTitle.addEventListener("pointerup", endLinkNodeDialogDrag);
    linkNodeDialogTitle.addEventListener("pointercancel", endLinkNodeDialogDrag);

    groupSelectionBox.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    groupSelectionBox.addEventListener("pointerdown", (event) => {
      if (event.target instanceof Element && event.target.closest(".group-selection-handle")) return;
      beginGroupTransform(event, "drag", groupSelectionBox);
    });

    for (const handle of groupSelectionHandles) {
      handle.addEventListener("pointerdown", (event) => {
        beginGroupTransform(event, selectionHandleMode, handle);
      });
    }

    window.addEventListener("pointermove", updateGroupTransform, { capture: true });
    window.addEventListener("pointerup", endGroupTransform, { capture: true });
    window.addEventListener("pointercancel", endGroupTransform, { capture: true });

    window.addEventListener("pointermove", updateLineDraftPointer, { capture: true });

    window.addEventListener("pointerdown", (event) => {
      if (!lineDraft) return;
      if (event.button !== 0) return;

      const targetNode = event.target instanceof Element
        ? event.target.closest(".text-node")
        : null;
      const lineTargetNode = targetNode && world.contains(targetNode)
        ? targetNode
        : getLineDraftHoverNode(event.clientX, event.clientY);
      event.preventDefault();
      event.stopImmediatePropagation();

      if (lineTargetNode && lineTargetNode !== lineDraft.sourceNode) {
        completeLineDraft(lineTargetNode);
      }
      cancelLineDraft();
    }, { capture: true });

    window.addEventListener("contextmenu", (event) => {
      if (!lineDraft) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      cancelLineDraft();
    }, { capture: true });

    window.addEventListener("pointerdown", (event) => {
      deactivateEditingNodeOnOutsidePointerDown(event.target);
      if (!slashCommandMenu.hidden && event.target instanceof Node && !slashCommandMenu.contains(event.target)) {
        const editingNode = getActiveEditingNode();
        if (!editingNode || !editingNode.contains(event.target)) closeSlashCommandMenu();
      }
      if (!nodeContextMenu.hidden) {
        if (event.target instanceof Node && nodeContextMenu.contains(event.target)) return;
        closeNodeContextMenu();
      }
      if (!lineContextMenu.hidden) {
        if (event.target instanceof Node && lineContextMenu.contains(event.target)) return;
        closeLineContextMenu();
      }
      if (!canvasContextMenu.hidden) {
        if (event.target instanceof Node && canvasContextMenu.contains(event.target)) return;
        closeCanvasContextMenu();
      }
    }, { capture: true });

    viewport.addEventListener("pointerdown", beginMobileAttitudeRotation, { capture: true });
    viewport.addEventListener("pointerdown", beginCanvasPan, { capture: true });

    viewport.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      if (event.target !== viewport && event.target !== world) return;
      if (
        IS_MOBILE_DEVICE &&
        event.pointerType === "touch" &&
        (mobileInteractionMode !== "select" || event.isPrimary === false)
      ) return;
      closeNodeContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      beginMarqueeSelection(event);
      event.preventDefault();
    });

    viewport.addEventListener("pointermove", updateCanvasPan);
    viewport.addEventListener("pointerup", endCanvasPan);
    viewport.addEventListener("pointercancel", endCanvasPan);

    viewport.addEventListener("pointermove", updateMobileAttitudeRotation);
    viewport.addEventListener("pointerup", endMobileAttitudeRotation);
    viewport.addEventListener("pointercancel", endMobileAttitudeRotation);

    viewport.addEventListener("pointermove", updateMarqueeSelection);
    viewport.addEventListener("pointerup", endMarqueeSelection);
    viewport.addEventListener("pointercancel", endMarqueeSelection);

    viewport.addEventListener("wheel", (event) => {
      event.preventDefault();
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation({ preservePhysicalWheelZoom: true });
      cancelNodeLayoutAnimation();

      if (event.altKey) {
        cancelPhysicalWheelZoomAnimation();
        rotateTo(camera.rotation + event.deltaY * ROTATION_SENSITIVITY, event.clientX, event.clientY);
      } else if (event.ctrlKey || event.metaKey) {
        const factor = Math.exp(-event.deltaY * ZOOM_SENSITIVITY);
        const isPhysicalWheelStep = detectPhysicalWheelStep(event);
        const isSuddenZoomJump =
          Math.abs(event.deltaY * ZOOM_SENSITIVITY) >= PHYSICAL_WHEEL_MIN_ZOOM_LOG_DELTA;
        if (isPhysicalWheelStep && hasPhysicalWheelInput && isSuddenZoomJump) {
          const physicalWheelFactor = Math.exp(-event.deltaY * PHYSICAL_WHEEL_ZOOM_SENSITIVITY);
          smoothPhysicalWheelZoom(physicalWheelFactor, event.clientX, event.clientY);
        } else {
          // Preserve native trackpad deltas and macOS momentum exactly as before.
          cancelPhysicalWheelZoomAnimation();
          zoomTo(camera.scale * factor, event.clientX, event.clientY);
        }
      } else {
        cancelPhysicalWheelZoomAnimation();
        camera.x -= event.deltaX;
        camera.y -= event.deltaY;
        render();
        scheduleViewportSave();
      }
    }, { passive: false });

    let gestureStartScale = camera.scale;
    let gestureStartRotation = camera.rotation;
    viewport.addEventListener("gesturestart", (event) => {
      event.preventDefault();
      nativeGestureActive = true;
      suppressMobilePointerPinchUntil = Date.now() + 400;
      mobilePinchSession = null;
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      if (IS_MOBILE_DEVICE) cancelMobileSessionsForPinch();
      gestureStartScale = camera.scale;
      gestureStartRotation = camera.rotation;
    });

    viewport.addEventListener("gesturechange", (event) => {
      event.preventDefault();
      const center = getGestureZoomCenter(event);
      const scale = Number.isFinite(event.scale) ? event.scale : 1;
      setCameraTransformAt(
        center.clientX,
        center.clientY,
        gestureStartScale * scale,
        gestureStartRotation
      );
    });

    viewport.addEventListener("gestureend", () => {
      nativeGestureActive = false;
      suppressMobilePointerPinchUntil = Date.now() + 250;
    });

    viewport.addEventListener("gesturecancel", () => {
      nativeGestureActive = false;
      suppressMobilePointerPinchUntil = Date.now() + 250;
    });

    viewport.addEventListener("dblclick", (event) => {

      const node = createTextNode(point.x, point.y);
      setNodeCenteredAtWorldPoint(node, point.x, point.y);
      scheduleAutosave();
      startEditing(node);

    window.addEventListener("selectstart", (event) => {
      if (isNativeTextInteractionTarget(event.target)) return;
      event.preventDefault();

    window.addEventListener("dragstart", (event) => {
      if (isNativeTextInteractionTarget(event.target)) return;
      event.preventDefault();

    window.addEventListener("dragenter", (event) => {
      if (!isFileDragEvent(event)) return;
      event.preventDefault();
    });

    window.addEventListener("dragover", (event) => {
      if (!isFileDragEvent(event)) return;
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
    });

    window.addEventListener("drop", (event) => {

      if (files.length === 0) return;

      event.preventDefault();
      event.stopPropagation();
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      closeLinkNodeDialog();
      closeSlashCommandMenu();

      cancelNodeLayoutAnimation();

    openFileInput.addEventListener("change", async () => {
      const file = openFileInput.files && openFileInput.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        fileHandle = null;
        loadState(JSON.parse(text));

        console.error("Open failed:", error);
        alert("Could not parse file.");

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        cancelLineDraft();
        closeNodeContextMenu();
        closeLineContextMenu();
        closeCanvasContextMenu();
        closeLinkNodeDialog();
        closeSlashCommandMenu();
      }

      const historyAction = getHistoryShortcutAction(event);
      if (historyAction && shouldUseGlobalHistoryShortcut(event.target)) {
        event.preventDefault();
        event.stopPropagation();
        if (historyAction === "undo") {
          undoHistory();
        } else {
          redoHistory();
        }
        return;
      }

      const isVersionToggle =
        event.key === "Tab" &&
        !event.altKey &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.shiftKey &&
        !slashCommandSession &&
        !isEditableTarget(event.target);
      if (isVersionToggle) {
        event.preventDefault();
        versionCounter.hidden = !versionCounter.hidden;
        return;
      }

      const quickResizeLevel = /^[1-9]$/.test(event.key) ? Number(event.key) : 0;
      const isQuickResize =
        quickResizeLevel > 0 &&
        selectedNodes.size > 0 &&
        !event.repeat &&
        !event.altKey &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.shiftKey;
      if (isQuickResize) {
        if (isEditableTarget(event.target) || getActiveEditingNode()) return;
        event.preventDefault();
        event.stopPropagation();
        closeNodeContextMenu();
        closeLineContextMenu();
        closeCanvasContextMenu();
        closeLinkNodeDialog();
        closeSlashCommandMenu();
        animateSelectedNodesToSizeLevel(quickResizeLevel);
        return;
      }

      const isSafeDeleteKey =
        event.key === "Delete" ||
        (event.key === "Backspace" && event.shiftKey);
      if (isSafeDeleteKey && selectedNodes.size > 0) {
        if (isEditableTarget(event.target)) return;
        event.preventDefault();
        deleteSelectedNodes();
        return;
      }

      const isPlainEqualKey =
        !event.altKey &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.shiftKey &&
        (event.key === "=" || event.code === "Equal");
      if (isPlainEqualKey && selectedNodes.size > 1) {
        if (isEditableTarget(event.target)) return;
        event.preventDefault();
        closeNodeContextMenu();
        closeLineContextMenu();
        closeCanvasContextMenu();
        closeLinkNodeDialog();
        closeSlashCommandMenu();
        alignSelectedNodesToColumn();
        return;
      }

      const key = event.key.toLowerCase();
      if (event.altKey && !event.metaKey && !event.ctrlKey && event.code === "KeyD") {
        event.preventDefault();
        navigationFitMarkersVisible = !navigationFitMarkersVisible;
        render();
        return;
      }

      const hasPrimaryModifier = event.metaKey || event.ctrlKey;
      if (!hasPrimaryModifier) return;

      if (key === "s") {
        event.preventDefault();
        void saveToFile();
      }

      if (key === "o") {
        event.preventDefault();
        void openFromFile();
      }
    }, { capture: true });

    window.addEventListener("resize", () => {
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      closeLinkNodeDialog();
      closeSlashCommandMenu();
      render();
    });

    window.addEventListener("pagehide", flushViewportSave);

    document.addEventListener("selectionchange", () => {
      const editingNode = getActiveEditingNode();
      if (!editingNode) return;
      updateSlashMenuForNode(editingNode);
    });

    document.addEventListener("visibilitychange", () => {
      updateDocumentTitle();
      if (document.hidden) clearSharedPollTimer();
      else refreshSharedSpaceSoon();
    });
    window.addEventListener("focus", () => {
      updateDocumentTitle();
      refreshSharedSpaceSoon();
    });

    async function loadFromLocalStorage(options = {}) {
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      const raw = localStorage.getItem(getStorageKey());
      if (!raw) return false;
      if (reportProgress) reportProgress(0.15);

      try {
        const state = JSON.parse(raw);
        if (reportProgress) reportProgress(0.25);
        await loadState(state, {
          ...options,
          onProgress: createLoadingProgressRange(0.25, 1, reportProgress)
        });
        return true;
      } catch (error) {
        console.error("Restore failed:", error);
        return false;
      }
    }

    async function applySharedState(data, options = {}) {
      if (!data) return false;
      if (Object.prototype.hasOwnProperty.call(data, "viewer")) setCurrentUser(data.viewer);
      if (!data.state) return false;

      const updatedAt = Number(data.updatedAt) || 1;
      if (updatedAt <= latestSharedUpdatedAt) return false;
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      if (reportProgress) reportProgress(0.25);

      try {
        applyingSharedState = true;
        latestSharedUpdatedAt = updatedAt;
        await loadState(data.state, {
          autosave: false,
          incremental: options.incremental,
          onProgress: createLoadingProgressRange(0.25, 1, reportProgress)
        });
        resetHistoryToCurrentState();
        return true;
      } catch (error) {
        console.error("Shared space restore failed:", error);
        return false;
      } finally {
        applyingSharedState = false;
      }
    }

    async function loadFromSharedSpace(options = {}) {
      if (!SHARED_SPACE_SLUG) return false;
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      if (reportProgress) reportProgress(0.05);
      const data = await requestSharedSpace({
        onDownloadProgress: createLoadingProgressRange(0.05, 0.25, reportProgress)
      });
      if (reportProgress) reportProgress(0.25);
      if (Object.prototype.hasOwnProperty.call(data, "viewer")) setCurrentUser(data.viewer);
      if (!data.state) {
        latestSharedUpdatedAt = Number(data.updatedAt) || latestSharedUpdatedAt;
        return false;
      }
      return applySharedState(data, options);
    }

    function getSharedPollDelay() {
      return SHARED_POLL_DELAYS_MS[Math.min(sharedPollDelayIndex, SHARED_POLL_DELAYS_MS.length - 1)];
    }

    function clearSharedPollTimer() {
      if (!sharedPollTimer) return;
      clearTimeout(sharedPollTimer);
      sharedPollTimer = null;
    }

    function resetSharedPollingCadence() {
      sharedPollDelayIndex = 0;
    }

    function slowSharedPollingCadence() {
      sharedPollDelayIndex = Math.min(sharedPollDelayIndex + 1, SHARED_POLL_DELAYS_MS.length - 1);
    }

    function scheduleSharedPoll(delayMs = getSharedPollDelay()) {
      if (!SHARED_SPACE_SLUG || document.hidden) {
        clearSharedPollTimer();
        return;
      }
      clearSharedPollTimer();
      sharedPollTimer = setTimeout(runSharedPoll, Math.max(0, delayMs));
    }

    async function runSharedPoll() {
      sharedPollTimer = null;
      if (!SHARED_SPACE_SLUG || document.hidden) return;
      if (savingSharedState || sharedPollInFlight) {
        scheduleSharedPoll(getSharedPollDelay());
        return;
      }

      sharedPollInFlight = true;
      try {
        const changed = await requestSharedSpace().then(applySharedState);
        if (changed) resetSharedPollingCadence();
        else slowSharedPollingCadence();
      } catch (error) {
        slowSharedPollingCadence();
        console.error("Shared space refresh failed:", error);
      } finally {
        sharedPollInFlight = false;
        scheduleSharedPoll();
      }
    }

    function refreshSharedSpaceSoon() {
      if (!SHARED_SPACE_SLUG || document.hidden || sharedPollInFlight) return;
      resetSharedPollingCadence();
      scheduleSharedPoll(0);
    }

    function startSharedPolling() {
      if (!SHARED_SPACE_SLUG) return;
      resetSharedPollingCadence();
      scheduleSharedPoll(getSharedPollDelay());
    }

    async function boot() {
      showLoadingScreen();
      updateDocumentTitle();
      startTitleHookRefresh();
      setLoadingProgress(10);
      void requestPersistentStorage();
      try {
        if (SHARED_SPACE_SLUG) {
          setLoadingProgress(20);
          try {
            if (!await loadFromSharedSpace({
              incremental: true,
              onProgress: (progress) => setLoadingProgress(20 + progress * 75)
            })) {
              setLoadingProgress(90);
              render();
            }
            startSharedPolling();
          } catch (error) {
            console.error("Shared space load failed:", error);
            setLoadingProgress(90);
            render();
          }
          return;
        }

        setLoadingProgress(20);
        if (!await loadFromLocalStorage({
          incremental: true,
          onProgress: (progress) => setLoadingProgress(20 + progress * 75)
        })) {
          setLoadingProgress(90);
          render();
        }
      } finally {
        initializeSessionViewport();
        resetHistoryToCurrentState();
        await hideLoadingScreen();
      }
    }

    initializeMobileExperience();
    void boot();
  </script>
</body>
</html>
