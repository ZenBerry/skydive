        const name = handle.dataset.handle || "";
        const size = selectionHandleMode === "rotate"
          ? handleSize + 2
          : handleSize;
        handle.style.width = `${size}px`;
        handle.style.height = `${size}px`;
        handle.style.left = "";
        handle.style.right = "";
        handle.style.top = "";
        handle.style.bottom = "";
        handle.style.transform = "";

        if (name.includes("n")) handle.style.top = `${handleOffset}px`;
        if (name.includes("s")) handle.style.bottom = `${handleOffset}px`;
        if (name.includes("w")) handle.style.left = `${handleOffset}px`;
        if (name.includes("e")) handle.style.right = `${handleOffset}px`;
      }
    }

    function refreshSelectionBounds() {
      if (selectedNodes.size === 0) {
        selectionBoundsWorld = null;
        selectionBoundsSpace = "world";
        selectionOverlayRotation = 0;
        setSelectionHandleMode("resize");
        renderGroupSelectionBox();
        updateMobileSelectionControls();
        return;
      }

      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      const useScreenSpace = Array.from(selectedNodes).some((node) => isFloatingNode(node));

      for (const node of selectedNodes) {
        if (!world.contains(node) || isNodeDeleted(node)) continue;
        const corners = useScreenSpace ? getNodeScreenCorners(node) : getNodeWorldCorners(node);
        if (corners.length !== 4) continue;
        for (const corner of corners) {
          const local = worldToSelectionLocal(corner);
          minX = Math.min(minX, local.x);
          minY = Math.min(minY, local.y);
          maxX = Math.max(maxX, local.x);
          maxY = Math.max(maxY, local.y);
        }
      }

      if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) {
        selectedNodes.clear();
        selectionBoundsWorld = null;
        selectionBoundsSpace = "world";
        selectionOverlayRotation = 0;
        applySelectionNodeClasses();
        renderGroupSelectionBox();
        updateMobileSelectionControls();
        return;
      }

      selectionBoundsWorld = {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
      selectionBoundsSpace = useScreenSpace ? "screen" : "world";
      renderGroupSelectionBox();
      updateMobileSelectionControls();
    }

    function setSelectedNodes(nodes) {
      const next = new Set();
      for (const node of nodes) {
        if (node instanceof HTMLElement && world.contains(node) && !isNodeDeleted(node)) {
          next.add(node);
        }
      }

      selectedNodes.clear();
      for (const node of next) {
        selectedNodes.add(node);
      }

      selectionOverlayRotation = getSelectionOverlayRotationForNodes(next);
      setSelectionHandleMode("resize");
      applySelectionNodeClasses();
      refreshSelectionBounds();
    }

    function alignSelectedNodesToColumn() {
      if (selectedNodes.size < 2) return false;
      const items = getSelectedNodeLayoutItems();
      const targets = getColumnAlignmentTargets(items);
      if (targets.length < 2) return false;
      return animateNodePositions(targets);
    }

    function pasteSizeToNodes(nodes) {
      if (!canPasteSizeToTargets(nodes)) return false;
      return animateNodesToBaseFontSize(nodes, copiedNodeBaseFontSize);
    }

    function clearSelection() {
      if (selectedNodes.size === 0) {
        selectionBoundsWorld = null;
        selectionBoundsSpace = "world";
        renderGroupSelectionBox();
        return;
      }
      selectedNodes.clear();
      applySelectionNodeClasses();
      refreshSelectionBounds();
    }

    function beginMarqueeSelection(event) {
      marqueeSession = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        currentX: event.clientX,
        currentY: event.clientY,
        hasMoved: false

      viewport.setPointerCapture(event.pointerId);
    }

    function updateMarqueeSelection(event) {
      if (!marqueeSession || event.pointerId !== marqueeSession.pointerId) return;
      marqueeSession.currentX = event.clientX;
      marqueeSession.currentY = event.clientY;

      const distance = Math.hypot(
        marqueeSession.currentX - marqueeSession.startX,
        marqueeSession.currentY - marqueeSession.startY
      );
      if (!marqueeSession.hasMoved && distance >= MARQUEE_DRAG_THRESHOLD_PX) {
        marqueeSession.hasMoved = true;
      }
      if (!marqueeSession.hasMoved) return;

      const rect = getScreenRectBetweenPoints(
        marqueeSession.startX,
        marqueeSession.startY,
        marqueeSession.currentX,
        marqueeSession.currentY
      );
      renderMarqueeRect(rect);
      setSelectedNodes(getNodesIntersectingScreenRect(rect));

      if (viewport.hasPointerCapture(event.pointerId)) {

      }

      hideMarqueeRect();
      if (!didMove) {

      }

    function isCanvasPanExcludedTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest("button, input, textarea, select, [data-command-interactive], .editing"));
    }

    function beginMobileAttitudeRotation(event) {
      if (
        !IS_MOBILE_DEVICE ||
        mobileInteractionMode !== "attitude" ||
        event.pointerType !== "touch" ||
        event.button !== 0 ||
        event.isPrimary === false ||
        isCanvasPanExcludedTarget(event.target)

      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      cancelMobileCanvasSessions(event.pointerId);
      cancelMobilePointerTrackingSession();

        pointerId: event.pointerId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startRotation: camera.rotation,
        anchorWorld: screenToWorld(event.clientX, event.clientY),
        moved: false
      };

      event.preventDefault();
      event.stopImmediatePropagation();
    }

    function updateMobileAttitudeRotation(event) {

      const dy = event.clientY - mobileAttitudeSession.startClientY;
      mobileAttitudeSession.moved = mobileAttitudeSession.moved || Math.hypot(dx, dy) >= MARQUEE_DRAG_THRESHOLD_PX;
      setCameraTransformForWorldPoint(
        mobileAttitudeSession.anchorWorld,
        mobileAttitudeSession.startClientX,
        mobileAttitudeSession.startClientY,
        camera.scale,
        mobileAttitudeSession.startRotation + dx * MOBILE_ATTITUDE_ROTATION_SENSITIVITY

      event.stopPropagation();
    }

    function endMobileAttitudeRotation(event) {

        viewport.releasePointerCapture(event.pointerId);

      mobileAttitudeSession = null;
      event.preventDefault();
      event.stopPropagation();
    }

    function beginCanvasPan(event) {
      const isMobileTouchPan =
        IS_MOBILE_DEVICE &&
        mobileInteractionMode === "pan" &&
        event.pointerType === "touch" &&
        event.isPrimary !== false;
      const isPhysicalMiddleButtonPan =
        !IS_MOBILE_DEVICE &&
        event.isTrusted &&
        event.pointerType === "mouse" &&
        event.button === 1;
      const isShiftPan = event.button === 0 && event.shiftKey;
      if (
        (!isShiftPan && !isMobileTouchPan && !isPhysicalMiddleButtonPan) ||
        isCanvasPanExcludedTarget(event.target)
      ) return;

      if (isPhysicalMiddleButtonPan) hasPhysicalWheelInput = true;

      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

      panSession = {
        pointerId: event.pointerId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startCameraX: camera.x,
        startCameraY: camera.y,
        moved: false
      };

      viewport.classList.add("panning");
      viewport.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopImmediatePropagation();
    }

    function updateCanvasPan(event) {

      const dx = event.clientX - panSession.startClientX;
      const dy = event.clientY - panSession.startClientY;
      panSession.moved = panSession.moved || dx !== 0 || dy !== 0;
      camera.x = panSession.startCameraX + dx;
      camera.y = panSession.startCameraY + dy;
      render();
      event.preventDefault();
      event.stopPropagation();
    }

    function endCanvasPan(event) {
      if (!panSession || event.pointerId !== panSession.pointerId) return;
      const didMove = panSession.moved;
      if (viewport.hasPointerCapture(event.pointerId)) {
        viewport.releasePointerCapture(event.pointerId);
      }
      panSession = null;
      viewport.classList.remove("panning");
      if (didMove) scheduleViewportSave();
      event.preventDefault();
      event.stopPropagation();
    }

    function getMobileActivationTarget(target) {

        target.closest(

        )
      ) return null;

      const node = target.closest(".text-node");
      if (node && world.contains(node) && !isCommandNode(node) && !node.classList.contains("editing")) {

      }

      if (target === viewport || target === world) {
        return { kind: "canvas", element: viewport };
      }

      return null;
    }

    function isSameMobileActivationTarget(first, second) {
      return Boolean(
        first &&
        second &&
        first.kind === second.kind &&
        first.element === second.element
      );
    }

        startEditing(node);
        return;
      }

      if (activationTarget.kind !== "canvas") return;
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelNodeLayoutAnimation();
      clearSelection();
      const point = screenToWorld(clientX, clientY);
      const node = createTextNode(point.x, point.y);
      setNodeCenteredAtWorldPoint(node, point.x, point.y);
      scheduleAutosave();
      startEditing(node);
    }

    function registerMobileTap(target, clientX, clientY) {
      const activationTarget = getMobileActivationTarget(target);
      if (!activationTarget) {
        lastMobileTap = null;
        return;
      }

      const now = Date.now();
      const isDoubleTap =
        lastMobileTap &&
        now - lastMobileTap.time <= MOBILE_DOUBLE_TAP_MS &&
        Math.hypot(clientX - lastMobileTap.clientX, clientY - lastMobileTap.clientY) <= MOBILE_DOUBLE_TAP_DISTANCE_PX &&
        isSameMobileActivationTarget(lastMobileTap.activationTarget, activationTarget);

          camera.y = panSession.startCameraY;

        clientY: (first.clientY + second.clientY) / 2

      if (viewport.hasPointerCapture(pointerId)) {

      }
      mobileAttitudeSession = null;

      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      cancelMobileCanvasSessions(firstPointerId);
      cancelMobileCanvasSessions(secondPointerId);
      cancelMobilePointerTrackingSession();
      cancelMobileAttitudeRotation();

      if (!Number.isFinite(distance) || distance <= 0) return true;

      const center = getMobileTouchCenter(points[0], points[1]);
      setCameraTransformForWorldPoint(
        mobilePinchSession.centerWorld,
        center.clientX,
        center.clientY,
        mobilePinchSession.startScale * (distance / mobilePinchSession.startDistance),
        mobilePinchSession.startRotation

      event.stopPropagation();

        clientX: event.clientX,
        clientY: event.clientY

        clientY: event.clientY

              clientY: touch.clientY

            clientY: (touches[0].clientY + touches[1].clientY) / 2

        clientY: event.clientY || window.innerHeight / 2

        cancelable: false,

        clientY: session.clientY

        session.node &&
        world.contains(session.node) &&
        Number.isFinite(session.nodeX) &&
        Number.isFinite(session.nodeY)
      ) {

        view: window,
        button: 2,

        event.button !== 0 ||
        event.isPrimary === false ||

        target: event.target,
        node: node && world.contains(node) ? node : null,
        nodeX: node && world.contains(node) ? Number(node.dataset.x) : NaN,
        nodeY: node && world.contains(node) ? Number(node.dataset.y) : NaN,
        selectedNodes: Array.from(selectedNodes),
        startClientX: event.clientX,
        startClientY: event.clientY,
        clientX: event.clientX,
        clientY: event.clientY,
        moved: false,
        longPressed: false,

          session.clientX - session.startClientX,
          session.clientY - session.startClientY

      session.clientY = event.clientY;

        session.clientX - session.startClientX,
        session.clientY - session.startClientY
      );

        !cancelled &&
        !session.longPressed &&
        !session.moved &&
        movedDistance <= MOBILE_GESTURE_MOVE_TOLERANCE_PX

      mobileAttitudeBtn.addEventListener("click", () => setMobileInteractionMode("attitude"));

      mobileRedoBtn.addEventListener("click", () => redoHistory());

    function beginGroupTransform(event, mode, captureElement) {

      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

      const selectionRotation = selectionOverlayRotation;
      const boundsCenterLocal = getBoundsCenter(selectionBoundsWorld);
      const boundsCenter = selectionLocalToWorld(boundsCenterLocal, selectionRotation);

        captureElement,

        startClientY: event.clientY,
        startPointer,
        startPointerLocal: worldToSelectionLocal(startPointer, selectionRotation),
        startAngle: Math.atan2(startPointer.y - boundsCenter.y, startPointer.x - boundsCenter.x),
        center: boundsCenter,
        initialBounds: { ...selectionBoundsWorld },
        moved: false,
        nodeSnapshots: Array.from(selectedNodes).map((node) => {

          const point = getNodePositionForSelectionSpace(node, selectionBoundsSpace);
          const local = nodeToSelectionLocal(node, point, selectionRotation);

            node,
            x: point.x,
            y: point.y,
            localX: local.x,
            localY: local.y,
            centerX: center ? center.x : point.x,

    function getResizeTransformDeltas(transform, pointer) {

      const dy = pointer.y - groupTransform.startPointer.y;
      if (!groupTransform.moved && Math.hypot(
        event.clientX - groupTransform.startClientX,
        event.clientY - groupTransform.startClientY

      if (groupTransform.mode === "drag") {

          setNodePositionForSelectionSpace(
            snapshot.node,
            { x: snapshot.x + dx, y: snapshot.y + dy },
            groupTransform.selectionBoundsSpace,
            { skipSelectionUpdate: true }
          );
        }
        refreshSelectionBounds();
        updateSpacingGuidesForNodes(groupTransform.nodeSnapshots.map((snapshot) => snapshot.node));
        return;
      }

      clearSpacingGuides();

      if (groupTransform.mode === "rotate") {
        const nextAngle = Math.atan2(
          pointer.y - groupTransform.center.y,
          pointer.x - groupTransform.center.x
        );
        const rotationDelta = normalizeRotation(nextAngle - groupTransform.startAngle);
        selectionOverlayRotation = normalizeRotation(groupTransform.selectionRotation + rotationDelta);
        for (const snapshot of groupTransform.nodeSnapshots) {
          const nextCenter = rotatePointAround(
            { x: snapshot.centerX, y: snapshot.centerY },
            groupTransform.center,
            rotationDelta
          );
          const nextRotation = normalizeRotation(snapshot.rotation + rotationDelta);
          if (Math.abs(nextRotation) >= 0.000001) {
            snapshot.node.dataset.rotation = String(nextRotation);
          } else {
            delete snapshot.node.dataset.rotation;
          }
          setNodeCenteredForSelectionSpace(
            snapshot.node,
            nextCenter,
            groupTransform.selectionBoundsSpace,
            { skipSelectionUpdate: true }
          );
        }
        refreshSelectionBounds();
        return;
      }

      const initialWidth = Math.max(0.001, groupTransform.initialBounds.width);
      const initialHeight = Math.max(0.001, groupTransform.initialBounds.height);
      const deltas = getResizeTransformDeltas(groupTransform, pointer);
      const nextWidth = Math.max(0.001, initialWidth + deltas.x);
      const nextHeight = Math.max(0.001, initialHeight + deltas.y);
      const scaleX = nextWidth / initialWidth;
      const scaleY = nextHeight / initialHeight;
      const fontScale = Math.sqrt(scaleX * scaleY);
      const anchor = getResizeAnchor(groupTransform.initialBounds, groupTransform.handle);

      for (const snapshot of groupTransform.nodeSnapshots) {
        const nextLocal = {
          x: anchor.x + (snapshot.localX - anchor.x) * scaleX,
          y: anchor.y + (snapshot.localY - anchor.y) * scaleY
        };
        const nextWorld = selectionLocalToNodeSpace(snapshot.node, nextLocal, groupTransform.selectionRotation);
        snapshot.node.dataset.baseFontSize = String(
          Math.max(0.001, snapshot.baseFontSize * fontScale)
        );
        setNodePositionForSelectionSpace(
          snapshot.node,
          nextWorld,
          groupTransform.selectionBoundsSpace,
          { skipSelectionUpdate: true }
        );
      }

      refreshSelectionBounds();
    }

    function endGroupTransform(event) {
      if (!groupTransform || event.pointerId !== groupTransform.pointerId) return;
      const { captureElement, pointerId } = groupTransform;
      const shouldToggleMode = groupTransform.mode === "drag" && !groupTransform.moved;
      if (captureElement.hasPointerCapture(pointerId)) {
        captureElement.releasePointerCapture(pointerId);
      }
      if (groupTransform.moved) suppressSelectionModeToggleUntil = Date.now() + 250;
      groupTransform = null;
      clearSpacingGuides();
      if (shouldToggleMode) toggleSelectionHandleMode();
      refreshSelectionBounds();
      if (!shouldToggleMode) scheduleAutosave();
    }

    function getViewportCullRect(padding) {
      const safePadding = Math.max(0, Number(padding) || 0);
      return {
        left: -safePadding,
        top: -safePadding,
        right: Math.max(1, viewport.clientWidth) + safePadding,
        bottom: Math.max(1, viewport.clientHeight) + safePadding
      };
    }

    function getNodeRenderCullRect() {
      return getViewportCullRect(NODE_RENDER_CULL_PADDING_SCREEN_PX);
    }

    function setNodeRenderCulled(node, culled) {
      if (!(node instanceof HTMLElement)) return;
      if (culled) {
        node.dataset.renderCulled = "true";
      } else {
        delete node.dataset.renderCulled;
      }
    }

    function cacheNodeRenderCullSize(node, screenScale) {
      if (!(node instanceof HTMLElement) || isFloatingNode(node)) return;
      if (!world.contains(node)) return;
      const scale = Number.isFinite(screenScale) && screenScale > 0 ? screenScale : 1;
      const cameraScale = getCameraScale();
      const screenWidth = Math.max(node.scrollWidth, node.offsetWidth, 1) * scale;
      const screenHeight = Math.max(node.scrollHeight, node.offsetHeight, 1) * scale;
      node.dataset.renderCullWorldWidth = String(screenWidth / cameraScale);
      node.dataset.renderCullWorldHeight = String(screenHeight / cameraScale);
    }

    function shouldRenderNodeInCullRect(node, cullRect) {
      if (!(node instanceof HTMLElement)) return false;
      if (isFloatingNode(node) || isNodeDeleted(node)) return true;
      if (selectedNodes.has(node) || node.classList.contains("editing") || node.classList.contains("navigation-target-highlight")) return true;
      if (lineDraft && lineDraft.sourceNode === node) return true;

      const worldX = Number(node.dataset.x);
      const worldY = Number(node.dataset.y);
      const worldWidth = Number(node.dataset.renderCullWorldWidth);
      const worldHeight = Number(node.dataset.renderCullWorldHeight);
      if (
        !Number.isFinite(worldX) ||
        !Number.isFinite(worldY) ||
        !Number.isFinite(worldWidth) ||
        !Number.isFinite(worldHeight) ||
        worldWidth <= 0 ||
        worldHeight <= 0
      ) return true;

      const point = worldToScreen(worldX, worldY);
      const radius = Math.hypot(worldWidth, worldHeight) * getCameraScale();
      return (
        point.x + radius >= cullRect.left &&
        point.x - radius <= cullRect.right &&
        point.y + radius >= cullRect.top &&
        point.y - radius <= cullRect.bottom
      );
    }

    function render() {
      const cullRect = getNodeRenderCullRect();
      for (const node of world.children) {
        if (shouldRenderNodeInCullRect(node, cullRect)) {
          renderNode(node);
        } else {
          setNodeRenderCulled(node, true);
        }
      }
      renderLineConnections();
      renderGroupSelectionBox();
      renderNavigationFitMarkers();
      renderRemotePointers();
    }

    function screenToWorld(clientX, clientY) {
      const scale = getCameraScale();
      const basis = getCameraBasis();
      const dx = clientX - camera.x;
      const dy = clientY - camera.y;
      return {
        x: (dx * basis.cos + dy * basis.sin) / scale,
        y: (-dx * basis.sin + dy * basis.cos) / scale
      };
    }

    function setNodePosition(node, x, y, options = {}) {
      const { skipSelectionUpdate = false, suppressRealtime = false } = options;
      node.dataset.x = String(x);
      node.dataset.y = String(y);
      renderNode(node);
      requestLineRender();
      if (!skipSelectionUpdate && selectedNodes.has(node)) {
        refreshSelectionBounds();
      }
      if (!suppressRealtime && SHARED_SPACE_SLUG && !applyingSharedState && !applyingSharedRealtimeNodePositions) {
        scheduleSharedRealtimeNodePosition(node);
      }
    }

    function setNodeCenteredAtWorldPoint(node, centerX, centerY, options = {}) {
      const size = getNodeWorldSize(node);
      const rotation = getNodeRotation(node);
      const basis = getCameraBasis(rotation);
      const offsetX = size.width * 0.5 * basis.cos - size.height * 0.5 * basis.sin;
      const offsetY = size.width * 0.5 * basis.sin + size.height * 0.5 * basis.cos;
      setNodePosition(node, centerX - offsetX, centerY - offsetY, options);
    }

    function getNodeTransform(node, rotation, scale) {
      const baseScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
      const centerX = Math.max(node.offsetWidth, 1) * baseScale * 0.5;
      const centerY = Math.max(node.offsetHeight, 1) * baseScale * 0.5;
      return [
        `rotate(${rotation}rad)`,
        `translate(${centerX}px, ${centerY}px)`,
        "scale(var(--float-transition-scale, 1))",
        `translate(${-centerX}px, ${-centerY}px)`,
        `scale(${baseScale})`
      ].join(" ");
    }

    function renderNode(node) {
      const x = Number(node.dataset.x);
      const y = Number(node.dataset.y);
      const metrics = getNodeRenderMetrics(node);
      const totalRotation = getNodeTotalRotation(node);
      const screenPoint = pointToScreenForNode(node, x, y);
      let appliedScale = metrics.screenScale;
      node.style.left = `${screenPoint.x}px`;
      node.style.top = `${screenPoint.y}px`;
      node.style.setProperty("--camera-scale", String(metrics.screenScale));
      if (isCommandNode(node)) {
        node.style.fontSize = `${metrics.layoutFontPx}px`;
        node.style.minWidth = "0px";
        node.style.transform = getNodeTransform(node, totalRotation, metrics.screenScale);
        node.style.transformOrigin = "top left";
      } else if (isHtmlViewNode(node)) {
        const frame = node.querySelector("iframe[data-html-view-token]");
        if (frame) applyHtmlViewFrameSize(frame);
        appliedScale = metrics.cameraScale * metrics.baseFontSize / BASE_TEXT_PX;
        node.style.fontSize = `${BASE_TEXT_PX}px`;
        node.style.minWidth = "0px";
        node.style.transform = getNodeTransform(
          node,
          totalRotation,
          appliedScale
        );
        node.style.transformOrigin = "top left";
      } else {
        node.style.fontSize = `${metrics.layoutFontPx}px`;
        node.style.minWidth = `${getTextNodeMinWidthScreenPx(metrics.visualFontPx) / metrics.screenScale}px`;
        node.style.transform = getNodeTransform(node, totalRotation, metrics.screenScale);
        node.style.transformOrigin = "top left";
      }
      setNodeRenderCulled(node, false);
      cacheNodeRenderCullSize(node, appliedScale);
      notifyCommandNodeRendered(node, metrics);
    }

    function notifyCommandNodeRendered(node, metrics) {
      if (!isCommandNode(node)) return;
      const command = getLoadedStaticCommand(node.dataset.commandId || "");
      if (!command || typeof command.renderFrame !== "function") return;
      try {
        command.renderFrame(node, {
          cameraScale: metrics.cameraScale,
          screenScale: metrics.screenScale,
          layoutFontPx: metrics.layoutFontPx
        });
      } catch (error) {
        console.error("Command renderFrame failed:", error);
      }
    }

    function zoomTo(newScale, clientX, clientY) {
      setCameraTransformAt(clientX, clientY, newScale, camera.rotation);
    }

    function rotateTo(newRotation, clientX, clientY) {
      setCameraTransformAt(clientX, clientY, camera.scale, newRotation);
    }

    function cancelPhysicalWheelZoomAnimation() {
      if (physicalWheelZoomAnimationFrame !== null) {
        cancelAnimationFrame(physicalWheelZoomAnimationFrame);
      }
      physicalWheelZoomAnimationFrame = null;
      physicalWheelZoomAnimation = null;
    }

    function runPhysicalWheelZoomAnimation(now) {
      if (!physicalWheelZoomAnimation) {
        physicalWheelZoomAnimationFrame = null;
        return;
      }

      const animation = physicalWheelZoomAnimation;
      const progress = clamp(
        (now - animation.startTime) / PHYSICAL_WHEEL_ZOOM_DURATION_MS,
        0,
        1
      );
      const eased = 1 - Math.pow(1 - progress, 3);
      camera.x = animation.startX + (animation.targetX - animation.startX) * eased;
      camera.y = animation.startY + (animation.targetY - animation.startY) * eased;
      camera.scale = animation.startScale + (animation.targetScale - animation.startScale) * eased;
      render();

      if (progress < 1) {
        physicalWheelZoomAnimationFrame = requestAnimationFrame(runPhysicalWheelZoomAnimation);
        return;
      }

      physicalWheelZoomAnimation = null;
      physicalWheelZoomAnimationFrame = null;
      scheduleViewportSave();
    }

    function smoothPhysicalWheelZoom(factor, clientX, clientY) {
      const accumulatedScale = physicalWheelZoomAnimation
        ? physicalWheelZoomAnimation.targetScale
        : camera.scale;
      const targetScale = accumulatedScale * factor;
      if (!Number.isFinite(targetScale) || targetScale <= 0) return;

      const worldPoint = screenToWorld(clientX, clientY);
      const targetOffset = getCameraScreenOffset(worldPoint.x, worldPoint.y, targetScale, camera.rotation);
      physicalWheelZoomAnimation = {
        startTime: performance.now(),
        startX: camera.x,
        startY: camera.y,
        startScale: camera.scale,
        targetX: clientX - targetOffset.x,
        targetY: clientY - targetOffset.y,
        targetScale
      };

      if (physicalWheelZoomAnimationFrame === null) {
        physicalWheelZoomAnimationFrame = requestAnimationFrame(runPhysicalWheelZoomAnimation);
      }
    }

    function selectAllText(node) {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(node);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function startEditing(node, selectAll = false, caretOffset = null) {
      if (isCommandNode(node)) return;
      if (isCalcVariableNode(node)) return;
      if (isHtmlViewNode(node)) return;
      unwrapTagLinks(node);
      prepareMarkdownNodeForEditing(node);
      node.classList.add("editing");
      node.contentEditable = "true";
      node.focus();
      if (selectAll) selectAllText(node);
      else if (Number.isFinite(caretOffset)) placeCaretInTextNode(node, caretOffset);
    }

    function stopEditing(node) {
      node.contentEditable = "false";
      node.classList.remove("editing");
      finishMarkdownNodeEditing(node);
      renderTagLinks(node);
    }

    function serializeState() {
      const state = {
        version: 1,
        nodes: Array.from(world.children).map(serializeNode),
        lines: lineConnections.map(serializeLineConnection)
      };
      const titleHook = getTitleHookState();
      if (titleHook) state.titleHook = titleHook;
      if (spaceMeta && typeof spaceMeta === "object" && Object.keys(spaceMeta).length > 0) {
        state.meta = cloneJson(spaceMeta, {});
      }
      return state;
    }

    function getSharedSpaceUrl(slug = SHARED_SPACE_SLUG) {
      const params = new URLSearchParams({ slug });
      return `/.netlify/functions/spaces?${params.toString()}`;
    }

    async function readJsonResponse(response, onDownloadProgress) {
      const reportProgress = typeof onDownloadProgress === "function" ? onDownloadProgress : null;
      const contentLength = Number(response.headers.get("Content-Length")) || 0;
      if (!response.body || typeof TextDecoder !== "function") {
        const data = await response.json();
        if (reportProgress) reportProgress(1);
        return data;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      const chunks = [];
      let loaded = 0;

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(decoder.decode(value, { stream: true }));
          loaded += value.byteLength;
          if (reportProgress && contentLength > 0) {
            reportProgress(Math.min(0.98, loaded / contentLength));
          }
        }
      } finally {
        reader.releaseLock();
      }

      chunks.push(decoder.decode());
      if (reportProgress) reportProgress(1);
      return JSON.parse(chunks.join(""));
    }

    async function requestSharedSpace(options = {}) {
      const { slug = SHARED_SPACE_SLUG, onDownloadProgress = null, ...fetchOptions } = options;
      const response = await fetch(getSharedSpaceUrl(slug), {
        headers: {
          "Accept": "application/json",
          ...(fetchOptions.body ? { "Content-Type": "application/json" } : {})
        },
        ...fetchOptions
      });

      if (!response.ok) {
        let data = null;
        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }
        const error = new Error(`Shared space request failed: ${response.status}`);
        error.status = response.status;
        error.data = data;
        throw error;
      }

      return readJsonResponse(response, onDownloadProgress);
    }

    function readSharedSpaceCache(slug = SHARED_SPACE_SLUG) {
      if (!slug) return null;
      try {
        const raw = localStorage.getItem(getSharedSpaceCacheKey(slug));
        if (!raw) return null;
        const cache = JSON.parse(raw);
        if (!cache || typeof cache !== "object" || !cache.state || typeof cache.state !== "object") return null;
        if (cache.appVersion !== APP_VERSION) return null;
        return cache;
      } catch (error) {
        console.error("Shared space cache read failed:", error);
        return null;
      }
    }

    function writeSharedSpaceCache(data, stateOverride = null, slug = SHARED_SPACE_SLUG) {
      if (!slug || !data) return false;
      const state = stateOverride || data.state;
      if (!state || typeof state !== "object") return false;
      try {
        localStorage.setItem(getSharedSpaceCacheKey(slug), JSON.stringify({
          appVersion: APP_VERSION,
          slug,
          revision: Number(data.revision) || 0,
          updatedAt: Number(data.updatedAt) || 0,
          cachedAt: Date.now(),
          state
        }));
        return true;
      } catch (error) {
        console.error("Shared space cache write failed:", error);
        return false;
      }
    }

    function removeSharedSpaceCache(slug = SHARED_SPACE_SLUG) {
      if (!slug) return;
      try {
        localStorage.removeItem(getSharedSpaceCacheKey(slug));
      } catch (error) {
        console.error("Shared space cache cleanup failed:", error);
      }
    }

    function writeSharedSpaceDraft(state, conflict = null, slug = SHARED_SPACE_SLUG) {
      if (!slug || !state || typeof state !== "object") return false;
      try {
        localStorage.setItem(getSharedSpaceDraftKey(slug), JSON.stringify({
          appVersion: APP_VERSION,
          slug,
          baseRevision: latestSharedRevision,
          serverRevision: Number(conflict && conflict.currentRevision) || 0,
          savedAt: Date.now(),
          state
        }));
        return true;
      } catch (error) {
        console.error("Shared space draft write failed:", error);
        return false;
      }
    }

    function updateSharedServerMarkers(data) {
      if (!data || typeof data !== "object") return;
      latestSharedRevision = Number(data.revision) || Number(data.currentRevision) || latestSharedRevision;
      latestSharedUpdatedAt = Number(data.updatedAt) || latestSharedUpdatedAt;
    }

    function getSharedConflictSpace(error) {
      return error && error.data && error.data.space && typeof error.data.space === "object"
        ? error.data.space
        : null;
    }

    function getStableJson(value) {
      if (Array.isArray(value)) {
        return `[${value.map(getStableJson).join(",")}]`;
      }
      if (value && typeof value === "object") {
        return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${getStableJson(value[key])}`).join(",")}}`;
      }
      return JSON.stringify(value);
    }

    function isSameSharedState(left, right) {
      if (!left || !right) return false;
      try {
        return getStableJson(left) === getStableJson(right);
      } catch (error) {
        return false;
      }
    }

    function canRetrySharedSaveAfterConflict(error) {
      const conflictSpace = getSharedConflictSpace(error);
      if (!conflictSpace || !conflictSpace.state) return false;
      const cache = readSharedSpaceCache();
      return Boolean(cache && isSameSharedState(cache.state, conflictSpace.state));
    }

    function isSharedEditLocked() {
      return Boolean(SHARED_SPACE_SLUG && sharedCacheValidationPending);
    }

    function unlockSharedCacheEditing() {
      sharedCacheValidationPending = false;
    }

    function hasActiveSharedLocalEdits() {
      return Boolean(
        SHARED_SPACE_SLUG &&
        (
          sharedLocalMutationPending ||
          saveTimer !== null ||
          getActiveEditingNode()
        )
      );
    }

    function notifySharedSaveConflict() {
      if (sharedSaveConflictNotified) return;
      sharedSaveConflictNotified = true;
      alert("This space changed elsewhere before your edit could save. Your local edit is still visible, but it has not been saved yet.");
    }

    function shouldBlockSharedEditEvent(event) {
      if (!isSharedEditLocked()) return false;
      if (event.type === "wheel" || event.type === "pointermove" || event.type === "pointerup" || event.type === "pointercancel") {
        return false;
      }
      if (event.type === "keydown" && event.key === "Escape") return false;
      if (event.type === "pointerdown") {
        return event.target !== viewport && event.target !== world;
      }
      if (event.type === "contextmenu" || event.type === "dblclick" || event.type === "drop" || event.type === "paste" || event.type === "beforeinput") {
        return true;
      }
      if (event.type === "click") {
        return event.target instanceof Element && Boolean(event.target.closest("button, input, textarea, select, [contenteditable='true']"));
      }
      if (event.type === "keydown") {
        const key = event.key || "";
        if (isEditableTarget(event.target)) return true;
        if (key === "Delete" || key === "Backspace") return true;
        if (/^[1-9]$/.test(key)) return true;
        if (key === "=" || key.toLowerCase() === "s" || key.toLowerCase() === "o" || key.toLowerCase() === "z" || key.toLowerCase() === "y") return true;
      }
      return false;
    }

    function blockSharedEditUntilValidated(event) {
      if (!shouldBlockSharedEditEvent(event)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }

    async function saveCurrentState() {
      if (IS_PLAYGROUND) return;
      if (isSharedEditLocked()) return;
      markDeloreanModified();
      const state = serializeState();
      if (SHARED_SPACE_SLUG) {
        if (savingSharedState) {
          sharedSaveQueued = true;
          return;
        }
        savingSharedState = true;
        let saveSucceeded = false;
        try {
          let data = null;
          try {
            data = await requestSharedSpace({
              method: "PUT",
              body: JSON.stringify({ state })
            });
          } catch (error) {
            if (error && error.status === 409 && canRetrySharedSaveAfterConflict(error)) {
              updateSharedServerMarkers(getSharedConflictSpace(error));
              data = await requestSharedSpace({
                method: "PUT",
                body: JSON.stringify({ state })
              });
            } else {
              throw error;
            }
          }
          updateSharedServerMarkers(data);
          sharedLocalMutationPending = false;
          sharedSaveConflictNotified = false;
          writeSharedSpaceCache(data, state);
          if (Object.prototype.hasOwnProperty.call(data, "viewer")) setCurrentUser(data.viewer);
          publishSharedRealtimeUpdate(data);
          saveSucceeded = true;
        } catch (error) {
          if (error && error.status === 409) {
            sharedLocalMutationPending = true;
            writeSharedSpaceDraft(state, error.data);
            notifySharedSaveConflict();
          }
          throw error;
        } finally {
          savingSharedState = false;
          if (!saveSucceeded) sharedSaveQueued = false;
        }
        if (saveSucceeded && sharedSaveQueued) {
          sharedSaveQueued = false;
          scheduleAutosave();
        }
        return;
      }

      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function getHistorySnapshot() {
      return JSON.stringify(serializeState());
    }

    function resetHistoryToCurrentState() {
      clearTimeout(historyTimer);
      historyTimer = null;
      currentHistorySnapshot = getHistorySnapshot();
      undoStack = [currentHistorySnapshot];
      redoStack = [];
      updateMobileHistoryControls();
    }

    function commitHistorySnapshot(options = {}) {
      if (suppressAutosave || applyingSharedState || applyingHistoryState) return false;

      const { clearRedo = true } = options;
      const snapshot = getHistorySnapshot();
      if (snapshot === currentHistorySnapshot) {
        updateMobileHistoryControls();
        return false;
      }

      undoStack.push(snapshot);
      currentHistorySnapshot = snapshot;
      if (undoStack.length > HISTORY_LIMIT) {
        undoStack.splice(0, undoStack.length - HISTORY_LIMIT);
      }
      if (clearRedo) redoStack = [];
      updateMobileHistoryControls();
      return true;
    }

    function scheduleHistoryCommit() {
      if (suppressAutosave || applyingSharedState || applyingHistoryState || isSharedEditLocked()) return;
      clearTimeout(historyTimer);
      historyTimer = setTimeout(() => {
        historyTimer = null;
        commitHistorySnapshot();
      }, HISTORY_COMMIT_DELAY_MS);
      updateMobileHistoryControls();
    }

    function flushHistoryCommit() {
      if (historyTimer !== null) {
        clearTimeout(historyTimer);
        historyTimer = null;
      }
      commitHistorySnapshot();
    }

    function restoreHistorySnapshot(snapshot) {
      if (!snapshot) return false;

      try {
        applyingHistoryState = true;
        const state = JSON.parse(snapshot);
        loadState(state, { autosave: false });
      } catch (error) {
        console.error("History restore failed:", error);
        return false;
      } finally {
        applyingHistoryState = false;
      }

      currentHistorySnapshot = snapshot;
      scheduleAutosave();
      return true;
    }

    function undoHistory() {
      flushHistoryCommit();
      if (undoStack.length <= 1) return false;

      const currentSnapshot = undoStack[undoStack.length - 1];
      const previousSnapshot = undoStack[undoStack.length - 2];
      if (!restoreHistorySnapshot(previousSnapshot)) return false;

      undoStack.pop();
      redoStack.push(currentSnapshot);
      if (IS_MOBILE_DEVICE) clearPendingHistoryCommit();
      updateMobileHistoryControls();
      return true;
    }

    function redoHistory() {
      flushHistoryCommit();
      if (redoStack.length === 0) return false;

      const nextSnapshot = redoStack[redoStack.length - 1];
      if (!restoreHistorySnapshot(nextSnapshot)) return false;

      redoStack.pop();
      undoStack.push(nextSnapshot);
      if (IS_MOBILE_DEVICE) clearPendingHistoryCommit();
      updateMobileHistoryControls();
      return true;
    }

    function scheduleAutosave() {
      if (suppressAutosave || applyingSharedState || isSharedEditLocked()) return;
      if (IS_PLAYGROUND) {
        scheduleHistoryCommit();
        updatePlaygroundControls();
        return;
      }
      if (SHARED_SPACE_SLUG) sharedLocalMutationPending = true;
      markDeloreanModified();
      scheduleHistoryCommit();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveTimer = null;
        void saveCurrentState().catch((error) => {
          console.error("Autosave failed:", error);
        });
      }, 120);
    }

    function saveViewportToSession() {
      if (IS_PLAYGROUND) return false;
      try {
        sessionStorage.setItem(getViewportStorageKey(), JSON.stringify({
          x: camera.x,
          y: camera.y,
          scale: camera.scale,
          rotation: getCameraRotation()
        }));
        return true;
      } catch (error) {
        console.error("Viewport save failed:", error);
        return false;
      }
    }

    function scheduleViewportSave() {
      clearTimeout(viewportSaveTimer);
      viewportSaveTimer = setTimeout(() => {
        viewportSaveTimer = null;
        saveViewportToSession();
      }, 80);
    }

    function flushViewportSave() {
      if (viewportSaveTimer !== null) {
        clearTimeout(viewportSaveTimer);
        viewportSaveTimer = null;
      }
      saveViewportToSession();
    }

    function loadViewportFromSession() {
      if (IS_PLAYGROUND) return false;
      let raw = "";
      try {
        raw = sessionStorage.getItem(getViewportStorageKey()) || "";
      } catch (error) {
        console.error("Viewport restore failed:", error);
        return false;
      }
      if (!raw) return false;

      try {
        const nextCamera = JSON.parse(raw);
        const x = Number(nextCamera.x);
        const y = Number(nextCamera.y);
        const scale = Number(nextCamera.scale);
        const rotation = Number(nextCamera.rotation || 0);
        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(scale) || scale <= 0 || !Number.isFinite(rotation)) {
          throw new Error("Invalid viewport state.");
        }
        camera.x = x;
        camera.y = y;
        camera.scale = scale;
        camera.rotation = normalizeRotation(rotation);
        return true;
      } catch (error) {
        console.error("Viewport restore failed:", error);
        try {
          sessionStorage.removeItem(getViewportStorageKey());
        } catch (storageError) {
          console.error("Viewport cleanup failed:", storageError);
        }
        return false;
      }
    }

    function initializeSessionViewport() {
      if (loadViewportFromSession()) {
        render();
        return;
      }

      render();
      if (!focusPageContentFullScreen()) {
        saveViewportToSession();
      }
    }

    function restoreStateNode(entry, options = {}) {
      const x = Number.isFinite(Number(entry.x)) ? Number(entry.x) : 0;
      const y = Number.isFinite(Number(entry.y)) ? Number(entry.y) : 0;
      const text = typeof entry.text === "string" ? entry.text : "";
      const markdownView = entry.viewMode === "markdown";
      const htmlView = entry.viewMode === "html";
      const html = !markdownView && !htmlView && typeof entry.html === "string" ? sanitizeNodeHtml(entry.html) : null;
      const id = typeof entry.id === "string" ? entry.id : "";
      const baseFontSize = Number.isFinite(Number(entry.baseFontSize)) && Number(entry.baseFontSize) > 0
        ? Number(entry.baseFontSize)
        : BASE_TEXT_PX / camera.scale;
      const rotation = Number.isFinite(Number(entry.rotation))
        ? normalizeRotation(Number(entry.rotation))
        : 0;
      if (entry.kind === "command") {
        const commandId = typeof entry.commandId === "string" ? entry.commandId : "";
        const commandVersion = typeof entry.commandVersion === "string" ? entry.commandVersion : "";
        const commandState = entry.commandState && typeof entry.commandState === "object"
          ? entry.commandState
          : {};
        createCommandNode(x, y, commandId, commandState, baseFontSize, id, commandVersion, {
          createdAt: entry.createdAt,
          deletedAt: entry.deletedAt,
          createdBy: entry.createdBy,
          floating: entry.floating === true,
          rotation,
          preserveTimestamps: true,
          ...options
        });
      } else {
        createTextNode(x, y, text, baseFontSize, id, html, {
          createdAt: entry.createdAt,
          deletedAt: entry.deletedAt,
          createdBy: entry.createdBy,
          rotation,
          variable: entry.variable === true,
          viewMode: markdownView ? "markdown" : htmlView ? "html" : "",
          floating: entry.floating === true,
          preserveTimestamps: true,
          ...options
        });
      }
    }

    function loadState(state, options = {}) {
      if (!state || typeof state !== "object") {
        throw new Error("Invalid state file.");
      }

      if (options.incremental === true) {
        return loadStateIncrementally(state, options);
      }

      const { autosave = true, onProgress = null } = options;
      const nextNodes = Array.isArray(state.nodes) ? state.nodes : [];
      const nextLines = Array.isArray(state.lines) ? state.lines : [];
      const nextTitleHook = state.titleHook && typeof state.titleHook === "object"
        ? normalizeTitleHookNodeId(state.titleHook.nodeId)
        : "";
      const nextMeta = state.meta && typeof state.meta === "object" ? cloneJson(state.meta, {}) : {};
      const reportProgress = typeof onProgress === "function" ? onProgress : null;

      suppressAutosave = true;
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      cancelLineDraft();
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      closeLinkNodeDialog();
      closeTemplateDialog();
      closeSlashCommandMenu();
      clearSelection();
      hideMarqueeRect();
      marqueeSession = null;
      panSession = null;
      viewport.classList.remove("panning");
      groupTransform = null;
      navigationFitTargetNode = null;
      for (const node of Array.from(world.children)) {
        destroyCommandNodeContent(node);
        unobserveNodeForLines(node);
      }
      world.innerHTML = "";
      clearNodeRegistry();
      nextNodeNumber = 1;
      nextLineNumber = 1;
      lineConnections = [];
      titleHookNodeId = nextTitleHook;
      spaceMeta = nextMeta;
      deloreanModified = Boolean(
        DELOREAN_SPACE_INFO.active &&
        spaceMeta.delorean &&
        typeof spaceMeta.delorean === "object" &&
        spaceMeta.delorean.modifiedAt
      );
      updateDocumentTitle();

      nextNodes.forEach((entry, index) => {
        restoreStateNode(entry);
        if (reportProgress) reportProgress((index + 1) / Math.max(1, nextNodes.length));
      });

      loadLineConnections(nextLines);
      updateDocumentTitle();

      if (nextNodes.length === 0 && reportProgress) reportProgress(1);

      suppressAutosave = false;
      render();
      if (autosave) scheduleAutosave();
    }

    async function loadStateIncrementally(state, options = {}) {
      if (!state || typeof state !== "object") {
        throw new Error("Invalid state file.");
      }

      const { autosave = true, onProgress = null } = options;
      const nextNodes = Array.isArray(state.nodes) ? state.nodes : [];
      const nextLines = Array.isArray(state.lines) ? state.lines : [];
      const nextTitleHook = state.titleHook && typeof state.titleHook === "object"
        ? normalizeTitleHookNodeId(state.titleHook.nodeId)
        : "";
      const nextMeta = state.meta && typeof state.meta === "object" ? cloneJson(state.meta, {}) : {};
      const reportProgress = typeof onProgress === "function" ? onProgress : null;
      const reportClearing = createLoadingProgressRange(0, 0.1, reportProgress);
      const reportNodes = createLoadingProgressRange(0.1, 0.76, reportProgress);
      const reportLines = createLoadingProgressRange(0.76, 0.9, reportProgress);
      const reportRender = createLoadingProgressRange(0.9, 1, reportProgress);
      const yieldEvery = Math.max(1, Number(options.yieldEvery) || 40);

      suppressAutosave = true;
      try {
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        cancelLineDraft();
        closeNodeContextMenu();
        closeLineContextMenu();
        closeCanvasContextMenu();
        closeLinkNodeDialog();
        closeTemplateDialog();
        closeSlashCommandMenu();
        clearSelection();
        hideMarqueeRect();
        marqueeSession = null;
        panSession = null;
        viewport.classList.remove("panning");
        groupTransform = null;
        navigationFitTargetNode = null;

        const currentNodes = Array.from(world.children);
        for (let index = 0; index < currentNodes.length; index += 1) {
          const node = currentNodes[index];
          destroyCommandNodeContent(node);
          unobserveNodeForLines(node);
          if (reportClearing) reportClearing((index + 1) / Math.max(1, currentNodes.length));
          if ((index + 1) % yieldEvery === 0) await waitForLoadingFrame();
        }
        world.innerHTML = "";
        clearNodeRegistry();
        if (reportClearing) reportClearing(1);
        await waitForLoadingFrame();

        nextNodeNumber = 1;
        nextLineNumber = 1;
        lineConnections = [];
        titleHookNodeId = nextTitleHook;
        spaceMeta = nextMeta;
        deloreanModified = Boolean(
          DELOREAN_SPACE_INFO.active &&
          spaceMeta.delorean &&
          typeof spaceMeta.delorean === "object" &&
          spaceMeta.delorean.modifiedAt
        );
        updateDocumentTitle();

        for (let index = 0; index < nextNodes.length; index += 1) {
          restoreStateNode(nextNodes[index]);
          if (reportNodes) reportNodes((index + 1) / Math.max(1, nextNodes.length));
          if ((index + 1) % yieldEvery === 0) await waitForLoadingFrame();
        }
        if (reportNodes) reportNodes(1);
        await waitForLoadingFrame();

        loadLineConnections(nextLines, { onProgress: reportLines });
        updateDocumentTitle();
        await waitForLoadingFrame();

        if (reportRender) reportRender(0.4);
        render();
        if (reportRender) reportRender(1);
      } finally {
        suppressAutosave = false;
      }

      if (autosave) scheduleAutosave();
    }

    async function requestPersistentStorage() {
      if (IS_PLAYGROUND) return;
      if (!navigator.storage || !navigator.storage.persist) return;
      try {
        await navigator.storage.persist();
      } catch (error) {
        console.error("Could not request persistent storage:", error);
      }
    }

    function downloadState(jsonText) {
      const blob = new Blob([jsonText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "mindmap.mind.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    async function saveToFile() {
      const jsonText = JSON.stringify(serializeState(), null, 2);
      try {
        if ("showSaveFilePicker" in window) {
          if (!fileHandle) {
            fileHandle = await window.showSaveFilePicker({
              suggestedName: "mindmap.mind.json",
              types: FILE_TYPES
            });
          }

          const writable = await fileHandle.createWritable();
          await writable.write(jsonText);
          await writable.close();
          return;
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        console.error("Save failed:", error);
      }

      downloadState(jsonText);
    }

    async function openFromFile() {
      try {
        if ("showOpenFilePicker" in window) {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: FILE_TYPES
          });
          if (!handle) return;
          fileHandle = handle;

          const file = await handle.getFile();
          const text = await file.text();
          loadState(JSON.parse(text));
          return;
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        console.error("Open failed:", error);
        alert("Could not open file.");
        return;
      }

      openFileInput.value = "";
      openFileInput.click();
    }

    function getFileExtension(fileName) {
      const name = typeof fileName === "string" ? fileName.trim() : "";
      const dotIndex = name.lastIndexOf(".");
      if (dotIndex <= 0 || dotIndex === name.length - 1) return "";
      return name.slice(dotIndex + 1).toLowerCase();
    }

    function getCloudinaryAttachmentUrl(url) {
      const href = normalizeExternalHref(url);
      if (!href) return "";

      const marker = "/upload/";
      const markerIndex = href.indexOf(marker);
      if (markerIndex === -1) return href;

      return `${href.slice(0, markerIndex + marker.length)}fl_attachment/${href.slice(markerIndex + marker.length)}`;
    }

    function getUploadErrorMessage(error) {
      const message = error && error.message ? String(error.message).trim() : "";
      return (message || "Upload failed.").slice(0, 180);
    }

    function createUploadingFileState(file) {
      const fileName = file && file.name ? file.name : "Untitled file";
      return {
        status: "uploading",
        progress: 0,
        fileName,
        extension: getFileExtension(fileName),
        mimeType: file && file.type ? file.type : "",
        bytes: file && Number.isFinite(Number(file.size)) ? Number(file.size) : 0,
        url: "",
        downloadUrl: "",
        resourceType: "",
        startedAt: Date.now()
      };
    }

    function createUploadedFileState(file, upload) {
      const fileName = file && file.name ? file.name : "Untitled file";
      const url = normalizeExternalHref(upload.secure_url || upload.url || "");
      if (!url) throw new Error("Cloudinary did not return a file URL.");

      return {
        status: "uploaded",
        progress: 100,
        fileName,
        extension: getFileExtension(fileName) || String(upload.format || "").toLowerCase(),
        mimeType: file && file.type ? file.type : "",
        bytes: Number.isFinite(Number(upload.bytes)) ? Number(upload.bytes) : Number(file.size) || 0,
        url,
        downloadUrl: getCloudinaryAttachmentUrl(url),
        resourceType: typeof upload.resource_type === "string" ? upload.resource_type : "",
        publicId: typeof upload.public_id === "string" ? upload.public_id : "",
        width: Number.isFinite(Number(upload.width)) ? Number(upload.width) : null,
        height: Number.isFinite(Number(upload.height)) ? Number(upload.height) : null,
        uploadedAt: Date.now()
      };
    }

    function createFailedFileState(file, error) {
      return {
        ...createUploadingFileState(file),
        status: "error",
        progress: 0,
        error: getUploadErrorMessage(error),
        failedAt: Date.now()
      };
    }

    async function requestCloudinaryUploadSignature(file) {
      const response = await fetch(CLOUDINARY_SIGNATURE_URL, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fileName: file.name || "",
          mimeType: file.type || "",
          bytes: Number(file.size) || 0,
          lastModified: Number(file.lastModified) || 0
        })
      });

      let data = null;
      try {
        data = await response.json();
      } catch (error) {
        data = null;
      }

      if (!response.ok) {
        throw new Error(data && data.error ? data.error : `Upload signature failed: ${response.status}`);
      }

      if (!data || !data.uploadUrl || !data.params || typeof data.params !== "object") {
        throw new Error("Upload signature response was incomplete.");
      }

      return data;
    }

    async function uploadFileToCloudinary(file, onProgress) {
      const signature = await requestCloudinaryUploadSignature(file);
      const formData = new FormData();

      for (const [key, value] of Object.entries(signature.params)) {
        formData.append(key, String(value));
      }
      formData.append("file", file);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", signature.uploadUrl);
        xhr.responseType = "json";

        xhr.upload.addEventListener("progress", (event) => {
          if (!event.lengthComputable || event.total <= 0) return;
          const progress = Math.min(99, Math.round((event.loaded / event.total) * 100));
          onProgress(progress);
        });

        xhr.addEventListener("load", () => {
          const body = xhr.response || {};
          if (xhr.status >= 200 && xhr.status < 300) {
            onProgress(100);
            resolve(body);
            return;
          }

          const cloudinaryMessage = body.error && body.error.message ? body.error.message : "";
          reject(new Error(cloudinaryMessage || `Cloudinary upload failed: ${xhr.status}`));
        });

        xhr.addEventListener("error", () => {
          reject(new Error("Network error while uploading file."));
        });

        xhr.addEventListener("abort", () => {
          reject(new Error("Upload was canceled."));
        });

        xhr.send(formData);
      });
    }

    function createFileUploadNode(file, worldX, worldY) {
      return createCommandNode(
        worldX,
        worldY,
        FILE_WIDGET_COMMAND_ID,
        createUploadingFileState(file),
        BASE_TEXT_PX / camera.scale
      );
    }

    function isAudioFile(file) {
      const mimeType = file && typeof file.type === "string" ? file.type.toLowerCase() : "";
      if (mimeType.startsWith("audio/")) return true;
      const extension = getFileExtension(file && file.name);
      return new Set(["aac", "aif", "aiff", "caf", "flac", "m4a", "mp3", "oga", "ogg", "opus", "wav", "wave", "webm"]).has(extension);
    }

    function createAudioUploadNode(file, worldX, worldY) {
      return createCommandNode(
        worldX,
        worldY,
        AUDIO_WIDGET_COMMAND_ID,
        {
          ...createUploadingFileState(file),
          label: file.name || "Audio",
          showSpeedControl: false,
          source: "drop"
        },
        BASE_TEXT_PX / camera.scale
      );
    }

    async function uploadFileForNode(file, node) {
      try {
        const upload = await uploadFileToCloudinary(file, (progress) => {
          const state = readCommandState(node);
          updateCommandNodeState(node, {
            ...state,
            status: "uploading",
            progress
          });
        });

        updateCommandNodeState(node, createUploadedFileState(file, upload));
      } catch (error) {
        console.error("File upload failed:", error);
        updateCommandNodeState(node, createFailedFileState(file, error));
      }
    }

    async function uploadAudioForNode(file, node) {
      try {
        const upload = await uploadFileToCloudinary(file, (progress) => {
          const state = readCommandState(node);
          updateCommandNodeState(node, {
            ...state,
            status: "uploading",
            progress,
            label: state.label || file.name || "Audio",
            showSpeedControl: false,
            source: "drop"
          });
        });

        updateCommandNodeState(node, {
          ...createUploadedFileState(file, upload),
          label: file.name || "Audio",
          showSpeedControl: false,
          source: "drop"
        });
      } catch (error) {
        console.error("Audio upload failed:", error);
        updateCommandNodeState(node, {
          ...createFailedFileState(file, error),
          label: file.name || "Audio",
          showSpeedControl: false,
          source: "drop"
        });
      }
    }

    function isFileDragEvent(event) {
      const transfer = event.dataTransfer;
      if (!transfer || !transfer.types) return false;
      return Array.from(transfer.types).includes("Files");
    }

    function getDroppedFiles(event) {
      const transfer = event.dataTransfer;
      if (!transfer || !transfer.files) return [];
      return Array.from(transfer.files).filter((file) => file && typeof file.name === "string");
    }

    function handleDroppedFiles(files, clientX, clientY) {
      if (files.length === 0) return;

      const point = screenToWorld(clientX, clientY);
      const offset = 18 / camera.scale;
      files.forEach((file, index) => {
        const x = point.x + index * offset;
        const y = point.y + index * offset;
        if (isAudioFile(file)) {
          const node = createAudioUploadNode(file, x, y);
          void uploadAudioForNode(file, node);
          return;
        }
        const node = createFileUploadNode(file, x, y);
        void uploadFileForNode(file, node);
      });
    }

    function switchMarkdownNodeToPlainTextAtPoint(node, clientX, clientY) {
      if (!isMarkdownViewNode(node)) return false;
      const source = getMarkdownSource(node);
      const range = getCaretRangeFromPoint(clientX, clientY);
      const displayOffset = range && node.contains(range.endContainer)
        ? getRenderedTextOffset(node, range)
        : 0;
      const sourceOffset = getMarkdownSourceOffsetFromDisplayOffset(source, displayOffset);
      switchNodeMarkdownView(node, false, {
        afterSwitch: () => startEditing(node, false, sourceOffset)
      });
      return true;
    }

    function attachNodeHandlers(node) {
      let dragPointerId = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let dragStartClientX = 0;
      let dragStartClientY = 0;
      let dragMoved = false;
      let pendingExternalLinkHref = "";
      let suppressExternalLinkVisit = false;

      node.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || node.classList.contains("editing")) return;
        if (event.target instanceof Element && event.target.closest(".internal-link, .tag-link")) return;
        if (event.target instanceof Element) {
          const externalLinkCard = event.target.closest(".external-link-card");
          const externalLinkPlain = event.target.closest(".external-link-plain");
          if (externalLinkCard && event.target.closest("button, input, textarea, select")) return;
          pendingExternalLinkHref = externalLinkCard && isExternalLinkLabelTarget(externalLinkCard, event.target)
            ? normalizeExternalHref(externalLinkCard.dataset.href || "")
            : externalLinkPlain && node.contains(externalLinkPlain)
              ? normalizeExternalHref(externalLinkPlain.dataset.href || externalLinkPlain.textContent || "")
              : "";
        }
        if (isCommandNode(node) && isCommandInteractiveTarget(event.target)) return;
        if (selectedNodes.size > 0 && !selectedNodes.has(node)) {
          clearSelection();
        }
        closeNodeContextMenu();
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        dragPointerId = event.pointerId;
        node.setPointerCapture(dragPointerId);
        dragStartClientX = event.clientX;
        dragStartClientY = event.clientY;
        dragMoved = false;
        const pointer = screenToNodeSpace(node, event.clientX, event.clientY);
        dragOffsetX = Number(node.dataset.x) - pointer.x;
        dragOffsetY = Number(node.dataset.y) - pointer.y;
        event.preventDefault();
        event.stopPropagation();
      });

      node.addEventListener("pointermove", (event) => {
        if (event.pointerId !== dragPointerId) return;
        if (!dragMoved && Math.hypot(event.clientX - dragStartClientX, event.clientY - dragStartClientY) >= MARQUEE_DRAG_THRESHOLD_PX) {
          dragMoved = true;
        }
        const pointer = screenToNodeSpace(node, event.clientX, event.clientY);
        setNodePosition(node, pointer.x + dragOffsetX, pointer.y + dragOffsetY);
        updateSpacingGuidesForNodes([node]);
      });

      function endDrag(event) {
        if (event.pointerId !== dragPointerId) return;
        const wasMobileLongPress = mobileLongPressPointerIds.has(event.pointerId);
        if (node.hasPointerCapture(dragPointerId)) {
          node.releasePointerCapture(dragPointerId);
        }
        clearSpacingGuides();
        if (event.type === "pointerup" && pendingExternalLinkHref && !dragMoved && !wasMobileLongPress) {
          openExternalHref(pendingExternalLinkHref);
          suppressExternalLinkVisit = true;
        } else if (wasMobileLongPress) {
          suppressExternalLinkVisit = true;
        } else {
          suppressExternalLinkVisit = Boolean(pendingExternalLinkHref && dragMoved);
        }
        dragPointerId = null;
        pendingExternalLinkHref = "";
        scheduleAutosave();
      }

      node.addEventListener("pointerup", endDrag);
      node.addEventListener("pointercancel", endDrag);

      node.addEventListener("dblclick", (event) => {
        event.stopPropagation();
        if (isCommandNode(node)) return;
        if (isCalcVariableNode(node)) return;
        clearSelection();
        if (switchMarkdownNodeToPlainTextAtPoint(node, event.clientX, event.clientY)) return;
        startEditing(node);
      });

      node.addEventListener("click", (event) => {
        if (isHtmlViewNode(node) && !dragMoved) {
          setHtmlWidgetActive(node, true);
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (handleExternalLinkAction(node, event)) return;
        if (suppressExternalLinkVisit) {
          suppressExternalLinkVisit = false;
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (handleExternalLinkVisit(node, event)) return;
        if (node.classList.contains("editing")) return;
        if (!(event.target instanceof Element)) return;
        const tagLink = event.target.closest(".tag-link");
        if (tagLink && node.contains(tagLink)) {
          const tag = tagLink.dataset.tag || tagLink.textContent || "";
          event.preventDefault();
          event.stopPropagation();
          window.open(getMarkFindPathForTag(tag), "_blank", "noopener,noreferrer");
          return;
        }
        const markdownLink = isMarkdownViewNode(node) ? event.target.closest("a[href]") : null;
        if (markdownLink && node.contains(markdownLink)) {
          event.preventDefault();
          event.stopPropagation();
          openExternalHref(markdownLink.getAttribute("href") || "");
          return;
        }
        const link = event.target.closest(".internal-link");
        if (selectedNodes.has(node) && !dragMoved && (!link || !node.contains(link))) {
          toggleSelectionHandleMode();
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (!link || !node.contains(link)) return;

        const targetId = (link.dataset.targetId || "").trim();
        if (!targetId) return;
        const targetNode = getNodeById(targetId);
        if (!targetNode) {
          alert(`Could not find node "${targetId}".`);
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        focusNodeFullScreen(targetNode);
      });

      node.addEventListener("input", () => {
        if (isCalcVariableNode(node)) return;
        if (isMarkdownViewNode(node)) {
          node.dataset.markdownSource = node.textContent || "";
        } else {
          autoLinkExternalUrls(node, { moveCaretToEnd: true });
        }
        updateCalcVariables();
        updateDocumentTitle();
        scheduleSharedRealtimeNodeText(node);
        scheduleAutosave();
        updateSlashMenuForNode(node);
      });

      node.addEventListener("paste", (event) => {
        if (isCalcVariableNode(node)) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        if (isMarkdownViewNode(node)) {
          const clipboard = event.clipboardData;
          const plainText = clipboard ? clipboard.getData("text/plain") || "" : "";
          if (!insertTextAtCaretInNode(node, plainText)) return;
          node.dataset.markdownSource = node.textContent || "";
          updateCalcVariables();
          updateDocumentTitle();
          scheduleSharedRealtimeNodeText(node);
          scheduleAutosave();
          updateSlashMenuForNode(node);
          return;
        }
        if (!insertSanitizedPaste(node, getSanitizedPasteHtml(event))) return;
        autoLinkExternalUrls(node, { force: true, moveCaretToEnd: true });
        updateCalcVariables();
        updateDocumentTitle();
        scheduleSharedRealtimeNodeText(node);
        scheduleAutosave();
        updateSlashMenuForNode(node);
      });

      node.addEventListener("blur", () => {
        if (isCommandNode(node)) return;
        if (isCalcVariableNode(node)) return;
        if (isMarkdownViewNode(node)) {
          node.dataset.markdownSource = node.textContent || "";
        } else {
          autoLinkExternalUrls(node, { force: true });
        }
        stopEditing(node);
        updateCalcVariables();
        closeSlashCommandMenu();
        updateDocumentTitle();
        scheduleAutosave();
      });

      node.addEventListener("mouseleave", () => {
        setHtmlWidgetActive(node, false);
      });

      node.addEventListener("keydown", (event) => {
        if (handleExternalLinkKeydown(node, event)) return;

        if (slashCommandSession && slashCommandSession.node === node) {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            slashCommandSelectedIndex = (slashCommandSelectedIndex + 1) % slashCommandSession.commands.length;
            renderSlashCommandMenu();
            return;
          }

          if (event.key === "ArrowUp") {
            event.preventDefault();
            slashCommandSelectedIndex =
              (slashCommandSelectedIndex - 1 + slashCommandSession.commands.length) % slashCommandSession.commands.length;
            renderSlashCommandMenu();
            return;
          }

          if (event.key === "Enter" || event.key === "Tab") {
            event.preventDefault();
            executeSlashCommand();
            return;
          }
        }

        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          node.blur();
        }

        if (event.key === "Escape") {
          event.preventDefault();
          if (slashCommandSession) {
            closeSlashCommandMenu();
            return;
          }
          node.blur();
        }
      });
    }

    function createTextNode(
      worldX,
      worldY,
      initialText = "",
      baseFontSize = BASE_TEXT_PX / camera.scale,
      preferredId = "",
      initialHtml = null,
      options = {}
    ) {
      const node = document.createElement("div");
      node.className = "text-node";
      node.dataset.nodeId = resolveNodeId(preferredId);
      if (typeof initialHtml === "string") {
        node.innerHTML = sanitizeNodeHtml(initialHtml);
      } else {
        node.textContent = initialText;
      }
      const htmlView = options.viewMode === "html";
      if (!htmlView) {
        normalizeNodeMarkup(node);
        renderTagLinks(node);
      }
      node.contentEditable = "false";

      // Keeps newly-created text visually consistent regardless of current zoom.
      node.dataset.baseFontSize = String(baseFontSize);
      const rotation = Object.prototype.hasOwnProperty.call(options, "rotation")
        ? Number(options.rotation)
        : getNewNodeRotation();
      const normalizedRotation = normalizeRotation(rotation);
      if (Math.abs(normalizedRotation) >= 0.000001) node.dataset.rotation = String(normalizedRotation);
      if (options.floating === true) node.dataset.floating = "true";
      setNodeTimestamps(node, options);
      setNodeCreator(node, options.createdBy || (!options.preserveTimestamps ? currentUser : null));
      setNodePosition(node, worldX, worldY);
      if (options.variable === true) setCalcVariableNode(node, true);
      if (options.viewMode === "markdown" && !isCalcVariableNode(node)) {
        node.dataset.markdownSource = node.textContent || "";
        node.dataset.viewMode = "markdown";
        renderMarkdownNode(node);
      } else if (htmlView && !isCalcVariableNode(node)) {
        node.dataset.htmlSource = initialText;
        node.dataset.viewMode = "html";
        renderHtmlNode(node);
      }
      attachNodeHandlers(node);
      world.appendChild(node);
      registerNode(node);
      if (!isNodeDeleted(node)) observeNodeForLines(node);
      if (options.autosave !== false) scheduleAutosave();
      if (!options.suppressRealtime && !applyingSharedRealtimeNodeStructure) {
        publishSharedRealtimeNodeCreate(node);
      }
      return node;
    }

    function createCommandNode(
      worldX,
      worldY,
      commandId,
      commandState = {},
      baseFontSize = BASE_TEXT_PX / camera.scale,
      preferredId = "",
      commandVersion = "",

    ) {

      node.dataset.kind = "command";

      node.contentEditable = "false";
      node.dataset.baseFontSize = String(baseFontSize);
      const rotation = Object.prototype.hasOwnProperty.call(options, "rotation")
        ? Number(options.rotation)
        : getNewNodeRotation();
      const normalizedRotation = normalizeRotation(rotation);
      if (Math.abs(normalizedRotation) >= 0.000001) node.dataset.rotation = String(normalizedRotation);
      if (options.floating === true) node.dataset.floating = "true";
      setNodeTimestamps(node, options);
      setNodeCreator(node, options.createdBy || (!options.preserveTimestamps ? currentUser : null));
      setNodePosition(node, worldX, worldY);
      if (!isNodeDeleted(node)) renderCommandNodeContent(node);
      attachNodeHandlers(node);

      }
      return node;
    }

    function getPlaygroundWidgetId(index) {
      return `playground-widget-${index}`;

    function getLandscapeSlot(index) {
      let remaining = Math.max(1, Math.floor(Number(index) || 1));
      let columns = LANDSCAPE_INITIAL_COLUMNS;
      let rows = LANDSCAPE_INITIAL_ROWS;
      const initialSlots = columns * rows;

      if (remaining <= initialSlots) {
        const zeroIndex = remaining - 1;
        return {
          column: zeroIndex % columns,
          row: Math.floor(zeroIndex / columns)
        };
      }

      remaining -= initialSlots;
      while (true) {
        columns += 1;
        if (remaining <= rows) {
          return {
            column: columns - 1,
            row: remaining - 1
          };
        }
        remaining -= rows;

        rows += 1;
        if (remaining <= columns) {
          return {
            column: remaining - 1,
            row: rows - 1
          };
        }
        remaining -= columns;
      }
    }

    function getLandscapeSlotCenter(index) {
      const slot = getLandscapeSlot(index);
      return {
        x: (slot.column - (LANDSCAPE_INITIAL_COLUMNS - 1) / 2) * LANDSCAPE_SLOT_GAP_X,
        y: (slot.row - (LANDSCAPE_INITIAL_ROWS - 1) / 2) * LANDSCAPE_SLOT_GAP_Y
      };
    }

    function getPlaygroundSlotCenter(index) {
      return getLandscapeSlotCenter(index);
    }

    function getPlaygroundWidgetCount() {

      for (const node of world.children) {
        if (!(node instanceof HTMLElement) || isNodeDeleted(node)) continue;
        const match = /^playground-widget-(\d+)$/.exec(node.dataset.nodeId || "");
        if (!match) continue;
        const index = Number(match[1]);
        if (Number.isFinite(index)) count = Math.max(count, index);
      }
      return count;
    }

    function getUserSpaceWidgetId(slug) {

    function getUserSpaceWidgetCount() {
      let count = 0;
      for (const node of world.children) {

    function getUserSpaceWidgetBySlug(slug, options = {}) {
      return getNodeById(getUserSpaceWidgetId(slug), options);
