      const fallbackRect = fallbackNode.getBoundingClientRect();
      const x = rect.left || fallbackRect.left;
      const y = (rect.bottom || fallbackRect.bottom) + 8;
      const menuRect = slashCommandMenu.getBoundingClientRect();
      slashCommandMenu.style.left = `${clamp(x, 8, Math.max(8, window.innerWidth - menuRect.width - 8))}px`;
      slashCommandMenu.style.top = `${clamp(y, 8, Math.max(8, window.innerHeight - menuRect.height - 8))}px`;
    }

    function renderSlashCommandMenu() {
      if (!slashCommandSession) return;
      const { node, commands, range } = slashCommandSession;
      slashCommandMenu.replaceChildren();
      slashCommandSelectedIndex = clamp(slashCommandSelectedIndex, 0, Math.max(0, commands.length - 1));

      commands.forEach((command, index) => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = "slash-command-option";
        option.setAttribute("aria-selected", index === slashCommandSelectedIndex ? "true" : "false");
        const name = document.createElement("span");
        name.className = "slash-command-name";
        name.textContent = `/${command.id} ${command.title || ""}`;
        const hint = document.createElement("span");
        hint.className = "slash-command-hint";
        hint.textContent = command.description || "";
        option.append(name, hint);
        option.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          executeSlashCommand(index);
        });
        slashCommandMenu.appendChild(option);
      });

      slashCommandMenu.hidden = false;
      positionSlashCommandMenu(range, node);
    }

    function updateSlashMenuForNode(node) {
      if (isCommandNode(node) || !node.classList.contains("editing")) {
        closeSlashCommandMenu();
        return;
      }

      const query = getSlashQueryForNode(node);
      if (!query) {
        closeSlashCommandMenu();
        return;
      }

      const commands = getMatchingCommands(query.query).filter((command) => {
        return !query.hasArgs || Boolean(command.acceptsArgs);
      });
      if (commands.length === 0) {
        closeSlashCommandMenu();
        return;
      }

      slashCommandSession = { node, commands, ...query };
      slashCommandSelectedIndex = 0;
      renderSlashCommandMenu();
    }

    function removeSlashToken(node, session) {
      const start = getTextPositionAtOffset(node, session.tokenStart);
      const end = getTextPositionAtOffset(node, session.tokenEnd);
      const range = document.createRange();
      range.setStart(start.node, start.offset);
      range.setEnd(end.node, end.offset);
      range.deleteContents();
      normalizeNodeMarkup(node);
    }

    function executeSlashCommand(index = slashCommandSelectedIndex) {
      const session = slashCommandSession;
      if (!session) return;
      const command = session.commands[index];
      if (!command) return;

      const sourceNode = session.node;
      const size = getNodeWorldSize(sourceNode);
      const sourceX = Number(sourceNode.dataset.x);
      const sourceY = Number(sourceNode.dataset.y);
      removeSlashToken(sourceNode, session);

      const state = typeof command.createState === "function"
        ? command.createState({ args: session.args || "", query: session.query || "" })
        : {};
      const commandNode = createCommandNode(
        sourceX,
        sourceY + size.height + 12 / camera.scale,
        command.id,
        state,
        Number(sourceNode.dataset.baseFontSize)
      );

      if (!(sourceNode.textContent || "").trim()) {
        removeLineConnectionsForNodes([sourceNode]);
        unobserveNodeForLines(sourceNode);
        world.removeChild(sourceNode);
        setNodePosition(commandNode, sourceX, sourceY);
      } else {
        sourceNode.blur();
      }

      closeSlashCommandMenu();
      clearSelection();
      setSelectedNodes([commandNode]);
      scheduleAutosave();
    }

    function getActiveEditingNode() {
      for (const node of world.children) {
        if (node instanceof HTMLElement && node.classList.contains("editing")) {
          return node;
        }
      }
      return null;
    }

    function deactivateEditingNodeOnOutsidePointerDown(target) {
      const editingNode = getActiveEditingNode();
      if (!editingNode) return;
      if (target instanceof Node && editingNode.contains(target)) return;
      if (target instanceof Node && slashCommandMenu.contains(target)) return;
      editingNode.blur();
    }

    function getScreenRectBetweenPoints(startX, startY, endX, endY) {
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const right = Math.max(startX, endX);
      const bottom = Math.max(startY, endY);
      return {
        left,
        top,
        right,
        bottom,
        width: right - left,
        height: bottom - top
      };
    }

    function renderMarqueeRect(rect) {
      marqueeSelection.hidden = false;
      marqueeSelection.style.left = `${rect.left}px`;
      marqueeSelection.style.top = `${rect.top}px`;
      marqueeSelection.style.width = `${rect.width}px`;
      marqueeSelection.style.height = `${rect.height}px`;
    }

    function hideMarqueeRect() {
      marqueeSelection.hidden = true;
    }

    function getNodesIntersectingScreenRect(rect) {
      const matches = [];
      for (const node of world.children) {
        if (!(node instanceof HTMLElement)) continue;
        const nodeRect = node.getBoundingClientRect();
        const intersects =
          nodeRect.right >= rect.left &&
          nodeRect.left <= rect.right &&
          nodeRect.bottom >= rect.top &&
          nodeRect.top <= rect.bottom;
        if (intersects) matches.push(node);
      }
      return matches;
    }

    function applySelectionNodeClasses() {
      for (const node of world.children) {
        if (!(node instanceof HTMLElement)) continue;
        node.classList.toggle("selected", selectedNodes.has(node));
      }
    }

    function renderGroupSelectionBox() {
      if (selectedNodes.size === 0 || !selectionBoundsWorld) {
        groupSelectionBox.hidden = true;
        return;
      }

      const left = camera.x + selectionBoundsWorld.minX * camera.scale - GROUP_SELECTION_PADDING_PX;
      const top = camera.y + selectionBoundsWorld.minY * camera.scale - GROUP_SELECTION_PADDING_PX;
      const width = selectionBoundsWorld.width * camera.scale + GROUP_SELECTION_PADDING_PX * 2;
      const height = selectionBoundsWorld.height * camera.scale + GROUP_SELECTION_PADDING_PX * 2;

      groupSelectionBox.hidden = false;
      groupSelectionBox.style.left = `${left}px`;
      groupSelectionBox.style.top = `${top}px`;
      groupSelectionBox.style.width = `${width}px`;
      groupSelectionBox.style.height = `${height}px`;
    }

    function refreshSelectionBounds() {
      if (selectedNodes.size === 0) {
        selectionBoundsWorld = null;
        renderGroupSelectionBox();
        return;
      }

      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      for (const node of selectedNodes) {
        if (!world.contains(node)) continue;
        const x = Number(node.dataset.x);
        const y = Number(node.dataset.y);
        const size = getNodeWorldSize(node);
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + size.width);
        maxY = Math.max(maxY, y + size.height);
      }

      if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) {
        selectedNodes.clear();
        selectionBoundsWorld = null;
        applySelectionNodeClasses();
        renderGroupSelectionBox();
        return;
      }

      selectionBoundsWorld = {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
      renderGroupSelectionBox();
    }

    function setSelectedNodes(nodes) {
      const next = new Set();
      for (const node of nodes) {
        if (node instanceof HTMLElement && world.contains(node)) {
          next.add(node);
        }
      }

      selectedNodes.clear();
      for (const node of next) {
        selectedNodes.add(node);
      }

      applySelectionNodeClasses();
      refreshSelectionBounds();
    }

    function alignSelectedNodesToColumn() {
      if (selectedNodes.size < 2) return false;
      const items = getSelectedNodeLayoutItems();
      const targets = getColumnAlignmentTargets(items);
      if (targets.length < 2) return false;
      return animateNodePositions(targets);
    }

    function clearSelection() {
      if (selectedNodes.size === 0) {
        selectionBoundsWorld = null;
        renderGroupSelectionBox();
        return;
      }
      selectedNodes.clear();
      applySelectionNodeClasses();
      refreshSelectionBounds();
    }

    function beginMarqueeSelection(event) {
      marqueeSession = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        currentX: event.clientX,
        currentY: event.clientY,
        hasMoved: false
      };
      viewport.setPointerCapture(event.pointerId);
    }

    function updateMarqueeSelection(event) {
      if (!marqueeSession || event.pointerId !== marqueeSession.pointerId) return;
      marqueeSession.currentX = event.clientX;
      marqueeSession.currentY = event.clientY;

      const distance = Math.hypot(
        marqueeSession.currentX - marqueeSession.startX,
        marqueeSession.currentY - marqueeSession.startY
      );
      if (!marqueeSession.hasMoved && distance >= MARQUEE_DRAG_THRESHOLD_PX) {
        marqueeSession.hasMoved = true;
      }
      if (!marqueeSession.hasMoved) return;

      const rect = getScreenRectBetweenPoints(
        marqueeSession.startX,
        marqueeSession.startY,
        marqueeSession.currentX,
        marqueeSession.currentY
      );
      renderMarqueeRect(rect);
      setSelectedNodes(getNodesIntersectingScreenRect(rect));
    }

    function endMarqueeSelection(event) {
      if (!marqueeSession || event.pointerId !== marqueeSession.pointerId) return;
      const didMove = marqueeSession.hasMoved;
      if (viewport.hasPointerCapture(event.pointerId)) {
        viewport.releasePointerCapture(event.pointerId);
      }
      marqueeSession = null;
      hideMarqueeRect();
      if (!didMove) {
        clearSelection();
      }
    }

    function isCanvasPanExcludedTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest("button, input, textarea, select, [data-command-interactive], .editing"));
    }

    function beginCanvasPan(event) {
      if (event.button !== 0 || !event.shiftKey || isCanvasPanExcludedTarget(event.target)) return;

      closeNodeContextMenu();
      closeLineContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

      panSession = {
        pointerId: event.pointerId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startCameraX: camera.x,
        startCameraY: camera.y,
        moved: false
      };

      viewport.classList.add("panning");
      viewport.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopImmediatePropagation();
    }

    function updateCanvasPan(event) {
      if (!panSession || event.pointerId !== panSession.pointerId) return;

      const dx = event.clientX - panSession.startClientX;
      const dy = event.clientY - panSession.startClientY;
      panSession.moved = panSession.moved || dx !== 0 || dy !== 0;
      camera.x = panSession.startCameraX + dx;
      camera.y = panSession.startCameraY + dy;
      render();
      event.preventDefault();
      event.stopPropagation();
    }

    function endCanvasPan(event) {
      if (!panSession || event.pointerId !== panSession.pointerId) return;
      const didMove = panSession.moved;
      if (viewport.hasPointerCapture(event.pointerId)) {
        viewport.releasePointerCapture(event.pointerId);
      }
      panSession = null;
      viewport.classList.remove("panning");
      if (didMove) scheduleAutosave();
      event.preventDefault();
      event.stopPropagation();
    }

    function beginGroupTransform(event, mode, captureElement) {
      if (event.button !== 0) return;
      if (selectedNodes.size === 0 || !selectionBoundsWorld) return;

      closeNodeContextMenu();
      closeLineContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

      groupTransform = {
        pointerId: event.pointerId,
        mode,
        captureElement,
        startPointer: screenToWorld(event.clientX, event.clientY),
        initialBounds: { ...selectionBoundsWorld },
        nodeSnapshots: Array.from(selectedNodes).map((node) => ({
          node,
          x: Number(node.dataset.x),
          y: Number(node.dataset.y),
          baseFontSize: Number(node.dataset.baseFontSize)
        }))
      };

      captureElement.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopPropagation();
    }

    function updateGroupTransform(event) {
      if (!groupTransform || event.pointerId !== groupTransform.pointerId) return;

      const pointer = screenToWorld(event.clientX, event.clientY);
      const dx = pointer.x - groupTransform.startPointer.x;
      const dy = pointer.y - groupTransform.startPointer.y;

      if (groupTransform.mode === "drag") {
        for (const snapshot of groupTransform.nodeSnapshots) {
          setNodePosition(snapshot.node, snapshot.x + dx, snapshot.y + dy, { skipSelectionUpdate: true });
        }
        refreshSelectionBounds();
        return;
      }

      const initialWidth = Math.max(0.001, groupTransform.initialBounds.width);
      const initialHeight = Math.max(0.001, groupTransform.initialBounds.height);
      const nextWidth = Math.max(0.001, initialWidth + dx);
      const nextHeight = Math.max(0.001, initialHeight + dy);
      const scaleX = nextWidth / initialWidth;
      const scaleY = nextHeight / initialHeight;
      const fontScale = Math.sqrt(scaleX * scaleY);

      for (const snapshot of groupTransform.nodeSnapshots) {
        const nextX = groupTransform.initialBounds.minX + (snapshot.x - groupTransform.initialBounds.minX) * scaleX;
        const nextY = groupTransform.initialBounds.minY + (snapshot.y - groupTransform.initialBounds.minY) * scaleY;
        snapshot.node.dataset.baseFontSize = String(
          Math.max(0.001, snapshot.baseFontSize * fontScale)
        );
        setNodePosition(snapshot.node, nextX, nextY, { skipSelectionUpdate: true });
      }

      refreshSelectionBounds();
    }

    function endGroupTransform(event) {
      if (!groupTransform || event.pointerId !== groupTransform.pointerId) return;
      const { captureElement, pointerId } = groupTransform;
      if (captureElement.hasPointerCapture(pointerId)) {
        captureElement.releasePointerCapture(pointerId);
      }
      groupTransform = null;
      refreshSelectionBounds();
      scheduleAutosave();
    }

    function render() {
      for (const node of world.children) {
        renderNode(node);
      }
      renderLineConnections();
      renderGroupSelectionBox();
      renderNavigationFitMarkers();
    }

    function screenToWorld(clientX, clientY) {
      return {
        x: (clientX - camera.x) / camera.scale,
        y: (clientY - camera.y) / camera.scale
      };
    }

    function setNodePosition(node, x, y, options = {}) {
      const { skipSelectionUpdate = false } = options;
      node.dataset.x = String(x);
      node.dataset.y = String(y);
      renderNode(node);
      requestLineRender();
      if (!skipSelectionUpdate && selectedNodes.has(node)) {
        refreshSelectionBounds();
      }
    }

    function renderNode(node) {
      const worldX = Number(node.dataset.x);
      const worldY = Number(node.dataset.y);
      const baseFontSize = Number(node.dataset.baseFontSize);
      node.style.left = `${camera.x + worldX * camera.scale}px`;
      node.style.top = `${camera.y + worldY * camera.scale}px`;
      node.style.fontSize = `${baseFontSize * camera.scale}px`;
    }

    function zoomTo(newScale, clientX, clientY) {
      if (!Number.isFinite(newScale) || newScale <= 0) return;
      const worldPoint = screenToWorld(clientX, clientY);
      camera.scale = newScale;
      camera.x = clientX - worldPoint.x * camera.scale;
      camera.y = clientY - worldPoint.y * camera.scale;
      render();
    }

    function selectAllText(node) {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(node);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function startEditing(node, selectAll = false) {
      if (isCommandNode(node)) return;
      node.classList.add("editing");
      node.contentEditable = "true";
      node.focus();
      if (selectAll) selectAllText(node);
    }

    function stopEditing(node) {
      node.contentEditable = "false";
      node.classList.remove("editing");
    }

    function serializeState() {
      return {
        version: 1,
        camera: {
          x: camera.x,
          y: camera.y,
          scale: camera.scale
        },
        nodes: Array.from(world.children).map(serializeNode),
        lines: lineConnections.map(serializeLineConnection)
      };
    }

    function getSharedSpaceUrl() {
      const params = new URLSearchParams({ slug: SHARED_SPACE_SLUG });
      return `/.netlify/functions/spaces?${params.toString()}`;
    }

    async function requestSharedSpace(options = {}) {
      const response = await fetch(getSharedSpaceUrl(), {
        headers: {
          "Accept": "application/json",
          ...(options.body ? { "Content-Type": "application/json" } : {})
        },
        ...options
      });

      if (!response.ok) {
        throw new Error(`Shared space request failed: ${response.status}`);
      }

      return response.json();
    }

    async function saveCurrentState() {
      const state = serializeState();
      if (SHARED_SPACE_SLUG) {
        savingSharedState = true;
        try {
          const data = await requestSharedSpace({
            method: "PUT",
            body: JSON.stringify({ state })
          });
          latestSharedUpdatedAt = Number(data.updatedAt) || latestSharedUpdatedAt;
        } finally {
          savingSharedState = false;
        }
        return;
      }

      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function scheduleAutosave() {
      if (suppressAutosave || applyingSharedState) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        void saveCurrentState().catch((error) => {
          console.error("Autosave failed:", error);
        });
      }, 120);
    }

    function loadState(state, options = {}) {
      if (!state || typeof state !== "object") {
        throw new Error("Invalid state file.");
      }

      const { autosave = true, onProgress = null } = options;
      const nextCamera = state.camera || {};
      const nextNodes = Array.isArray(state.nodes) ? state.nodes : [];
      const nextLines = Array.isArray(state.lines) ? state.lines : [];
      const reportProgress = typeof onProgress === "function" ? onProgress : null;

      suppressAutosave = true;
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      cancelLineDraft();
      closeNodeContextMenu();
      closeLineContextMenu();
      closeLinkNodeDialog();
      closeSlashCommandMenu();
      clearSelection();
      hideMarqueeRect();
      marqueeSession = null;
      panSession = null;
      viewport.classList.remove("panning");
      groupTransform = null;
      navigationFitTargetNode = null;
      for (const node of Array.from(world.children)) {
        destroyCommandNodeContent(node);
        unobserveNodeForLines(node);
      }
      world.innerHTML = "";
      nextNodeNumber = 1;
      nextLineNumber = 1;
      lineConnections = [];

      camera.x = Number.isFinite(Number(nextCamera.x)) ? Number(nextCamera.x) : window.innerWidth / 2;
      camera.y = Number.isFinite(Number(nextCamera.y)) ? Number(nextCamera.y) : window.innerHeight / 2;
      camera.scale = Number.isFinite(Number(nextCamera.scale)) && Number(nextCamera.scale) > 0
        ? Number(nextCamera.scale)
        : 1;

      nextNodes.forEach((entry, index) => {
        const x = Number.isFinite(Number(entry.x)) ? Number(entry.x) : 0;
        const y = Number.isFinite(Number(entry.y)) ? Number(entry.y) : 0;
        const text = typeof entry.text === "string" ? entry.text : "";
        const html = typeof entry.html === "string" ? sanitizeNodeHtml(entry.html) : null;
        const id = typeof entry.id === "string" ? entry.id : "";
        const baseFontSize = Number.isFinite(Number(entry.baseFontSize)) && Number(entry.baseFontSize) > 0
          ? Number(entry.baseFontSize)
          : BASE_TEXT_PX / camera.scale;
        if (entry.kind === "command") {
          const commandId = typeof entry.commandId === "string" ? entry.commandId : "";
          const commandVersion = typeof entry.commandVersion === "string" ? entry.commandVersion : "";
          const commandState = entry.commandState && typeof entry.commandState === "object"
            ? entry.commandState
            : {};
          createCommandNode(x, y, commandId, commandState, baseFontSize, id, commandVersion);
        } else {
          createTextNode(x, y, text, baseFontSize, id, html);
        }
        if (reportProgress) reportProgress((index + 1) / Math.max(1, nextNodes.length));
      });

      loadLineConnections(nextLines);

      if (nextNodes.length === 0 && reportProgress) reportProgress(1);

      suppressAutosave = false;
      render();
      if (autosave) scheduleAutosave();
    }

    async function requestPersistentStorage() {
      if (!navigator.storage || !navigator.storage.persist) return;
      try {
        await navigator.storage.persist();
      } catch (error) {
        console.error("Could not request persistent storage:", error);
      }
    }

    function downloadState(jsonText) {
      const blob = new Blob([jsonText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "mindmap.mind.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    async function saveToFile() {
      const jsonText = JSON.stringify(serializeState(), null, 2);
      try {
        if ("showSaveFilePicker" in window) {
          if (!fileHandle) {
            fileHandle = await window.showSaveFilePicker({
              suggestedName: "mindmap.mind.json",
              types: FILE_TYPES
            });
          }

          const writable = await fileHandle.createWritable();
          await writable.write(jsonText);
          await writable.close();
          return;
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        console.error("Save failed:", error);
      }

      downloadState(jsonText);
    }

    async function openFromFile() {
      try {
        if ("showOpenFilePicker" in window) {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: FILE_TYPES
          });
          if (!handle) return;
          fileHandle = handle;

          const file = await handle.getFile();
          const text = await file.text();
          loadState(JSON.parse(text));
          return;
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        console.error("Open failed:", error);
        alert("Could not open file.");
        return;
      }

      openFileInput.value = "";
      openFileInput.click();
    }

    function getFileExtension(fileName) {
      const name = typeof fileName === "string" ? fileName.trim() : "";
      const dotIndex = name.lastIndexOf(".");
      if (dotIndex <= 0 || dotIndex === name.length - 1) return "";
      return name.slice(dotIndex + 1).toLowerCase();
    }

    function getCloudinaryAttachmentUrl(url) {
      const href = normalizeExternalHref(url);
      if (!href) return "";

      const marker = "/upload/";
      const markerIndex = href.indexOf(marker);
      if (markerIndex === -1) return href;

      return `${href.slice(0, markerIndex + marker.length)}fl_attachment/${href.slice(markerIndex + marker.length)}`;
    }

    function getUploadErrorMessage(error) {
      const message = error && error.message ? String(error.message).trim() : "";
      return (message || "Upload failed.").slice(0, 180);
    }

    function createUploadingFileState(file) {
      const fileName = file && file.name ? file.name : "Untitled file";
      return {
        status: "uploading",
        progress: 0,
        fileName,
        extension: getFileExtension(fileName),
        mimeType: file && file.type ? file.type : "",
        bytes: file && Number.isFinite(Number(file.size)) ? Number(file.size) : 0,
        url: "",
        downloadUrl: "",
        resourceType: "",
        startedAt: Date.now()
      };
    }

    function createUploadedFileState(file, upload) {
      const fileName = file && file.name ? file.name : "Untitled file";
      const url = normalizeExternalHref(upload.secure_url || upload.url || "");
      if (!url) throw new Error("Cloudinary did not return a file URL.");

      return {
        status: "uploaded",
        progress: 100,
        fileName,
        extension: getFileExtension(fileName) || String(upload.format || "").toLowerCase(),
        mimeType: file && file.type ? file.type : "",
        bytes: Number.isFinite(Number(upload.bytes)) ? Number(upload.bytes) : Number(file.size) || 0,
        url,
        downloadUrl: getCloudinaryAttachmentUrl(url),
        resourceType: typeof upload.resource_type === "string" ? upload.resource_type : "",
        publicId: typeof upload.public_id === "string" ? upload.public_id : "",
        width: Number.isFinite(Number(upload.width)) ? Number(upload.width) : null,
        height: Number.isFinite(Number(upload.height)) ? Number(upload.height) : null,
        uploadedAt: Date.now()
      };
    }

    function createFailedFileState(file, error) {
      return {
        ...createUploadingFileState(file),
        status: "error",
        progress: 0,
        error: getUploadErrorMessage(error),
        failedAt: Date.now()
      };
    }

    async function requestCloudinaryUploadSignature(file) {
      const response = await fetch(CLOUDINARY_SIGNATURE_URL, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fileName: file.name || "",
          mimeType: file.type || "",
          bytes: Number(file.size) || 0,
          lastModified: Number(file.lastModified) || 0
        })
      });

      let data = null;
      try {
        data = await response.json();
      } catch (error) {
        data = null;
      }

      if (!response.ok) {
        throw new Error(data && data.error ? data.error : `Upload signature failed: ${response.status}`);
      }

      if (!data || !data.uploadUrl || !data.params || typeof data.params !== "object") {
        throw new Error("Upload signature response was incomplete.");
      }

      return data;
    }

    async function uploadFileToCloudinary(file, onProgress) {
      const signature = await requestCloudinaryUploadSignature(file);
      const formData = new FormData();

      for (const [key, value] of Object.entries(signature.params)) {
        formData.append(key, String(value));
      }
      formData.append("file", file);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", signature.uploadUrl);
        xhr.responseType = "json";

        xhr.upload.addEventListener("progress", (event) => {
          if (!event.lengthComputable || event.total <= 0) return;
          const progress = Math.min(99, Math.round((event.loaded / event.total) * 100));
          onProgress(progress);
        });

        xhr.addEventListener("load", () => {
          const body = xhr.response || {};
          if (xhr.status >= 200 && xhr.status < 300) {
            onProgress(100);
            resolve(body);
            return;
          }

          const cloudinaryMessage = body.error && body.error.message ? body.error.message : "";
          reject(new Error(cloudinaryMessage || `Cloudinary upload failed: ${xhr.status}`));
        });

        xhr.addEventListener("error", () => {
          reject(new Error("Network error while uploading file."));
        });

        xhr.addEventListener("abort", () => {
          reject(new Error("Upload was canceled."));
        });

        xhr.send(formData);
      });
    }

    function createFileUploadNode(file, worldX, worldY) {
      return createCommandNode(
        worldX,
        worldY,
        FILE_WIDGET_COMMAND_ID,
        createUploadingFileState(file),
        BASE_TEXT_PX / camera.scale
      );
    }

    async function uploadFileForNode(file, node) {
      try {
        const upload = await uploadFileToCloudinary(file, (progress) => {
          const state = readCommandState(node);
          updateCommandNodeState(node, {
            ...state,
            status: "uploading",
            progress
          });
        });

        updateCommandNodeState(node, createUploadedFileState(file, upload));
      } catch (error) {
        console.error("File upload failed:", error);
        updateCommandNodeState(node, createFailedFileState(file, error));
      }
    }

    function isFileDragEvent(event) {
      const transfer = event.dataTransfer;
      if (!transfer || !transfer.types) return false;
      return Array.from(transfer.types).includes("Files");
    }

    function getDroppedFiles(event) {
      const transfer = event.dataTransfer;
      if (!transfer || !transfer.files) return [];
      return Array.from(transfer.files).filter((file) => file && typeof file.name === "string");
    }

    function handleDroppedFiles(files, clientX, clientY) {
      if (files.length === 0) return;

      const point = screenToWorld(clientX, clientY);
      const offset = 18 / camera.scale;
      const nodes = files.map((file, index) => {
        const node = createFileUploadNode(file, point.x + index * offset, point.y + index * offset);
        void uploadFileForNode(file, node);
        return node;
      });

      clearSelection();
      setSelectedNodes(nodes);
    }

    function attachNodeHandlers(node) {
      let dragPointerId = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let dragStartClientX = 0;
      let dragStartClientY = 0;
      let dragMoved = false;
      let pendingExternalLinkHref = "";
      let suppressExternalLinkVisit = false;

      node.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || node.classList.contains("editing")) return;
        if (event.target instanceof Element && event.target.closest(".internal-link")) return;
        if (event.target instanceof Element) {
          const externalLinkCard = event.target.closest(".external-link-card");
          if (externalLinkCard && event.target.closest("button, input, textarea, select")) return;
          pendingExternalLinkHref = normalizeExternalHref(externalLinkCard ? externalLinkCard.dataset.href : "");
        }
        if (isCommandNode(node) && isCommandInteractiveTarget(event.target)) return;
        if (selectedNodes.size > 0 && !selectedNodes.has(node)) {
          clearSelection();
        }
        closeNodeContextMenu();
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        dragPointerId = event.pointerId;
        node.setPointerCapture(dragPointerId);
        dragStartClientX = event.clientX;
        dragStartClientY = event.clientY;
        dragMoved = false;
        const pointer = screenToWorld(event.clientX, event.clientY);
        dragOffsetX = Number(node.dataset.x) - pointer.x;
        dragOffsetY = Number(node.dataset.y) - pointer.y;
        event.preventDefault();
        event.stopPropagation();
      });

      node.addEventListener("pointermove", (event) => {
        if (event.pointerId !== dragPointerId) return;
        if (!dragMoved && Math.hypot(event.clientX - dragStartClientX, event.clientY - dragStartClientY) >= MARQUEE_DRAG_THRESHOLD_PX) {
          dragMoved = true;
        }
        const pointer = screenToWorld(event.clientX, event.clientY);
        setNodePosition(node, pointer.x + dragOffsetX, pointer.y + dragOffsetY);
      });

      function endDrag(event) {
        if (event.pointerId !== dragPointerId) return;
        if (node.hasPointerCapture(dragPointerId)) {
          node.releasePointerCapture(dragPointerId);
        }
        if (event.type === "pointerup" && pendingExternalLinkHref && !dragMoved) {
          openExternalHref(pendingExternalLinkHref);
          suppressExternalLinkVisit = true;
        } else {
          suppressExternalLinkVisit = Boolean(pendingExternalLinkHref && dragMoved);
        }
        dragPointerId = null;
        pendingExternalLinkHref = "";
        scheduleAutosave();
      }

      node.addEventListener("pointerup", endDrag);
      node.addEventListener("pointercancel", endDrag);

      node.addEventListener("dblclick", (event) => {
        event.stopPropagation();
        if (isCommandNode(node)) return;
        clearSelection();
        startEditing(node);
      });

      node.addEventListener("click", (event) => {
        if (handleExternalLinkAction(node, event)) return;
        if (suppressExternalLinkVisit) {
          suppressExternalLinkVisit = false;
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        if (handleExternalLinkVisit(node, event)) return;
        if (node.classList.contains("editing")) return;
        if (!(event.target instanceof Element)) return;
        const link = event.target.closest(".internal-link");
        if (!link || !node.contains(link)) return;

        const targetId = (link.dataset.targetId || "").trim();
        if (!targetId) return;
        const targetNode = getNodeById(targetId);
        if (!targetNode) {
          alert(`Could not find node "${targetId}".`);
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        focusNodeFullScreen(targetNode);
      });

      node.addEventListener("input", () => {
        autoLinkExternalUrls(node, { moveCaretToEnd: true });
        scheduleAutosave();
        updateSlashMenuForNode(node);
      });

      node.addEventListener("paste", () => {
        setTimeout(() => {
          autoLinkExternalUrls(node, { force: true, moveCaretToEnd: true });
          updateSlashMenuForNode(node);
        }, 0);
      });

      node.addEventListener("blur", () => {
        if (isCommandNode(node)) return;
        autoLinkExternalUrls(node, { force: true });
        stopEditing(node);
        closeSlashCommandMenu();
        scheduleAutosave();
      });

      node.addEventListener("keydown", (event) => {
        if (handleExternalLinkKeydown(node, event)) return;

        if (slashCommandSession && slashCommandSession.node === node) {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            slashCommandSelectedIndex = (slashCommandSelectedIndex + 1) % slashCommandSession.commands.length;
            renderSlashCommandMenu();
            return;
          }

          if (event.key === "ArrowUp") {
            event.preventDefault();
            slashCommandSelectedIndex =
              (slashCommandSelectedIndex - 1 + slashCommandSession.commands.length) % slashCommandSession.commands.length;
            renderSlashCommandMenu();
            return;
          }

          if (event.key === "Enter" || event.key === "Tab") {
            event.preventDefault();
            executeSlashCommand();
            return;
          }
        }

        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          node.blur();
        }

        if (event.key === "Escape") {
          event.preventDefault();
          if (slashCommandSession) {
            closeSlashCommandMenu();
            return;
          }
          node.blur();
        }
      });
    }

    function createTextNode(
      worldX,
      worldY,
      initialText = "",
      baseFontSize = BASE_TEXT_PX / camera.scale,
      preferredId = "",
      initialHtml = null
    ) {
      const node = document.createElement("div");
      node.className = "text-node";
      node.dataset.nodeId = resolveNodeId(preferredId);
      if (typeof initialHtml === "string") {
        node.innerHTML = sanitizeNodeHtml(initialHtml);
      } else {
        node.textContent = initialText;
      }
      normalizeNodeMarkup(node);
      node.contentEditable = "false";

      // Keeps newly-created text visually consistent regardless of current zoom.
      node.dataset.baseFontSize = String(baseFontSize);
      setNodePosition(node, worldX, worldY);
      attachNodeHandlers(node);
      world.appendChild(node);
      observeNodeForLines(node);
      scheduleAutosave();
      return node;
    }

    function createCommandNode(
      worldX,
      worldY,
      commandId,
      commandState = {},
      baseFontSize = BASE_TEXT_PX / camera.scale,
      preferredId = "",
      commandVersion = ""
    ) {
      const node = document.createElement("div");
      node.className = "text-node command-node";
      node.dataset.kind = "command";
      node.dataset.nodeId = resolveNodeId(preferredId);
      node.dataset.commandId = commandId;
      if (commandVersion) node.dataset.commandVersion = commandVersion;
      writeCommandState(node, commandState);
      node.contentEditable = "false";
      node.dataset.baseFontSize = String(baseFontSize);
      setNodePosition(node, worldX, worldY);
      renderCommandNodeContent(node);
      attachNodeHandlers(node);
      world.appendChild(node);
      observeNodeForLines(node);
      scheduleAutosave();
      return node;
    }

    viewport.addEventListener("pointerup", endCanvasPan);

    viewport.addEventListener("pointerup", endMarqueeSelection);
    viewport.addEventListener("pointercancel", endMarqueeSelection);

    viewport.addEventListener("wheel", (event) => {
      event.preventDefault();
      closeNodeContextMenu();
      closeLineContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

      const isZoomGesture = event.ctrlKey || event.metaKey;
      if (isZoomGesture) {
        // Uses native trackpad wheel deltas (including macOS momentum events).
        const factor = Math.exp(-event.deltaY * ZOOM_SENSITIVITY);
        zoomTo(camera.scale * factor, event.clientX, event.clientY);
      } else {
        camera.x -= event.deltaX;
        camera.y -= event.deltaY;
        render();

      scheduleAutosave();
    }, { passive: false });

    viewport.addEventListener("gesturestart", (event) => {

      closeNodeContextMenu();
      closeLineContextMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();
      gestureStartScale = camera.scale;

    viewport.addEventListener("gesturechange", (event) => {
      event.preventDefault();
      const centerX = event.clientX || window.innerWidth / 2;
      const centerY = event.clientY || window.innerHeight / 2;
      zoomTo(gestureStartScale * event.scale, centerX, centerY);

    viewport.addEventListener("dblclick", (event) => {
      if (event.target !== viewport && event.target !== world) return;

      closeLineContextMenu();

      event.stopPropagation();
      closeNodeContextMenu();
      closeLineContextMenu();
      closeLinkNodeDialog();
      closeSlashCommandMenu();
      cancelCameraAnimation();
      cancelNodeLayoutAnimation();

    openFileInput.addEventListener("change", async () => {
      const file = openFileInput.files && openFileInput.files[0];
      if (!file) return;

        fileHandle = null;

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {

        closeNodeContextMenu();
        closeLineContextMenu();
        closeLinkNodeDialog();
        closeSlashCommandMenu();

        if (isEditableTarget(event.target)) return;
        event.preventDefault();
        closeNodeContextMenu();
        closeLineContextMenu();
        cancelNodeLayoutAnimation();
        removeLineConnectionsForNodes(Array.from(selectedNodes));
        for (const node of Array.from(selectedNodes)) {
          if (world.contains(node)) {
            destroyCommandNodeContent(node);
            unobserveNodeForLines(node);
            world.removeChild(node);
          }
        }
        clearSelection();
        scheduleAutosave();
        return;
      }

      const isPlainEqualKey =
        !event.altKey &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.shiftKey &&
        (event.key === "=" || event.code === "Equal");
      if (isPlainEqualKey && selectedNodes.size > 1) {
        if (isEditableTarget(event.target)) return;
        event.preventDefault();
        closeNodeContextMenu();
        closeLineContextMenu();
        closeLinkNodeDialog();
        closeSlashCommandMenu();
        alignSelectedNodesToColumn();
        return;
      }

      const key = event.key.toLowerCase();
      if (event.altKey && !event.metaKey && !event.ctrlKey && event.code === "KeyD") {
        event.preventDefault();
        navigationFitMarkersVisible = !navigationFitMarkersVisible;
        render();
        return;
      }

      const hasPrimaryModifier = event.metaKey || event.ctrlKey;
      if (!hasPrimaryModifier) return;

      if (key === "s") {
        event.preventDefault();
        void saveToFile();
      }

      if (key === "o") {
        event.preventDefault();
        void openFromFile();
      }
    }, { capture: true });

    window.addEventListener("resize", () => {
      closeNodeContextMenu();
      closeLineContextMenu();
      closeLinkNodeDialog();
      closeSlashCommandMenu();
      render();
    });

    document.addEventListener("selectionchange", () => {
      const editingNode = getActiveEditingNode();
      if (!editingNode) return;
      updateSlashMenuForNode(editingNode);
    });

    function loadFromLocalStorage(options = {}) {
      const raw = localStorage.getItem(getStorageKey());
      if (!raw) return false;

      try {
        loadState(JSON.parse(raw), options);
        return true;
      } catch (error) {
        console.error("Restore failed:", error);
        return false;
      }
    }

    function applySharedState(data, options = {}) {
      if (!data || !data.state) return false;

      const updatedAt = Number(data.updatedAt) || 1;
      if (updatedAt <= latestSharedUpdatedAt) return false;

      try {
        applyingSharedState = true;
        latestSharedUpdatedAt = updatedAt;
        loadState(data.state, { autosave: false, onProgress: options.onProgress });
        return true;
      } catch (error) {
        console.error("Shared space restore failed:", error);
        return false;
      } finally {
        applyingSharedState = false;
      }
    }

    async function loadFromSharedSpace(options = {}) {
      if (!SHARED_SPACE_SLUG) return false;
      const data = await requestSharedSpace();
      if (!data.state) {
        latestSharedUpdatedAt = Number(data.updatedAt) || latestSharedUpdatedAt;
        return false;
      }
      return applySharedState(data, options);
    }

    function startSharedPolling() {
      if (!SHARED_SPACE_SLUG || sharedPollTimer) return;
      sharedPollTimer = setInterval(() => {
        if (savingSharedState) return;
        void requestSharedSpace()
          .then(applySharedState)
          .catch((error) => {
            console.error("Shared space refresh failed:", error);
          });
      }, SHARED_POLL_MS);
    }

    async function boot() {
      setLoadingProgress(10);
      void requestPersistentStorage();
      try {
        if (SHARED_SPACE_SLUG) {
          setLoadingProgress(20);
          try {
            if (!await loadFromSharedSpace({
              onProgress: (progress) => setLoadingProgress(35 + progress * 60)
            })) {
              setLoadingProgress(80);
              render();
            }
            startSharedPolling();
          } catch (error) {
            console.error("Shared space load failed:", error);
            render();
          }
          return;
        }

        setLoadingProgress(20);
        if (!loadFromLocalStorage({
          onProgress: (progress) => setLoadingProgress(20 + progress * 75)
        })) {
          setLoadingProgress(80);
          render();
        }
      } finally {
        hideLoadingScreen();
      }
    }

    void boot();
  </script>
</body>
</html>
