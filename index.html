    function normalizeSpaceOwnerKey(space) {
      return normalizeUserSlug(space && space.createdBy && space.createdBy.nickname);
    }

    function isIndexedUserSpace(space) {
      const slug = String(space && space.slug || "").trim();
      if (!slug || slug.startsWith("delorean/") || slug === SHARED_SPACE_SLUG) return false;
      return normalizeSpaceOwnerKey(space) === USER_SPACES_INFO.usernameKey;
    }

    function compareSpacesByCreatedAt(left, right) {
      const leftCreatedAt = Number(left && left.createdAt) || Number(left && left.updatedAt) || 0;
      const rightCreatedAt = Number(right && right.createdAt) || Number(right && right.updatedAt) || 0;
      if (leftCreatedAt !== rightCreatedAt) return leftCreatedAt - rightCreatedAt;
      return String(left && left.slug || "").localeCompare(String(right && right.slug || ""));
    }

    async function fetchAgentSpaces() {
      const response = await fetch("/api/agent?spaces=1", {
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });
      if (!response.ok) throw new Error(`Spaces list request failed: ${response.status}`);
      const data = await response.json();
      return Array.isArray(data && data.spaces) ? data.spaces : [];
    }

    function createUserSpaceWidget(space) {
      const slug = String(space && space.slug || "").trim();
      if (!slug) return null;
      const widgetId = getUserSpaceWidgetId(slug);
      const existing = getUserSpaceWidgetBySlug(slug, { includeDeleted: true });
      if (existing && !isNodeDeleted(existing)) return existing;
      if (existing) removeNodeImmediately(existing);

      const center = getLandscapeSlotCenter(getUserSpaceWidgetCount() + 1);
      const node = createTextNode(
        center.x,
        center.y,
        "",
        LANDSCAPE_WIDGET_BASE_FONT_SIZE,
        widgetId
      );
      node.dataset.userSpaceWidget = "true";
      node.dataset.userSpaceSlug = slug;
      const card = createExternalLinkCard(
        getAbsoluteSpaceUrl(slug),
        slug
      );
      if (card) {
        node.replaceChildren(card);
        normalizeNodeMarkup(node);
      } else {
        node.textContent = slug;
      }
      renderNode(node);
      setNodeCenteredAtWorldPoint(node, center.x, center.y);
      return node;
    }

    function ensureUserSpaceWidgets(spaces) {
      const orderedSpaces = spaces
        .filter(isIndexedUserSpace)
        .sort(compareSpacesByCreatedAt);
      let created = 0;

      for (const space of orderedSpaces) {
        const slug = String(space.slug || "").trim();
        if (!slug || getUserSpaceWidgetBySlug(slug)) continue;
        if (createUserSpaceWidget(space)) created += 1;
      }

      const missing = orderedSpaces.filter((space) => {
        const slug = String(space.slug || "").trim();
        return slug && !getUserSpaceWidgetBySlug(slug);
      });
      for (const space of missing) {
        if (createUserSpaceWidget(space)) created += 1;
      }

      return {
        total: orderedSpaces.length,
        created,
        missingAfterSync: orderedSpaces.filter((space) => {
          const slug = String(space.slug || "").trim();
          return slug && !getUserSpaceWidgetBySlug(slug);
        }).map((space) => String(space.slug || ""))
      };
    }

    async function syncUserSpacesIndex(options = {}) {
      if (!USER_SPACES_INFO.active || userSpacesSyncInFlight) return;
      if (isSharedEditLocked() && options.force !== true) return;
      userSpacesSyncInFlight = true;
      try {
        const spaces = await fetchAgentSpaces();
        const result = ensureUserSpaceWidgets(spaces);
        if (result.created > 0) {
          clearSelection();
          if (saveTimer !== null) {
            clearTimeout(saveTimer);
            saveTimer = null;
          }
          commitHistorySnapshot();
          await saveCurrentState();
        }
        if (result.missingAfterSync.length > 0) {
          console.error("User spaces index sync missed spaces:", result.missingAfterSync);
        }
      } catch (error) {
        console.error("User spaces index sync failed:", error);
      } finally {
        userSpacesSyncInFlight = false;
      }
    }

    function scheduleUserSpacesIndexSync(delayMs = USER_SPACES_SYNC_DEBOUNCE_MS) {
      if (!USER_SPACES_INFO.active) return;
      clearTimeout(userSpacesSyncTimer);
      userSpacesSyncTimer = setTimeout(() => {
        userSpacesSyncTimer = null;
        void syncUserSpacesIndex();
      }, Math.max(0, delayMs));
    }

      clearHtmlWidgetActive();

      if (input.altKey) {

        rotateTo(camera.rotation + input.deltaY * ROTATION_SENSITIVITY, input.clientX, input.clientY);
      } else if (input.ctrlKey || input.metaKey) {
        const factor = Math.exp(-input.deltaY * ZOOM_SENSITIVITY);
        const isPhysicalWheelStep = input.sourceEvent ? detectPhysicalWheelStep(input.sourceEvent) : false;
        const isSuddenZoomJump =
          Math.abs(input.deltaY * ZOOM_SENSITIVITY) >= PHYSICAL_WHEEL_MIN_ZOOM_LOG_DELTA;
        if (isPhysicalWheelStep && hasPhysicalWheelInput && isSuddenZoomJump) {
          const physicalWheelFactor = Math.exp(-input.deltaY * PHYSICAL_WHEEL_ZOOM_SENSITIVITY);
          smoothPhysicalWheelZoom(physicalWheelFactor, input.clientX, input.clientY);
        } else {
          // Preserve native trackpad deltas and macOS momentum exactly as before.
          cancelPhysicalWheelZoomAnimation();
          zoomTo(camera.scale * factor, input.clientX, input.clientY);
        }
      } else {
        cancelPhysicalWheelZoomAnimation();
        camera.x -= input.deltaX;
        camera.y -= input.deltaY;
        render();
        scheduleViewportSave();
      }
    }

    async function loadFromLocalStorage(options = {}) {
      if (IS_PLAYGROUND) return false;
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      const raw = localStorage.getItem(getStorageKey());
      if (!raw) return false;
      if (reportProgress) reportProgress(0.15);

      try {
        const state = JSON.parse(raw);
        if (reportProgress) reportProgress(0.25);
        await loadState(state, {
          ...options,
          onProgress: createLoadingProgressRange(0.25, 1, reportProgress)
        });
        return true;
      } catch (error) {
        console.error("Restore failed:", error);
        return false;
      }
    }

    async function applySharedState(data, options = {}) {
      if (!data) return false;
      if (Object.prototype.hasOwnProperty.call(data, "viewer")) setCurrentUser(data.viewer);
      if (!data.state) return false;
      if (hasActiveSharedLocalEdits() && options.force !== true) return false;

      const revision = Number(data.revision) || 0;
      const updatedAt = Number(data.updatedAt) || 1;
      if (revision > 0) {
        if (revision <= latestSharedRevision) return false;
      } else if (updatedAt <= latestSharedUpdatedAt) {
        return false;
      }
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      if (reportProgress) reportProgress(0.25);

      try {
        applyingSharedState = true;
        latestSharedRevision = revision || latestSharedRevision;
        latestSharedUpdatedAt = updatedAt;
        await loadState(data.state, {
          autosave: false,
          incremental: options.incremental,
          onProgress: createLoadingProgressRange(0.25, 1, reportProgress)
        });
        writeSharedSpaceCache(data);
        resetHistoryToCurrentState();
        return true;
      } catch (error) {
        console.error("Shared space restore failed:", error);
        return false;
      } finally {
        applyingSharedState = false;
      }
    }

    async function loadFromSharedSpace(options = {}) {
      if (!SHARED_SPACE_SLUG) return false;
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      if (reportProgress) reportProgress(0.05);
      const data = await requestSharedSpace({
        onDownloadProgress: createLoadingProgressRange(0.05, 0.25, reportProgress)
      });
      if (reportProgress) reportProgress(0.25);
      if (Object.prototype.hasOwnProperty.call(data, "viewer")) setCurrentUser(data.viewer);
      if (!data.state) {
        latestSharedRevision = Number(data.revision) || latestSharedRevision;
        latestSharedUpdatedAt = Number(data.updatedAt) || latestSharedUpdatedAt;
        return false;
      }
      return applySharedState(data, options);
    }

    async function loadCachedSharedSpace(cache, meta = null, options = {}) {
      if (!cache || !cache.state) return false;
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      if (reportProgress) reportProgress(0.18);
      try {
        const source = meta || cache;
        latestSharedRevision = Number(source.revision) || Number(cache.revision) || latestSharedRevision;
        latestSharedUpdatedAt = Number(source.updatedAt) || Number(cache.updatedAt) || latestSharedUpdatedAt;
        if (meta && Object.prototype.hasOwnProperty.call(meta, "viewer")) setCurrentUser(meta.viewer);
        await loadState(cache.state, {
          autosave: false,
          incremental: options.incremental,
          onProgress: createLoadingProgressRange(0.18, 1, reportProgress)
        });
        sharedSpaceLoadedFromCache = true;
        sharedCacheValidationPending = true;
        return true;
      } catch (error) {
        removeSharedSpaceCache();
        console.error("Shared space cache restore failed:", error);
        return false;
      }
    }

    async function loadFromSharedSpaceWithCache(options = {}) {
      if (!SHARED_SPACE_SLUG) return false;
      const cache = readSharedSpaceCache();

      if (cache) {
        if (await loadCachedSharedSpace(cache, null, options)) return true;
        if (typeof options.onCacheFallback === "function") options.onCacheFallback();
      }

      return loadFromSharedSpace(options);
    }

    function focusTargetNodeFromUrl() {
      const targetId = typeof TARGET_NODE_ID === "string" ? TARGET_NODE_ID.trim() : "";
      if (!targetId) return;
      const node = getNodeById(targetId);
      if (node) {
        focusNodeFullScreen(node);
        highlightNavigationTarget(node, 5000);
        return;
      }
      if (!SHARED_SPACE_SLUG) return;
      const spaceLink = `[${SHARED_SPACE_SLUG}](${getSpacePathFromSlug(SHARED_SPACE_SLUG)})`;
      window.location.assign(getMarkPathWithNotice(`The node in question no longer exists at ${spaceLink}.`));
    }

    async function loadSharedRealtimeConfig() {
      const response = await fetch(REALTIME_CONFIG_URL, {
        headers: { "Accept": "application/json" },
        cache: "no-store"
      });
      if (!response.ok) throw new Error(`Realtime config request failed: ${response.status}`);
      return response.json();
    }

    async function getSupabaseModule() {
      const imported = await import(SUPABASE_JS_URL);
      if (!imported || typeof imported.createClient !== "function") {
        throw new Error("Supabase realtime client could not be loaded.");
      }
      return imported;
    }

    function getSharedRealtimeChannelName() {
      return `space:${encodeRealtimeChannelPart(SHARED_SPACE_SLUG)}`;
    }

    function stopSharedRealtime() {
      sharedRealtimeReady = false;
      if (sharedRealtimeNodePositionFrame !== null) {
        cancelAnimationFrame(sharedRealtimeNodePositionFrame);
        sharedRealtimeNodePositionFrame = null;
      }
      pendingSharedRealtimeNodePositions.clear();
      pendingSharedRealtimeNodeTexts.clear();
      if (sharedRealtimePointerFrame !== null) {
        cancelAnimationFrame(sharedRealtimePointerFrame);
        sharedRealtimePointerFrame = null;
      }
      pendingSharedRealtimePointer = null;
      if (remotePointerAnimationFrame !== null) {
        cancelAnimationFrame(remotePointerAnimationFrame);
        remotePointerAnimationFrame = null;
      }
      for (const entry of remotePointers.values()) entry.element.remove();
      remotePointers.clear();
      if (sharedRealtimeChannel && typeof sharedRealtimeChannel.unsubscribe === "function") {
        void sharedRealtimeChannel.unsubscribe().catch((error) => {
          console.error("Realtime unsubscribe failed:", error);
        });
      }
      sharedRealtimeChannel = null;
      if (sharedRealtimeClient && typeof sharedRealtimeClient.removeAllChannels === "function") {
        void sharedRealtimeClient.removeAllChannels().catch((error) => {
          console.error("Realtime cleanup failed:", error);
        });
      }
      sharedRealtimeClient = null;
    }

    function getRemotePointerColor(id) {
      const text = String(id || "");
      let hash = 0;
      for (let index = 0; index < text.length; index += 1) {
        hash = (hash * 31 + text.charCodeAt(index)) >>> 0;
      }
      return REMOTE_POINTER_COLORS[hash % REMOTE_POINTER_COLORS.length];
    }

    function getRemotePointerLabel(user, senderId) {
      const nickname = user && typeof user.nickname === "string" ? user.nickname.trim() : "";
      if (nickname) return nickname;
      const name = user && typeof user.name === "string" ? user.name.trim() : "";
      if (name) return name;
      const id = user && typeof user.id === "string" ? user.id.trim() : "";
      if (id) return id.slice(0, 8);
      return String(senderId || "").slice(0, 8) || "Guest";
    }

    function createRemotePointer(senderId, user) {
      const pointer = document.createElement("div");
      pointer.className = "remote-pointer";
      pointer.style.setProperty("--remote-pointer-color", getRemotePointerColor(senderId));

      const shape = document.createElement("div");
      shape.className = "remote-pointer-shape";
      const svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("aria-hidden", "true");
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", "M20.5056 10.7754C21.1225 10.5355 21.431 10.4155 21.5176 10.2459C21.5926 10.099 21.5903 9.92446 21.5115 9.77954C21.4205 9.61226 21.109 9.50044 20.486 9.2768L4.59629 3.5728C4.0866 3.38983 3.83175 3.29835 3.66514 3.35605C3.52029 3.40621 3.40645 3.52004 3.35629 3.6649C3.29859 3.8315 3.39008 4.08635 3.57304 4.59605L9.277 20.4858C9.50064 21.1088 9.61246 21.4203 9.77973 21.5113C9.92465 21.5901 10.0991 21.5924 10.2461 21.5174C10.4157 21.4308 10.5356 21.1223 10.7756 20.5054L13.3724 13.8278C13.4194 13.707 13.4429 13.6466 13.4792 13.5957C13.5114 13.5506 13.5508 13.5112 13.5959 13.479C13.6468 13.4427 13.7072 13.4192 13.828 13.3722L20.5056 10.7754Z");
      path.setAttribute("stroke", "currentColor");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path);
      shape.appendChild(svg);
      const label = document.createElement("div");
      label.className = "remote-pointer-label";
      label.textContent = getRemotePointerLabel(user, senderId);
      pointer.append(shape, label);
      remotePointerLayer.appendChild(pointer);
      return {
        element: pointer,
        worldX: 0,
        worldY: 0,
        displayX: 0,
        displayY: 0,
        initialized: false,
        lastSeenAt: 0
      };
    }

    function ensureRemotePointerAnimation() {
      if (remotePointerAnimationFrame !== null) return;
      remotePointerAnimationFrame = requestAnimationFrame(animateRemotePointers);
    }

    function renderRemotePointer(entry, now) {
      const screenPoint = worldToScreen(entry.worldX, entry.worldY);
      if (!entry.initialized) {
        entry.displayX = screenPoint.x;
        entry.displayY = screenPoint.y;
        entry.initialized = true;
      } else {
        entry.displayX += (screenPoint.x - entry.displayX) * REMOTE_POINTER_LERP;
        entry.displayY += (screenPoint.y - entry.displayY) * REMOTE_POINTER_LERP;
      }
      entry.element.style.transform = `translate3d(${entry.displayX}px, ${entry.displayY}px, 0)`;
      entry.element.dataset.visible = String(now - entry.lastSeenAt <= REMOTE_POINTER_TTL_MS);
    }

    function animateRemotePointers(now) {
      remotePointerAnimationFrame = null;
      let active = false;
      for (const [senderId, entry] of remotePointers) {
        if (now - entry.lastSeenAt > REMOTE_POINTER_TTL_MS * 2) {
          entry.element.remove();
          remotePointers.delete(senderId);
          continue;
        }
        renderRemotePointer(entry, now);
        active = true;
      }
      if (active) ensureRemotePointerAnimation();
    }

    function renderRemotePointers() {
      const now = performance.now();
      for (const entry of remotePointers.values()) renderRemotePointer(entry, now);
    }

    async function refreshSharedSpaceFromServer() {
      if (!SHARED_SPACE_SLUG || document.hidden) return;
      if (hasActiveSharedLocalEdits()) {
        sharedRealtimeRefreshQueued = true;
        return;
      }
      if (sharedRealtimeRefreshInFlight) {
        sharedRealtimeRefreshQueued = true;
        return;
      }

      sharedRealtimeRefreshInFlight = true;
      try {
        do {
          sharedRealtimeRefreshQueued = false;
          const changed = await requestSharedSpace({ cache: "no-store" }).then((data) => applySharedState(data, { incremental: true }));
          unlockSharedCacheEditing();
        } while (sharedRealtimeRefreshQueued && !hasActiveSharedLocalEdits());
      } catch (error) {
        console.error("Realtime shared space refresh failed:", error);
      } finally {
        sharedRealtimeRefreshInFlight = false;
      }
    }

    function refreshSharedSpaceFromRealtime(payload) {
      if (payload && payload.senderId === sharedRealtimeClientId) return;
      const revision = Number(payload && payload.revision) || 0;
      const updatedAt = Number(payload && payload.updatedAt) || 0;
      if (revision > 0 && revision <= latestSharedRevision) return;
      if (revision <= 0 && updatedAt > 0 && updatedAt <= latestSharedUpdatedAt) return;
      if (Date.now() - latestSharedRealtimePatchAt <= SHARED_REALTIME_PATCH_SETTLE_MS) {
        return;
      }
      void refreshSharedSpaceFromServer();
    }

    async function startSharedRealtime() {
      if (!SHARED_SPACE_SLUG || sharedRealtimeChannel) return;
      try {
        const config = await loadSharedRealtimeConfig();
        if (!config || config.enabled !== true || !config.supabaseUrl || !config.supabaseAnonKey) return;
        const { createClient } = await getSupabaseModule();
        sharedRealtimeClient = createClient(config.supabaseUrl, config.supabaseAnonKey, {
          auth: { persistSession: false, autoRefreshToken: false }
        });
        sharedRealtimeChannel = sharedRealtimeClient
          .channel(getSharedRealtimeChannelName(), {
            config: { broadcast: { self: false } }
          })
          .on("broadcast", { event: "space_node_positions" }, (message) => {
            applySharedRealtimeNodePositions(message && message.payload);
          })
          .on("broadcast", { event: "space_node_texts" }, (message) => {
            applySharedRealtimeNodeTexts(message && message.payload);
          })
          .on("broadcast", { event: "space_node_create" }, (message) => {
            applySharedRealtimeNodeCreate(message && message.payload);
          })
          .on("broadcast", { event: "space_node_delete" }, (message) => {
            applySharedRealtimeNodeDelete(message && message.payload);
          })
          .on("broadcast", { event: "space_pointer" }, (message) => {
            applySharedRealtimePointer(message && message.payload);
          })
          .on("broadcast", { event: "space_saved" }, (message) => {
            void refreshSharedSpaceFromRealtime(message && message.payload);
          })
          .subscribe((status) => {
            sharedRealtimeReady = status === "SUBSCRIBED";
          });
      } catch (error) {
        stopSharedRealtime();
        console.error("Realtime setup failed:", error);
      }
    }

    function publishSharedRealtimeUpdate(data) {
      if (!sharedRealtimeReady || !sharedRealtimeChannel || !data) return;
      void sharedRealtimeChannel.send({
        type: "broadcast",
        event: "space_saved",
        payload: {
          senderId: sharedRealtimeClientId,
          slug: SHARED_SPACE_SLUG,
          revision: Number(data.revision) || 0,
          updatedAt: Number(data.updatedAt) || Date.now()
        }
      }).catch((error) => {
        console.error("Realtime publish failed:", error);
      });
    }

    function flushSharedRealtimeNodePositions() {
      sharedRealtimeNodePositionFrame = null;
      if (!sharedRealtimeReady || !sharedRealtimeChannel || (pendingSharedRealtimeNodePositions.size === 0 && pendingSharedRealtimeNodeTexts.size === 0)) {
        pendingSharedRealtimeNodePositions.clear();
        pendingSharedRealtimeNodeTexts.clear();
        return;
      }
      const positions = Array.from(pendingSharedRealtimeNodePositions.values());
      const texts = Array.from(pendingSharedRealtimeNodeTexts.values());
      pendingSharedRealtimeNodePositions.clear();
      pendingSharedRealtimeNodeTexts.clear();
      if (positions.length > 0) {
        void sharedRealtimeChannel.send({
          type: "broadcast",
          event: "space_node_positions",
          payload: {
            senderId: sharedRealtimeClientId,
            slug: SHARED_SPACE_SLUG,
            updatedAt: Date.now(),
            positions
          }
        }).catch((error) => {
          console.error("Realtime node position publish failed:", error);
        });
      }
      if (texts.length > 0) {
        void sharedRealtimeChannel.send({
          type: "broadcast",
          event: "space_node_texts",
          payload: {
            senderId: sharedRealtimeClientId,
            slug: SHARED_SPACE_SLUG,
            updatedAt: Date.now(),
            texts
          }
        }).catch((error) => {
          console.error("Realtime node text publish failed:", error);
        });
      }
    }

    function scheduleSharedRealtimeNodeFrame() {
      if (sharedRealtimeNodePositionFrame !== null) return;
      sharedRealtimeNodePositionFrame = requestAnimationFrame(flushSharedRealtimeNodePositions);
    }

    function scheduleSharedRealtimeNodePosition(node) {
      if (!sharedRealtimeReady || !(node instanceof HTMLElement) || !world.contains(node)) return;
      const id = node.dataset.nodeId || "";
      const x = Number(node.dataset.x);
      const y = Number(node.dataset.y);
      if (!id || !Number.isFinite(x) || !Number.isFinite(y)) return;
      pendingSharedRealtimeNodePositions.set(id, { id, x, y });
      scheduleSharedRealtimeNodeFrame();
    }

    function applySharedRealtimeNodePositions(payload) {
      if (!payload || payload.senderId === sharedRealtimeClientId) return;
      if (payload.slug !== SHARED_SPACE_SLUG) return;
      const positions = Array.isArray(payload.positions) ? payload.positions : [];
      if (positions.length === 0 || hasActiveSharedLocalEdits()) return;
      latestSharedRealtimePatchAt = Date.now();
      applyingSharedRealtimeNodePositions = true;
      try {
        const touched = [];
        for (const position of positions) {
          const node = getNodeById(String(position && position.id || ""));
          if (!node) continue;
          const x = Number(position.x);
          const y = Number(position.y);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          setNodePosition(node, x, y, { skipSelectionUpdate: true, suppressRealtime: true });
          touched.push(node);
        }
        if (touched.length > 0) {
          refreshSelectionBounds();
        }
      } finally {
        applyingSharedRealtimeNodePositions = false;
      }
    }

    function getSharedRealtimeTextPatch(node) {
      if (!(node instanceof HTMLElement) || !world.contains(node) || isCommandNode(node)) return null;
      const serialized = serializeNode(node);
      return {
        id: serialized.id,
        text: serialized.text || "",
        html: serialized.html || "",
        viewMode: serialized.viewMode || "",
        variable: serialized.variable === true
      };
    }

    function scheduleSharedRealtimeNodeText(node) {
      if (!sharedRealtimeReady || applyingSharedRealtimeNodeText) return;
      const patch = getSharedRealtimeTextPatch(node);
      if (!patch || !patch.id) return;
      pendingSharedRealtimeNodeTexts.set(patch.id, patch);
      scheduleSharedRealtimeNodeFrame();
    }

    function applySharedRealtimeNodeTexts(payload) {
      if (!payload || payload.senderId === sharedRealtimeClientId) return;
      if (payload.slug !== SHARED_SPACE_SLUG) return;
      const texts = Array.isArray(payload.texts) ? payload.texts : [];
      if (texts.length === 0 || hasActiveSharedLocalEdits()) return;
      latestSharedRealtimePatchAt = Date.now();

      applyingSharedRealtimeNodeText = true;
      try {
        for (const patch of texts) {
          const node = getNodeById(String(patch && patch.id || ""));
          if (!node || isCommandNode(node) || node.classList.contains("editing")) continue;
          const viewMode = patch.viewMode === "markdown" || patch.viewMode === "html" ? patch.viewMode : "";
          setCalcVariableNode(node, patch.variable === true);
          if (viewMode === "markdown") {
            node.dataset.viewMode = "markdown";
            node.dataset.markdownSource = typeof patch.text === "string" ? patch.text : "";
            delete node.dataset.htmlSource;
            node.textContent = node.dataset.markdownSource;
            renderMarkdownNode(node);
          } else if (viewMode === "html") {
            node.dataset.viewMode = "html";
            node.dataset.htmlSource = typeof patch.text === "string" ? patch.text : "";
            delete node.dataset.markdownSource;
            renderHtmlNode(node);
          } else {
            delete node.dataset.viewMode;
            delete node.dataset.markdownSource;
            delete node.dataset.htmlSource;
            if (typeof patch.html === "string" && patch.html) {
              node.innerHTML = sanitizeNodeHtml(patch.html);
            } else {
              node.textContent = typeof patch.text === "string" ? patch.text : "";
            }
            normalizeNodeMarkup(node);
            renderTagLinks(node);
          }
          renderNode(node);
        }
        updateCalcVariables();
        updateDocumentTitle();
        refreshSelectionBounds();
        requestLineRender();
      } finally {
        applyingSharedRealtimeNodeText = false;
      }
    }

    function publishSharedRealtimeNodeCreate(node) {
      if (!sharedRealtimeReady || !sharedRealtimeChannel || !(node instanceof HTMLElement) || !world.contains(node)) return;
      const entry = serializeNode(node);
      if (!entry || !entry.id) return;
      void sharedRealtimeChannel.send({
        type: "broadcast",
        event: "space_node_create",
        payload: {
          senderId: sharedRealtimeClientId,
          slug: SHARED_SPACE_SLUG,
          updatedAt: Date.now(),
          node: entry
        }
      }).catch((error) => {
        console.error("Realtime node create publish failed:", error);
      });
    }

    function applySharedRealtimeNodeCreate(payload) {
      if (!payload || payload.senderId === sharedRealtimeClientId) return;
      if (payload.slug !== SHARED_SPACE_SLUG) return;
      const entry = payload.node && typeof payload.node === "object" ? payload.node : null;
      const id = entry && typeof entry.id === "string" ? entry.id.trim() : "";
      if (!entry || !id || getNodeById(id, { includeDeleted: true })) return;

      latestSharedRealtimePatchAt = Date.now();
      applyingSharedRealtimeNodeStructure = true;
      try {
        restoreStateNode(entry, { autosave: false, suppressRealtime: true });
        refreshSelectionBounds();
        requestLineRender();
        updateCalcVariables();
        updateDocumentTitle();
      } finally {
        applyingSharedRealtimeNodeStructure = false;
      }
    }

    function publishSharedRealtimeNodeDelete(nodes, deletedAt) {
      if (!sharedRealtimeReady || !sharedRealtimeChannel) return;
      const ids = nodes
        .map((node) => node instanceof HTMLElement ? node.dataset.nodeId || "" : "")
        .filter(Boolean);
      if (ids.length === 0) return;
      void sharedRealtimeChannel.send({
        type: "broadcast",
        event: "space_node_delete",
        payload: {
          senderId: sharedRealtimeClientId,
          slug: SHARED_SPACE_SLUG,
          updatedAt: Date.now(),
          deletedAt,
          ids
        }
      }).catch((error) => {
        console.error("Realtime node delete publish failed:", error);
      });
    }

    function applySharedRealtimeNodeDelete(payload) {
      if (!payload || payload.senderId === sharedRealtimeClientId) return;
      if (payload.slug !== SHARED_SPACE_SLUG) return;
      const ids = Array.isArray(payload.ids) ? payload.ids : [];
      const nodes = ids
        .map((id) => getNodeById(String(id || "")))
        .filter(Boolean);
      if (nodes.length === 0) return;

      latestSharedRealtimePatchAt = Date.now();
      applyingSharedRealtimeNodeStructure = true;
      try {
        softDeleteNodes(nodes, Number(payload.deletedAt) || Date.now(), {
          autosave: false,
          suppressRealtime: true
        });
      } finally {
        applyingSharedRealtimeNodeStructure = false;
      }
    }

    function flushSharedRealtimePointer() {
      sharedRealtimePointerFrame = null;
      if (!sharedRealtimeReady || !sharedRealtimeChannel || !pendingSharedRealtimePointer) return;
      const point = pendingSharedRealtimePointer;
      pendingSharedRealtimePointer = null;
      void sharedRealtimeChannel.send({
        type: "broadcast",
        event: "space_pointer",
        payload: {
          senderId: sharedRealtimeClientId,
          slug: SHARED_SPACE_SLUG,
          updatedAt: Date.now(),
          user: currentUser ? {
            id: currentUser.id || "",
            nickname: currentUser.nickname || ""
          } : null,
          x: point.x,
          y: point.y
        }
      }).catch((error) => {
        console.error("Realtime pointer publish failed:", error);
      });
    }

    function scheduleSharedRealtimePointer(event) {
      if (!sharedRealtimeReady || !SHARED_SPACE_SLUG || document.hidden) return;
      if (!event || !Number.isFinite(event.clientX) || !Number.isFinite(event.clientY)) return;
      pendingSharedRealtimePointer = screenToWorld(event.clientX, event.clientY);
      if (sharedRealtimePointerFrame !== null) return;
      sharedRealtimePointerFrame = requestAnimationFrame(flushSharedRealtimePointer);
    }

    function applySharedRealtimePointer(payload) {
      if (!payload || payload.senderId === sharedRealtimeClientId) return;
      if (payload.slug !== SHARED_SPACE_SLUG) return;
      const x = Number(payload.x);
      const y = Number(payload.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      const senderId = String(payload.senderId || "");
      if (!senderId) return;
      let entry = remotePointers.get(senderId);
      if (!entry) {
        entry = createRemotePointer(senderId, payload.user || null);
        remotePointers.set(senderId, entry);
      }
      entry.worldX = x;
      entry.worldY = y;
      entry.lastSeenAt = performance.now();
      entry.element.dataset.visible = "true";
      ensureRemotePointerAnimation();
    }

    async function boot() {
      const canSkipLoadingScreen = Boolean(SHARED_SPACE_SLUG && readSharedSpaceCache());
      let loadingScreenShown = false;
      sharedSpaceLoadedFromCache = false;
      sharedCacheValidationPending = false;
      if (canSkipLoadingScreen && loadingScreen) {
        loadingScreen.hidden = true;
        loadingScreen.classList.remove("loading-visible", "loading-complete");
      } else {
        showLoadingScreen();
        loadingScreenShown = true;
      }
      updateDocumentTitle();
      startTitleHookRefresh();
      if (loadingScreenShown) setLoadingProgress(10);
      void requestPersistentStorage();
      try {
        await loadGlobalTemplates();
        if (IS_PLAYGROUND) {
          if (loadingScreenShown) setLoadingProgress(90);
          await loadState({ version: 1, nodes: [], lines: [] }, { autosave: false });
          // setupPlaygroundControls();
          render();
          return;
        }
        if (SHARED_SPACE_SLUG) {
          if (loadingScreenShown) setLoadingProgress(20);
          try {
            const loadOptions = {
              incremental: true,
              onProgress: (progress) => {
                if (loadingScreenShown) setLoadingProgress(20 + progress * 75);
              }
            };
            const loaded = USER_SPACES_INFO.active
              ? await loadFromSharedSpace(loadOptions)
              : await loadFromSharedSpaceWithCache({
                ...loadOptions,
                onCacheFallback: () => {
                  if (loadingScreenShown) return;
                  showLoadingScreen();
                  loadingScreenShown = true;
                  setLoadingProgress(20);
                }
              });
            if (!loaded) {
              if (loadingScreenShown) setLoadingProgress(90);
              render();
            }
            if (USER_SPACES_INFO.active) await syncUserSpacesIndex({ force: true });
            void startSharedRealtime();
            if (sharedSpaceLoadedFromCache) void refreshSharedSpaceFromServer();
          } catch (error) {
            console.error("Shared space load failed:", error);
            if (loadingScreenShown) setLoadingProgress(90);
            render();
          }
          return;
        }

        setLoadingProgress(20);
        if (!await loadFromLocalStorage({
          incremental: true,
          onProgress: (progress) => setLoadingProgress(20 + progress * 75)
        })) {
          setLoadingProgress(90);
          render();
        }
      } finally {
        initializeSessionViewport();
        focusTargetNodeFromUrl();
        resetHistoryToCurrentState();
        if (loadingScreenShown) {
          await hideLoadingScreen();
        } else {
          skipLoadingScreen();
        }
      }
    }

    initializeMobileExperience();
    void boot();
  </script>
</body>
