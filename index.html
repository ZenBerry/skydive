<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Skydive</title>
  <script src="/assets/disable-native-zoom.js"></script>
  <script src="https://unpkg.com/@zenberry/quico@latest/dist/quico.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap");

    @font-face {
      font-family: "Myriad Pro";
      src: url("https://res.cloudinary.com/zenberry/raw/upload/v1752586755/fonts/myriadpro_light.woff2") format("woff2");
      font-display: swap;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    @property --float-transition-scale {
      syntax: "<number>";
      inherits: false;
      initial-value: 1;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      background: #fff;
      cursor: default;
      opacity: 0;
      transition: opacity 520ms cubic-bezier(0.2, 0, 0, 1);
    }

    body.app-ready #viewport {
      opacity: 1;
    }

    body.app-ready-instant #viewport {
      transition: none;
    }

    #viewport.panning,
    #viewport.panning .text-node,
    #viewport.panning .external-link-card,
    #viewport.panning #group-selection-box,
    #viewport.panning .group-selection-handle {
      cursor: grabbing;
    }

    #viewport.line-drafting,
    #viewport.line-drafting .text-node,
    #viewport.line-drafting .external-link-card {
      cursor: crosshair;
    }

    #line-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      background: #fff;
      pointer-events: none;
    }

    #spacing-guide-layer {
      position: absolute;
      inset: 0;
      z-index: 410;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      will-change: opacity;
    }

    #spacing-guide-layer[hidden] {
      display: none;
    }

    .spacing-guide-line {
      stroke: #111;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .connection-line {
      stroke: none;
      shape-rendering: geometricPrecision;
    }

    .connection-line-shadow {
      display: none;
    }

    .connection-line-stroke {
      fill: rgba(54, 59, 68, 0.5);
    }

    .connection-line-draft .connection-line-shadow {
      display: none;
    }

    .connection-line-draft .connection-line-stroke {
      fill: rgba(46, 52, 62, 0.42);
    }

    .connection-line-hit {
      fill: none;
      stroke: rgba(0, 0, 0, 0);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: context-menu;
    }

    .connection-line-operation {
      pointer-events: none;
    }

    .connection-line-operation circle {
      fill: #fff;
      stroke: rgba(17, 24, 39, 0.38);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .connection-line-operation text {
      fill: #111;
      font: 700 13px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      dominant-baseline: central;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 0.7;
      vector-effect: non-scaling-stroke;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: auto;
      pointer-events: none;
    }

    #remote-pointer-layer {
      position: fixed;
      inset: 0;
      z-index: 460;
      overflow: hidden;
      pointer-events: none;
    }

    .remote-pointer {
      position: absolute;
      left: 0;
      top: 0;
      width: 22px;
      height: 28px;
      opacity: 0;
      transform: translate3d(-100px, -100px, 0);
      transition: opacity 180ms ease;
      will-change: transform, opacity;
    }

    .remote-pointer[data-visible="true"] {
      opacity: 1;
    }

    .remote-pointer-shape {
      position: absolute;
      inset: 0;
      color: var(--remote-pointer-color, #10b981);
      filter: drop-shadow(0 4px 8px rgba(15, 23, 42, 0.22));
    }

    .remote-pointer-shape svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .remote-pointer-label {
      position: absolute;
      left: 18px;
      top: 18px;
      max-width: 120px;
      overflow: hidden;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--remote-pointer-color, #10b981);
      color: #fff;
      font: 700 11px/1.1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font: 400 16px/1.4 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      opacity: 0;
      transition: opacity 760ms cubic-bezier(0.9, 0, 0.1, 1);
      will-change: opacity;
    }

    #loading-screen.loading-visible {
      opacity: 1;
    }

    #loading-screen.loading-complete {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen[hidden] {
      display: none;
    }

    .text-node {
      position: absolute;
      --float-transition-scale: 1;
      min-width: 0;
      min-height: 1em;
      line-height: 1.25;
      color: #111;
      white-space: pre;
      width: max-content;
      max-width: none;
      overflow-wrap: normal;
      word-break: keep-all;
      user-select: none;
      cursor: grab;
      outline: none;
      pointer-events: auto;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
    }

    .text-node[data-floating="true"] {
      z-index: 4600;
    }

    .text-node[data-floating="true"]:not(.command-node):not(:has(.external-link-card)) {
      text-shadow: 0 0px 7px #00000096;
    }

    .text-node.float-bounce-in {
      animation: float-bounce-in 360ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    .text-node.float-bounce-out {
      animation: float-bounce-out 340ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    .text-node[data-floating="true"].float-bounce-in:not(.command-node):not(:has(.external-link-card)) {
      animation:
        float-bounce-in 360ms cubic-bezier(0.2, 0, 0, 1) both,
        float-text-shadow-in 360ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    .text-node.float-bounce-out:not(.command-node):not(:has(.external-link-card)) {
      animation:
        float-bounce-out 340ms cubic-bezier(0.2, 0, 0, 1) both,
        float-text-shadow-out 340ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .text-node.float-bounce-in,
      .text-node.float-bounce-out,
      .command-node[data-floating="true"].float-bounce-in > :first-child,
      .command-node.float-bounce-out > :first-child,
      .text-node[data-floating="true"].float-bounce-in .external-link-card,
      .text-node.float-bounce-out .external-link-card {
        animation: none;
      }
    }

    @keyframes float-bounce-in {
      0% { --float-transition-scale: 0.988; }
      54% { --float-transition-scale: 1.02; }
      100% { --float-transition-scale: 1; }
    }

    @keyframes float-bounce-out {
      0% { --float-transition-scale: 1.012; }
      46% { --float-transition-scale: 0.988; }
      100% { --float-transition-scale: 1; }
    }

    @keyframes float-text-shadow-in {
      0% { text-shadow: 0 0px 0 #00000000; }
      54% { text-shadow: 0 0px 9px #0000007a; }
      100% { text-shadow: 0 0px 7px #00000096; }
    }

    @keyframes float-text-shadow-out {
      0% { text-shadow: 0 0px 7px #00000096; }
      46% { text-shadow: 0 0px 5px #00000062; }
      100% { text-shadow: 0 0px 0 #00000000; }
    }

    .text-node.selected {
      outline: calc(1px / var(--camera-scale, 1)) solid rgba(29, 78, 216, 0.5);
      outline-offset: calc(2px / var(--camera-scale, 1));
    }

    .text-node[data-creator-initial]::before {
      content: attr(data-creator-initial);
      position: absolute;
      z-index: 1;
      top: 50%;
      right: calc(100% + 0.34em);
      width: 0.9em;
      height: 0.9em;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--creator-avatar-bg, #111);
      border: 0.045em solid var(--creator-avatar-border, #111);
      color: var(--creator-avatar-fg, #fff);
      font: 700 0.28em/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      transform: translateY(-50%);
      pointer-events: auto;
    }

    .text-node[data-creator-avatar-image]::before {
      background: var(--creator-avatar-bg, #111) var(--creator-avatar-image) center / contain no-repeat;
    }

    .text-node.editing {
      -webkit-user-select: text;
      user-select: text;
      cursor: text;
    }

    .text-node.editing * {
      -webkit-user-select: text;
      user-select: text;
    }

    .text-node.editing .external-link-card,
    .text-node.editing .external-link-card * {
      -webkit-user-select: none;
      user-select: none;
    }

    input,
    textarea,
    .text-node.editing .external-link-card input {
      -webkit-user-select: text;
      user-select: text;
    }

    .text-node[data-deleted-at] {
      display: none !important;
    }

    .text-node[data-render-culled] {
      visibility: hidden;
      pointer-events: none;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) {
      white-space: normal;
    }

    .text-node.markdown-view-transition {
      transition: opacity 140ms cubic-bezier(0.9, 0, 0.1, 1);
      will-change: opacity;
    }

    .text-node.markdown-view-transition.markdown-view-transition-out {
      opacity: 0;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) > * {
      margin: 0 0 0.42em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) > :last-child {
      margin-bottom: 0;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) h1,
    .text-node[data-view-mode="markdown"]:not(.editing) h2,
    .text-node[data-view-mode="markdown"]:not(.editing) h3 {
      font: inherit;
      font-weight: 700;
      line-height: 1.12;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) h1 {
      font-size: 1.55em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) h2 {
      font-size: 1.28em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) h3 {
      font-size: 1.08em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) ul,
    .text-node[data-view-mode="markdown"]:not(.editing) ol {
      padding-left: 1.08em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) li {
      margin: 0 0 0.14em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) blockquote {
      padding-left: 0.58em;
      border-left: 0.08em solid rgba(17, 24, 39, 0.28);
      color: #4b5563;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) code,
    .text-node[data-view-mode="markdown"]:not(.editing) pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) code {
      padding: 0.02em 0.22em;
      border-radius: 0.18em;
      background: #f2f4f7;
      font-size: 0.86em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) pre {
      max-width: 28em;
      overflow: auto;
      padding: 0.48em 0.58em;
      border-radius: 0.28em;
      background: #f7f7f5;
      white-space: pre;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) pre code {
      padding: 0;
      background: transparent;
      font-size: 0.82em;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) a {
      color: #2563eb;
      text-decoration: underline;
      text-decoration-thickness: from-font;
    }

    .text-node[data-view-mode="markdown"]:not(.editing) hr {
      width: 100%;
      margin: 0.55em 0;
      border: 0;
      border-top: 0.05em solid rgba(17, 24, 39, 0.25);
    }

    .text-node[data-view-mode="html"] {
      white-space: normal;
      overflow: visible;
    }

    .text-node[data-view-mode="html"] iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    .text-node[data-view-mode="html"].html-widget-active iframe {
      pointer-events: auto;
    }

    #viewport.panning .text-node[data-view-mode="html"] iframe,
    #viewport.html-wheel-through .text-node[data-view-mode="html"] iframe {
      pointer-events: none;
    }

    .text-node.variable-node {
      box-sizing: border-box;
      padding: 0.18em 0.34em 0.16em;
      border: 0.04em solid #93c5fd;
      border-radius: 0.32em;
      background: #eaf4ff;
      color: #0f172a;
      cursor: grab;
    }

    .command-node,
    .external-link-card {
      --widget-color: #ffffff;
      --widget-button-color: hsl(0 0% 91% / 44%);
      --widget-button-hover-color: hsl(0 0% 94% / 44%);
      --widget-border-color: #d6d6d6;
      --widget-field-color: #ffffff;
      --widget-field-border-color: #d6d6d6;
      --widget-float-shadow-color: #f6f6f6;
      --widget-corner-shape: squircle;
      --widget-shell-radius: 1.82em;
      --widget-control-radius: 1.52em;
      --widget-button-radius: 999px;
    }

    .command-node {
      min-width: 0;
      min-height: 0;
      white-space: normal;
      cursor: grab;
    }

    .command-node button {
      font: inherit;
      background: var(--widget-button-color) !important;
    }

    .command-node button:hover:not(:disabled) {
      background: var(--widget-button-hover-color) !important;
    }

    .command-node [data-command-interactive] {
      cursor: pointer;
    }

    .command-node > :first-child {
      background: var(--widget-color) !important;
      border-color: var(--widget-border-color) !important;
      border-radius: var(--widget-shell-radius) !important;
      box-shadow: none !important;
    }

    .command-node[data-floating="true"] > :first-child {
      box-shadow: 0 0 14px 0 var(--widget-float-shadow-color) !important;
      filter: drop-shadow(0 0 7px var(--widget-float-shadow-color));
    }

    .command-node[data-floating="true"].float-bounce-in > :first-child {
      animation: float-command-shadow-in 360ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    .command-node.float-bounce-out > :first-child {
      animation: float-command-shadow-out 340ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    .external-link-card {
      border-radius: var(--widget-shell-radius) !important;
    }

    .command-node button,
    .command-node input,
    .command-node textarea,
    .command-node select,
    .command-node [class$="-wave"],
    .command-node [class$="-string"],
    .external-link-card button,
    .external-link-editor input {
      border-radius: var(--widget-control-radius) !important;
    }

    .command-node button,
    .external-link-card button {
      border-radius: var(--widget-button-radius) !important;
    }

    @supports (corner-shape: squircle) {
      .command-node > :first-child,
      .external-link-card,
      .command-node button,
      .command-node input,
      .command-node textarea,
      .command-node select,
      .command-node [class$="-wave"],
      .command-node [class$="-string"],
      .external-link-card button,
      .external-link-editor input {
        corner-shape: var(--widget-corner-shape);
      }
    }

    #version-counter {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      z-index: 1000;
      padding: 4px 7px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      color: #6b7280;
      font: 500 12px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      pointer-events: none;
    }

    #version-counter[hidden] {
      display: none;
    }

    .internal-link {
      color: #6b7280;
      text-decoration: underline;
      text-decoration-thickness: from-font;
      cursor: pointer;
    }

    .external-link-plain {
      color: #2563eb;
      text-decoration: underline;
      text-decoration-thickness: from-font;
      cursor: pointer;
    }

    .tag-link {
      color: #111;
      text-decoration: underline;
      text-decoration-thickness: from-font;
      cursor: pointer;
    }

    .text-node.editing .internal-link {
      cursor: text;
    }

    .text-node.editing .external-link-plain,
    .text-node.editing .tag-link {
      cursor: text;
    }

    .external-link-card {
      display: inline-grid;
      gap: 0.35em;
      max-width: 18em;
      margin: 0 0.12em;
      padding: 0.45em 0.52em 0.42em;
      border: 0.04em solid var(--widget-border-color);
      border-radius: 0.55em;
      background: var(--widget-color);
      box-shadow: none;
      color: #3f3328;
      cursor: grab;
      vertical-align: middle;
      white-space: normal;
      user-select: none;
    }

    .text-node[data-floating="true"] .external-link-card {
      box-shadow: 0 0 14px 0 var(--widget-float-shadow-color);
    }

    .text-node[data-floating="true"].float-bounce-in .external-link-card {
      animation: float-widget-shadow-in 360ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    .text-node.float-bounce-out .external-link-card {
      animation: float-widget-shadow-out 340ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    @keyframes float-widget-shadow-in {
      0% { box-shadow: 0 0 0 0 #00000000; }
      54% { box-shadow: 0 0 16px 0 var(--widget-float-shadow-color); }
      100% { box-shadow: 0 0 14px 0 var(--widget-float-shadow-color); }
    }

    @keyframes float-widget-shadow-out {
      0% { box-shadow: 0 0 14px 0 var(--widget-float-shadow-color); }
      46% { box-shadow: 0 0 9px 0 var(--widget-float-shadow-color); }
      100% { box-shadow: 0 0 0 0 #00000000; }
    }

    @keyframes float-command-shadow-in {
      0% { filter: drop-shadow(0 0 0 #00000000); }
      54% { filter: drop-shadow(0 0 8px var(--widget-float-shadow-color)); }
      100% { filter: drop-shadow(0 0 7px var(--widget-float-shadow-color)); }
    }

    @keyframes float-command-shadow-out {
      0% { filter: drop-shadow(0 0 7px var(--widget-float-shadow-color)); }
      46% { filter: drop-shadow(0 0 5px var(--widget-float-shadow-color)); }
      100% { filter: drop-shadow(0 0 0 #00000000); }
    }

    .external-link-label {
      overflow: hidden;
      color: #4b3b2d;
      display: block;
      cursor: pointer;
      font: 500 0.78em/1.16 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      text-decoration: underline;
      text-decoration-thickness: from-font;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .external-link-actions,
    .external-link-editor-actions {
      display: flex;
      gap: 0.25em;
      align-items: center;
    }

    .external-link-card button {
      border: 0;
      border-radius: 0.38em;
      background: var(--widget-button-color);
      padding: 0.26em 0.42em;
      color: #4b3b2d;
      font: 500 0.45em/1 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
    }

    .external-link-card button:hover {
      background: var(--widget-button-hover-color);
    }

    .external-link-editor {
      display: grid;
      gap: 0.25em;
    }

    .external-link-editor[hidden] {
      display: none;
    }

    .external-link-editor input {
      width: 17em;
      max-width: 100%;
      box-sizing: border-box;
      border: 0.04em solid var(--widget-field-border-color);
      border-radius: 0.38em;
      background: var(--widget-field-color);
      padding: 0.28em 0.38em;
      color: #3f3328;
      font: 400 0.46em/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      outline: none;
    }

    .text-node.navigation-target-highlight {
      animation: destination-text-glow 5000ms linear forwards;
    }

    @keyframes destination-text-glow {
      0% {
        text-shadow:
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0);
      }
      16% {
        text-shadow:
          0 0 0.22em rgba(255, 255, 255, 0.98),
          0 0 0.56em rgba(255, 255, 255, 0.9),
          0 0 1.28em rgba(255, 255, 255, 0.72);
      }
      74% {
        text-shadow:
          0 0 0.26em rgba(255, 255, 255, 0.88),
          0 0 0.66em rgba(255, 255, 255, 0.74),
          0 0 1.38em rgba(255, 255, 255, 0.52);
      }
      100% {
        text-shadow:
          0 0 0.36em rgba(255, 255, 255, 0),
          0 0 0.9em rgba(255, 255, 255, 0),
          0 0 1.7em rgba(255, 255, 255, 0);
      }
    }

    function isPlaygroundPath() {

    function detectMobileDevice() {
      const userAgent = navigator.userAgent || "";
      const reportsMobile = Boolean(
        navigator.userAgentData && navigator.userAgentData.mobile
      );
      const hasMobileUserAgent = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(userAgent);
      const isIPadDesktopMode =
        navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const isTouchOnlySmallScreen =
        navigator.maxTouchPoints > 0 &&
        window.matchMedia("(pointer: coarse)").matches &&
        window.matchMedia("(hover: none)").matches &&
        Math.min(window.screen.width, window.screen.height) <= 1024;

      return reportsMobile || hasMobileUserAgent || isIPadDesktopMode || isTouchOnlySmallScreen;
    }

    function createClientId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    function encodeRealtimeChannelPart(value) {
      const bytes = new TextEncoder().encode(String(value || ""));
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function detectPhysicalWheelStep(event) {
      if (IS_MOBILE_DEVICE || !event.isTrusted) return false;

      // Device type is not exposed, so only discrete wheel signatures qualify.
      const deltaY = Math.abs(event.deltaY);
      const legacyDelta = Math.abs(Number(event.wheelDeltaY ?? event.wheelDelta));
      const hasLegacyWheelStep =
        Number.isFinite(legacyDelta) &&
        legacyDelta >= 120 &&
        Math.abs(legacyDelta % 120) < 0.001;
      const hasDiscreteDeltaMode = event.deltaMode === 1 || event.deltaMode === 2;
      const hasSuddenPixelStep =
        event.deltaMode === 0 &&
        deltaY >= PHYSICAL_WHEEL_MIN_PIXEL_DELTA &&
        Math.abs(event.deltaX) < 1 &&
        hasLegacyWheelStep;

      const detected = hasDiscreteDeltaMode || hasSuddenPixelStep;
      if (detected) hasPhysicalWheelInput = true;
      return detected;
    }

    function getNodePlainTitleText(node, options = {}) {
      if (!(node instanceof HTMLElement)) return "";
      if (!options.cleanControls) return (node.textContent || "").trim();
      const clone = node.cloneNode(true);
      clone.querySelectorAll("style, script, button, input, textarea, select").forEach((element) => element.remove());
      return (clone.textContent || "").replace(/\s+/g, " ").trim();

    function getHookedNodeTitle(node) {
      if (!(node instanceof HTMLElement) || isNodeDeleted(node)) return "";
      if (isCommandNode(node)) {
        const command = getCommand(node.dataset.commandId || "");
        if (command && typeof command.getTitle === "function") {
          const title = command.getTitle(readCommandState(node), getCommandRenderContext(node), node);
          if (typeof title === "string" && title.trim()) return title.trim();
        }
        return getNodePlainTitleText(node, { cleanControls: true });
      }
      return getNodePlainTitleText(node);

    function startTitleHookRefresh() {
      if (titleHookWorker || titleHookTimer !== null) return;
      if (typeof Worker === "function" && typeof Blob === "function" && window.URL && typeof URL.createObjectURL === "function") {
        try {
          const workerUrl = URL.createObjectURL(new Blob([
            `setInterval(() => postMessage(0), ${TITLE_HOOK_REFRESH_MS});`
          ], { type: "application/javascript" }));
          titleHookWorker = new Worker(workerUrl);
          URL.revokeObjectURL(workerUrl);
          titleHookWorker.onmessage = updateDocumentTitle;
          titleHookWorker.onerror = () => {
            if (titleHookWorker) titleHookWorker.terminate();
            titleHookWorker = null;
            if (titleHookTimer === null) {
              titleHookTimer = setInterval(updateDocumentTitle, TITLE_HOOK_REFRESH_MS);
            }
          };
          return;
        } catch (error) {
          titleHookWorker = null;

    function normalizeAvatarColor(value) {

        g: source.g + (target.g - source.g) * amount,

    function drawQuicoAvatarDataUrl(character, palette) {
      const glyph = Array.from(String(character || "").trim())[0] || "?";
      const cacheKey = [glyph, palette.background, palette.border, palette.foreground].join("|");
      const cache = drawQuicoAvatarDataUrl.cache || (drawQuicoAvatarDataUrl.cache = new Map());
      if (cache.has(cacheKey)) return cache.get(cacheKey);

      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext("2d");
      if (!context) return "";

      const center = size / 2;
      const radius = size * 0.44;
      context.clearRect(0, 0, size, size);
      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.closePath();
      context.fillStyle = palette.background;
      context.fill();
      context.lineWidth = 24;
      context.strokeStyle = palette.border;
      context.stroke();

      const fontSize = Math.round(size * 0.56);
      context.fillStyle = palette.foreground;
      context.textAlign = "left";
      context.textBaseline = "alphabetic";
      context.font = `700 ${fontSize}px Roboto, "Helvetica Neue", Arial, sans-serif`;

      const dataUrl = canvas.toDataURL("image/png");
      cache.set(cacheKey, dataUrl);

          : mixAvatarColor(background, "#000000", 0.36);

    function clearArtificialLoadingProgress() {

    function getArtificialLoadingProgressDelay(percent) {
      if (percent < LOADING_ARTIFICIAL_FAST_LIMIT_PERCENT) return LOADING_ARTIFICIAL_FAST_STEP_MS;
      if (percent < LOADING_ARTIFICIAL_SLOW_LIMIT_PERCENT) return LOADING_ARTIFICIAL_SLOW_STEP_MS;
      return 0;
    }

    function scheduleArtificialLoadingProgress() {
      if (!loadingScreen || loadingArtificialProgressTimer !== null) return;
      const current = Math.max(
        Math.round(loadingDisplayedProgress),
        loadingProgressValue,
        LOADING_ARTIFICIAL_START_PERCENT
      );
      const delay = getArtificialLoadingProgressDelay(current);
      if (!delay) {
        loadingArtificialProgressActive = current < 100;
        return;
      }

      loadingArtificialProgressActive = true;
      loadingArtificialProgressTimer = setTimeout(() => {
        loadingArtificialProgressTimer = null;
        if (!loadingArtificialProgressActive || !loadingScreen) return;
        const displayed = Math.max(Math.round(loadingDisplayedProgress), loadingProgressValue);
        const limit = displayed < LOADING_ARTIFICIAL_FAST_LIMIT_PERCENT
          ? LOADING_ARTIFICIAL_FAST_LIMIT_PERCENT
          : LOADING_ARTIFICIAL_SLOW_LIMIT_PERCENT;
        const next = Math.min(limit, displayed + 1);

          loadingArtificialProgressActive = false;
          return;

        setLoadingProgress(next, { artificial: true });
        scheduleArtificialLoadingProgress();

    function setLoadingProgress(percent, options = {}) {

      let nextProgressValue = reportedValue;
      let handedOffArtificialProgress = false;

      if (!isArtificial && loadingArtificialProgressActive && reportedValue > LOADING_ARTIFICIAL_START_PERCENT) {
        const displayedFloor = Math.max(0, Math.min(100, Math.round(loadingDisplayedProgress)));
        handedOffArtificialProgress = true;
        clearArtificialLoadingProgress();
        loadingRealProgressOffset = Math.max(0, displayedFloor - reportedValue);

      if (!isArtificial && loadingRealProgressOffset > 0) {

      const progress = loadingProgressAnimationDuration > 0
        ? Math.min(1, elapsed / loadingProgressAnimationDuration)

      setLoadingProgressText(loadingDisplayedProgress);

      return (progress) => {
        const value = Math.max(0, Math.min(1, Number(progress) || 0));

    function waitForLoadingFrame() {

    function registerNode(node) {

      const node = nodeRegistry.get(id);
      if (!node) return null;
      if (!world.contains(node)) {

        return null;
      }
      if (!options.includeDeleted && isNodeDeleted(node)) return null;
      return node;

    function updateNextNodeNumberFromId(nodeId) {

    function resolveNodeId(preferredId) {

      if (!isNodeIdInUse(requested)) {

        return requested;
      }
      let suffix = 2;
      let candidate = `${requested}-${suffix}`;
      while (isNodeIdInUse(candidate)) {
        suffix += 1;
        candidate = `${requested}-${suffix}`;
      }

    function normalizeExternalHref(value) {

    function sanitizeNodeHtml(rawHtml, options = {}) {

            const link = document.createElement("span");
            link.className = "internal-link";
            link.dataset.targetId = targetId;
            link.textContent = element.textContent || "";
            target.appendChild(link);
            return;

        if (tag === "SPAN" && element.classList.contains("external-link-plain")) {
          const text = element.textContent || "";
          const href = normalizeExternalHref(element.dataset.href || text);
          if (href) {
            const span = document.createElement("span");
            span.className = "external-link-plain";
            span.dataset.href = href;
            span.textContent = text;
            target.appendChild(span);
            return;
          }
        }

        if (tag === "SPAN" && element.classList.contains("external-link-card")) {
          const href = normalizeExternalHref(
            element.dataset.href ||
            (element.querySelector("a") && element.querySelector("a").getAttribute("href")) ||
            element.textContent ||
            ""
          );
          if (href) {
            const card = createExternalLinkCard(href, element.dataset.label || "", {
              widgetColor: element.dataset.widgetColor || ""

        const sanitizedTag = SANITIZED_INLINE_TAGS.get(tag);

        const isPastedBlock = preserveBlockBreaks && PASTED_BLOCK_TAGS.has(tag);

        for (const child of element.childNodes) {

    }

    function insertSanitizedPaste(node, html) {

        Number(node.dataset.x),
        Number(node.dataset.y)
      );
      if (isFloating) {
        node.dataset.x = String(origin.x);
        node.dataset.y = String(origin.y);
        const totalRotation = normalizeRotation(getCameraRotation() + getNodeRotation(node));
        if (Math.abs(totalRotation) >= 0.000001) node.dataset.rotation = String(totalRotation);
        else delete node.dataset.rotation;
        node.dataset.baseFontSize = String(getNodeRenderedFontSize(node) * FLOAT_PINNED_SIZE_SCALE);
        node.dataset.floating = "true";
      } else {
        const worldPoint = screenToWorld(origin.x, origin.y);
        node.dataset.x = String(worldPoint.x);
        node.dataset.y = String(worldPoint.y);
        const worldRotation = normalizeRotation(getNodeRotation(node) - getCameraRotation());
        if (Math.abs(worldRotation) >= 0.000001) node.dataset.rotation = String(worldRotation);
        else delete node.dataset.rotation;
        node.dataset.baseFontSize = String(getNodeBaseFontSize(node) / (getCameraScale() * FLOAT_PINNED_SIZE_SCALE));
        delete node.dataset.floating;
      }

      restoreNodeScreenCenter(node, screenCenter);
      playFloatTransition(node, isFloating);
      requestLineRender();
      refreshSelectionBounds();
      scheduleAutosave();
      return true;
    }

    function toggleContextMenuNodeFloating() {
      if (!contextMenuNode || !world.contains(contextMenuNode)) return;
      setNodeFloating(contextMenuNode, !isFloatingNode(contextMenuNode));
      closeNodeContextMenu();
    }

    function getTransformedWorldRectBounds(rect) {
      const corners = [
        worldToScreen(rect.minX, rect.minY),
        worldToScreen(rect.maxX, rect.minY),
        worldToScreen(rect.maxX, rect.maxY),
        worldToScreen(rect.minX, rect.maxY)
      ];
      const xs = corners.map((point) => point.x);
      const ys = corners.map((point) => point.y);
      const left = Math.min(...xs);
      const top = Math.min(...ys);
      const right = Math.max(...xs);
      const bottom = Math.max(...ys);
      return {
        left,
        top,
        right,
        bottom,
        width: Math.max(0, right - left),
        height: Math.max(0, bottom - top)
      };
    }

    function getPointBounds(points) {
      const xs = points.map((point) => point.x);
      const ys = points.map((point) => point.y);
      const minX = Math.min(...xs);
      const minY = Math.min(...ys);
      const maxX = Math.max(...xs);
      const maxY = Math.max(...ys);
      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
    }

    function getPointCenter(points) {
      let x = 0;
      let y = 0;
      for (const point of points) {
        x += point.x;
        y += point.y;
      }
      return {
        x: x / points.length,
        y: y / points.length
      };
    }

    function rotatePointAround(point, center, angle) {
      const basis = getCameraBasis(angle);
      const dx = point.x - center.x;
      const dy = point.y - center.y;
      return {
        x: center.x + dx * basis.cos - dy * basis.sin,
        y: center.y + dx * basis.sin + dy * basis.cos
      };
    }

    function getBoundsCenter(bounds) {
      return {
        x: bounds.minX + bounds.width * 0.5,
        y: bounds.minY + bounds.height * 0.5
      };
    }

    function worldToSelectionLocal(point, rotation = selectionOverlayRotation) {
      const basis = getCameraBasis(rotation);
      return {
        x: point.x * basis.cos + point.y * basis.sin,
        y: -point.x * basis.sin + point.y * basis.cos
      };
    }

    function selectionLocalToWorld(point, rotation = selectionOverlayRotation) {
      const basis = getCameraBasis(rotation);
      return {
        x: point.x * basis.cos - point.y * basis.sin,
        y: point.x * basis.sin + point.y * basis.cos
      };
    }

    function getNodeWorldCorners(node) {
      const x = Number(node.dataset.x);
      const y = Number(node.dataset.y);
      const size = getNodeWorldSize(node);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return [];

      const rotation = getNodeRotation(node);
      const basis = getCameraBasis(rotation);
      return [
        { x, y },
        { x: x + size.width * basis.cos, y: y + size.width * basis.sin },
        {
          x: x + size.width * basis.cos - size.height * basis.sin,
          y: y + size.width * basis.sin + size.height * basis.cos
        },
        { x: x - size.height * basis.sin, y: y + size.height * basis.cos }
      ];
    }

    function getNodeWorldBounds(node) {
      const corners = getNodeWorldCorners(node);
      return corners.length === 4 ? getPointBounds(corners) : null;
    }

    function getNodeWorldCenter(node) {
      if (isFloatingNode(node)) return getNodeScreenCenter(node);
      const corners = getNodeWorldCorners(node);
      return corners.length === 4 ? getPointCenter(corners) : null;
    }

    function getNodeScreenCorners(node) {
      const point = pointToScreenForNode(node, Number(node.dataset.x), Number(node.dataset.y));
      const x = point.x;
      const y = point.y;
      const size = getNodeScreenSize(node);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return [];

      const rotation = getNodeTotalRotation(node);
      const basis = getCameraBasis(rotation);
      return [
        { x, y },
        { x: x + size.width * basis.cos, y: y + size.width * basis.sin },
        {
          x: x + size.width * basis.cos - size.height * basis.sin,
          y: y + size.width * basis.sin + size.height * basis.cos
        },
        { x: x - size.height * basis.sin, y: y + size.height * basis.cos }
      ];
    }

    function getNodeScreenCenter(node) {
      const corners = getNodeScreenCorners(node);
      return corners.length === 4 ? getPointCenter(corners) : null;
    }

    function setCameraTransformAt(clientX, clientY, nextScale, nextRotation) {
      if (!Number.isFinite(nextScale) || nextScale <= 0) return false;
      const worldPoint = screenToWorld(clientX, clientY);
      return setCameraTransformForWorldPoint(worldPoint, clientX, clientY, nextScale, nextRotation);
    }

    function setCameraTransformForWorldPoint(worldPoint, clientX, clientY, nextScale, nextRotation) {
      if (
        !worldPoint ||
        !Number.isFinite(worldPoint.x) ||
        !Number.isFinite(worldPoint.y) ||
        !Number.isFinite(clientX) ||
        !Number.isFinite(clientY) ||
        !Number.isFinite(nextScale) ||
        nextScale <= 0
      ) return false;
      const rotation = normalizeRotation(nextRotation);
      const offset = getCameraScreenOffset(worldPoint.x, worldPoint.y, nextScale, rotation);
      camera.scale = nextScale;
      camera.rotation = rotation;
      camera.x = clientX - offset.x;
      camera.y = clientY - offset.y;
      render();
      scheduleViewportSave();
      return true;
    }

    function easeInOutHeavy(t) {
      if (t < 0.5) {
        return 16 * Math.pow(t, 5);
      }
      return 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function easeInOutNatural(t) {
      const clamped = clamp(t, 0, 1);
      return clamped * clamped * clamped * (clamped * (clamped * 6 - 15) + 10);
    }

    function getNodeWorldSize(node) {
      if (isHtmlViewNode(node)) {
        const baseFontSize = getNodeBaseFontSize(node);
        const htmlScale = baseFontSize / BASE_TEXT_PX;
        return {
          width: clamp(Math.ceil(Number(node.dataset.htmlViewWidth) || 1), 1, HTML_VIEW_MAX_SIZE_PX) * htmlScale,
          height: clamp(Math.ceil(Number(node.dataset.htmlViewHeight) || 1), 1, HTML_VIEW_MAX_SIZE_PX) * htmlScale
        };
      }
      const metrics = getNodeRenderMetrics(node);
      return {
        width: Math.max(node.scrollWidth, node.offsetWidth, 1) * metrics.worldScale,
        height: Math.max(node.scrollHeight, node.offsetHeight, 1) * metrics.worldScale
      };
    }

    function getNodeScreenSize(node) {
      if (isFloatingNode(node)) return getNodeWorldSize(node);
      const worldSize = getNodeWorldSize(node);
      return {
        width: worldSize.width * getCameraScale(),
        height: worldSize.height * getCameraScale()
      };
    }

    function getNodeGroupWorldBounds(nodes) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      for (const node of nodes) {
        if (!(node instanceof HTMLElement) || !world.contains(node) || isNodeDeleted(node)) continue;
        const bounds = getNodeWorldBounds(node);
        if (!bounds) continue;
        minX = Math.min(minX, bounds.minX);
        minY = Math.min(minY, bounds.minY);
        maxX = Math.max(maxX, bounds.maxX);
        maxY = Math.max(maxY, bounds.maxY);
      }

      if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) return null;
      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
    }

    function getNodeScreenBounds(node) {
      const rect = node.getBoundingClientRect();
      if (!Number.isFinite(rect.left) || !Number.isFinite(rect.top) || !Number.isFinite(rect.right) || !Number.isFinite(rect.bottom)) return null;
      return {
        minX: rect.left,
        minY: rect.top,
        maxX: rect.right,
        maxY: rect.bottom,
        width: Math.max(0.001, rect.width),
        height: Math.max(0.001, rect.height)
      };
    }

    function getNodeScreenBoundsForGroup(nodes) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      for (const node of nodes) {
        if (!(node instanceof HTMLElement) || !world.contains(node) || isNodeDeleted(node)) continue;
        const bounds = getNodeScreenBounds(node);
        if (!bounds) continue;
        minX = Math.min(minX, bounds.minX);
        minY = Math.min(minY, bounds.minY);
        maxX = Math.max(maxX, bounds.maxX);
        maxY = Math.max(maxY, bounds.maxY);
      }

      if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) return null;
      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
    }

    function getNodeGroupAverageScreenHeight(nodes) {
      let total = 0;
      let count = 0;
      for (const node of nodes) {
        if (!(node instanceof HTMLElement) || !world.contains(node) || isNodeDeleted(node)) continue;
        const bounds = getNodeScreenBounds(node);
        if (!bounds) continue;
        total += bounds.height;
        count += 1;
      }
      return count > 0 ? total / count : 1;
    }

    function getSpacingGuideX(a, b) {
      const overlapMin = Math.max(a.minX, b.minX);
      const overlapMax = Math.min(a.maxX, b.maxX);
      if (overlapMin <= overlapMax) return (overlapMin + overlapMax) * 0.5;
      return a.maxX < b.minX ? (a.maxX + b.minX) * 0.5 : (b.maxX + a.minX) * 0.5;
    }

    function getVerticalBoundsGap(upper, lower) {
      return lower.minY - upper.maxY;
    }

    function getSpacingGuideHorizontalTolerance() {
      return Math.max(
        SPACING_GUIDE_MIN_GAP_SCREEN_PX,
        viewport.clientWidth * SPACING_GUIDE_HORIZONTAL_TOLERANCE_VIEWPORT_RATIO
      );
    }

    function getSpacingGuideUnits(upper, lower) {
      return getVerticalBoundsGap(upper.bounds, lower.bounds);
    }

    function hasSpacingGuideSimilarSize(baseSize, candidateSize) {
      if (!Number.isFinite(baseSize) || !Number.isFinite(candidateSize) || baseSize <= 0 || candidateSize <= 0) return false;
      const ratio = candidateSize / baseSize;
      return ratio >= 1 - SPACING_GUIDE_SIZE_RATIO_TOLERANCE &&
        ratio <= 1 + SPACING_GUIDE_SIZE_RATIO_TOLERANCE;
    }

    function getBoundsCenterX(bounds) {
      return bounds.minX + bounds.width * 0.5;
    }

    function hasSpacingGuideHorizontalRelation(a, b, toleranceScreen) {
      if (Math.max(a.minX, b.minX) <= Math.min(a.maxX, b.maxX)) return true;
      const aCenter = getBoundsCenterX(a);
      const bCenter = getBoundsCenterX(b);
      if (aCenter >= b.minX - toleranceScreen && aCenter <= b.maxX + toleranceScreen) return true;
      if (bCenter >= a.minX - toleranceScreen && bCenter <= a.maxX + toleranceScreen) return true;
      return Math.abs(aCenter - bCenter) <= toleranceScreen;
    }

    function getSpacingGuideCandidateDistance(draggedBounds, bounds) {
      if (bounds.maxY <= draggedBounds.minY) return draggedBounds.minY - bounds.maxY;
      if (bounds.minY >= draggedBounds.maxY) return bounds.minY - draggedBounds.maxY;
      return 0;
    }

    function createSpacingGuidePair(upper, lower) {
      return {
        upper: upper.bounds,
        lower: lower.bounds
      };
    }

    function addMatchingSpacingPairs(pairs, entries, startIndex, step, targetUnits) {
      for (
        let index = startIndex;
        index >= 0 && index < entries.length - 1 && pairs.length < SPACING_GUIDE_MAX_CHAIN_GAPS;
        index += step
      ) {
        const units = getSpacingGuideUnits(entries[index], entries[index + 1]);
        if (Math.abs(units - targetUnits) > SPACING_GUIDE_PIXEL_TOLERANCE) break;
        const pair = createSpacingGuidePair(entries[index], entries[index + 1]);
        if (step < 0) pairs.unshift(pair);
        else pairs.push(pair);
      }
    }

    function createSpacingGuideFromPairs(pairs) {
      return pairs.length >= 2 ? { pairs } : null;
    }

    function findSpacingGuidesForNodes(nodes) {
      if (nodes.some((node) => isFloatingNode(node))) return [];
      const draggedNodes = new Set(nodes);
      const draggedBounds = getNodeScreenBoundsForGroup(nodes);
      if (!draggedBounds) return [];

      const horizontalTolerance = getSpacingGuideHorizontalTolerance();
      const draggedSize = getNodeGroupAverageScreenHeight(nodes);
      const candidates = [];

      for (const node of world.children) {
        if (!(node instanceof HTMLElement)) continue;
        if (draggedNodes.has(node) || isNodeDeleted(node) || isFloatingNode(node)) continue;
        const bounds = getNodeScreenBounds(node);
        if (!bounds) continue;
        const size = bounds.height;
        if (!hasSpacingGuideSimilarSize(draggedSize, size)) continue;
        if (!hasSpacingGuideHorizontalRelation(draggedBounds, bounds, horizontalTolerance)) continue;
        candidates.push({ node, bounds, size });
      }

      const entries = candidates
        .sort((a, b) =>
          getSpacingGuideCandidateDistance(draggedBounds, a.bounds) -
          getSpacingGuideCandidateDistance(draggedBounds, b.bounds)
        )
        .slice(0, SPACING_GUIDE_MAX_LOOKUP_NODES)
        .sort((a, b) => a.bounds.minY - b.bounds.minY);
      const draggedEntry = { node: null, bounds: draggedBounds, size: draggedSize };
      const guides = [];

      const aboveIndex = entries.findLastIndex((entry) => entry.bounds.maxY <= draggedBounds.minY);
      const belowIndex = entries.findIndex((entry) => entry.bounds.minY >= draggedBounds.maxY);

      if (aboveIndex >= 1) {
        const targetGap = getVerticalBoundsGap(entries[aboveIndex].bounds, draggedBounds);
        const targetUnits = getSpacingGuideUnits(entries[aboveIndex], draggedEntry);
        const referenceUnits = getSpacingGuideUnits(entries[aboveIndex - 1], entries[aboveIndex]);
        if (
          targetGap >= SPACING_GUIDE_MIN_GAP_SCREEN_PX &&
          Math.abs(targetUnits - referenceUnits) <= SPACING_GUIDE_PIXEL_TOLERANCE
        ) {
          const pairs = [
            createSpacingGuidePair(entries[aboveIndex - 1], entries[aboveIndex]),
            createSpacingGuidePair(entries[aboveIndex], draggedEntry)
          ];
          addMatchingSpacingPairs(pairs, entries, aboveIndex - 2, -1, referenceUnits);
          const guide = createSpacingGuideFromPairs(pairs);
          if (guide) guides.push(guide);
        }
      }

      if (belowIndex >= 0 && belowIndex < entries.length - 1) {
        const targetGap = getVerticalBoundsGap(draggedBounds, entries[belowIndex].bounds);
        const targetUnits = getSpacingGuideUnits(draggedEntry, entries[belowIndex]);
        const referenceUnits = getSpacingGuideUnits(entries[belowIndex], entries[belowIndex + 1]);
        if (
          targetGap >= SPACING_GUIDE_MIN_GAP_SCREEN_PX &&
          Math.abs(targetUnits - referenceUnits) <= SPACING_GUIDE_PIXEL_TOLERANCE
        ) {
          const pairs = [
            createSpacingGuidePair(draggedEntry, entries[belowIndex]),
            createSpacingGuidePair(entries[belowIndex], entries[belowIndex + 1])
          ];
          addMatchingSpacingPairs(pairs, entries, belowIndex + 1, 1, referenceUnits);
          const guide = createSpacingGuideFromPairs(pairs);
          if (guide) guides.push(guide);
        }
      }

      if (aboveIndex >= 0 && belowIndex >= 0) {
        const aboveGap = getVerticalBoundsGap(entries[aboveIndex].bounds, draggedBounds);
        const belowGap = getVerticalBoundsGap(draggedBounds, entries[belowIndex].bounds);
        const aboveUnits = getSpacingGuideUnits(entries[aboveIndex], draggedEntry);
        const belowUnits = getSpacingGuideUnits(draggedEntry, entries[belowIndex]);
        if (
          aboveGap >= SPACING_GUIDE_MIN_GAP_SCREEN_PX &&
          belowGap >= SPACING_GUIDE_MIN_GAP_SCREEN_PX &&
          Math.abs(aboveUnits - belowUnits) <= SPACING_GUIDE_PIXEL_TOLERANCE
        ) {
          const guide = createSpacingGuideFromPairs([
            createSpacingGuidePair(entries[aboveIndex], draggedEntry),
            createSpacingGuidePair(draggedEntry, entries[belowIndex])
          ]);
          if (guide) guides.unshift(guide);
        }
      }

      return guides.slice(0, 2);
    }

    function setSpacingGuideOpacity(targetOpacity, onComplete) {
      const target = clamp(targetOpacity, 0, 1);
      if (spacingGuideFadeFrame !== null && spacingGuideFadeTarget === target) return;
      if (spacingGuideFadeFrame !== null) cancelAnimationFrame(spacingGuideFadeFrame);

      const startOpacity = spacingGuideOpacity;
      spacingGuideFadeTarget = target;
      if (Math.abs(startOpacity - target) < 0.001) {
        spacingGuideOpacity = target;
        spacingGuideLayer.style.opacity = String(target);
        spacingGuideFadeFrame = null;
        if (onComplete) onComplete();
        return;
      }

      const startTime = performance.now();
      const tick = (now) => {
        const progress = clamp((now - startTime) / SPACING_GUIDE_FADE_DURATION_MS, 0, 1);
        const eased = easeInOutNatural(progress);
        spacingGuideOpacity = startOpacity + (target - startOpacity) * eased;
        spacingGuideLayer.style.opacity = String(spacingGuideOpacity);
        if (progress < 1) {
          spacingGuideFadeFrame = requestAnimationFrame(tick);
          return;
        }

        spacingGuideOpacity = target;
        spacingGuideLayer.style.opacity = String(target);
        spacingGuideFadeFrame = null;
        if (onComplete) onComplete();
      };
      spacingGuideFadeFrame = requestAnimationFrame(tick);
    }

    function clearSpacingGuides() {
      if (spacingGuideLayer.hasAttribute("hidden")) return;
      setSpacingGuideOpacity(0, () => {
        spacingGuideLayer.replaceChildren();
        spacingGuideLayer.setAttribute("hidden", "");
      });
    }

    function renderSpacingGuides(guides) {
      if (!guides || guides.length === 0) {
        clearSpacingGuides();
        return;
      }

      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      spacingGuideLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
      spacingGuideLayer.setAttribute("width", String(width));
      spacingGuideLayer.setAttribute("height", String(height));
      spacingGuideLayer.replaceChildren();
      if (spacingGuideLayer.hasAttribute("hidden")) {
        spacingGuideOpacity = 0;
        spacingGuideLayer.style.opacity = "0";
        spacingGuideLayer.removeAttribute("hidden");
      }

      for (const guide of guides) {
        for (const pair of guide.pairs) {
          const x = getSpacingGuideX(pair.upper, pair.lower);
          const start = { x, y: pair.upper.maxY };
          const end = { x, y: pair.lower.minY };
          const line = document.createElementNS(SVG_NS, "line");
          line.setAttribute("class", "spacing-guide-line");
          line.setAttribute("x1", String(start.x));
          line.setAttribute("y1", String(start.y));
          line.setAttribute("x2", String(end.x));
          line.setAttribute("y2", String(end.y));
          spacingGuideLayer.appendChild(line);

        }
      }
      setSpacingGuideOpacity(1);
    }

    function updateSpacingGuidesForNodes(nodes) {
      renderSpacingGuides(findSpacingGuidesForNodes(nodes));
    }

    function updateNextLineNumberFromId(lineId) {
      const match = /^line-(\d+)$/.exec(lineId);
      if (!match) return;
      const value = Number(match[1]);
      if (!Number.isFinite(value)) return;
      nextLineNumber = Math.max(nextLineNumber, value + 1);
    }

    function isLineIdInUse(lineId) {
      return lineConnections.some((line) => line.id === lineId);
    }

    function generateLineId() {
      let candidate = `line-${nextLineNumber}`;
      while (isLineIdInUse(candidate)) {
        nextLineNumber += 1;
        candidate = `line-${nextLineNumber}`;
      }
      nextLineNumber += 1;
      return candidate;
    }

    function resolveLineId(preferredId) {
      const requested = typeof preferredId === "string" ? preferredId.trim() : "";
      if (!requested) return generateLineId();
      if (!isLineIdInUse(requested)) {
        updateNextLineNumberFromId(requested);
        return requested;
      }
      let suffix = 2;
      let candidate = `${requested}-${suffix}`;
      while (isLineIdInUse(candidate)) {
        suffix += 1;
        candidate = `${requested}-${suffix}`;
      }
      return candidate;
    }

    function normalizeLineEndpointId(value) {
      return typeof value === "string" ? value.trim() : "";
    }

    function getLineConnectionKey(fromId, toId) {
      return [fromId, toId].sort().join("\u0000");
    }

    function hasLineConnection(fromId, toId) {
      const key = getLineConnectionKey(fromId, toId);
      return lineConnections.some((line) => !line.deletedAt && getLineConnectionKey(line.from, line.to) === key);
    }

    function normalizeCalcOperation(value) {
      const operation = String(value || "").trim();
      if (operation === "/") return "÷";
      if (operation.toLowerCase() === "x") return "*";
      return CALC_OPERATIONS.has(operation) ? operation : "";
    }

    function isCalcVariableNode(node) {
      return node instanceof HTMLElement && node.dataset.variable === "true";
    }

    function setCalcVariableNode(node, active) {
      if (!(node instanceof HTMLElement) || isCommandNode(node)) return false;
      const shouldBeActive = Boolean(active);
      if (shouldBeActive === isCalcVariableNode(node)) return false;

      if (shouldBeActive) {
        node.dataset.variable = "true";
        node.classList.add("variable-node");
        node.contentEditable = "false";
        node.classList.remove("editing");
      } else {
        delete node.dataset.variable;
        node.classList.remove("variable-node");
      }
      renderNode(node);
      return true;
    }

    function getNodeNumericValue(node) {
      if (!(node instanceof HTMLElement)) return null;
      const text = (node.textContent || "").replace(/,/g, "").trim();
      if (!text) return null;
      const value = Number(text);
      return Number.isFinite(value) ? value : null;
    }

    function formatCalcResult(value) {
      if (!Number.isFinite(value)) return "NaN";
      const normalized = Math.abs(value) < 1e-12 ? 0 : value;
      return Number(normalized.toPrecision(12)).toString();
    }

    function getIncomingCalcLine(nodeId, visitedLineIds) {
      let candidate = null;
      for (const line of lineConnections) {
        const operation = normalizeCalcOperation(line.operation);
        if (
          line.deletedAt ||
          operation === "" ||
          operation === "=" ||
          line.to !== nodeId ||
          visitedLineIds.has(line.id)
        ) {
          continue;
        }
        candidate = line;
      }
      return candidate;
    }

    function buildCalcChain(finalNodeId) {
      const visitedLineIds = new Set();
      const visitedNodeIds = new Set([finalNodeId]);
      const reversedLines = [];
      let currentId = finalNodeId;

      while (currentId) {
        const line = getIncomingCalcLine(currentId, visitedLineIds);
        if (!line) break;
        if (visitedNodeIds.has(line.from)) return null;
        visitedLineIds.add(line.id);
        visitedNodeIds.add(line.from);
        reversedLines.push(line);
        currentId = line.from;
      }

      return {
        startId: currentId,
        lines: reversedLines.reverse()
      };
    }

    function calculateChainValue(finalNodeId) {
      const chain = buildCalcChain(finalNodeId);
      if (!chain || !chain.startId) return null;

      const startNode = getNodeById(chain.startId);
      let value = getNodeNumericValue(startNode);
      if (value === null) return null;

      for (const line of chain.lines) {
        const node = getNodeById(line.to);
        const nextValue = getNodeNumericValue(node);
        if (nextValue === null) return null;
        const operation = normalizeCalcOperation(line.operation);
        if (operation === "+") value += nextValue;
        else if (operation === "-") value -= nextValue;
        else if (operation === "*") value *= nextValue;
        else if (operation === "÷") value = nextValue === 0 ? NaN : value / nextValue;
      }

      return value;
    }

    function updateCalcVariables() {
      const equalLines = lineConnections.filter((line) =>
        !line.deletedAt && normalizeCalcOperation(line.operation) === "="
      );
      const targetIds = new Set(equalLines.map((line) => line.to).filter(Boolean));
      let changed = false;

      for (const node of world.children) {
        if (!(node instanceof HTMLElement) || isCommandNode(node) || isNodeDeleted(node)) continue;
        if (!targetIds.has(node.dataset.nodeId || "")) {
          changed = setCalcVariableNode(node, false) || changed;
        }
      }

      const passes = Math.max(1, equalLines.length + 1);
      for (let pass = 0; pass < passes; pass += 1) {
        let passChanged = false;
        for (const line of equalLines) {
          const targetNode = getNodeById(line.to);
          if (!targetNode || isCommandNode(targetNode)) continue;
          changed = setCalcVariableNode(targetNode, true) || changed;
          const result = calculateChainValue(line.from);
          const nextText = result === null ? "NaN" : formatCalcResult(result);
          if (targetNode.textContent !== nextText) {
            targetNode.textContent = nextText;
            normalizeNodeMarkup(targetNode);
            renderNode(targetNode);
            passChanged = true;
            changed = true;
          }
        }
        if (!passChanged) break;
      }

      if (changed) {
        requestLineRender();
        refreshSelectionBounds();
        updateDocumentTitle();
      }
      return changed;
    }

    function setLineOperation(lineId, operation) {
      const id = typeof lineId === "string" ? lineId.trim() : "";
      const normalized = normalizeCalcOperation(operation);
      if (!id || !normalized) return false;
      const line = lineConnections.find((entry) => entry.id === id && !entry.deletedAt);
      if (!line) return false;
      line.operation = normalized;
      renderLineConnections();
      updateCalcVariables();
      scheduleAutosave();
      return true;
    }

    function createLineConnection(sourceNode, targetNode) {
      if (!(sourceNode instanceof HTMLElement) || !(targetNode instanceof HTMLElement)) return false;
      if (isNodeDeleted(sourceNode) || isNodeDeleted(targetNode)) return false;
      if (!world.contains(sourceNode) || !world.contains(targetNode) || sourceNode === targetNode) return false;

      const from = normalizeLineEndpointId(sourceNode.dataset.nodeId || "");
      const to = normalizeLineEndpointId(targetNode.dataset.nodeId || "");
      if (!from || !to || from === to || hasLineConnection(from, to)) return false;

      lineConnections.push({
        id: generateLineId(),
        from,
        to,
        createdAt: Date.now()
      });
      renderLineConnections();
      scheduleAutosave();
      return true;
    }

    function removeLineConnection(lineId) {
      const id = typeof lineId === "string" ? lineId.trim() : "";
      if (!id) return false;
      const line = lineConnections.find((entry) => entry.id === id && !entry.deletedAt);
      if (!line) return false;
      line.deletedAt = Date.now();
      renderLineConnections();
      updateCalcVariables();
      scheduleAutosave();
      return true;
    }

    function serializeLineConnection(line) {
      const serialized = {
        id: line.id || "",
        from: line.from || "",
        to: line.to || ""
      };
      const createdAt = normalizeTimestamp(line.createdAt);
      const deletedAt = normalizeTimestamp(line.deletedAt);
      if (createdAt) serialized.createdAt = createdAt;
      if (deletedAt) serialized.deletedAt = deletedAt;
      const operation = normalizeCalcOperation(line.operation);
      if (operation) serialized.operation = operation;
      return serialized;
    }

    function loadLineConnections(entries, options = {}) {
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      lineConnections = [];
      nextLineNumber = 1;

      if (!Array.isArray(entries)) {
        renderLineConnections();
        if (reportProgress) reportProgress(1);
        return;
      }

      const seen = new Set();
      entries.forEach((entry, index) => {
        if (!entry || typeof entry !== "object") {
          if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
          return;
        }
        const from = normalizeLineEndpointId(entry.from);
        const to = normalizeLineEndpointId(entry.to);
        if (
          !from ||
          !to ||
          from === to ||
          !getNodeById(from, { includeDeleted: true }) ||
          !getNodeById(to, { includeDeleted: true })
        ) {
          if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
          return;
        }

        const key = getLineConnectionKey(from, to);
        const createdAt = normalizeTimestamp(entry.createdAt);
        const deletedAt = normalizeTimestamp(entry.deletedAt);
        if (!deletedAt) {
          if (seen.has(key)) {
            if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
            return;
          }
          seen.add(key);
        }

        lineConnections.push({
          id: resolveLineId(entry.id),
          from,
          to,
          ...(normalizeCalcOperation(entry.operation) ? { operation: normalizeCalcOperation(entry.operation) } : {}),
          ...(createdAt ? { createdAt } : {}),
          ...(deletedAt ? { deletedAt } : {})
        });
        if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
      });

      renderLineConnections();
      updateCalcVariables();
      if (reportProgress) reportProgress(1);
    }

    function removeLineConnectionsForNodes(nodes, deletedAt = Date.now()) {
      const nodeIds = new Set(
        nodes
          .filter((node) => node instanceof HTMLElement)
          .map((node) => normalizeLineEndpointId(node.dataset.nodeId || ""))
          .filter(Boolean)
      );
      if (nodeIds.size === 0) return false;

      let changed = false;
      lineConnections.forEach((line) => {
        if (line.deletedAt || (!nodeIds.has(line.from) && !nodeIds.has(line.to))) return;
        line.deletedAt = deletedAt;
        changed = true;
      });
      if (!changed) return false;
      renderLineConnections();
      updateCalcVariables();
      return true;
    }

    function softDeleteNodes(nodes, deletedAt = Date.now(), options = {}) {
      const targets = nodes.filter((node) => node instanceof HTMLElement && world.contains(node) && !isNodeDeleted(node));
      if (targets.length === 0) return false;

      removeLineConnectionsForNodes(targets, deletedAt);
      for (const node of targets) {
        if (selectedNodes.has(node)) selectedNodes.delete(node);
        if (node.classList.contains("editing")) stopEditing(node);
        destroyCommandNodeContent(node);
        unobserveNodeForLines(node);
        node.dataset.deletedAt = String(deletedAt);
        node.setAttribute("aria-hidden", "true");
        node.classList.remove("selected", "editing", "navigation-target-highlight");
      }

      refreshSelectionBounds();
      renderLineConnections();
      updateDocumentTitle();
      if (options.autosave !== false) scheduleAutosave();
      if (!options.suppressRealtime && !applyingSharedRealtimeNodeStructure) {
        publishSharedRealtimeNodeDelete(targets, deletedAt);
      }
      return true;
    }

    function deleteSelectedNodes() {
      if (selectedNodes.size === 0) return false;
      closeNodeContextMenu();
      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelNodeLayoutAnimation();
      const deleted = softDeleteNodes(Array.from(selectedNodes));
      clearSelection();
      return deleted;
    }

    function requestLineRender() {
      if (lineRenderFrame !== null) return;
      lineRenderFrame = requestAnimationFrame(() => {
        lineRenderFrame = null;
        renderLineConnections();
      });
    }

    function observeNodeForLines(node) {
      if (nodeResizeObserver && node instanceof HTMLElement) nodeResizeObserver.observe(node);
    }

    function unobserveNodeForLines(node) {
      if (nodeResizeObserver && node instanceof HTMLElement) nodeResizeObserver.unobserve(node);
    }

    function getNodeWorldCenter(node) {
      if (isFloatingNode(node)) return getNodeScreenCenter(node);
      const corners = getNodeWorldCorners(node);
      if (corners.length === 4) {
        return {
          x: (corners[0].x + corners[2].x) / 2,
          y: (corners[0].y + corners[2].y) / 2
        };
      }
      const size = getNodeWorldSize(node);
      return {
        x: Number(node.dataset.x) + size.width / 2,
        y: Number(node.dataset.y) + size.height / 2
      };
    }

    function getCameraScale() {
      return Number.isFinite(camera.scale) && camera.scale > 0 ? camera.scale : 1;
    }

    function screenToWorldLength(value) {
      return value / getCameraScale();
    }

    function getNodeRenderMetrics(node) {
      const baseFontSize = getNodeBaseFontSize(node);
      const cameraScale = getCameraScale();
      const effectiveCameraScale = isFloatingNode(node) ? 1 : cameraScale;
      const visualFontPx = baseFontSize * effectiveCameraScale;
      const layoutFontPx = clamp(visualFontPx, MIN_NODE_LAYOUT_FONT_PX, MAX_NODE_LAYOUT_FONT_PX);
      return {
        baseFontSize,
        cameraScale: effectiveCameraScale,
        visualFontPx,
        layoutFontPx,
        screenScale: visualFontPx / layoutFontPx,
        worldScale: baseFontSize / layoutFontPx
      };
    }

    function getScreenAffordanceScale(fontSize) {
      const t = clamp(
        (fontSize - ZOOM_AFFORDANCE_MIN_FONT_SCREEN_PX) /
          (ZOOM_AFFORDANCE_FULL_FONT_SCREEN_PX - ZOOM_AFFORDANCE_MIN_FONT_SCREEN_PX),
        0,
        1
      );
      return easeInOutNatural(t);
    }

    function getNodeBaseFontSize(node) {
      if (!(node instanceof HTMLElement)) return BASE_TEXT_PX / getCameraScale();
      const baseFontSize = Number(node.dataset.baseFontSize);
      return Number.isFinite(baseFontSize) && baseFontSize > 0 ? baseFontSize : BASE_TEXT_PX / getCameraScale();
    }

    function getNodeRenderedFontSize(node) {
      return getNodeBaseFontSize(node) * (isFloatingNode(node) ? 1 : getCameraScale());
    }

    function getNodeScreenAffordanceScale(node) {
      return getScreenAffordanceScale(getNodeRenderedFontSize(node));
    }

    function getTextNodeMinWidthScreenPx(fontSize) {
      return TEXT_NODE_MIN_HIT_WIDTH_SCREEN_PX * getScreenAffordanceScale(fontSize);
    }

    function getSelectedNodesAffordanceScale() {
      if (selectedNodes.size === 0) return getScreenAffordanceScale(BASE_TEXT_PX * getCameraScale());
      let scale = 0;
      for (const node of selectedNodes) {
        if (node instanceof HTMLElement && world.contains(node)) {
          scale = Math.max(scale, getNodeScreenAffordanceScale(node));
        }
      }
      return scale;
    }

    function getGroupSelectionPaddingScreenPx() {
      return GROUP_SELECTION_PADDING_PX * getSelectedNodesAffordanceScale();
    }

    function getGroupSelectionHandleScreenPx() {
      return Math.max(
        MIN_GROUP_SELECTION_HANDLE_SCREEN_PX,
        GROUP_SELECTION_HANDLE_SCREEN_PX * getSelectedNodesAffordanceScale()
      );
    }

    function getNodeAnchorPaddingWorld(node) {
      const fontSize = getNodeRenderedFontSize(node);
      const affordanceScale = getScreenAffordanceScale(fontSize);
      const naturalPadding = fontSize * LINE_ANCHOR_ELLIPSE_PADDING_FONT_RATIO;
      const padding = clamp(
        Math.max(naturalPadding, MIN_LINE_ANCHOR_ELLIPSE_PADDING_SCREEN_PX * affordanceScale),
        0,
        Math.max(naturalPadding, MAX_LINE_ANCHOR_ELLIPSE_PADDING_SCREEN_PX * affordanceScale)
      );
      return screenToWorldLength(padding);
    }

    function getLineEndpointGapWorld(node) {
      const fontSize = getNodeRenderedFontSize(node);
      const gap = Math.max(
        fontSize * 0.06,
        LINE_ENDPOINT_GAP_SCREEN_PX * getScreenAffordanceScale(fontSize)
      );
      return screenToWorldLength(gap);
    }

    function getLineWidthWorldFromScreen(widthPx) {
      return screenToWorldLength(widthPx);
    }

    function getLineShadowExtraWidthWorld(startWidth, endWidth) {
      const maxLineWidthPx = Math.max(startWidth, endWidth) * getCameraScale();
      const equivalentFontSize = maxLineWidthPx / LINE_WIDTH_FONT_RATIO;
      const extraWidthPx = Math.min(
        LINE_SHADOW_EXTRA_WIDTH_SCREEN_PX * getScreenAffordanceScale(equivalentFontSize),
        maxLineWidthPx * 1.4
      );
      return screenToWorldLength(extraWidthPx);
    }

    function getDraftDashLengthWorld() {
      return screenToWorldLength(LINE_DRAFT_DASH_LENGTH_SCREEN_PX);
    }

    function getDraftGapLengthWorld() {
      return screenToWorldLength(LINE_DRAFT_GAP_LENGTH_SCREEN_PX);
    }

    function getNodeAnchorPoint(node, towardPoint) {
      const size = getNodeWorldSize(node);
      const center = getNodeWorldCenter(node);
      let dx = towardPoint.x - center.x;
      let dy = towardPoint.y - center.y;
      let length = Math.hypot(dx, dy);
      if (length < 0.001) {
        dx = 1;
        dy = 0;
        length = 1;
      }

      const normalX = dx / length;
      const normalY = dy / length;
      const rotation = getNodeRotation(node);
      const basis = getCameraBasis(rotation);
      const localDx = dx * basis.cos + dy * basis.sin;
      const localDy = -dx * basis.sin + dy * basis.cos;
      const padding = getNodeAnchorPaddingWorld(node);
      const radiusX = Math.max(size.width / 2 + padding, 0.5);
      const radiusY = Math.max(size.height / 2 + padding, 0.5);
      const ellipseScale = 1 / Math.max(
        0.001,
        Math.sqrt((localDx * localDx) / (radiusX * radiusX) + (localDy * localDy) / (radiusY * radiusY))
      );
      const endpointGap = getLineEndpointGapWorld(node);

      return {
        x: center.x + dx * ellipseScale + normalX * endpointGap,
        y: center.y + dy * ellipseScale + normalY * endpointGap
      };
    }

    function getLineAnchorPair(sourceNode, targetNode) {
      const sourceCenter = getNodeWorldCenter(sourceNode);
      const targetCenter = getNodeWorldCenter(targetNode);
      const centerDx = targetCenter.x - sourceCenter.x;
      const centerDy = targetCenter.y - sourceCenter.y;
      const centerDistance = Math.hypot(centerDx, centerDy);
      if (centerDistance * getCameraScale() < MIN_VISIBLE_LINE_LENGTH_SCREEN_PX) return null;

      const start = getNodeAnchorPoint(sourceNode, targetCenter);
      const end = getNodeAnchorPoint(targetNode, sourceCenter);
      const projectedDistance = ((end.x - start.x) * centerDx + (end.y - start.y) * centerDy) / centerDistance;
      if (projectedDistance * getCameraScale() < MIN_VISIBLE_LINE_LENGTH_SCREEN_PX) return null;

      return {
        start,
        end
      };
    }

    function getNodeLineWidth(node) {
      const fontSize = getNodeRenderedFontSize(node);
      const naturalWidth = fontSize * LINE_WIDTH_FONT_RATIO;
      const width = Math.min(
        Math.max(naturalWidth, MIN_LINE_WIDTH_SCREEN_PX * getScreenAffordanceScale(fontSize)),
        MAX_LINE_WIDTH_SCREEN_PX
      );
      return screenToWorldLength(width);
    }

    function getStableLineSeed(value) {
      const text = String(value || "");
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function formatLineNumber(value) {
      return Number.isFinite(value) ? Number(value.toFixed(3)) : 0;
    }

    function getNaturalLineGeometry(start, end, seedValue) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 0.5) {
        return {
          start,
          control1: start,
          control2: end,
          end,
          distance
        };
      }

      const unitX = dx / distance;
      const unitY = dy / distance;
      const seed = getStableLineSeed(seedValue);
      const direction = seed % 2 === 0 ? 1 : -1;
      const variation = ((((seed >>> 4) % 17) - 8) / 8) * Math.min(1, distance * 0.004);
      const bow = Math.min(distance * 0.026, 24) * direction + variation;
      const gravity = Math.min(distance * 0.01, 12);
      const bendX = -unitY * bow;
      const bendY = unitX * bow + gravity;
      const control1 = {
        x: start.x + dx * 0.34 + bendX,
        y: start.y + dy * 0.34 + bendY
      };
      const control2 = {
        x: start.x + dx * 0.66 + bendX,
        y: start.y + dy * 0.66 + bendY
      };

      return {
        start,
        control1,
        control2,
        end,
        distance
      };
    }

    function getNaturalLineCenterPath(geometry) {
      return [
        "M", formatLineNumber(geometry.start.x), formatLineNumber(geometry.start.y),
        "C", formatLineNumber(geometry.control1.x), formatLineNumber(geometry.control1.y),
        formatLineNumber(geometry.control2.x), formatLineNumber(geometry.control2.y),
        formatLineNumber(geometry.end.x), formatLineNumber(geometry.end.y)
      ].join(" ");
    }

    function appendCalcOperationMarker(group, geometry, operation) {
      const normalized = normalizeCalcOperation(operation);
      if (!normalized) return;

      const point = getCubicPoint(geometry, 0.5);
      const marker = document.createElementNS(SVG_NS, "g");
      marker.setAttribute("class", "connection-line-operation");
      marker.setAttribute("transform", `translate(${formatLineNumber(point.x)} ${formatLineNumber(point.y)})`);

      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("r", formatLineNumber(screenToWorldLength(10)));

      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("y", formatLineNumber(screenToWorldLength(0.2)));
      label.style.fontSize = `${formatLineNumber(screenToWorldLength(13))}px`;
      label.textContent = normalized;

      marker.append(circle, label);
      group.appendChild(marker);
    }

    function getCubicPoint(geometry, t) {
      const inverse = 1 - t;
      const a = inverse * inverse * inverse;
      const b = 3 * inverse * inverse * t;
      const c = 3 * inverse * t * t;
      const d = t * t * t;
      return {
        x: geometry.start.x * a + geometry.control1.x * b + geometry.control2.x * c + geometry.end.x * d,
        y: geometry.start.y * a + geometry.control1.y * b + geometry.control2.y * c + geometry.end.y * d
      };
    }

    function getCubicTangent(geometry, t) {
      const inverse = 1 - t;
      const a = 3 * inverse * inverse;
      const b = 6 * inverse * t;
      const c = 3 * t * t;
      const tangent = {
        x:
          (geometry.control1.x - geometry.start.x) * a +
          (geometry.control2.x - geometry.control1.x) * b +
          (geometry.end.x - geometry.control2.x) * c,
        y:
          (geometry.control1.y - geometry.start.y) * a +
          (geometry.control2.y - geometry.control1.y) * b +
          (geometry.end.y - geometry.control2.y) * c
      };
      if (Math.hypot(tangent.x, tangent.y) > 0.001) return tangent;
      return {
        x: geometry.end.x - geometry.start.x,
        y: geometry.end.y - geometry.start.y
      };
    }

    function getTaperedLineShapePath(
      geometry,
      startWidth,
      endWidth,
      extraWidth = 0,
      startT = 0,
      endT = 1
    ) {
      const t0 = clamp(startT, 0, 1);
      const t1 = clamp(endT, t0, 1);
      const segmentDistance = Math.max(0.001, geometry.distance * (t1 - t0));
      const sampleDistance = segmentDistance * getCameraScale();
      const sampleCount = clamp(Math.round(sampleDistance / 28), 3, 72);
      const left = [];
      const right = [];

      for (let index = 0; index <= sampleCount; index += 1) {
        const t = t0 + (t1 - t0) * (index / sampleCount);
        const point = getCubicPoint(geometry, t);
        const tangent = getCubicTangent(geometry, t);
        const length = Math.max(0.001, Math.hypot(tangent.x, tangent.y));
        const normal = {
          x: -tangent.y / length,
          y: tangent.x / length
        };
        const eased = easeInOutNatural(t);
        const width = startWidth + (endWidth - startWidth) * eased + extraWidth;
        const cappedWidth = Math.min(width, segmentDistance * LINE_WIDTH_DISTANCE_LIMIT_RATIO);
        const halfWidth = Math.max(0.001, cappedWidth / 2);
        left.push({
          x: point.x + normal.x * halfWidth,
          y: point.y + normal.y * halfWidth
        });
        right.push({
          x: point.x - normal.x * halfWidth,
          y: point.y - normal.y * halfWidth
        });
      }

      const parts = [
        "M", formatLineNumber(left[0].x), formatLineNumber(left[0].y)
      ];
      for (let index = 1; index < left.length; index += 1) {
        parts.push("L", formatLineNumber(left[index].x), formatLineNumber(left[index].y));
      }
      for (let index = right.length - 1; index >= 0; index -= 1) {
        parts.push("L", formatLineNumber(right[index].x), formatLineNumber(right[index].y));
      }
      parts.push("Z");
      return parts.join(" ");
    }

    function appendTaperedLineShape(group, className, geometry, startWidth, endWidth, extraWidth = 0, options = {}) {
      if (options.dashed) {
        const dashLength = getDraftDashLengthWorld();
        const gapLength = getDraftGapLengthWorld();
        const cycleLength = dashLength + gapLength;
        const distance = Math.max(1, geometry.distance);
        let cursor = 0;
        while (cursor < distance) {
          const segmentStart = cursor / distance;
          const segmentEnd = Math.min(cursor + dashLength, distance) / distance;
          if (segmentEnd > segmentStart) {
            const path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("class", className);
            path.setAttribute(
              "d",
