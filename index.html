              getTaperedLineShapePath(geometry, startWidth, endWidth, extraWidth, segmentStart, segmentEnd)
            );
            group.appendChild(path);
          }
          cursor += cycleLength;
        }
        return;
      }

      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("class", className);
      path.setAttribute("d", getTaperedLineShapePath(geometry, startWidth, endWidth, extraWidth));
      group.appendChild(path);
    }

    function shouldRenderLineGeometry(geometry, startWidth, endWidth) {
      const scale = getCameraScale();
      const screenDistance = geometry.distance * scale;
      const maxScreenWidth = Math.max(startWidth, endWidth) * scale;
      return (
        screenDistance >= Math.max(MIN_VISIBLE_LINE_LENGTH_SCREEN_PX, maxScreenWidth * 0.9) &&
        maxScreenWidth >= MIN_VISIBLE_LINE_WIDTH_SCREEN_PX
      );
    }

    function getLineHitStrokeScreenPx(sourceNode, targetNode) {
      const affordanceScale = Math.min(
        getNodeScreenAffordanceScale(sourceNode),
        getNodeScreenAffordanceScale(targetNode)
      );
      return clamp(LINE_HIT_STROKE_SCREEN_PX * affordanceScale, 1, LINE_HIT_STROKE_SCREEN_PX);
    }

    function appendConnectionPath(geometry, options = {}) {
      const group = document.createElementNS(SVG_NS, "g");
      group.setAttribute("class", options.draft ? "connection-line-draft" : "connection-line-persisted");
      if (options.id) group.dataset.lineId = options.id;
      const startWidth = Number.isFinite(options.startWidth)
        ? options.startWidth
        : getLineWidthWorldFromScreen(MIN_LINE_WIDTH_SCREEN_PX);
      const endWidth = Number.isFinite(options.endWidth) ? options.endWidth : startWidth;
      if (!shouldRenderLineGeometry(geometry, startWidth, endWidth)) return false;

      appendTaperedLineShape(
        group,
        "connection-line connection-line-shadow",
        geometry,
        startWidth,
        endWidth,
        getLineShadowExtraWidthWorld(startWidth, endWidth),
        { dashed: options.draft }
      );
      appendTaperedLineShape(
        group,
        "connection-line connection-line-stroke",
        geometry,
        startWidth,
        endWidth,
        0,
        { dashed: options.draft }
      );
      appendCalcOperationMarker(group, geometry, options.operation);
      lineRenderRoot.appendChild(group);

      if (options.id) {
        const hitPath = document.createElementNS(SVG_NS, "path");
        hitPath.setAttribute("class", "connection-line-hit");
        hitPath.setAttribute("d", getNaturalLineCenterPath(geometry));
        hitPath.dataset.lineId = options.id;
        if (Number.isFinite(options.hitStrokeWidth)) {
          hitPath.style.strokeWidth = `${options.hitStrokeWidth}px`;
        }
        lineRenderRoot.appendChild(hitPath);
      }
      return true;
    }

    function getLineRenderCullRect() {
      return getViewportCullRect(LINE_RENDER_CULL_PADDING_SCREEN_PX);
    }

    function getCachedNodeScreenCullBounds(node) {
      if (!(node instanceof HTMLElement)) return null;
      const worldX = Number(node.dataset.x);
      const worldY = Number(node.dataset.y);
      const worldWidth = Number(node.dataset.renderCullWorldWidth);
      const worldHeight = Number(node.dataset.renderCullWorldHeight);
      if (
        !Number.isFinite(worldX) ||
        !Number.isFinite(worldY) ||
        !Number.isFinite(worldWidth) ||
        !Number.isFinite(worldHeight) ||
        worldWidth <= 0 ||
        worldHeight <= 0
      ) return null;

      const point = worldToScreen(worldX, worldY);
      const radius = Math.hypot(worldWidth, worldHeight) * getCameraScale();
      return {
        left: point.x - radius,
        top: point.y - radius,
        right: point.x + radius,
        bottom: point.y + radius
      };
    }

    function screenBoundsIntersectRect(bounds, rect) {
      return (
        bounds.right >= rect.left &&
        bounds.left <= rect.right &&
        bounds.bottom >= rect.top &&
        bounds.top <= rect.bottom
      );
    }

    function shouldRenderLineInCullRect(sourceNode, targetNode, cullRect) {
      if (
        selectedNodes.has(sourceNode) ||
        selectedNodes.has(targetNode) ||
        sourceNode.classList.contains("editing") ||
        targetNode.classList.contains("editing") ||
        sourceNode.classList.contains("navigation-target-highlight") ||
        targetNode.classList.contains("navigation-target-highlight")
      ) return true;

      const sourceBounds = getCachedNodeScreenCullBounds(sourceNode);
      const targetBounds = getCachedNodeScreenCullBounds(targetNode);
      if (!sourceBounds || !targetBounds) return true;

      const lineBounds = {
        left: Math.min(sourceBounds.left, targetBounds.left),
        top: Math.min(sourceBounds.top, targetBounds.top),
        right: Math.max(sourceBounds.right, targetBounds.right),
        bottom: Math.max(sourceBounds.bottom, targetBounds.bottom)
      };
      return screenBoundsIntersectRect(lineBounds, cullRect);
    }

    function renderLineConnections() {
      if (!lineLayer) return;
      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      const scale = getCameraScale();
      const rotation = getCameraRotation();
      const basis = getCameraBasis(rotation);
      const cullRect = getLineRenderCullRect();
      lineLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
      lineLayer.setAttribute("width", String(width));
      lineLayer.setAttribute("height", String(height));
      lineLayer.style.transform = "";
      lineLayer.replaceChildren();
      lineRenderRoot = document.createElementNS(SVG_NS, "g");
      lineRenderRoot.setAttribute(
        "transform",
        `matrix(${formatLineNumber(scale * basis.cos)} ${formatLineNumber(scale * basis.sin)} ${formatLineNumber(-scale * basis.sin)} ${formatLineNumber(scale * basis.cos)} ${formatLineNumber(camera.x)} ${formatLineNumber(camera.y)})`
      );
      lineLayer.appendChild(lineRenderRoot);

      for (const line of lineConnections) {
        if (line.deletedAt) continue;
        const sourceNode = getNodeById(line.from);
        const targetNode = getNodeById(line.to);
        if (!sourceNode || !targetNode) continue;
        if (isFloatingNode(sourceNode) || isFloatingNode(targetNode)) continue;
        if (!shouldRenderLineInCullRect(sourceNode, targetNode, cullRect)) continue;
        const points = getLineAnchorPair(sourceNode, targetNode);
        if (!points) continue;
        appendConnectionPath(getNaturalLineGeometry(points.start, points.end, line.id), {
          id: line.id,
          operation: line.operation,
          startWidth: getNodeLineWidth(sourceNode),
          endWidth: getNodeLineWidth(targetNode),
          hitStrokeWidth: getLineHitStrokeScreenPx(sourceNode, targetNode)
        });
      }

      if (!lineDraft || !world.contains(lineDraft.sourceNode) || isFloatingNode(lineDraft.sourceNode)) return;
      const start = getNodeAnchorPoint(lineDraft.sourceNode, {
        x: lineDraft.displayX,
        y: lineDraft.displayY
      });
      const end = {
        x: lineDraft.displayX,
        y: lineDraft.displayY
      };
      const draftWidth = getNodeLineWidth(lineDraft.sourceNode);
      appendConnectionPath(getNaturalLineGeometry(start, end, `draft:${lineDraft.sourceId}`), {
        draft: true,
        startWidth: draftWidth,
        endWidth: lineDraft.displayEndWidth
      });
    }

    function requestLineDraftAnimation() {
      if (lineDraftAnimationFrame !== null) return;
      lineDraftAnimationFrame = requestAnimationFrame(updateLineDraftAnimation);
    }

    function updateLineDraftAnimation() {
      lineDraftAnimationFrame = null;
      if (!lineDraft) return;
      if (!world.contains(lineDraft.sourceNode)) {
        cancelLineDraft();
        return;
      }

      lineDraft.velocityX = (lineDraft.velocityX + (lineDraft.cursorX - lineDraft.displayX) * LINE_DRAFT_SPRING) * LINE_DRAFT_DAMPING;
      lineDraft.velocityY = (lineDraft.velocityY + (lineDraft.cursorY - lineDraft.displayY) * LINE_DRAFT_SPRING) * LINE_DRAFT_DAMPING;
      lineDraft.displayX += lineDraft.velocityX;
      lineDraft.displayY += lineDraft.velocityY;

      if (
        Math.abs(lineDraft.cursorX - lineDraft.displayX) < 0.02 &&
        Math.abs(lineDraft.cursorY - lineDraft.displayY) < 0.02 &&
        Math.abs(lineDraft.velocityX) < 0.02 &&
        Math.abs(lineDraft.velocityY) < 0.02
      ) {
        lineDraft.displayX = lineDraft.cursorX;
        lineDraft.displayY = lineDraft.cursorY;
        lineDraft.velocityX = 0;
        lineDraft.velocityY = 0;
      }

      lineDraft.baseEndWidth = getNodeLineWidth(lineDraft.sourceNode) * LINE_DRAFT_END_WIDTH_RATIO;
      lineDraft.targetEndWidth =
        lineDraft.hoverNode && world.contains(lineDraft.hoverNode)
          ? getNodeLineWidth(lineDraft.hoverNode)
          : lineDraft.baseEndWidth;
      lineDraft.displayEndWidth += (lineDraft.targetEndWidth - lineDraft.displayEndWidth) * LINE_DRAFT_THICKNESS_EASE;
      if (Math.abs(lineDraft.targetEndWidth - lineDraft.displayEndWidth) < 0.002) {
        lineDraft.displayEndWidth = lineDraft.targetEndWidth;
      }

      renderLineConnections();
      requestLineDraftAnimation();
    }

    function beginLineDraft(sourceNode, clientX, clientY) {
      if (!(sourceNode instanceof HTMLElement) || !world.contains(sourceNode)) return;
      if (isNodeDeleted(sourceNode)) return;
      cancelLineDraft();
      closeLinkNodeDialog();

      const center = getNodeWorldCenter(sourceNode);
      const startPoint = Number.isFinite(clientX) && Number.isFinite(clientY)
        ? screenToWorld(clientX, clientY)
        : center;
      const startWidth = getNodeLineWidth(sourceNode);
      lineDraft = {
        sourceNode,
        sourceId: normalizeLineEndpointId(sourceNode.dataset.nodeId || ""),
        cursorX: startPoint.x,
        cursorY: startPoint.y,
        displayX: startPoint.x,
        displayY: startPoint.y,
        velocityX: 0,
        velocityY: 0,
        hoverNode: null,
        baseEndWidth: startWidth * LINE_DRAFT_END_WIDTH_RATIO,
        displayEndWidth: startWidth * LINE_DRAFT_END_WIDTH_RATIO,
        targetEndWidth: startWidth * LINE_DRAFT_END_WIDTH_RATIO
      };
      viewport.classList.add("line-drafting");
      renderLineConnections();
      requestLineDraftAnimation();
    }

    function cancelLineDraft() {
      if (lineDraftAnimationFrame !== null) {
        cancelAnimationFrame(lineDraftAnimationFrame);
        lineDraftAnimationFrame = null;
      }
      if (!lineDraft) return;
      lineDraft = null;
      viewport.classList.remove("line-drafting");
      renderLineConnections();
    }

    function getLineDraftHoverNode(clientX, clientY) {
      if (!lineDraft) return null;
      const point = screenToWorld(clientX, clientY);
      let bestNode = null;
      let bestScore = Infinity;

      for (const node of world.children) {
        if (!(node instanceof HTMLElement) || node === lineDraft.sourceNode || isNodeDeleted(node)) continue;
        const center = getNodeWorldCenter(node);
        const size = getNodeWorldSize(node);
        const padding = getNodeAnchorPaddingWorld(node);
        const radiusX = Math.max(size.width / 2 + padding, 0.5);
        const radiusY = Math.max(size.height / 2 + padding, 0.5);
        const dx = point.x - center.x;
        const dy = point.y - center.y;
        const rotation = getNodeRotation(node);
        const basis = getCameraBasis(rotation);
        const localDx = dx * basis.cos + dy * basis.sin;
        const localDy = -dx * basis.sin + dy * basis.cos;
        const score = (localDx * localDx) / (radiusX * radiusX) + (localDy * localDy) / (radiusY * radiusY);
        if (score <= 1 && score < bestScore) {
          bestScore = score;
          bestNode = node;
        }
      }

      return bestNode;
    }

    function updateLineDraftPointer(event) {
      if (!lineDraft) return;
      const point = screenToWorld(event.clientX, event.clientY);
      lineDraft.cursorX = point.x;
      lineDraft.cursorY = point.y;
      lineDraft.hoverNode = getLineDraftHoverNode(event.clientX, event.clientY);
      lineDraft.baseEndWidth = getNodeLineWidth(lineDraft.sourceNode) * LINE_DRAFT_END_WIDTH_RATIO;
      lineDraft.targetEndWidth = lineDraft.hoverNode
        ? getNodeLineWidth(lineDraft.hoverNode)
        : lineDraft.baseEndWidth;
    }

    function completeLineDraft(targetNode) {
      const sourceNode = lineDraft ? lineDraft.sourceNode : null;
      if (!sourceNode || targetNode === sourceNode) return false;
      return createLineConnection(sourceNode, targetNode);
    }

    function getSelectedNodeLayoutItems() {
      return Array.from(selectedNodes)
        .filter((node) => node instanceof HTMLElement && world.contains(node))
        .map((node, index) => {
          const x = Number(node.dataset.x);
          const y = Number(node.dataset.y);
          const size = getNodeWorldSize(node);
          return { node, index, x, y, width: size.width, height: size.height };
        })
        .filter((item) =>
          Number.isFinite(item.x) &&
          Number.isFinite(item.y) &&
          Number.isFinite(item.width) &&
          Number.isFinite(item.height)
        );
    }

    function getColumnAlignmentTargets(items) {
      if (items.length < 2) return [];

      const cameraBasis = getCameraBasis();
      const projected = items
        .map((item) => {
          const corners = getNodeWorldCorners(item.node);
          if (corners.length !== 4) return null;
          const axes = corners.map((point) => ({
            x: point.x * cameraBasis.cos - point.y * cameraBasis.sin,
            y: point.x * cameraBasis.sin + point.y * cameraBasis.cos
          }));
          const xs = axes.map((point) => point.x);
          const ys = axes.map((point) => point.y);
          const left = Math.min(...xs);
          const top = Math.min(...ys);
          const bottom = Math.max(...ys);
          return {
            ...item,
            visualLeft: left,
            visualTop: top,
            visualBottom: bottom,
            visualHeight: Math.max(0.001, bottom - top)
          };
        })
        .filter(Boolean);

      if (projected.length < 2) return [];

      const ordered = projected.slice().sort((a, b) =>
        a.visualTop - b.visualTop ||
        a.visualLeft - b.visualLeft ||
        a.index - b.index
      );
      const left = Math.min(...projected.map((item) => item.visualLeft));
      const top = Math.min(...projected.map((item) => item.visualTop));
      const bottom = Math.max(...projected.map((item) => item.visualBottom));
      const totalHeight = ordered.reduce((sum, item) => sum + item.visualHeight, 0);
      const gap = Math.max(0, (bottom - top - totalHeight) / (ordered.length - 1));
      let nextTop = top;

      return ordered.map((item) => {
        const visualDx = left - item.visualLeft;
        const visualDy = nextTop - item.visualTop;
        const target = {
          node: item.node,
          x: item.x + visualDx * cameraBasis.cos + visualDy * cameraBasis.sin,
          y: item.y - visualDx * cameraBasis.sin + visualDy * cameraBasis.cos
        };
        nextTop += item.visualHeight + gap;
        return target;
      });
    }

    function animateNodePositions(targets, durationMs = ALIGN_ANIMATION_DURATION_MS) {
      cancelNodeLayoutAnimation();

      const snapshots = targets
        .filter((target) => target.node instanceof HTMLElement && world.contains(target.node))
        .map((target) => ({
          node: target.node,
          startX: Number(target.node.dataset.x),
          startY: Number(target.node.dataset.y),
          targetX: target.x,
          targetY: target.y
        }))
        .filter((snapshot) =>
          Number.isFinite(snapshot.startX) &&
          Number.isFinite(snapshot.startY) &&
          Number.isFinite(snapshot.targetX) &&
          Number.isFinite(snapshot.targetY)
        );

      if (snapshots.length === 0) return false;

      const hasMovement = snapshots.some((snapshot) =>
        Math.abs(snapshot.targetX - snapshot.startX) > 0.001 ||
        Math.abs(snapshot.targetY - snapshot.startY) > 0.001
      );
      if (!hasMovement) return false;

      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / durationMs);
        const eased = easeInOutNatural(t);

        for (const snapshot of snapshots) {
          if (!world.contains(snapshot.node)) continue;
          setNodePosition(
            snapshot.node,
            snapshot.startX + (snapshot.targetX - snapshot.startX) * eased,
            snapshot.startY + (snapshot.targetY - snapshot.startY) * eased,
            { skipSelectionUpdate: true }
          );
        }
        refreshSelectionBounds();

        if (t < 1) {
          nodeLayoutAnimationFrame = requestAnimationFrame(tick);
          return;
        }

        for (const snapshot of snapshots) {
          if (!world.contains(snapshot.node)) continue;
          setNodePosition(snapshot.node, snapshot.targetX, snapshot.targetY, { skipSelectionUpdate: true });
        }
        nodeLayoutAnimationFrame = null;
        refreshSelectionBounds();
        scheduleAutosave();
      }

      nodeLayoutAnimationFrame = requestAnimationFrame(tick);
      return true;
    }

    function getQuickResizeFontSize(level) {
      return BASE_TEXT_PX / Math.pow(QUICK_RESIZE_STEP_FACTOR, level - QUICK_RESIZE_MIN_LEVEL);
    }

    function animateNodesToBaseFontSize(nodes, targetFontSize, durationMs = QUICK_RESIZE_ANIMATION_DURATION_MS) {
      if (!Number.isFinite(targetFontSize) || targetFontSize <= 0) return false;
      cancelNodeLayoutAnimation();
      const snapshots = Array.from(nodes)
        .filter((node) => node instanceof HTMLElement && world.contains(node) && !isNodeDeleted(node))
        .map((node) => ({
          node,
          startFontSize: getNodeBaseFontSize(node)
        }));

      if (snapshots.length === 0) return false;

      const hasChange = snapshots.some((snapshot) =>
        Math.abs(snapshot.startFontSize - targetFontSize) > 0.000001
      );
      if (!hasChange) return true;

      const start = performance.now();

      function tick(now) {
        const t = Math.min(1, (now - start) / durationMs);
        const eased = easeInOutNatural(t);

        for (const snapshot of snapshots) {
          if (!world.contains(snapshot.node)) continue;
          const fontSize = snapshot.startFontSize +
            (targetFontSize - snapshot.startFontSize) * eased;
          snapshot.node.dataset.baseFontSize = String(fontSize);
          renderNode(snapshot.node);
        }
        requestLineRender();
        refreshSelectionBounds();

        if (t < 1) {
          nodeLayoutAnimationFrame = requestAnimationFrame(tick);
          return;
        }

        for (const snapshot of snapshots) {
          if (!world.contains(snapshot.node)) continue;
          snapshot.node.dataset.baseFontSize = String(targetFontSize);
          renderNode(snapshot.node);
        }
        nodeLayoutAnimationFrame = null;
        requestLineRender();
        refreshSelectionBounds();
        scheduleAutosave();
      }

      nodeLayoutAnimationFrame = requestAnimationFrame(tick);
      return true;
    }

    function animateSelectedNodesToSizeLevel(level, durationMs = QUICK_RESIZE_ANIMATION_DURATION_MS) {
      if (!Number.isInteger(level) || level < QUICK_RESIZE_MIN_LEVEL || level > QUICK_RESIZE_MAX_LEVEL) {
        return false;
      }

      return animateNodesToBaseFontSize(selectedNodes, getQuickResizeFontSize(level), durationMs);
    }

    function measureNodeRenderedSizePx(node, fontSizePx) {
      const probe = node.cloneNode(true);
      probe.classList.remove("selected", "navigation-target-highlight", "editing");
      probe.contentEditable = "false";

      // Measure in a hidden probe with node floors disabled for stable fitting math.
      probe.style.position = "fixed";
      probe.style.left = "-100000px";
      probe.style.top = "-100000px";
      probe.style.visibility = "hidden";
      probe.style.pointerEvents = "none";
      probe.style.minWidth = "0";
      probe.style.minHeight = "0";
      probe.style.width = "max-content";
      probe.style.maxWidth = "none";
      probe.style.fontSize = `${Math.max(0.001, fontSizePx)}px`;
      probe.style.transform = "none";
      probe.style.transformOrigin = "top left";

      document.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();

      return {
        width: Math.max(0.001, rect.width),
        height: Math.max(0.001, rect.height)
      };
    }

    function solveNodeFitScale(node, guideWidthPx) {
      if (isHtmlViewNode(node)) {
        const size = getNodeWorldSize(node);
        return Math.max(MIN_NAVIGATION_SCALE, guideWidthPx / Math.max(0.001, size.width));
      }
      const baseFontSizeRaw = Number(node.dataset.baseFontSize);
      const baseFontSize = Number.isFinite(baseFontSizeRaw) && baseFontSizeRaw > 0
        ? baseFontSizeRaw
        : BASE_TEXT_PX;

      const rect = node.getBoundingClientRect();
      const startWidth = Math.max(0.001, rect.width);
      let scale = Math.max(MIN_NAVIGATION_SCALE, camera.scale * (guideWidthPx / startWidth));

      // Converges rapidly even when tiny-font glyph rasterization is non-linear.
      for (let i = 0; i < 6; i += 1) {
        const measured = measureNodeRenderedSizePx(node, baseFontSize * scale);
        const ratio = guideWidthPx / Math.max(0.001, measured.width);
        scale = Math.max(MIN_NAVIGATION_SCALE, scale * ratio);
        if (Math.abs(1 - ratio) < 0.0015) break;
      }

      return scale;
    }

    function getNavigationGuideBounds() {
      const viewWidth = Math.max(1, viewport.clientWidth);
      const viewHeight = Math.max(1, viewport.clientHeight);
      const guideWidth = Math.max(1, viewWidth * NAVIGATION_VIEWPORT_FILL);
      const left = (viewWidth - guideWidth) / 2;
      return {
        left,
        right: left + guideWidth,
        width: guideWidth,
        centerY: viewHeight / 2
      };
    }

    function placeFitMarker(marker, x, y, visible = true) {
      if (!marker) return;
      marker.hidden = !visible;
      if (!visible) return;
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
    }

    function renderNavigationFitMarkers() {
      if (!navigationFitMarkersVisible) {
        placeFitMarker(fitGuideLeft, 0, 0, false);
        placeFitMarker(fitGuideRight, 0, 0, false);
        placeFitMarker(fitTargetLeft, 0, 0, false);
        placeFitMarker(fitTargetRight, 0, 0, false);
        return;
      }

      const guide = getNavigationGuideBounds();
      placeFitMarker(fitGuideLeft, guide.left, guide.centerY, true);
      placeFitMarker(fitGuideRight, guide.right, guide.centerY, true);

      if (!navigationFitTargetNode || !world.contains(navigationFitTargetNode)) {
        placeFitMarker(fitTargetLeft, 0, 0, false);
        placeFitMarker(fitTargetRight, 0, 0, false);
        return;
      }

      const rect = navigationFitTargetNode.getBoundingClientRect();
      const centerY = rect.top + rect.height / 2;
      placeFitMarker(fitTargetLeft, rect.left, centerY, true);
      placeFitMarker(fitTargetRight, rect.right, centerY, true);
    }

    function getNavigationDuration(targetX, targetY, targetScale) {
      const dx = targetX - camera.x;
      const dy = targetY - camera.y;
      const panDistance = Math.hypot(dx, dy);
      const viewportDiagonal = Math.max(1, Math.hypot(viewport.clientWidth, viewport.clientHeight));
      const panFactor = clamp(panDistance / viewportDiagonal, 0, 2);
      const scaleFactor = clamp(Math.abs(Math.log(targetScale / camera.scale)), 0, 2);
      const duration = 620 + panFactor * 200 + scaleFactor * 220;
      return clamp(duration, 620, 1300);
    }

    function highlightNavigationTarget(node, durationMs = 5000) {
      const previousTimeout = nodeHighlightTimeouts.get(node);
      if (previousTimeout) clearTimeout(previousTimeout);
      node.classList.remove("navigation-target-highlight");
      void node.offsetWidth;
      node.classList.add("navigation-target-highlight");
      const timeoutId = setTimeout(() => {
        node.classList.remove("navigation-target-highlight");
        nodeHighlightTimeouts.delete(node);
      }, durationMs);
      nodeHighlightTimeouts.set(node, timeoutId);
    }

    function animateCameraTo(targetX, targetY, targetScale, durationMs = 760, onComplete = null) {
      cancelCameraAnimation();
      const startX = camera.x;
      const startY = camera.y;
      const startScale = camera.scale;
      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / durationMs);
        const eased = easeInOutHeavy(t);
        camera.x = startX + (targetX - startX) * eased;
        camera.y = startY + (targetY - startY) * eased;
        camera.scale = startScale + (targetScale - startScale) * eased;
        render();
        if (t < 1) {
          cameraAnimationFrame = requestAnimationFrame(tick);
        } else {
          cameraAnimationFrame = null;
          scheduleViewportSave();
          if (typeof onComplete === "function") onComplete();
        }
      }

      cameraAnimationFrame = requestAnimationFrame(tick);
    }

    function focusNodeFullScreen(node) {
      const guide = getNavigationGuideBounds();
      const targetScale = solveNodeFitScale(node, guide.width);
      navigationFitTargetNode = node;

      const rect = node.getBoundingClientRect();
      const baseFontSizeRaw = Number(node.dataset.baseFontSize);
      const baseFontSize = Number.isFinite(baseFontSizeRaw) && baseFontSizeRaw > 0
        ? baseFontSizeRaw
        : BASE_TEXT_PX;
      const nodeXRaw = Number(node.dataset.x);
      const nodeYRaw = Number(node.dataset.y);
      const fallbackPoint = screenToWorld(rect.left, rect.top);
      const nodeX = Number.isFinite(nodeXRaw) ? nodeXRaw : fallbackPoint.x;
      const nodeY = Number.isFinite(nodeYRaw) ? nodeYRaw : fallbackPoint.y;
      const finalMeasured = isHtmlViewNode(node)
        ? {
            width: getNodeWorldSize(node).width * targetScale,
            height: getNodeWorldSize(node).height * targetScale
          }
        : measureNodeRenderedSizePx(node, baseFontSize * targetScale);
      const targetOffset = getCameraScreenOffset(nodeX, nodeY, targetScale, camera.rotation);
      const targetX = guide.left - targetOffset.x;
      const targetY = guide.centerY - targetOffset.y - finalMeasured.height / 2;
      const duration = getNavigationDuration(targetX, targetY, targetScale);

      // highlightNavigationTarget(node);
      animateCameraTo(targetX, targetY, targetScale, duration);
    }

    function getPageContentBounds() {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      for (const node of world.children) {
        if (!(node instanceof HTMLElement) || isNodeDeleted(node)) continue;
        const bounds = getNodeWorldBounds(node);
        if (!bounds) continue;
        minX = Math.min(minX, bounds.minX);
        minY = Math.min(minY, bounds.minY);
        maxX = Math.max(maxX, bounds.maxX);
        maxY = Math.max(maxY, bounds.maxY);
      }

      if (!Number.isFinite(minX) || !Number.isFinite(minY) || !Number.isFinite(maxX) || !Number.isFinite(maxY)) {
        return null;
      }

      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
    }

    function focusPageContentFullScreen() {
      const bounds = getPageContentBounds();
      if (!bounds) return false;

      const viewWidth = Math.max(1, viewport.clientWidth);
      const viewHeight = Math.max(1, viewport.clientHeight);
      const targetScale = Math.max(
        0.0001,
        Math.min(
          (viewWidth * NAVIGATION_VIEWPORT_FILL) / bounds.width,
          (viewHeight * NAVIGATION_VIEWPORT_FILL) / bounds.height
        )
      );
      const centerX = bounds.minX + bounds.width / 2;
      const centerY = bounds.minY + bounds.height / 2;
      const targetOffset = getCameraScreenOffset(centerX, centerY, targetScale, camera.rotation);
      const targetX = viewWidth / 2 - targetOffset.x;
      const targetY = viewHeight / 2 - targetOffset.y;
      const duration = getNavigationDuration(targetX, targetY, targetScale);

      navigationFitTargetNode = null;
      animateCameraTo(targetX, targetY, targetScale, duration);
      return true;
    }

    function linkSelectionToTarget(node, selectionRange, targetNodeId) {
      if (!selectionRange) {
        throw new Error("Select a word first.");
      }
      if (!node.contains(selectionRange.startContainer) || !node.contains(selectionRange.endContainer)) {
        throw new Error("Selection must stay inside one node.");
      }

      const text = selectionRange.toString();
      if (!text.trim()) {
        throw new Error("Selection is empty.");
      }

      const link = document.createElement("span");
      link.className = "internal-link";
      link.dataset.targetId = targetNodeId;
      link.textContent = text;

      selectionRange.deleteContents();
      selectionRange.insertNode(link);
    }

    function setCaretToEnd(node) {
      if (!node || !node.isContentEditable) return;
      const selection = window.getSelection();
      if (!selection) return;

      const range = document.createRange();
      range.selectNodeContents(node);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function trimExternalUrlMatch(rawUrl) {
      let href = rawUrl;
      let trailing = "";

      while (/[.,!?;:]$/.test(href)) {
        trailing = href.slice(-1) + trailing;
        href = href.slice(0, -1);
      }

      if (href.endsWith(")") && !href.includes("(")) {
        trailing = ")" + trailing;
        href = href.slice(0, -1);
      }

      return { href, trailing };
    }

    function autoLinkExternalUrls(node, options = {}) {
      if (!node || isCommandNode(node)) return false;
      const { force = false, moveCaretToEnd = false } = options;
      const nodeText = getPlainTextSource(node).trim();
      const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {
        acceptNode(textNode) {
          const parent = textNode.parentElement;
          if (!parent) return NodeFilter.FILTER_REJECT;
          if (parent.closest(".external-link-card, .external-link-plain, .internal-link")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const textNodes = [];
      let textNode = walker.nextNode();
      while (textNode) {
        textNodes.push(textNode);
        textNode = walker.nextNode();
      }

      let changed = false;
      const urlPattern = /https?:\/\/[^\s<>"']+/gi;

      for (const currentTextNode of textNodes) {
        const text = currentTextNode.textContent || "";
        let lastIndex = 0;
        urlPattern.lastIndex = 0;
        let match = urlPattern.exec(text);
        const fragment = document.createDocumentFragment();
        let textNodeChanged = false;

        while (match) {
          const rawUrl = match[0];
          const start = match.index;
          const end = start + rawUrl.length;
          const isStillBeingTyped = !force && end === text.length;
          const { href, trailing } = trimExternalUrlMatch(rawUrl);
          const normalizedHref = normalizeExternalHref(href);

          if (start > lastIndex) {
            fragment.appendChild(document.createTextNode(text.slice(lastIndex, start)));
          }

          if (normalizedHref && !isStillBeingTyped) {
            const isOnlyLinkInNode = nodeText === href;
            const link = isOnlyLinkInNode
              ? createExternalLinkCard(normalizedHref)
              : createExternalLinkPlain(normalizedHref, href);
            if (link) {
              fragment.appendChild(link);
              if (trailing) fragment.appendChild(document.createTextNode(trailing));
              textNodeChanged = true;
            } else {
              fragment.appendChild(document.createTextNode(rawUrl));
            }
          } else {
            fragment.appendChild(document.createTextNode(rawUrl));
          }

          lastIndex = end;
          match = urlPattern.exec(text);
        }

        if (!textNodeChanged) continue;
        if (lastIndex < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
        currentTextNode.replaceWith(fragment);
        changed = true;
      }

      if (changed) {
        if (moveCaretToEnd) setCaretToEnd(node);
        refreshSelectionBounds();
        scheduleAutosave();
      }

      return changed;
    }

    function createExternalLinkPlain(href, text = href) {
      const normalizedHref = normalizeExternalHref(href);
      if (!normalizedHref) return null;
      const span = document.createElement("span");
      span.className = "external-link-plain";
      span.dataset.href = normalizedHref;
      span.textContent = text;
      return span;
    }

    function getExternalLinkCardFromTarget(node, target) {
      if (!(target instanceof Element)) return null;
      const card = target.closest(".external-link-card");
      if (!card || !node.contains(card)) return null;
      return card;
    }

    function flattenExternalLinkCard(card) {
      const href = normalizeExternalHref(card.dataset.href || "");
      if (!href) return;
      const link = createExternalLinkPlain(href);
      if (link) card.replaceWith(link);
    }

    function saveExternalLinkCardEdit(card) {
      const hrefInput = card.querySelector('[data-external-link-field="href"]');
      const labelInput = card.querySelector('[data-external-link-field="label"]');
      const nextHref = normalizeExternalHref(hrefInput ? hrefInput.value : "");
      if (!nextHref) {
        if (hrefInput) hrefInput.focus();
        return;
      }

      card.dataset.href = nextHref;
      card.dataset.label = labelInput ? labelInput.value.trim() : "";
      renderExternalLinkCard(card);
    }

    function isExternalLinkControlTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest("button, input, textarea, select"));
    }

    function isExternalLinkLabelTarget(card, target) {
      if (!(target instanceof Element)) return false;
      const label = target.closest(".external-link-label");
      return Boolean(label && card.contains(label));
    }

    function attachExternalLinkCardPointerHandlers(card) {
      card.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || isExternalLinkControlTarget(event.target)) return;

        const node = card.closest(".text-node");
        if (!(node instanceof HTMLElement) || !world.contains(node)) return;

        closeNodeContextMenu();
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        const pointer = screenToWorld(event.clientX, event.clientY);
        externalLinkCardPointer = {
          pointerId: event.pointerId,
          card,
          node,
          startClientX: event.clientX,
          startClientY: event.clientY,
          dragOffsetX: Number(node.dataset.x) - pointer.x,
          dragOffsetY: Number(node.dataset.y) - pointer.y,
          href: isExternalLinkLabelTarget(card, event.target) ? normalizeExternalHref(card.dataset.href || "") : "",
          moved: false
        };
        card.setPointerCapture(event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      });

      card.addEventListener("pointermove", (event) => {
        const session = externalLinkCardPointer;
        if (!session || session.card !== card || session.pointerId !== event.pointerId) return;

        if (!session.moved && Math.hypot(event.clientX - session.startClientX, event.clientY - session.startClientY) >= MARQUEE_DRAG_THRESHOLD_PX) {
          session.moved = true;
        }

        const pointer = screenToWorld(event.clientX, event.clientY);
        setNodePosition(session.node, pointer.x + session.dragOffsetX, pointer.y + session.dragOffsetY);
        event.preventDefault();
        event.stopPropagation();
      });

      function endExternalLinkCardPointer(event) {
        const session = externalLinkCardPointer;
        if (!session || session.card !== card || session.pointerId !== event.pointerId) return;

        if (card.hasPointerCapture(session.pointerId)) {
          card.releasePointerCapture(session.pointerId);
        }

        externalLinkCardPointer = null;
        if (event.type === "pointerup" && session.href && !session.moved) {
          openExternalHref(session.href);
          card.dataset.suppressNextVisit = "true";
        } else if (session.moved) {
          card.dataset.suppressNextVisit = "true";
        }
        scheduleAutosave();
        event.preventDefault();
        event.stopPropagation();
      }

      card.addEventListener("pointerup", endExternalLinkCardPointer);
      card.addEventListener("pointercancel", endExternalLinkCardPointer);
    }

    function handleExternalLinkAction(node, event) {
      const card = getExternalLinkCardFromTarget(node, event.target);
      if (!card) return false;

      const actionTarget = event.target instanceof Element
        ? event.target.closest("[data-external-link-action]")
        : null;
      if (!actionTarget || !card.contains(actionTarget)) return false;

      const action = actionTarget.dataset.externalLinkAction;
      event.preventDefault();
      event.stopPropagation();

      if (action === "open") {
        const href = normalizeExternalHref(card.dataset.href || "");
        openExternalHref(href);
      }

      if (action === "edit") {
        renderExternalLinkCard(card, { editing: true });
        const labelInput = card.querySelector('[data-external-link-field="label"]');
        if (labelInput) labelInput.focus();
      }

      if (action === "flatten") {
        flattenExternalLinkCard(card);
        refreshSelectionBounds();
      }

      if (action === "save") {
        saveExternalLinkCardEdit(card);
        refreshSelectionBounds();
      }

      if (action === "cancel") {
        renderExternalLinkCard(card);
      }

      scheduleAutosave();
      return true;
    }

    function handleExternalLinkVisit(node, event) {
      const card = getExternalLinkCardFromTarget(node, event.target);
      if (!card) {
        if (node.classList.contains("editing") || !(event.target instanceof Element)) return false;
        const plainLink = event.target.closest(".external-link-plain");
        if (!plainLink || !node.contains(plainLink)) return false;
        const href = normalizeExternalHref(plainLink.dataset.href || plainLink.textContent || "");
        if (!href) return false;
        event.preventDefault();
        event.stopPropagation();
        openExternalHref(href);
        return true;
      }

      if (event.target instanceof Element && event.target.closest("button, input, textarea, select")) {
        return false;
      }

      if (card.dataset.suppressNextVisit === "true") {
        delete card.dataset.suppressNextVisit;
        event.preventDefault();
        event.stopPropagation();
        return true;
      }

      if (!isExternalLinkLabelTarget(card, event.target)) return false;

      const href = normalizeExternalHref(card.dataset.href || "");
      if (!href) return false;

      event.preventDefault();
      event.stopPropagation();
      openExternalHref(href);
      return true;
    }

    function openExternalHref(href) {
      const normalizedHref = normalizeExternalHref(href);
      if (!normalizedHref) return;
      window.open(normalizedHref, "_blank", "noopener,noreferrer");
    }

    function handleExternalLinkKeydown(node, event) {
      const card = getExternalLinkCardFromTarget(node, event.target);
      if (!card) return false;

      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        saveExternalLinkCardEdit(card);
        refreshSelectionBounds();
        scheduleAutosave();
        return true;
      }

      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        renderExternalLinkCard(card);
        scheduleAutosave();
        return true;
      }

      event.stopPropagation();
      return true;
    }

    function isEditableTarget(target) {
      if (!(target instanceof HTMLElement)) return false;
      if (target.isContentEditable) return true;
      const tag = target.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    }

    function isNativeTextInteractionTarget(target) {
      const element = target instanceof Element
        ? target
        : target instanceof Node
          ? target.parentElement
          : null;
      if (!element) return false;
      if (element.closest("input, textarea")) return true;
      const editingNode = element.closest(".text-node.editing");
      if (!editingNode || !world.contains(editingNode)) return false;
      return !element.closest("button, select, .external-link-card, [contenteditable=\"false\"]");
    }

    function shouldUseGlobalHistoryShortcut(target) {
      if (!(target instanceof HTMLElement)) return true;
      const tag = target.tagName;
      return tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT";
    }

    function getHistoryShortcutAction(event) {
      const hasPrimaryModifier = event.metaKey || event.ctrlKey;
      if (!hasPrimaryModifier || event.altKey) return "";

      const key = event.key.toLowerCase();
      const isZ = key === "z" || event.code === "KeyZ";
      const isY = key === "y" || event.code === "KeyY";
      if (isZ && !event.shiftKey) return "undo";
      if ((isY && !event.shiftKey) || (isZ && event.shiftKey)) return "redo";
      return "";
    }

    function isCommandNode(node) {
      return node instanceof HTMLElement && node.dataset.kind === "command";
    }

    function isExternalLinkCard(element) {
      return element instanceof HTMLElement && element.classList.contains("external-link-card");
    }

    function isWidgetColorable(element) {
      return isCommandNode(element) || isExternalLinkCard(element);
    }

    function eventTargetExternalLinkCard(target, node) {
      if (!(target instanceof Element)) return null;
      const card = target.closest(".external-link-card");
      if (!isExternalLinkCard(card) || !node.contains(card)) return null;
      return card;
    }

    function isCommandInteractiveTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest("button, input, textarea, select, [data-command-interactive]"));
    }

    function getRegisteredCommands() {
      const commands = Array.isArray(window.SkydiveCommands) ? window.SkydiveCommands : [];
      const loadedCommandIds = new Set(commands.map((command) => command && command.id).filter(Boolean));
      const lazyCommands = Array.from(LAZY_STATIC_COMMANDS.values())
        .filter((command) => !loadedCommandIds.has(command.id));
      const templateCommands = globalTemplates.map((template) => ({
        id: template.id,
        title: template.name || "Template",
        description: template.description || DEFAULT_TEMPLATE_DESCRIPTION,
        kind: "template",
        template
      }));
      return commands.concat(lazyCommands, templateCommands);
    }

    function getCommand(commandId) {
      return getRegisteredCommands().find((command) => command && command.id === commandId) || null;
    }

    function getLoadedStaticCommand(commandId) {
      const commands = Array.isArray(window.SkydiveCommands) ? window.SkydiveCommands : [];
      return commands.find((command) => command && command.id === commandId) || null;
    }

    function loadLazyCommand(commandId) {
      const lazyCommand = LAZY_STATIC_COMMANDS.get(commandId);
      if (!lazyCommand || !lazyCommand.script) return Promise.resolve(null);
      if (getLoadedStaticCommand(commandId)) return Promise.resolve(getLoadedStaticCommand(commandId));
      if (lazyCommandLoads.has(commandId)) return lazyCommandLoads.get(commandId);

      const loadPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = lazyCommand.script;
        script.async = true;
        script.onload = () => resolve(getLoadedStaticCommand(commandId));
        script.onerror = () => reject(new Error(`Could not load /${commandId}.`));
        document.head.appendChild(script);
      }).finally(() => {
        lazyCommandLoads.delete(commandId);
      });

      lazyCommandLoads.set(commandId, loadPromise);
      return loadPromise;
    }

    function getStaticCommandIds() {
      const commands = Array.isArray(window.SkydiveCommands) ? window.SkydiveCommands : [];
      return new Set(commands.concat(Array.from(LAZY_STATIC_COMMANDS.values())).flatMap((command) => [
        command && command.id,
        ...(Array.isArray(command && command.aliases) ? command.aliases : [])
      ]).map((value) => String(value || "").toLowerCase()).filter(Boolean));
    }

    function normalizeTemplateCommandId(value) {
      return String(value || "")
        .normalize("NFKC")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9_-]/g, "")
        .replace(/[-_]{2,}/g, "-")
        .replace(/^[-_]+|[-_]+$/g, "");
    }

    function getTemplateNameProblem(name) {
      const id = normalizeTemplateCommandId(name);
      if (!id) return "Give it a short name first.";
      if (!TEMPLATE_COMMAND_ID_PATTERN.test(id)) return "Try a shorter command-style name.";
      if (getStaticCommandIds().has(id)) return `/${id} is already a command.`;
      if (globalTemplates.some((template) => template.id === id)) return `/${id} is already one of your templates.`;
      return "";
    }

    function cloneCommandState(state) {
      if (!state || typeof state !== "object") return {};
      try {
        return JSON.parse(JSON.stringify(state));
      } catch (error) {
        return {};
      }
    }

    function readCommandState(node) {
      try {
        const parsed = JSON.parse(node.dataset.commandState || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function writeCommandState(node, state) {
      node.dataset.commandState = JSON.stringify(cloneCommandState(state));
    }

    function normalizeWidgetColor(value) {
      const color = typeof value === "string" ? value.trim().toLowerCase() : "";
      if (LEGACY_WIDGET_COLOR_ALIASES.has(color)) return LEGACY_WIDGET_COLOR_ALIASES.get(color);
      return WIDGET_COLORS.has(color) ? color : "";
    }

    function adjustWidgetColorLightness(color, delta, alpha = 1) {
      const match = /^#([\da-f]{2})([\da-f]{2})([\da-f]{2})([\da-f]{2})?$/i.exec(color);
      if (!match) return color;

      const red = parseInt(match[1], 16) / 255;
      const green = parseInt(match[2], 16) / 255;
      const blue = parseInt(match[3], 16) / 255;
      const sourceAlpha = match[4] ? parseInt(match[4], 16) / 255 : 1;
      const max = Math.max(red, green, blue);
      const min = Math.min(red, green, blue);
      const lightness = (max + min) / 2;
      const chroma = max - min;
      let hue = 0;
      let saturation = 0;

      if (chroma > 0) {
        saturation = chroma / (1 - Math.abs(2 * lightness - 1));
        if (max === red) hue = ((green - blue) / chroma) % 6;
        else if (max === green) hue = (blue - red) / chroma + 2;
        else hue = (red - green) / chroma + 4;
        hue = (hue * 60 + 360) % 360;
      }

      const effectiveAlpha = clamp(sourceAlpha * alpha, 0, 1);
      const alphaSuffix = effectiveAlpha < 1 ? ` / ${Math.round(effectiveAlpha * 100)}%` : "";
      return `hsl(${hue.toFixed(1)} ${Math.round(saturation * 100)}% ${clamp(lightness * 100 + delta, 0, 100).toFixed(1)}%${alphaSuffix})`;
    }

    function getWidgetFloatShadowColor(color) {
      const normalized = normalizeWidgetColor(color) || DEFAULT_WIDGET_COLOR;
      if (WIDGET_FLOAT_SHADOW_COLORS.has(normalized)) {
        return WIDGET_FLOAT_SHADOW_COLORS.get(normalized);
      }
      return adjustWidgetColorLightness(normalized, 5, 0.92);
    }

    function getWidgetColor(node) {
      if (isCommandNode(node)) {
        return normalizeWidgetColor(readCommandState(node)[WIDGET_COLOR_STATE_KEY]) || DEFAULT_WIDGET_COLOR;
      }
      if (isExternalLinkCard(node)) {
        return normalizeWidgetColor(node.dataset.widgetColor || "") || DEFAULT_WIDGET_COLOR;
      }
      return DEFAULT_WIDGET_COLOR;
    }

    function applyWidgetColor(node) {
      if (!isWidgetColorable(node)) return;
      const color = getWidgetColor(node);
      if (isCommandNode(node) || color !== DEFAULT_WIDGET_COLOR) node.dataset.widgetColor = color;
      else delete node.dataset.widgetColor;
      node.style.setProperty("--widget-color", color);
      node.style.setProperty("--widget-button-color", adjustWidgetColorLightness(color, -9, 0.44));
      node.style.setProperty("--widget-button-hover-color", adjustWidgetColorLightness(color, -6, 0.44));
      node.style.setProperty("--widget-border-color", adjustWidgetColorLightness(color, -16));
      node.style.setProperty("--widget-field-color", adjustWidgetColorLightness(color, 4));
      node.style.setProperty("--widget-field-border-color", adjustWidgetColorLightness(color, -14));
      node.style.setProperty("--widget-float-shadow-color", getWidgetFloatShadowColor(color));
    }

    function preserveWidgetColor(node, nextState) {
      const state = cloneCommandState(nextState);
      const color = getWidgetColor(node);
      if (color !== DEFAULT_WIDGET_COLOR) state[WIDGET_COLOR_STATE_KEY] = color;
      else delete state[WIDGET_COLOR_STATE_KEY];
      return state;
    }

    function updateWidgetColorPicker(node) {
      const selectedColor = getWidgetColor(node);
      for (const swatch of widgetColorPicker.querySelectorAll(".widget-color-swatch")) {
        const swatchColor = normalizeWidgetColor(swatch.dataset.widgetColor || "");
        swatch.setAttribute("aria-checked", swatchColor === selectedColor ? "true" : "false");
      }
    }

    function updateCalcOperationPicker(lineId) {
      const line = lineConnections.find((entry) => entry.id === lineId && !entry.deletedAt);
      const selectedOperation = normalizeCalcOperation(line && line.operation);
      for (const button of calcOperationPicker.querySelectorAll(".calc-operation-btn")) {
        const operation = normalizeCalcOperation(button.dataset.calcOperation || "");
        button.setAttribute("aria-pressed", operation && operation === selectedOperation ? "true" : "false");
      }
    }

    function setWidgetColor(node, value) {
      if (!isWidgetColorable(node)) return;
      const color = normalizeWidgetColor(value) || DEFAULT_WIDGET_COLOR;
      if (isCommandNode(node)) {
        const state = readCommandState(node);
        if (color !== DEFAULT_WIDGET_COLOR) state[WIDGET_COLOR_STATE_KEY] = color;
        else delete state[WIDGET_COLOR_STATE_KEY];
        writeCommandState(node, state);
      } else if (color !== DEFAULT_WIDGET_COLOR) {
        node.dataset.widgetColor = color;
      } else {
        delete node.dataset.widgetColor;
      }
      applyWidgetColor(node);
      scheduleAutosave();
    }

    function destroyCommandNodeContent(node) {
      if (!isCommandNode(node)) return;
      const command = getCommand(node.dataset.commandId || "");
      if (command && typeof command.destroy === "function") {
        command.destroy(node);
      }
    }

    function getSourceTimelineSlug() {
      return DELOREAN_SPACE_INFO.active ? DELOREAN_SPACE_INFO.originalSlug : SHARED_SPACE_SLUG;
    }

    function getDeloreanDateSlug(targetAt) {
      return new Date(targetAt).toISOString().replace(/\./g, "-").replace(/:/g, "-");
    }

    function getDeloreanSpaceSlug(sourceSlug, targetAt) {
      return [
        DELOREAN_SPACE_PREFIX,
        sourceSlug,
        getDeloreanDateSlug(targetAt)
      ].filter(Boolean).join("/");
    }

    function getSpacePathFromSlug(slug) {
      return `/${String(slug || "").split("/").map(encodeURIComponent).join("/")}`;
    }

    function getMarkPathWithNotice(message) {
      return `/mark?notice=${encodeURIComponent(message)}`;
    }

    function getMarkFindPathForTag(tag) {
      const normalizedTag = String(tag || "").trim();
      if (!normalizedTag) return "/mark";
      const params = new URLSearchParams({ q: `/find ${normalizedTag}` });
      if (SHARED_SPACE_SLUG) params.set("space", SHARED_SPACE_SLUG);
      return `/mark?${params.toString()}`;
    }

    function getAbsoluteSpaceUrl(slug) {
      return new URL(getSpacePathFromSlug(slug), window.location.origin).href;
    }

    async function loadSharedSpaceState(slug) {
      const data = await requestSharedSpace({ slug });
      return data && data.state ? data.state : { version: 1, nodes: [], lines: [] };
    }

    async function saveSharedSpaceState(slug, state) {
      const data = await requestSharedSpace({
        slug,
        method: "PUT",
        body: JSON.stringify({ state })
      });
      return data;
    }

    function stripTimelineFields(item) {
      const copy = cloneJson(item, {});
      delete copy.deletedAt;
      return copy;
    }

    function getDeloreanStateAt(sourceState, sourceSlug, targetAt) {
      const state = sourceState && typeof sourceState === "object" ? sourceState : {};
      const nodes = Array.isArray(state.nodes) ? state.nodes : [];
      const lines = Array.isArray(state.lines) ? state.lines : [];
      const includedNodeIds = new Set();
      const nextNodes = [];

      nodes.forEach((node) => {
        if (!isItemLiveAt(node, targetAt)) return;
        if (node.kind === "command" && node.commandId === DELOREAN_COMMAND_ID) return;
        const copy = stripTimelineFields(node);
        if (!copy.id) return;
        includedNodeIds.add(copy.id);
        nextNodes.push(copy);
      });

      const nextLines = lines
        .filter((line) => isItemLiveAt(line, targetAt))
        .filter((line) => includedNodeIds.has(line.from) && includedNodeIds.has(line.to))
        .map(stripTimelineFields);

      return {
        version: Number.isFinite(Number(state.version)) ? Number(state.version) : 1,
        meta: {
          delorean: {
            originalSlug: sourceSlug,
            targetAt,
            createdAt: Date.now(),
            modifiedAt: null
          }
        },
        nodes: nextNodes,
        lines: nextLines
      };
    }

    async function createDeloreanSpace(durationMs) {
      const sourceSlug = getSourceTimelineSlug();
      if (!sourceSlug) {
        throw new Error("Delorean needs a named shared space first.");
      }

      const duration = Number(durationMs);
      if (!Number.isFinite(duration) || duration < 0) {
        throw new Error("Choose a valid time to travel back to.");
      }

      const targetAt = Date.now() - duration;
      const sourceState = DELOREAN_SPACE_INFO.active
        ? await loadSharedSpaceState(sourceSlug)
        : serializeState();
      const targetState = getDeloreanStateAt(sourceState, sourceSlug, targetAt);
      const targetSlug = getDeloreanSpaceSlug(sourceSlug, targetAt);
      await saveSharedSpaceState(targetSlug, targetState);

      return {
        sourceSlug,
        targetAt,
        targetSlug,
        targetUrl: getAbsoluteSpaceUrl(targetSlug)
      };
    }

    function getCommandRenderContext(node) {
      return {
        nodeId: node && node.dataset ? node.dataset.nodeId || "" : "",
        nodeCreatedBy: node ? getNodeCreator(node) : null,
        currentUser,
        currentSpaceSlug: SHARED_SPACE_SLUG,
        delorean: cloneJson(DELOREAN_SPACE_INFO, {}),
        createDeloreanSpace,
        uploadFile: uploadFileToCloudinary,
        createUploadedFileState,
        openSpace(slug) {
          window.location.assign(getSpacePathFromSlug(slug));
        }
      };
    }

    function renderCommandNodeContent(node) {
      const commandId = node.dataset.commandId || "";
      const command = getLoadedStaticCommand(commandId) || getCommand(commandId);
      destroyCommandNodeContent(node);
      node.replaceChildren();
      if (!command || typeof command.render !== "function") {
        const lazyCommand = LAZY_STATIC_COMMANDS.get(commandId);
        if (lazyCommand) {
          const loading = document.createElement("div");
          loading.textContent = "Loading command";
          loading.style.padding = "0.55em 0.7em";
          loading.style.border = "1px solid #e2d7c7";
          loading.style.borderRadius = "0.5em";
          loading.style.background = "#fffaf3";
          loading.style.color = "#7b6a58";
          node.appendChild(loading);
          applyWidgetColor(node);
          loadLazyCommand(commandId)
            .then((loadedCommand) => {
              if (!loadedCommand || !world.contains(node) || isNodeDeleted(node)) return;
              renderCommandNodeContent(node);
              refreshSelectionBounds();
              updateDocumentTitle();
            })
            .catch((error) => {
              console.error(error);
              if (!world.contains(node) || isNodeDeleted(node)) return;
              node.replaceChildren();
              const failed = document.createElement("div");
              failed.textContent = "Could not load command";
              failed.style.padding = "0.55em 0.7em";
              failed.style.border = "1px solid #e2d7c7";
              failed.style.borderRadius = "0.5em";
              failed.style.background = "#fffaf3";
              failed.style.color = "#7b6a58";
              node.appendChild(failed);
              applyWidgetColor(node);
            });
          return;
        }

        const missing = document.createElement("div");
        missing.textContent = "Missing command";
        missing.style.padding = "0.55em 0.7em";
        missing.style.border = "1px solid #e2d7c7";
        missing.style.borderRadius = "0.5em";
        missing.style.background = "#fffaf3";
        missing.style.color = "#7b6a58";
        node.appendChild(missing);
        applyWidgetColor(node);
        return;
      }

      const state = readCommandState(node);
      command.render(node, state, (nextState) => {
        writeCommandState(node, preserveWidgetColor(node, nextState));
        renderCommandNodeContent(node);
        refreshSelectionBounds();
        updateDocumentTitle();
        scheduleAutosave();
      }, getCommandRenderContext(node));
      applyWidgetColor(node);
    }

    function updateCommandNodeState(node, nextState, options = {}) {
      if (!isCommandNode(node) || !world.contains(node)) return;
      writeCommandState(node, preserveWidgetColor(node, nextState));
      renderCommandNodeContent(node);
      refreshSelectionBounds();
      updateDocumentTitle();
      if (options.autosave !== false) scheduleAutosave();
    }

    function serializeNode(node) {
      const base = {
        id: node.dataset.nodeId || "",
        x: Number(node.dataset.x),
        y: Number(node.dataset.y),
        baseFontSize: Number(node.dataset.baseFontSize)
      };
      const rotation = getNodeRotation(node);
      if (Math.abs(rotation) >= 0.000001) base.rotation = rotation;
      if (isFloatingNode(node)) base.floating = true;
      const createdAt = normalizeTimestamp(node.dataset.createdAt);
      const deletedAt = normalizeTimestamp(node.dataset.deletedAt);
      if (createdAt) base.createdAt = createdAt;
      if (deletedAt) base.deletedAt = deletedAt;
      const createdBy = getNodeCreator(node);
      if (createdBy) base.createdBy = createdBy;

      if (isCommandNode(node)) {
        return {
          ...base,
          kind: "command",
          commandId: node.dataset.commandId || "",
          ...(node.dataset.commandVersion ? { commandVersion: node.dataset.commandVersion } : {}),
          commandState: readCommandState(node)
        };
      }

      return {
        ...base,
        kind: "text",
        ...(isCalcVariableNode(node) ? { variable: true } : {}),
        ...(isMarkdownViewNode(node) ? { viewMode: "markdown" } : {}),
        ...(isHtmlViewNode(node) ? { viewMode: "html" } : {}),
        ...(!isMarkdownViewNode(node) && !isHtmlViewNode(node) ? { html: sanitizeNodeHtml(node.innerHTML) } : {}),
        text: getSerializableTextSource(node)
      };
    }

    function getCaretTextOffset(root, range) {
      const before = range.cloneRange();
      before.selectNodeContents(root);
      before.setEnd(range.endContainer, range.endOffset);
      return before.toString().length;
    }

    function getTextPositionAtOffset(root, offset) {
      const targetOffset = Math.max(0, offset);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let remaining = targetOffset;
      let textNode = walker.nextNode();

      while (textNode) {
        const length = textNode.textContent.length;
        if (remaining <= length) {
          return { node: textNode, offset: remaining };
        }
        remaining -= length;
        textNode = walker.nextNode();
      }

      return { node: root, offset: root.childNodes.length };
    }

    function getCaretRangeFromPoint(clientX, clientY) {
      if (document.caretPositionFromPoint) {
        const position = document.caretPositionFromPoint(clientX, clientY);
        if (position) {
          const range = document.createRange();
          range.setStart(position.offsetNode, position.offset);
          range.collapse(true);
          return range;
        }
      }

      if (document.caretRangeFromPoint) {
        const range = document.caretRangeFromPoint(clientX, clientY);
        if (range) return range;
      }

      return null;
    }

    function getRenderedTextOffset(root, range) {
      if (!(root instanceof Node) || !(range instanceof Range)) return 0;
      let offset = 0;
      let found = false;

      function countNode(nodePart) {
        if (found) return;
        if (nodePart === range.endContainer) {
          if (nodePart.nodeType === Node.TEXT_NODE) {
            offset += clamp(range.endOffset, 0, (nodePart.textContent || "").length);
          } else {
            for (let index = 0; index < range.endOffset; index += 1) {
              countWholeNode(nodePart.childNodes[index]);
            }
          }
          found = true;
          return;
        }

        if (nodePart.nodeType === Node.TEXT_NODE) {
          offset += (nodePart.textContent || "").length;
          return;
        }

        if (nodePart.nodeType !== Node.ELEMENT_NODE) return;
        if (nodePart.tagName === "BR") {
          offset += 1;
          return;
        }

        for (const child of nodePart.childNodes) countNode(child);
      }

      function countWholeNode(nodePart) {
        if (!nodePart) return;
        if (nodePart.nodeType === Node.TEXT_NODE) {
          offset += (nodePart.textContent || "").length;
          return;
        }
        if (nodePart.nodeType !== Node.ELEMENT_NODE) return;
        if (nodePart.tagName === "BR") {
          offset += 1;
          return;
        }
        for (const child of nodePart.childNodes) countWholeNode(child);
      }

      countNode(root);
      return offset;
    }

    function placeCaretInTextNode(node, offset) {
      if (!(node instanceof HTMLElement)) return;
      const position = getTextPositionAtOffset(node, offset);
      const range = document.createRange();
      range.setStart(position.node, position.offset);
      range.collapse(true);
      const selection = window.getSelection();
      if (!selection) return;
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function getSlashQueryForNode(node) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      if (!range.collapsed || !node.contains(range.endContainer)) return null;

      const caretOffset = getCaretTextOffset(node, range);
      const textBeforeCaret = (node.textContent || "").slice(0, caretOffset);
      const match = /(^|\s)\/([a-z0-9_-]*)(?:\s+([\s\S]*))?$/i.exec(textBeforeCaret);
      if (!match) return null;
      if (match[3] !== undefined && !match[2]) return null;

      return {
        query: match[2].toLowerCase(),
        args: typeof match[3] === "string" ? match[3].trim() : "",
        hasArgs: match[3] !== undefined,
        tokenStart: match.index + match[1].length,
        tokenEnd: caretOffset,
        range
      };
    }

    function getMatchingCommands(query) {
      const normalized = (query || "").toLowerCase();
      return getRegisteredCommands().filter((command) => {
        if (!command || !command.id) return false;
        const fields = [
          command.id,
          command.title,
          command.description,
          ...(Array.isArray(command.aliases) ? command.aliases : [])
        ].filter(Boolean).map((value) => String(value).toLowerCase());
        return fields.some((field) => field.includes(normalized));
      });
    }

    function closeSlashCommandMenu() {
      slashCommandSession = null;
      slashCommandSelectedIndex = 0;
      slashCommandMenu.hidden = true;
      slashCommandMenu.replaceChildren();
    }

    function positionSlashCommandMenu(range, fallbackNode) {
      const rect = range.getBoundingClientRect();
      const fallbackRect = fallbackNode.getBoundingClientRect();
      const x = rect.left || fallbackRect.left;
      const y = (rect.bottom || fallbackRect.bottom) + 8;
      const menuRect = slashCommandMenu.getBoundingClientRect();
      slashCommandMenu.style.left = `${clamp(x, 8, Math.max(8, window.innerWidth - menuRect.width - 8))}px`;
      slashCommandMenu.style.top = `${clamp(y, 8, Math.max(8, window.innerHeight - menuRect.height - 8))}px`;
    }

    function renderSlashCommandMenu() {
      if (!slashCommandSession) return;
      const { node, commands, range } = slashCommandSession;
      slashCommandMenu.replaceChildren();
      slashCommandSelectedIndex = clamp(slashCommandSelectedIndex, 0, Math.max(0, commands.length - 1));

      commands.forEach((command, index) => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = "slash-command-option";
        option.setAttribute("aria-selected", index === slashCommandSelectedIndex ? "true" : "false");
        const name = document.createElement("span");
        name.className = "slash-command-name";
        name.textContent = `/${command.id} ${command.title || ""}`;
        const hint = document.createElement("span");
        hint.className = "slash-command-hint";
        hint.textContent = command.description || "";
        option.append(name, hint);
        option.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          executeSlashCommand(index);
        });
        slashCommandMenu.appendChild(option);
      });

      slashCommandMenu.hidden = false;
      positionSlashCommandMenu(range, node);
    }

    function updateSlashMenuForNode(node) {
      if (isCommandNode(node) || !node.classList.contains("editing")) {
        closeSlashCommandMenu();
        return;
      }

      const query = getSlashQueryForNode(node);
      if (!query) {
        closeSlashCommandMenu();
        return;
      }

      const commands = getMatchingCommands(query.query).filter((command) => {
        return !query.hasArgs || Boolean(command.acceptsArgs);
      });
      if (commands.length === 0) {
        closeSlashCommandMenu();
        return;
      }

      slashCommandSession = { node, commands, ...query };
      slashCommandSelectedIndex = 0;
      renderSlashCommandMenu();
    }

    function removeSlashToken(node, session) {
      const start = getTextPositionAtOffset(node, session.tokenStart);
      const end = getTextPositionAtOffset(node, session.tokenEnd);
      const range = document.createRange();
      range.setStart(start.node, start.offset);
      range.setEnd(end.node, end.offset);
      range.deleteContents();
      range.collapse(true);
      const selection = window.getSelection();
      if (selection) {
        selection.removeAllRanges();
        selection.addRange(range);
      }
      normalizeNodeMarkup(node);
    }

    function insertTextAtCaretInNode(node, text) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return false;
      const range = selection.getRangeAt(0);
      if (!node.contains(range.startContainer)) return false;
      range.deleteContents();
      range.insertNode(document.createTextNode(text));
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
      normalizeNodeMarkup(node);
      return true;
    }

    function getTemplateReferenceBaseFontSize(payload, entries) {
      const payloadBaseFontSize = Number(payload && payload.baseFontSize);
      if (Number.isFinite(payloadBaseFontSize) && payloadBaseFontSize > 0) return payloadBaseFontSize;

      const sizes = entries
        .map((entry) => Number(entry && entry.baseFontSize))
        .filter((value) => Number.isFinite(value) && value > 0);
      if (sizes.length === 0) return BASE_TEXT_PX / camera.scale;
      return sizes.reduce((total, value) => total + value, 0) / sizes.length;
    }

    function createNodesFromTemplate(template, worldX, worldY, baseFontSize) {
      const payload = template && template.payload && typeof template.payload === "object" ? template.payload : {};
      const entries = Array.isArray(payload.nodes) ? payload.nodes : [];
      const lines = Array.isArray(payload.lines) ? payload.lines : [];
      const targetBaseFontSize = Number.isFinite(Number(baseFontSize)) && Number(baseFontSize) > 0
        ? Number(baseFontSize)
        : BASE_TEXT_PX / camera.scale;
      const referenceBaseFontSize = getTemplateReferenceBaseFontSize(payload, entries);
      const templateScale = targetBaseFontSize / referenceBaseFontSize;
      const idMap = new Map();
      const createdNodes = [];

      entries.forEach((entry) => {
        if (!entry || typeof entry !== "object") return;
        const x = worldX + Number(entry.x || 0) * templateScale;
        const y = worldY + Number(entry.y || 0) * templateScale;
        const nodeBaseFontSize = Number.isFinite(Number(entry.baseFontSize)) && Number(entry.baseFontSize) > 0
          ? Number(entry.baseFontSize) * templateScale
          : targetBaseFontSize;
        const options = {
          rotation: Number.isFinite(Number(entry.rotation)) ? Number(entry.rotation) : 0,
          variable: entry.variable === true,
          viewMode: entry.viewMode === "markdown" ? "markdown" : ""
        };
        const node = entry.kind === "command"
          ? createCommandNode(
            x,
            y,
            String(entry.commandId || ""),
            cloneJson(entry.commandState, {}),
            nodeBaseFontSize,
            "",
            String(entry.commandVersion || ""),
            options
          )
          : createTextNode(
            x,
            y,
            typeof entry.text === "string" ? entry.text : "",
            nodeBaseFontSize,
            "",
            typeof entry.html === "string" ? entry.html : null,
            options
          );
        if (node) {
          idMap.set(String(entry.id || ""), node.dataset.nodeId || "");
          createdNodes.push(node);
        }
      });

      lines.forEach((line) => {
        if (!line || typeof line !== "object") return;
        const from = idMap.get(String(line.from || ""));
        const to = idMap.get(String(line.to || ""));
        if (!from || !to || from === to || hasLineConnection(from, to)) return;
        const operation = normalizeCalcOperation(line.operation);
        lineConnections.push({
          id: generateLineId(),
          from,
          to,
          createdAt: Date.now(),
          ...(operation ? { operation } : {})
        });
      });

      renderLineConnections();
      updateCalcVariables();
      return createdNodes;
    }

    function executeSlashCommand(index = slashCommandSelectedIndex) {
      const session = slashCommandSession;
      if (!session) return;
      const command = session.commands[index];
      if (!command) return;

      const sourceNode = session.node;
      const size = getNodeWorldSize(sourceNode);
      const sourceX = Number(sourceNode.dataset.x);
      const sourceY = Number(sourceNode.dataset.y);
      removeSlashToken(sourceNode, session);

      if (command.kind === "template") {
        const insertX = sourceX;
        const insertY = (sourceNode.textContent || "").trim()
          ? sourceY + size.height + 12 / camera.scale
          : sourceY;
        const wasSuppressingAutosave = suppressAutosave;
        suppressAutosave = true;
        let createdNodes = [];
        try {
          createdNodes = createNodesFromTemplate(
            command.template,
            insertX,
            insertY,
            Number(sourceNode.dataset.baseFontSize)
          );
          if (!(sourceNode.textContent || "").trim()) {
            softDeleteNodes([sourceNode]);
          } else {
            sourceNode.blur();
          }
        } finally {
          suppressAutosave = wasSuppressingAutosave;
        }
        closeSlashCommandMenu();
        setSelectedNodes(createdNodes);
        updateDocumentTitle();
        scheduleAutosave();
        return;
      }

      if (command.output === "text" && typeof command.createText === "function") {
        insertTextAtCaretInNode(sourceNode, command.createText({ args: session.args || "", query: session.query || "" }));
        sourceNode.focus();
        closeSlashCommandMenu();
        scheduleAutosave();
        return;
      }

      const state = typeof command.createState === "function"
        ? command.createState({ args: session.args || "", query: session.query || "" })
        : {};
      const commandNode = createCommandNode(
        sourceX,
        sourceY + size.height + 12 / camera.scale,
        command.id,
        state,
        Number(sourceNode.dataset.baseFontSize)
      );
      if (command.id === AUDIO_WIDGET_COMMAND_ID) {
        const recordButton = commandNode.querySelector('[data-action="record"]');
        if (recordButton instanceof HTMLButtonElement && !recordButton.disabled) {
          recordButton.click();
        }
      }

      if (!(sourceNode.textContent || "").trim()) {
        softDeleteNodes([sourceNode]);
        setNodePosition(commandNode, sourceX, sourceY);
      } else {
        sourceNode.blur();
      }

      closeSlashCommandMenu();
      clearSelection();
      scheduleAutosave();
    }

    function getActiveEditingNode() {
      for (const node of world.children) {
        if (node instanceof HTMLElement && node.classList.contains("editing")) {
          return node;
        }
      }
      return null;
    }

    function deactivateEditingNodeOnOutsidePointerDown(target) {
      const editingNode = getActiveEditingNode();
      if (!editingNode) return;
      if (target instanceof Node && editingNode.contains(target)) return;
      if (target instanceof Node && slashCommandMenu.contains(target)) return;
      editingNode.blur();
    }

    function getScreenRectBetweenPoints(startX, startY, endX, endY) {
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const right = Math.max(startX, endX);
      const bottom = Math.max(startY, endY);
      return {
        left,
        top,
        right,
        bottom,
        width: right - left,
        height: bottom - top
      };
    }

    function renderMarqueeRect(rect) {
      marqueeSelection.hidden = false;
      marqueeSelection.style.left = `${rect.left}px`;
      marqueeSelection.style.top = `${rect.top}px`;
      marqueeSelection.style.width = `${rect.width}px`;
      marqueeSelection.style.height = `${rect.height}px`;
    }

    function hideMarqueeRect() {
      marqueeSelection.hidden = true;
    }

    function setSelectionHandleMode(mode) {
      selectionHandleMode = mode === "rotate" ? "rotate" : "resize";
      groupSelectionBox.dataset.mode = selectionHandleMode;
    }

    function toggleSelectionHandleMode() {
      if (Date.now() < suppressSelectionModeToggleUntil) return;
      setSelectionHandleMode(selectionHandleMode === "resize" ? "rotate" : "resize");
    }

    function getNodesIntersectingScreenRect(rect) {
      const matches = [];
      for (const node of world.children) {
        if (!(node instanceof HTMLElement)) continue;
        if (isNodeDeleted(node)) continue;
        const nodeRect = node.getBoundingClientRect();
        const intersects =
          nodeRect.right >= rect.left &&
          nodeRect.left <= rect.right &&
          nodeRect.bottom >= rect.top &&
          nodeRect.top <= rect.bottom;
        if (intersects) matches.push(node);
      }
      return matches;
    }

    function applySelectionNodeClasses() {
      for (const node of world.children) {
        if (!(node instanceof HTMLElement)) continue;
        if (isNodeDeleted(node)) continue;
        node.classList.toggle("selected", selectedNodes.has(node));
      }
    }

    function getSelectionOverlayRotationForNodes(nodes) {
      if (nodes.size === 1) {
        const [node] = nodes;
        return isFloatingNode(node) ? getNodeTotalRotation(node) : getNodeRotation(node);
      }
      return 0;
    }

    function renderGroupSelectionBox() {
      if (selectedNodes.size === 0 || !selectionBoundsWorld) {
        groupSelectionBox.hidden = true;
        return;
      }

      const padding = getGroupSelectionPaddingScreenPx();
      const handleSize = getGroupSelectionHandleScreenPx();
      const handleOffset = -(handleSize / 2 + 1);
      const scale = selectionBoundsSpace === "screen" ? 1 : getCameraScale();
      const center = selectionLocalToWorld(getBoundsCenter(selectionBoundsWorld));
      const screenCenter = selectionBoundsSpace === "screen" ? center : worldToScreen(center.x, center.y);
      const width = selectionBoundsWorld.width * scale + padding * 2;
      const height = selectionBoundsWorld.height * scale + padding * 2;
      const left = screenCenter.x - width * 0.5;
      const top = screenCenter.y - height * 0.5;

      groupSelectionBox.hidden = false;
      groupSelectionBox.style.left = `${left}px`;
      groupSelectionBox.style.top = `${top}px`;
      groupSelectionBox.style.width = `${width}px`;
      groupSelectionBox.style.height = `${height}px`;
      const rotation = selectionBoundsSpace === "screen"
        ? selectionOverlayRotation
        : normalizeRotation(getCameraRotation() + selectionOverlayRotation);
      groupSelectionBox.style.transform = `rotate(${rotation}rad)`;
      groupSelectionBox.style.transformOrigin = "50% 50%";
      groupSelectionBox.dataset.mode = selectionHandleMode;

      for (const handle of groupSelectionHandles) {
        handle.style.width = "";
        handle.style.height = "";
