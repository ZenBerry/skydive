<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Skydive</title>
  <script src="/assets/disable-native-zoom.js"></script>
  <script src="https://unpkg.com/@zenberry/quico@latest/dist/quico.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap");

    @font-face {
      font-family: "Myriad Pro";
      src: url("https://res.cloudinary.com/zenberry/raw/upload/v1752586755/fonts/myriadpro_light.woff2") format("woff2");
      font-display: swap;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      background: #fff;
      cursor: default;
      opacity: 0;
      transition: opacity 520ms cubic-bezier(0.2, 0, 0, 1);
    }

    body.app-ready #viewport {
      opacity: 1;
    }

    #viewport.panning,
    #viewport.panning .text-node,
    #viewport.panning .external-link-card,
    #viewport.panning #group-selection-box,
    #viewport.panning .group-selection-handle {
      cursor: grabbing;
    }

    #viewport.line-drafting,
    #viewport.line-drafting .text-node,
    #viewport.line-drafting .external-link-card {
      cursor: crosshair;
    }

    #line-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      background: #fff;
      pointer-events: none;
    }

    .connection-line {
      stroke: none;
      shape-rendering: geometricPrecision;
    }

    .connection-line-shadow {
      display: none;
    }

    .connection-line-stroke {
      fill: rgba(54, 59, 68, 0.5);
    }

    .connection-line-draft .connection-line-shadow {
      display: none;
    }

    .connection-line-draft .connection-line-stroke {
      fill: rgba(46, 52, 62, 0.42);
    }

    .connection-line-hit {
      fill: none;
      stroke: rgba(0, 0, 0, 0);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: context-menu;
    }

    .connection-line-operation {
      pointer-events: none;
    }

    .connection-line-operation circle {
      fill: #fff;
      stroke: rgba(17, 24, 39, 0.38);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .connection-line-operation text {
      fill: #111;
      font: 700 13px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      dominant-baseline: central;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 0.7;
      vector-effect: non-scaling-stroke;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font: 400 16px/1.4 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      opacity: 0;
      transition: opacity 760ms cubic-bezier(0.9, 0, 0.1, 1);
      will-change: opacity;
    }

    #loading-screen.loading-visible {
      opacity: 1;
    }

    #loading-screen.loading-complete {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen[hidden] {
      display: none;
    }

    .text-node {
      position: absolute;
      min-width: 0;
      min-height: 1em;
      line-height: 1.25;
      color: #111;
      white-space: pre;
      width: max-content;
      max-width: none;
      overflow-wrap: normal;
      word-break: keep-all;
      user-select: none;
      cursor: grab;
      outline: none;
      pointer-events: auto;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
    }

    .text-node.selected {
      outline: calc(1px / var(--camera-scale, 1)) solid rgba(29, 78, 216, 0.5);
      outline-offset: calc(2px / var(--camera-scale, 1));
    }

    .text-node[data-creator-initial]::before {
      content: attr(data-creator-initial);
      position: absolute;
      top: 50%;
      right: calc(100% + 0.34em);
      width: 0.9em;
      height: 0.9em;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--creator-avatar-bg, #111);
      border: 0.045em solid var(--creator-avatar-border, #111);
      color: var(--creator-avatar-fg, #fff);
      font: 700 0.28em/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
      transform: translateY(-50%);
      pointer-events: auto;
    }

    .text-node[data-creator-avatar-image]::before {
      background: var(--creator-avatar-bg, #111) var(--creator-avatar-image) center / contain no-repeat;
    }

    .text-node.editing {
      -webkit-user-select: text;
      user-select: text;
      cursor: text;
    }

    .text-node.editing * {
      -webkit-user-select: text;
      user-select: text;
    }

    .text-node.editing .external-link-card,
    .text-node.editing .external-link-card * {
      -webkit-user-select: none;
      user-select: none;
    }

    input,
    textarea,
    .text-node.editing .external-link-card input {
      -webkit-user-select: text;
      user-select: text;
    }

    .text-node[data-deleted-at] {
      display: none !important;
    }

    .text-node.variable-node {
      box-sizing: border-box;
      padding: 0.18em 0.34em 0.16em;
      border: 0.04em solid #93c5fd;
      border-radius: 0.32em;
      background: #eaf4ff;
      color: #0f172a;
      cursor: grab;
    }

    .command-node,
    .external-link-card {
      --widget-color: #ffffff;
      --widget-button-color: #e8e8e8;
      --widget-button-hover-color: #f0f0f0;
      --widget-border-color: #d6d6d6;
      --widget-field-color: #ffffff;
      --widget-field-border-color: #d6d6d6;
    }

    .command-node {
      min-width: 0;
      min-height: 0;
      white-space: normal;
      cursor: grab;
    }

    .command-node button {
      font: inherit;
      background: var(--widget-button-color) !important;
    }

    .command-node button:hover:not(:disabled) {
      background: var(--widget-button-hover-color) !important;
    }

    .command-node [data-command-interactive] {
      cursor: pointer;
    }

    .command-node > :first-child {
      background: var(--widget-color) !important;
      border-color: var(--widget-border-color) !important;
      box-shadow: none !important;
    }

    #version-counter {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      z-index: 1000;
      padding: 4px 7px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      color: #6b7280;
      font: 500 12px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      pointer-events: none;
    }

    #version-counter[hidden] {
      display: none;
    }

    .internal-link {
      color: #6b7280;
      text-decoration: underline;
      cursor: pointer;
    }

    .text-node.editing .internal-link {
      cursor: text;
    }

    .external-link-card {
      display: inline-grid;
      gap: 0.35em;
      max-width: 18em;
      margin: 0 0.12em;
      padding: 0.45em 0.52em 0.42em;
      border: 0.04em solid var(--widget-border-color);
      border-radius: 0.55em;
      background: var(--widget-color);
      box-shadow: none;
      color: #3f3328;
      cursor: grab;
      vertical-align: middle;
      white-space: normal;
      user-select: none;
    }

    .external-link-label {
      display: none;
    }

    .external-link-card::before {
      content: attr(data-display-label);
      overflow: hidden;
      color: #4b3b2d;
      display: block;
      font: 500 0.78em/1.16 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      text-decoration: underline;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .external-link-actions,
    .external-link-editor-actions {
      display: flex;
      gap: 0.25em;
      align-items: center;
    }

    .external-link-card button {
      border: 0;
      border-radius: 0.38em;
      background: var(--widget-button-color);
      padding: 0.26em 0.42em;
      color: #4b3b2d;
      font: 500 0.45em/1 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
    }

    .external-link-card button:hover {
      background: var(--widget-button-hover-color);
    }

    .external-link-editor {
      display: grid;
      gap: 0.25em;
    }

    .external-link-editor[hidden] {
      display: none;
    }

    .external-link-editor input {
      width: 17em;
      max-width: 100%;
      box-sizing: border-box;
      border: 0.04em solid var(--widget-field-border-color);
      border-radius: 0.38em;
      background: var(--widget-field-color);
      padding: 0.28em 0.38em;
      color: #3f3328;
      font: 400 0.46em/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      outline: none;
    }

    .text-node.navigation-target-highlight {
      animation: destination-text-glow 5000ms linear forwards;
    }

    @keyframes destination-text-glow {
      0% {
        text-shadow:
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0);
      }
      16% {
        text-shadow:
          0 0 0.22em rgba(255, 255, 255, 0.98),
          0 0 0.56em rgba(255, 255, 255, 0.9),
          0 0 1.28em rgba(255, 255, 255, 0.72);
      }
      74% {
        text-shadow:
          0 0 0.26em rgba(255, 255, 255, 0.88),
          0 0 0.66em rgba(255, 255, 255, 0.74),
          0 0 1.38em rgba(255, 255, 255, 0.52);
      }
      100% {
        text-shadow:
          0 0 0.36em rgba(255, 255, 255, 0),
          0 0 0.9em rgba(255, 255, 255, 0),
          0 0 1.7em rgba(255, 255, 255, 0);
      }
    }

    #node-context-menu,
    #line-context-menu,
    #canvas-context-menu {
      position: fixed;
      z-index: 1000;
      min-width: 190px;
      padding: 6px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
      display: grid;
      gap: 4px;
    }

    #node-context-menu[hidden],
    #line-context-menu[hidden],
    #canvas-context-menu[hidden] {
      display: none;
    }

    #node-context-menu button,
    #line-context-menu button,
    #canvas-context-menu button {
      border: 0;
      background: transparent;
      padding: 8px 10px;
      text-align: left;
      border-radius: 6px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      cursor: pointer;
    }

    #node-context-menu button:hover:not(:disabled),
    #line-context-menu button:hover:not(:disabled),
    #canvas-context-menu button:hover:not(:disabled) {
      background: #f2f4f7;
    }

    #node-context-menu button:disabled,
    #line-context-menu button:disabled,
    #canvas-context-menu button:disabled {
      color: #999;
      cursor: not-allowed;
    }

    #widget-color-picker {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 2px;
      padding: 9px 6px 4px;
      border-top: 1px solid #ece8e2;
    }

    #widget-color-picker[hidden] {
      display: none;
    }

    #node-context-menu .widget-color-swatch {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      padding: 0;
      border: 1px solid rgba(78, 70, 62, 0.17);
      border-radius: 50%;
      background: var(--swatch-color);
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.48);
      cursor: pointer;
      transition: background-color 110ms ease, transform 110ms ease, box-shadow 110ms ease;
    }

    #node-context-menu button.widget-color-swatch:hover:not(:disabled) {
      background: color-mix(in srgb, var(--swatch-color) 72%, #fff);
      transform: scale(1.08);
    }

    #node-context-menu .widget-color-swatch[aria-checked="true"] {
      box-shadow:
        0 0 0 2px #fff,
        0 0 0 3.5px rgba(74, 68, 62, 0.62),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.48);
    }

    #node-context-menu .widget-color-swatch:focus-visible {
      outline: 2px solid rgba(54, 125, 210, 0.78);
      outline-offset: 2px;
    }

    #calc-operation-picker {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      padding: 4px 6px 7px;
      border-bottom: 1px solid #ece8e2;
    }

    #line-context-menu .calc-operation-btn {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      padding: 0;
      border: 1px solid rgba(78, 70, 62, 0.17);
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.48);
      color: #111;
      text-align: center;
      font: 700 13px/1 "Roboto", "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
      transition: background-color 110ms ease, transform 110ms ease, box-shadow 110ms ease;
    }

    #line-context-menu button.calc-operation-btn:hover:not(:disabled) {
      background: #fff;
      transform: scale(1.08);
    }

    #line-context-menu .calc-operation-btn[aria-pressed="true"] {
      box-shadow:
        0 0 0 2px #fff,
        0 0 0 3.5px rgba(74, 68, 62, 0.62),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.48);
    }

    #line-context-menu .calc-operation-btn:focus-visible {
      outline: 2px solid rgba(54, 125, 210, 0.78);
      outline-offset: 2px;
    }

    #link-node-dialog {
      position: fixed;
      z-index: 1100;
      width: min(300px, calc(100vw - 16px));
      padding: 6px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
      display: grid;
      gap: 4px;
    }

    #link-node-dialog[hidden] {
      display: none;
    }

    #link-node-dialog-title {
      padding: 8px 10px 6px;
      border-radius: 6px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      cursor: move;
      touch-action: none;
    }

    #link-node-dialog-input {
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      margin: 8px;
      padding: 8px 10px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      outline: none;
    }

    #link-node-dialog-input:focus {
      border-color: #d0d0d0;
      box-shadow: none;
    }

    #link-node-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    #link-node-dialog button {
      border: 0;
      background: transparent;
      padding: 8px 10px;
      text-align: left;
      border-radius: 6px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      cursor: pointer;
    }

    #link-node-dialog button:hover {
      background: #f2f4f7;
    }

    #slash-command-menu {
      position: fixed;
      z-index: 1200;
      width: min(240px, calc(100vw - 16px));
      padding: 6px;
      border: 1px solid #e2d7c7;
      border-radius: 10px;
      background: #fffaf3;
      box-shadow: 0 10px 28px rgba(83, 63, 43, 0.12);
      display: grid;
      gap: 3px;
    }

    #slash-command-menu[hidden] {
      display: none;
    }

    .slash-command-option {
      border: 0;
      border-radius: 7px;
      background: transparent;
      padding: 8px 9px;
      text-align: left;
      color: #3f3328;
      cursor: pointer;
    }

    .slash-command-option[aria-selected="true"],
    .slash-command-option:hover {
      background: #f2e6d7;
    }

    .slash-command-name {
      display: block;
      font: 500 13px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    .slash-command-hint {
      display: block;
      margin-top: 2px;
      font: 400 12px/1.25 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #7b6a58;
    }

    #marquee-selection {
      position: absolute;
      z-index: 430;
      border: 1px solid #2563eb;
      background: rgba(37, 99, 235, 0.16);
      pointer-events: none;
    }

    #marquee-selection[hidden] {
      display: none;
    }

    #group-selection-box {
      position: absolute;
      z-index: 420;
      border: 1px solid #111;
      background: transparent;
      cursor: move;
      touch-action: none;
      box-sizing: border-box;
    }

    #group-selection-box[hidden] {
      display: none;
    }

    .group-selection-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 1px solid #111;
      background: #111;
      box-sizing: border-box;
      touch-action: none;
    }

    #group-selection-box[data-mode="resize"] .group-selection-handle[data-handle="nw"],
    #group-selection-box[data-mode="resize"] .group-selection-handle[data-handle="se"] {
      cursor: nwse-resize;
    }

    #group-selection-box[data-mode="resize"] .group-selection-handle[data-handle="ne"],
    #group-selection-box[data-mode="resize"] .group-selection-handle[data-handle="sw"] {
      cursor: nesw-resize;
    }

    #group-selection-box[data-mode="rotate"] {
      cursor: default;
    }

    #group-selection-box[data-mode="rotate"] .group-selection-handle {
      width: 14px;
      height: 14px;
      border-color: #111;
      background: transparent;
      cursor: grab;
    }

    #group-selection-box[data-mode="rotate"] .group-selection-handle[data-handle="nw"] {
      border-right: 0;
      border-bottom: 0;
      border-radius: 10px 0 0 0;
    }

    #group-selection-box[data-mode="rotate"] .group-selection-handle[data-handle="ne"] {
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 10px 0 0;
    }

    #group-selection-box[data-mode="rotate"] .group-selection-handle[data-handle="sw"] {
      border-right: 0;
      border-top: 0;
      border-radius: 0 0 0 10px;
    }

    #group-selection-box[data-mode="rotate"] .group-selection-handle[data-handle="se"] {
      border-left: 0;
      border-top: 0;
      border-radius: 0 0 10px 0;
    }
    .fit-marker {
      position: fixed;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 1500;
    }

    .fit-marker.guide {
      background: #22c55e;
    }

    .fit-marker.target {
      background: #facc15;
    }

    #mobile-toolbar {
      display: none;
    }

    body.mobile-device #viewport {
      -webkit-touch-callout: none;
    }

    body.mobile-device #mobile-toolbar {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 900;
      display: flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.14);
      transform: translateX(-50%);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    body.mobile-device #mobile-toolbar[hidden],
    body.mobile-device #mobile-redo-btn[hidden] {
      display: none;
    }

    .mobile-tool-btn {
      display: grid;
      width: 38px;
      height: 38px;
      box-sizing: border-box;
      place-items: center;
      padding: 7px;
      border: 1px solid rgba(17, 24, 39, 0.15);
      border-radius: 6px;
      background: #fff;
      color: #111827;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-tool-btn[aria-pressed="true"] {
      border-color: rgba(37, 99, 235, 0.62);
      background: #eaf0ff;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
    }

    .mobile-tool-btn:disabled {
      opacity: 0.32;
    }

    .mobile-tool-btn img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .mobile-tool-btn svg {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #mobile-delete-btn {
      color: #991b1b;
    }

    #mobile-redo-btn img {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <quico hidden>S</quico>
  <div id="loading-screen" role="status" aria-live="polite">Loading... 0% done</div>
  <div id="version-counter" aria-label="Application version" hidden></div>
  <div id="viewport">
    <svg id="line-layer" aria-hidden="true"></svg>
    <div id="world"></div>
    <div id="marquee-selection" hidden></div>

    function detectMobileDevice() {
      const userAgent = navigator.userAgent || "";
      const reportsMobile = Boolean(
        navigator.userAgentData && navigator.userAgentData.mobile
      );
      const hasMobileUserAgent = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(userAgent);
      const isIPadDesktopMode =
        navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const isTouchOnlySmallScreen =
        navigator.maxTouchPoints > 0 &&
        window.matchMedia("(pointer: coarse)").matches &&
        window.matchMedia("(hover: none)").matches &&
        Math.min(window.screen.width, window.screen.height) <= 1024;

      return reportsMobile || hasMobileUserAgent || isIPadDesktopMode || isTouchOnlySmallScreen;
    }

    function detectPhysicalWheelStep(event) {
      if (IS_MOBILE_DEVICE || !event.isTrusted) return false;

      // Device type is not exposed, so only discrete wheel signatures qualify.
      const deltaY = Math.abs(event.deltaY);
      const legacyDelta = Math.abs(Number(event.wheelDeltaY ?? event.wheelDelta));
      const hasLegacyWheelStep =
        Number.isFinite(legacyDelta) &&
        legacyDelta >= 120 &&
        Math.abs(legacyDelta % 120) < 0.001;
      const hasDiscreteDeltaMode = event.deltaMode === 1 || event.deltaMode === 2;
      const hasSuddenPixelStep =
        event.deltaMode === 0 &&
        deltaY >= PHYSICAL_WHEEL_MIN_PIXEL_DELTA &&
        Math.abs(event.deltaX) < 1 &&
        hasLegacyWheelStep;

      const detected = hasDiscreteDeltaMode || hasSuddenPixelStep;
      if (detected) hasPhysicalWheelInput = true;
      return detected;
    }

    function getSharedSpacePathParts() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      if (parts.length === 0 || (parts.length === 1 && parts[0] === "index.html")) return [];
      const decoded = parts.map(decodePathPart).filter(Boolean);
      if (decoded.length === 0 || RESERVED_SHARED_SPACE_SLUGS.has(decoded[0])) return [];
      return decoded;
    }

    function getSharedSpaceSlug() {
      return SHARED_SPACE_PARTS.join("/");

    function getDeloreanSpaceInfo() {
      if (
        SHARED_SPACE_PARTS.length < 3 ||
        SHARED_SPACE_PARTS[0].toLowerCase() !== DELOREAN_SPACE_PREFIX
      ) {
        return { active: false, originalSlug: "", dateSlug: "" };
      }

      return {
        active: true,
        originalSlug: SHARED_SPACE_PARTS.slice(1, -1).join("/"),
        dateSlug: SHARED_SPACE_PARTS[SHARED_SPACE_PARTS.length - 1]

    function getNodePlainTitleText(node, options = {}) {
      if (!(node instanceof HTMLElement)) return "";
      if (!options.cleanControls) return (node.textContent || "").trim();
      const clone = node.cloneNode(true);
      clone.querySelectorAll("style, script, button, input, textarea, select").forEach((element) => element.remove());
      return (clone.textContent || "").replace(/\s+/g, " ").trim();
    }

    function getHookedNodeTitle(node) {

      if (isCommandNode(node)) {

          const title = command.getTitle(readCommandState(node), getCommandRenderContext(node), node);
          if (typeof title === "string" && title.trim()) return title.trim();
        }
        return getNodePlainTitleText(node, { cleanControls: true });
      }
      return getNodePlainTitleText(node);

          URL.revokeObjectURL(workerUrl);
          titleHookWorker.onmessage = updateDocumentTitle;
          titleHookWorker.onerror = () => {
            if (titleHookWorker) titleHookWorker.terminate();
            titleHookWorker = null;
            if (titleHookTimer === null) {

          };
          return;
        } catch (error) {
          titleHookWorker = null;

      }
      titleHookTimer = setInterval(updateDocumentTitle, TITLE_HOOK_REFRESH_MS);

    function normalizeTimestamp(value) {
      if (value === undefined || value === null || value === "") return null;
      const timestamp = typeof value === "string" && !/^\d+(?:\.\d+)?$/.test(value.trim())
        ? Date.parse(value)
        : Number(value);
      return Number.isFinite(timestamp) && timestamp > 0 ? Math.round(timestamp) : null;
    }

    function isDeletedAtAfterCutoff(value, cutoff) {
      const deletedAt = normalizeTimestamp(value);
      return deletedAt !== null && deletedAt <= cutoff;
    }

    function wasCreatedAfterCutoff(value, cutoff) {
      const createdAt = normalizeTimestamp(value);
      return createdAt !== null && createdAt > cutoff;

      if (!item || typeof item !== "object") return false;
      if (wasCreatedAfterCutoff(item.createdAt, cutoff)) return false;
      if (isDeletedAtAfterCutoff(item.deletedAt, cutoff)) return false;
      return true;
    }

    function isNodeDeleted(node) {
      return node instanceof HTMLElement && Boolean(node.dataset.deletedAt);
    }

    function setNodeTimestamps(node, options = {}) {
      const createdAt = normalizeTimestamp(options.createdAt);
      const deletedAt = normalizeTimestamp(options.deletedAt);
      if (createdAt) {
        node.dataset.createdAt = String(createdAt);
      } else if (!options.preserveTimestamps) {
        node.dataset.createdAt = String(Date.now());
      }
      if (deletedAt) {
        node.dataset.deletedAt = String(deletedAt);
        node.setAttribute("aria-hidden", "true");
        unobserveNodeForLines(node);
        if (isCommandNode(node)) destroyCommandNodeContent(node);
      } else {
        delete node.dataset.deletedAt;
        node.removeAttribute("aria-hidden");
      }
    }

    function normalizeCreator(value) {
      if (!value || typeof value !== "object") return null;
      const id = typeof value.id === "string" ? value.id.trim() : "";
      const nickname = typeof value.nickname === "string" ? value.nickname.trim() : "";
      const accentColor = normalizeAvatarColor(value.accentColor);
      return id && nickname ? { id, nickname, ...(accentColor ? { accentColor } : {}) } : null;
    }

    function normalizeAvatarColor(value) {
      const match = String(value || "").trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!match) return "";
      const hex = match[1].toLowerCase();
      return hex.length === 3
        ? `#${hex.split("").map((digit) => digit + digit).join("")}`
        : `#${hex}`;
    }

    function avatarRgb(hex) {
      const color = normalizeAvatarColor(hex) || "#111111";
      const value = color.slice(1);
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function avatarHex({ r, g, b }) {
      return `#${[r, g, b].map((channel) => (
        Math.max(0, Math.min(255, Math.round(channel))).toString(16).padStart(2, "0")
      )).join("")}`;
    }

    function avatarLuminance(hex) {
      const { r, g, b } = avatarRgb(hex);
      return [r, g, b].map((channel) => {
        const value = channel / 255;
        return value <= 0.03928 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
      }).reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0);
    }

    function mixAvatarColor(hex, targetHex, amount) {
      const source = avatarRgb(hex);
      const target = avatarRgb(targetHex);
      return avatarHex({
        r: source.r + (target.r - source.r) * amount,
        g: source.g + (target.g - source.g) * amount,
        b: source.b + (target.b - source.b) * amount
      });
    }

    function drawQuicoAvatarDataUrl(character, palette) {
      const glyph = Array.from(String(character || "").trim())[0] || "?";
      const cacheKey = [glyph, palette.background, palette.border, palette.foreground].join("|");
      const cache = drawQuicoAvatarDataUrl.cache || (drawQuicoAvatarDataUrl.cache = new Map());
      if (cache.has(cacheKey)) return cache.get(cacheKey);

      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext("2d");
      if (!context) return "";

      const center = size / 2;
      const radius = size * 0.44;
      context.clearRect(0, 0, size, size);
      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.closePath();
      context.fillStyle = palette.background;
      context.fill();
      context.lineWidth = 24;
      context.strokeStyle = palette.border;
      context.stroke();

      const fontSize = Math.round(size * 0.56);
      context.fillStyle = palette.foreground;
      context.textAlign = "left";
      context.textBaseline = "alphabetic";
      context.font = `700 ${fontSize}px Roboto, "Helvetica Neue", Arial, sans-serif`;

      const dataUrl = canvas.toDataURL("image/png");
      cache.set(cacheKey, dataUrl);
      return dataUrl;
    }

    function getAvatarPalette(accentColor) {
      const background = normalizeAvatarColor(accentColor) || "#111111";
      const luminance = avatarLuminance(background);
      const foreground = luminance > 0.58 ? "#111111" : "#ffffff";
      const border = luminance > 0.72
        ? "#111111"
        : luminance < 0.18
          ? mixAvatarColor(background, "#000000", 0.45)
          : mixAvatarColor(background, "#000000", 0.36);
      return { background, foreground, border };
    }

    function getCreatorAccentColor(creator) {
      if (
        currentUser &&
        creator &&
        currentUser.id === creator.id &&
        currentUser.accentColor
      ) {
        return currentUser.accentColor;
      }
      return creator && creator.accentColor ? creator.accentColor : "#111111";
    }

    function applyNodeCreatorAvatar(node, creator) {
      const palette = getAvatarPalette(getCreatorAccentColor(creator));
      node.style.setProperty("--creator-avatar-bg", palette.background);
      node.style.setProperty("--creator-avatar-border", palette.border);
      node.style.setProperty("--creator-avatar-fg", palette.foreground);
      const dataUrl = drawQuicoAvatarDataUrl(Array.from(creator.nickname)[0] || "?", palette);
      if (dataUrl) {
        node.dataset.creatorAvatarImage = "true";
        node.style.setProperty("--creator-avatar-image", `url("${dataUrl}")`);
      } else {
        delete node.dataset.creatorAvatarImage;
        node.style.removeProperty("--creator-avatar-image");
      }
    }

    function refreshCreatorAvatars() {
      for (const node of world.querySelectorAll(".text-node[data-creator-id]")) {
        const creator = getNodeCreator(node);
        if (creator) applyNodeCreatorAvatar(node, creator);
      }
    }

    function setCurrentUser(value) {
      currentUser = normalizeCreator(value);
      refreshCreatorAvatars();
    }

    function setNodeCreator(node, value) {
      const creator = normalizeCreator(value);
      if (!creator) {
        delete node.dataset.creatorId;
        delete node.dataset.creatorNickname;
        delete node.dataset.creatorInitial;
        delete node.dataset.creatorAccentColor;
        delete node.dataset.creatorAvatarImage;
        node.style.removeProperty("--creator-avatar-bg");
        node.style.removeProperty("--creator-avatar-border");
        node.style.removeProperty("--creator-avatar-fg");
        node.style.removeProperty("--creator-avatar-image");
        node.removeAttribute("title");
        return;
      }
      node.dataset.creatorId = creator.id;
      node.dataset.creatorNickname = creator.nickname;
      node.dataset.creatorInitial = Array.from(creator.nickname)[0] || "?";
      if (creator.accentColor) {
        node.dataset.creatorAccentColor = creator.accentColor;
      } else {
        delete node.dataset.creatorAccentColor;
      }
      applyNodeCreatorAvatar(node, creator);
      node.title = creator.nickname;
    }

    function getNodeCreator(node) {
      return normalizeCreator({
        id: node.dataset.creatorId || "",
        nickname: node.dataset.creatorNickname || "",
        accentColor: node.dataset.creatorAccentColor || ""
      });
    }

    function markDeloreanModified() {
      if (!DELOREAN_SPACE_INFO.active || deloreanModified || applyingSharedState || applyingHistoryState || suppressAutosave) {
        return;
      }

      deloreanModified = true;
      spaceMeta = cloneJson(spaceMeta, {});
      const delorean = spaceMeta.delorean && typeof spaceMeta.delorean === "object"
        ? cloneJson(spaceMeta.delorean, {})
        : {};
      delorean.modifiedAt = Date.now();
      spaceMeta.delorean = delorean;
      updateDocumentTitle();
    }

    function setLoadingProgress(percent) {
      if (!loadingScreen) return;
      const value = Math.max(0, Math.min(100, Math.round(percent)));
      if (value < loadingProgressValue) return;
      loadingProgressValue = value;
      loadingProgressAnimationFrom = loadingDisplayedProgress;
      loadingProgressAnimationStart = 0;
      loadingProgressAnimationDuration = Math.max(
        260,
        Math.min(1800, 260 + Math.abs(loadingProgressValue - loadingDisplayedProgress) * 34)
      );
      if (loadingProgressAnimationFrame === null) {
        loadingProgressAnimationFrame = requestAnimationFrame(animateLoadingProgress);
      }
    }

    function setLoadingProgressText(percent) {
      if (!loadingScreen) return;
      const value = Math.max(0, Math.min(100, Math.round(percent)));
      loadingScreen.textContent = `Loading... ${value}% done`;
    }

    function easeLoadingProgress(progress) {
      const value = Math.max(0, Math.min(1, progress));
      return value < 0.5
        ? Math.pow(2 * value, 10) / 2
        : 1 - Math.pow(2 * (1 - value), 10) / 2;
    }

    function resolveLoadingProgressAnimation() {
      if (loadingProgressResolvers.length === 0) return;
      const resolvers = loadingProgressResolvers;
      loadingProgressResolvers = [];
      resolvers.forEach((resolve) => resolve());
    }

    function animateLoadingProgress(timestamp) {
      if (!loadingScreen) {
        loadingProgressAnimationFrame = null;
        resolveLoadingProgressAnimation();
        return;
      }
      if (!loadingProgressAnimationStart) loadingProgressAnimationStart = timestamp;
      const elapsed = timestamp - loadingProgressAnimationStart;
      const progress = loadingProgressAnimationDuration > 0
        ? Math.min(1, elapsed / loadingProgressAnimationDuration)
        : 1;
      const eased = easeLoadingProgress(progress);
      loadingDisplayedProgress = loadingProgressAnimationFrom +
        (loadingProgressValue - loadingProgressAnimationFrom) * eased;
      if (loadingDisplayedProgress > loadingProgressValue) loadingDisplayedProgress = loadingProgressValue;
      setLoadingProgressText(loadingDisplayedProgress);

      if (progress < 1 && loadingDisplayedProgress < loadingProgressValue) {
        loadingProgressAnimationFrame = requestAnimationFrame(animateLoadingProgress);
      } else {
        loadingDisplayedProgress = loadingProgressValue;
        setLoadingProgressText(loadingDisplayedProgress);
        loadingProgressAnimationFrame = null;
        resolveLoadingProgressAnimation();
      }
    }

    function waitForLoadingProgressAnimation() {
      if (loadingProgressAnimationFrame === null) return Promise.resolve();
      return new Promise((resolve) => {
        loadingProgressResolvers.push(resolve);
      });
    }

    function createLoadingProgressRange(start, end, onProgress) {
      if (typeof onProgress !== "function") return null;
      const from = Math.max(0, Math.min(1, Number(start) || 0));
      const to = Math.max(from, Math.min(1, Number(end) || from));
      return (progress) => {
        const value = Math.max(0, Math.min(1, Number(progress) || 0));
        onProgress(from + (to - from) * value);
      };
    }

    function waitForLoadingFrame() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => resolve());
      });
    }

    function showLoadingScreen() {
      if (!loadingScreen) return;
      loadingScreen.hidden = false;
      loadingScreen.classList.remove("loading-visible", "loading-complete");
      void loadingScreen.offsetWidth;
      loadingScreen.classList.add("loading-visible");
    }

    function waitForLoadingTransition() {
      return new Promise((resolve) => {
        if (!loadingScreen) {
          resolve();
          return;
        }

        const timeout = setTimeout(resolve, 900);
        loadingScreen.addEventListener("transitionend", (event) => {
          if (event.target !== loadingScreen || event.propertyName !== "opacity") return;
          clearTimeout(timeout);
          resolve();
        }, { once: true });
      });
    }

    async function hideLoadingScreen() {
      setLoadingProgress(100);
      await waitForLoadingProgressAnimation();
      document.body.classList.add("app-ready");
      await waitForLoadingFrame();
      if (loadingScreen) loadingScreen.classList.add("loading-complete");
      await waitForLoadingTransition();
      if (loadingScreen) loadingScreen.hidden = true;
    }

    function getNodeById(nodeId, options = {}) {
      const id = typeof nodeId === "string" ? nodeId.trim() : "";
      if (!id) return null;
      for (const node of world.children) {
        if (!options.includeDeleted && isNodeDeleted(node)) continue;
        if (node.dataset.nodeId === id) return node;
      }
      return null;
    }

    function updateNextNodeNumberFromId(nodeId) {
      const match = /^node-(\d+)$/.exec(nodeId);
      if (!match) return;
      const value = Number(match[1]);
      if (!Number.isFinite(value)) return;
      nextNodeNumber = Math.max(nextNodeNumber, value + 1);
    }

    function isNodeIdInUse(nodeId) {
      return Boolean(getNodeById(nodeId, { includeDeleted: true }));
    }

    function generateNodeId() {
      let candidate = `node-${nextNodeNumber}`;
      while (isNodeIdInUse(candidate)) {
        nextNodeNumber += 1;
        candidate = `node-${nextNodeNumber}`;
      }
      nextNodeNumber += 1;
      return candidate;
    }

    function resolveNodeId(preferredId) {
      const requested = typeof preferredId === "string" ? preferredId.trim() : "";
      if (!requested) return generateNodeId();
      if (!isNodeIdInUse(requested)) {
        updateNextNodeNumberFromId(requested);
        return requested;
      }
      let suffix = 2;
      let candidate = `${requested}-${suffix}`;
      while (isNodeIdInUse(candidate)) {
        suffix += 1;
        candidate = `${requested}-${suffix}`;
      }
      return candidate;
    }

    function normalizeExternalHref(value) {
      const raw = typeof value === "string" ? value.trim() : "";
      if (!raw) return "";

      try {
        const url = new URL(raw);
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
      } catch (error) {
        return "";
      }
    }

    function getDefaultExternalLinkLabel(href) {
      const normalized = normalizeExternalHref(href);
      if (!normalized) return "";

      try {
        const url = new URL(normalized);
        if (url.search) {
          return `${url.origin}${url.pathname}...`;
        }
      } catch (error) {
        return normalized;
      }

      return normalized;
    }

    function getExternalLinkDisplayLabel(href, label) {
      const custom = typeof label === "string" ? label.trim() : "";
      return custom || getDefaultExternalLinkLabel(href);
    }

    function createExternalLinkCard(href, label = "", options = {}) {
      const normalizedHref = normalizeExternalHref(href);
      if (!normalizedHref) return null;

      const card = document.createElement("span");
      card.className = "external-link-card";
      card.contentEditable = "false";
      card.dataset.href = normalizedHref;
      card.dataset.label = typeof label === "string" ? label.trim() : "";
      const color = normalizeWidgetColor(options.widgetColor || options.color || "");
      if (color && color !== DEFAULT_WIDGET_COLOR) card.dataset.widgetColor = color;
      attachExternalLinkCardPointerHandlers(card);
      applyWidgetColor(card);

      renderExternalLinkCard(card, options);
      return card;
    }

    function renderExternalLinkCard(card, options = {}) {
      const href = normalizeExternalHref(card.dataset.href || "");
      const label = typeof card.dataset.label === "string" ? card.dataset.label : "";
      if (!href) return;

      const isEditing = Boolean(options.editing);
      card.dataset.displayLabel = getExternalLinkDisplayLabel(href, label);
      card.replaceChildren();
      applyWidgetColor(card);

      const actions = document.createElement("span");
      actions.className = "external-link-actions";
      actions.hidden = isEditing;

      const openButton = document.createElement("button");
      openButton.type = "button";
      openButton.dataset.externalLinkAction = "open";
      openButton.textContent = "Open";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.dataset.externalLinkAction = "edit";
      editButton.textContent = "Edit";

      const flattenButton = document.createElement("button");
      flattenButton.type = "button";
      flattenButton.dataset.externalLinkAction = "flatten";
      flattenButton.textContent = "Flatten";
      actions.append(openButton, editButton, flattenButton);
      card.appendChild(actions);

      const editor = document.createElement("span");
      editor.className = "external-link-editor";
      editor.hidden = !isEditing;

      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.dataset.externalLinkField = "label";
      labelInput.placeholder = "Label";
      labelInput.value = label;

      const hrefInput = document.createElement("input");
      hrefInput.type = "url";
      hrefInput.dataset.externalLinkField = "href";
      hrefInput.placeholder = "Link";
      hrefInput.value = href;

      const editorActions = document.createElement("span");
      editorActions.className = "external-link-editor-actions";

      const saveButton = document.createElement("button");
      saveButton.type = "button";
      saveButton.dataset.externalLinkAction = "save";
      saveButton.textContent = "Save";

      const cancelButton = document.createElement("button");
      cancelButton.type = "button";
      cancelButton.dataset.externalLinkAction = "cancel";
      cancelButton.textContent = "Cancel";
      editorActions.append(saveButton, cancelButton);
      editor.append(labelInput, hrefInput, editorActions);
      card.appendChild(editor);
    }

    function sanitizeNodeHtml(rawHtml, options = {}) {
      if (typeof rawHtml !== "string" || rawHtml.length === 0) return "";
      const { preserveBlockBreaks = false } = options;

      const source = document.createElement("div");
      source.innerHTML = rawHtml;
      const output = document.createElement("div");

      function appendBreak(target) {
        if (target.lastChild && target.lastChild.nodeName !== "BR") {
          target.appendChild(document.createElement("br"));
        }
      }

      function walk(node, target) {
        if (node.nodeType === Node.TEXT_NODE) {
          target.appendChild(document.createTextNode(node.textContent || ""));
          return;
        }

        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const element = node;
        const tag = element.tagName;

        if (tag === "BR") {
          target.appendChild(document.createElement("br"));
          return;
        }

        if (tag === "SPAN" && element.classList.contains("internal-link")) {
          const targetId = (element.dataset.targetId || "").trim();
          if (targetId) {
            const link = document.createElement("span");
            link.className = "internal-link";
            link.dataset.targetId = targetId;
            link.textContent = element.textContent || "";
            target.appendChild(link);
            return;
          }
        }

        if (tag === "SPAN" && element.classList.contains("external-link-plain")) {
          const href = normalizeExternalHref(element.textContent || "");
          if (href) {
            const span = document.createElement("span");
            span.className = "external-link-plain";
            span.textContent = href;
            target.appendChild(span);
            return;
          }
        }

        if (tag === "SPAN" && element.classList.contains("external-link-card")) {
          const href = normalizeExternalHref(
            element.dataset.href ||
            (element.querySelector("a") && element.querySelector("a").getAttribute("href")) ||
            element.textContent ||
            ""
          );
          if (href) {
            const card = createExternalLinkCard(href, element.dataset.label || "", {
              widgetColor: element.dataset.widgetColor || ""
            });
            if (card) target.appendChild(card);
            return;
          }
        }

        const sanitizedTag = SANITIZED_INLINE_TAGS.get(tag);
        if (sanitizedTag) {
          const formatted = document.createElement(sanitizedTag);
          for (const child of element.childNodes) {
            walk(child, formatted);
          }
          if (formatted.hasChildNodes()) target.appendChild(formatted);
          return;
        }

        const isPastedBlock = preserveBlockBreaks && PASTED_BLOCK_TAGS.has(tag);
        if (isPastedBlock) appendBreak(target);

        for (const child of element.childNodes) {
          walk(child, target);
        }
        if (isPastedBlock) appendBreak(target);
      }

      for (const child of source.childNodes) {
        walk(child, output);
      }
      if (preserveBlockBreaks) {
        while (output.lastChild && output.lastChild.nodeName === "BR") {
          output.lastChild.remove();
        }
      }
      return output.innerHTML;
    }

    function getSanitizedPasteHtml(event) {
      const clipboard = event.clipboardData;
      if (!clipboard) return "";

      const plainText = clipboard.getData("text/plain") || "";
      const clipboardHtml = clipboard.getData("text/html") || "";
      const sanitizedHtml = clipboardHtml
        ? sanitizeNodeHtml(clipboardHtml, { preserveBlockBreaks: true })
        : "";
      if (sanitizedHtml) return sanitizedHtml;

      const plain = document.createElement("div");
      plain.textContent = plainText;
      return plain.innerHTML.replace(/\r\n?|\n/g, "<br>");
    }

    function insertSanitizedPaste(node, html) {
      if (!html) return false;

      const selection = window.getSelection();
      const range = selection && selection.rangeCount > 0
        ? selection.getRangeAt(0)
        : document.createRange();
      if (
        !node.contains(range.startContainer) ||
        !node.contains(range.endContainer)
      ) {
        range.selectNodeContents(node);
        range.collapse(false);
      }

      range.deleteContents();
      const fragment = range.createContextualFragment(html);
      const lastInsertedNode = fragment.lastChild;
      range.insertNode(fragment);

      if (selection && lastInsertedNode) {
        range.setStartAfter(lastInsertedNode);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      }
      return true;
    }

    function normalizeNodeMarkup(node) {
      const cleanHtml = sanitizeNodeHtml(node.innerHTML);
      if (node.innerHTML !== cleanHtml) {
        node.innerHTML = cleanHtml;
      }
    }

    function getSelectionRangeWithinNode(node) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      if (range.collapsed) return null;
      if (!node.contains(range.startContainer) || !node.contains(range.endContainer)) return null;
      if (!range.toString()) return null;
      return range.cloneRange();
    }

    async function copyTextToClipboard(text) {
      if (!text) throw new Error("Nothing to copy.");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "true");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(textarea);
      if (!ok) throw new Error("Copy command failed.");
    }

    function positionLinkNodeDialog(clientX, clientY) {

      const desiredY = Number.isFinite(clientY) ? clientY : window.innerHeight / 2;
      const rect = linkNodeDialog.getBoundingClientRect();

    function submitLinkNodeDialog() {
      const sourceNode = pendingLinkSourceNode;
      const selectionRange = pendingLinkSelectionRange;
      if (!sourceNode || !selectionRange) {
        closeLinkNodeDialog();
        alert("Select a word inside the node first.");
        return;
      }

      const targetNodeId = linkNodeDialogInput.value.trim();
      if (!targetNodeId) {

      const targetNode = getNodeById(targetNodeId);

      if (targetNode === sourceNode) {
        alert("Choose a different node ID.");

        linkSelectionToTarget(sourceNode, selectionRange, targetNodeId);
        normalizeNodeMarkup(sourceNode);
        scheduleAutosave();
        closeLinkNodeDialog();

        console.error("Linking failed:", error);
        alert("Could not link the selected text.");

    function openNodeContextMenu(node, clientX, clientY, eventTarget = null) {
      closeLineContextMenu();
      closeCanvasContextMenu();
      closeLinkNodeDialog();
      contextMenuNode = node;

      contextMenuSelectionRange = isCommandNode(node) || contextMenuWidget ? null : getSelectionRangeWithinNode(node);
      linkSelectionBtn.disabled = !contextMenuSelectionRange;
      widgetColorPicker.hidden = !isWidgetColorable(contextMenuWidget || node);
      updateWidgetColorPicker(contextMenuWidget || node);
      nodeContextMenu.hidden = false;

      const menuRect = nodeContextMenu.getBoundingClientRect();
      const clampedX = Math.min(clientX, window.innerWidth - menuRect.width - 8);
      const clampedY = Math.min(clientY, window.innerHeight - menuRect.height - 8);

      nodeContextMenu.style.top = `${Math.max(8, clampedY)}px`;
    }

    function openLineContextMenu(lineId, clientX, clientY) {
      closeNodeContextMenu();
      closeCanvasContextMenu();
      closeLinkNodeDialog();
      contextMenuLineId = lineId;
      updateCalcOperationPicker(lineId);
      lineContextMenu.hidden = false;

      const menuRect = lineContextMenu.getBoundingClientRect();
      const clampedX = Math.min(clientX, window.innerWidth - menuRect.width - 8);
      const clampedY = Math.min(clientY, window.innerHeight - menuRect.height - 8);
      lineContextMenu.style.left = `${Math.max(8, clampedX)}px`;
      lineContextMenu.style.top = `${Math.max(8, clampedY)}px`;
    }

    function openCanvasContextMenu(clientX, clientY) {
      closeNodeContextMenu();
      closeLineContextMenu();
      closeLinkNodeDialog();
      canvasContextMenu.hidden = false;

      const menuRect = canvasContextMenu.getBoundingClientRect();
      const clampedX = Math.min(clientX, window.innerWidth - menuRect.width - 8);
      const clampedY = Math.min(clientY, window.innerHeight - menuRect.height - 8);
      canvasContextMenu.style.left = `${Math.max(8, clampedX)}px`;
      canvasContextMenu.style.top = `${Math.max(8, clampedY)}px`;

    function cancelCameraAnimation(options = {}) {

    function cancelNodeLayoutAnimation() {

        nodeLayoutAnimationFrame = null;

    function clamp(value, min, max) {

    function normalizeRotation(value) {

    function getNodeRotation(node) {

      return normalizeRotation(Number(node.dataset.rotation || 0));
    }

    function getNewNodeRotation() {
      return normalizeRotation(-camera.rotation);
    }

    function getCameraRotation() {
      return normalizeRotation(camera.rotation);
    }

    function getCameraBasis(rotation = getCameraRotation()) {
      return {
        cos: Math.cos(rotation),
        sin: Math.sin(rotation)

    }

    function getCameraScreenOffset(worldX, worldY, scale = getCameraScale(), rotation = getCameraRotation()) {
      const basis = getCameraBasis(rotation);

        x: (worldX * basis.cos - worldY * basis.sin) * scale,

    function worldToScreen(worldX, worldY, scale = getCameraScale(), rotation = getCameraRotation()) {
      const offset = getCameraScreenOffset(worldX, worldY, scale, rotation);
      return {
        x: camera.x + offset.x,
        y: camera.y + offset.y
      };
    }

    function getTransformedWorldRectBounds(rect) {
      const corners = [
        worldToScreen(rect.minX, rect.minY),
        worldToScreen(rect.maxX, rect.minY),
        worldToScreen(rect.maxX, rect.maxY),
        worldToScreen(rect.minX, rect.maxY)
      ];
      const xs = corners.map((point) => point.x);
      const ys = corners.map((point) => point.y);
      const left = Math.min(...xs);
      const top = Math.min(...ys);
      const right = Math.max(...xs);
      const bottom = Math.max(...ys);
      return {
        left,
        top,
        right,
        bottom,
        width: Math.max(0, right - left),
        height: Math.max(0, bottom - top)
      };
    }

    function getPointBounds(points) {
      const xs = points.map((point) => point.x);
      const ys = points.map((point) => point.y);
      const minX = Math.min(...xs);
      const minY = Math.min(...ys);
      const maxX = Math.max(...xs);
      const maxY = Math.max(...ys);
      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(0.001, maxX - minX),
        height: Math.max(0.001, maxY - minY)
      };
    }

    function getPointCenter(points) {
      let x = 0;
      let y = 0;
      for (const point of points) {
        x += point.x;
        y += point.y;
      }
      return {
        x: x / points.length,
        y: y / points.length
      };
    }

    function rotatePointAround(point, center, angle) {
      const basis = getCameraBasis(angle);
      const dx = point.x - center.x;
      const dy = point.y - center.y;
      return {
        x: center.x + dx * basis.cos - dy * basis.sin,
        y: center.y + dx * basis.sin + dy * basis.cos
      };
    }

    function getBoundsCenter(bounds) {
      return {
        x: bounds.minX + bounds.width * 0.5,
        y: bounds.minY + bounds.height * 0.5
      };
    }

    function worldToSelectionLocal(point, rotation = selectionOverlayRotation) {
      const basis = getCameraBasis(rotation);
      return {
        x: point.x * basis.cos + point.y * basis.sin,
        y: -point.x * basis.sin + point.y * basis.cos
      };
    }

    function selectionLocalToWorld(point, rotation = selectionOverlayRotation) {
      const basis = getCameraBasis(rotation);
      return {
        x: point.x * basis.cos - point.y * basis.sin,
        y: point.x * basis.sin + point.y * basis.cos
      };
    }

    function getNodeWorldCorners(node) {
      const x = Number(node.dataset.x);
      const y = Number(node.dataset.y);
      const size = getNodeWorldSize(node);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return [];

      const rotation = getNodeRotation(node);
      const basis = getCameraBasis(rotation);
      return [
        { x, y },
        { x: x + size.width * basis.cos, y: y + size.width * basis.sin },
        {
          x: x + size.width * basis.cos - size.height * basis.sin,
          y: y + size.width * basis.sin + size.height * basis.cos
        },
        { x: x - size.height * basis.sin, y: y + size.height * basis.cos }
      ];
    }

    function getNodeWorldBounds(node) {
      const corners = getNodeWorldCorners(node);
      return corners.length === 4 ? getPointBounds(corners) : null;
    }

    function getNodeWorldCenter(node) {
      const corners = getNodeWorldCorners(node);
      return corners.length === 4 ? getPointCenter(corners) : null;
    }

    function setCameraTransformAt(clientX, clientY, nextScale, nextRotation) {
      if (!Number.isFinite(nextScale) || nextScale <= 0) return false;
      const worldPoint = screenToWorld(clientX, clientY);
      return setCameraTransformForWorldPoint(worldPoint, clientX, clientY, nextScale, nextRotation);
    }

    function setCameraTransformForWorldPoint(worldPoint, clientX, clientY, nextScale, nextRotation) {
      if (
        !worldPoint ||
        !Number.isFinite(worldPoint.x) ||
        !Number.isFinite(worldPoint.y) ||
        !Number.isFinite(clientX) ||
        !Number.isFinite(clientY) ||
        !Number.isFinite(nextScale) ||
        nextScale <= 0
      ) return false;
      const rotation = normalizeRotation(nextRotation);
      const offset = getCameraScreenOffset(worldPoint.x, worldPoint.y, nextScale, rotation);
      camera.scale = nextScale;
      camera.rotation = rotation;
      camera.x = clientX - offset.x;
      camera.y = clientY - offset.y;
      render();
      scheduleViewportSave();
      return true;
    }

    function easeInOutHeavy(t) {
      if (t < 0.5) {
        return 16 * Math.pow(t, 5);
      }
      return 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function easeInOutNatural(t) {
      const clamped = clamp(t, 0, 1);
      return clamped * clamped * clamped * (clamped * (clamped * 6 - 15) + 10);
    }

    function getNodeWorldSize(node) {
      const metrics = getNodeRenderMetrics(node);
      return {
        width: Math.max(node.scrollWidth, node.offsetWidth, 1) * metrics.worldScale,
        height: Math.max(node.scrollHeight, node.offsetHeight, 1) * metrics.worldScale
      };
    }

    function updateNextLineNumberFromId(lineId) {
      const match = /^line-(\d+)$/.exec(lineId);
      if (!match) return;
      const value = Number(match[1]);
      if (!Number.isFinite(value)) return;
      nextLineNumber = Math.max(nextLineNumber, value + 1);
    }

    function isLineIdInUse(lineId) {
      return lineConnections.some((line) => line.id === lineId);
    }

    function generateLineId() {
      let candidate = `line-${nextLineNumber}`;
      while (isLineIdInUse(candidate)) {
        nextLineNumber += 1;
        candidate = `line-${nextLineNumber}`;
      }
      nextLineNumber += 1;
      return candidate;
    }

    function resolveLineId(preferredId) {
      const requested = typeof preferredId === "string" ? preferredId.trim() : "";
      if (!requested) return generateLineId();
      if (!isLineIdInUse(requested)) {
        updateNextLineNumberFromId(requested);
        return requested;
      }
      let suffix = 2;
      let candidate = `${requested}-${suffix}`;
      while (isLineIdInUse(candidate)) {
        suffix += 1;
        candidate = `${requested}-${suffix}`;
      }
      return candidate;
    }

    function normalizeLineEndpointId(value) {
      return typeof value === "string" ? value.trim() : "";
    }

    function getLineConnectionKey(fromId, toId) {
      return [fromId, toId].sort().join("\u0000");
    }

    function hasLineConnection(fromId, toId) {
      const key = getLineConnectionKey(fromId, toId);
      return lineConnections.some((line) => !line.deletedAt && getLineConnectionKey(line.from, line.to) === key);
    }

    function normalizeCalcOperation(value) {
      const operation = String(value || "").trim();
      if (operation === "/") return "÷";
      if (operation.toLowerCase() === "x") return "*";
      return CALC_OPERATIONS.has(operation) ? operation : "";
    }

    function isCalcVariableNode(node) {
      return node instanceof HTMLElement && node.dataset.variable === "true";
    }

    function setCalcVariableNode(node, active) {
      if (!(node instanceof HTMLElement) || isCommandNode(node)) return false;
      const shouldBeActive = Boolean(active);
      if (shouldBeActive === isCalcVariableNode(node)) return false;

      if (shouldBeActive) {
        node.dataset.variable = "true";
        node.classList.add("variable-node");
        node.contentEditable = "false";
        node.classList.remove("editing");
      } else {
        delete node.dataset.variable;
        node.classList.remove("variable-node");
      }
      renderNode(node);
      return true;
    }

    function getNodeNumericValue(node) {
      if (!(node instanceof HTMLElement)) return null;
      const text = (node.textContent || "").replace(/,/g, "").trim();
      if (!text) return null;
      const value = Number(text);
      return Number.isFinite(value) ? value : null;
    }

    function formatCalcResult(value) {
      if (!Number.isFinite(value)) return "NaN";
      const normalized = Math.abs(value) < 1e-12 ? 0 : value;
      return Number(normalized.toPrecision(12)).toString();
    }

    function getIncomingCalcLine(nodeId, visitedLineIds) {
      let candidate = null;
      for (const line of lineConnections) {
        const operation = normalizeCalcOperation(line.operation);
        if (
          line.deletedAt ||
          operation === "" ||
          operation === "=" ||
          line.to !== nodeId ||
          visitedLineIds.has(line.id)
        ) {
          continue;
        }
        candidate = line;
      }
      return candidate;
    }

    function buildCalcChain(finalNodeId) {
      const visitedLineIds = new Set();
      const visitedNodeIds = new Set([finalNodeId]);
      const reversedLines = [];
      let currentId = finalNodeId;

      while (currentId) {
        const line = getIncomingCalcLine(currentId, visitedLineIds);
        if (!line) break;
        if (visitedNodeIds.has(line.from)) return null;
        visitedLineIds.add(line.id);
        visitedNodeIds.add(line.from);
        reversedLines.push(line);
        currentId = line.from;
      }

      return {
        startId: currentId,
        lines: reversedLines.reverse()
      };
    }

    function calculateChainValue(finalNodeId) {
      const chain = buildCalcChain(finalNodeId);
      if (!chain || !chain.startId) return null;

      const startNode = getNodeById(chain.startId);
      let value = getNodeNumericValue(startNode);
      if (value === null) return null;

      for (const line of chain.lines) {
        const node = getNodeById(line.to);
        const nextValue = getNodeNumericValue(node);
        if (nextValue === null) return null;
        const operation = normalizeCalcOperation(line.operation);
        if (operation === "+") value += nextValue;
        else if (operation === "-") value -= nextValue;
        else if (operation === "*") value *= nextValue;

      const targetIds = new Set(equalLines.map((line) => line.to).filter(Boolean));
      let changed = false;

      for (const node of world.children) {
        if (!(node instanceof HTMLElement) || isCommandNode(node) || isNodeDeleted(node)) continue;
        if (!targetIds.has(node.dataset.nodeId || "")) {

      for (let pass = 0; pass < passes; pass += 1) {
        let passChanged = false;
        for (const line of equalLines) {
          const targetNode = getNodeById(line.to);
          if (!targetNode || isCommandNode(targetNode)) continue;
          changed = setCalcVariableNode(targetNode, true) || changed;
          const result = calculateChainValue(line.from);
          const nextText = result === null ? "NaN" : formatCalcResult(result);
          if (targetNode.textContent !== nextText) {

            renderNode(targetNode);
            passChanged = true;
            changed = true;

      if (changed) {

        refreshSelectionBounds();
        updateDocumentTitle();

    function setLineOperation(lineId, operation) {

      if (!line) return false;
      line.operation = normalized;
      renderLineConnections();
      updateCalcVariables();
      scheduleAutosave();
      return true;
    }

    function createLineConnection(sourceNode, targetNode) {
      if (!(sourceNode instanceof HTMLElement) || !(targetNode instanceof HTMLElement)) return false;
      if (isNodeDeleted(sourceNode) || isNodeDeleted(targetNode)) return false;
      if (!world.contains(sourceNode) || !world.contains(targetNode) || sourceNode === targetNode) return false;

      const from = normalizeLineEndpointId(sourceNode.dataset.nodeId || "");
      const to = normalizeLineEndpointId(targetNode.dataset.nodeId || "");
      if (!from || !to || from === to || hasLineConnection(from, to)) return false;

      lineConnections.push({
        id: generateLineId(),
        from,
        to,
        createdAt: Date.now()
      });
      renderLineConnections();
      scheduleAutosave();
      return true;
    }

    function removeLineConnection(lineId) {
      const id = typeof lineId === "string" ? lineId.trim() : "";
      if (!id) return false;
      const line = lineConnections.find((entry) => entry.id === id && !entry.deletedAt);
      if (!line) return false;
      line.deletedAt = Date.now();
      renderLineConnections();
      updateCalcVariables();
      scheduleAutosave();
      return true;
    }

    function serializeLineConnection(line) {
      const serialized = {
        id: line.id || "",
        from: line.from || "",
        to: line.to || ""
      };
      const createdAt = normalizeTimestamp(line.createdAt);
      const deletedAt = normalizeTimestamp(line.deletedAt);
      if (createdAt) serialized.createdAt = createdAt;
      if (deletedAt) serialized.deletedAt = deletedAt;
      const operation = normalizeCalcOperation(line.operation);
      if (operation) serialized.operation = operation;
      return serialized;
    }

    function loadLineConnections(entries, options = {}) {
      const reportProgress = typeof options.onProgress === "function" ? options.onProgress : null;
      lineConnections = [];
      nextLineNumber = 1;

      if (!Array.isArray(entries)) {
        renderLineConnections();
        if (reportProgress) reportProgress(1);
        return;

      const seen = new Set();
      entries.forEach((entry, index) => {
        if (!entry || typeof entry !== "object") {
          if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
          return;
        }
        const from = normalizeLineEndpointId(entry.from);
        const to = normalizeLineEndpointId(entry.to);
        if (
          !from ||
          !to ||
          from === to ||
          !getNodeById(from, { includeDeleted: true }) ||
          !getNodeById(to, { includeDeleted: true })
        ) {
          if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
          return;
        }

        const key = getLineConnectionKey(from, to);
        const createdAt = normalizeTimestamp(entry.createdAt);
        const deletedAt = normalizeTimestamp(entry.deletedAt);
        if (!deletedAt) {
          if (seen.has(key)) {
            if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
            return;
          }
          seen.add(key);
        }

        lineConnections.push({
          id: resolveLineId(entry.id),
          from,
          to,
          ...(normalizeCalcOperation(entry.operation) ? { operation: normalizeCalcOperation(entry.operation) } : {}),
          ...(createdAt ? { createdAt } : {}),
          ...(deletedAt ? { deletedAt } : {})
        });
        if (reportProgress) reportProgress((index + 1) / Math.max(1, entries.length));
      });

      renderLineConnections();
      updateCalcVariables();
      if (reportProgress) reportProgress(1);
    }

    function removeLineConnectionsForNodes(nodes, deletedAt = Date.now()) {

          .filter((node) => node instanceof HTMLElement)
          .map((node) => normalizeLineEndpointId(node.dataset.nodeId || ""))
          .filter(Boolean)
      );
      if (nodeIds.size === 0) return false;

      let changed = false;
      lineConnections.forEach((line) => {
        if (line.deletedAt || (!nodeIds.has(line.from) && !nodeIds.has(line.to))) return;
        line.deletedAt = deletedAt;
        changed = true;
      });
      if (!changed) return false;
      renderLineConnections();
      updateCalcVariables();
      return true;
    }

    function softDeleteNodes(nodes, deletedAt = Date.now()) {
      const targets = nodes.filter((node) => node instanceof HTMLElement && world.contains(node) && !isNodeDeleted(node));
      if (targets.length === 0) return false;

      removeLineConnectionsForNodes(targets, deletedAt);
      for (const node of targets) {
        if (selectedNodes.has(node)) selectedNodes.delete(node);
        if (node.classList.contains("editing")) stopEditing(node);
        destroyCommandNodeContent(node);
        unobserveNodeForLines(node);
        node.dataset.deletedAt = String(deletedAt);
        node.setAttribute("aria-hidden", "true");
        node.classList.remove("selected", "editing", "navigation-target-highlight");

      renderLineConnections();
      updateDocumentTitle();
      scheduleAutosave();
      return true;
    }

    function deleteSelectedNodes() {

      closeLineContextMenu();
      closeCanvasContextMenu();
      cancelNodeLayoutAnimation();
      const deleted = softDeleteNodes(Array.from(selectedNodes));
      clearSelection();
      return deleted;

    function requestLineRender() {

        renderLineConnections();

    function observeNodeForLines(node) {
      if (nodeResizeObserver && node instanceof HTMLElement) nodeResizeObserver.observe(node);

    function unobserveNodeForLines(node) {

    }

    function getNodeWorldCenter(node) {
      const corners = getNodeWorldCorners(node);
      if (corners.length === 4) {

          x: (corners[0].x + corners[2].x) / 2,
          y: (corners[0].y + corners[2].y) / 2

      }
      const size = getNodeWorldSize(node);
      return {
        x: Number(node.dataset.x) + size.width / 2,
        y: Number(node.dataset.y) + size.height / 2
      };
    }

    function getCameraScale() {
      return Number.isFinite(camera.scale) && camera.scale > 0 ? camera.scale : 1;

    function screenToWorldLength(value) {
      return value / getCameraScale();
    }

    function getNodeRenderMetrics(node) {
      const baseFontSize = getNodeBaseFontSize(node);
      const cameraScale = getCameraScale();
      const visualFontPx = baseFontSize * cameraScale;
      const layoutFontPx = clamp(visualFontPx, MIN_NODE_LAYOUT_FONT_PX, MAX_NODE_LAYOUT_FONT_PX);
      return {
        baseFontSize,
        cameraScale,
        visualFontPx,
        layoutFontPx,
        screenScale: visualFontPx / layoutFontPx,
        worldScale: baseFontSize / layoutFontPx
      };
    }

    function getScreenAffordanceScale(fontSize) {
      const t = clamp(
        (fontSize - ZOOM_AFFORDANCE_MIN_FONT_SCREEN_PX) /
          (ZOOM_AFFORDANCE_FULL_FONT_SCREEN_PX - ZOOM_AFFORDANCE_MIN_FONT_SCREEN_PX),
        0,
        1

      return easeInOutNatural(t);
    }

    function getNodeBaseFontSize(node) {
      if (!(node instanceof HTMLElement)) return BASE_TEXT_PX / getCameraScale();
      const baseFontSize = Number(node.dataset.baseFontSize);
      return Number.isFinite(baseFontSize) && baseFontSize > 0 ? baseFontSize : BASE_TEXT_PX / getCameraScale();
    }

    function getNodeRenderedFontSize(node) {
      return getNodeBaseFontSize(node) * getCameraScale();
    }

    function getNodeScreenAffordanceScale(node) {
      return getScreenAffordanceScale(getNodeRenderedFontSize(node));
    }

    function getTextNodeMinWidthScreenPx(fontSize) {
      return TEXT_NODE_MIN_HIT_WIDTH_SCREEN_PX * getScreenAffordanceScale(fontSize);
    }

    function getSelectedNodesAffordanceScale() {
      if (selectedNodes.size === 0) return getScreenAffordanceScale(BASE_TEXT_PX * getCameraScale());
      let scale = 0;
      for (const node of selectedNodes) {
        if (node instanceof HTMLElement && world.contains(node)) {
          scale = Math.max(scale, getNodeScreenAffordanceScale(node));
        }
      }
      return scale;
    }

    function getGroupSelectionPaddingScreenPx() {
      return GROUP_SELECTION_PADDING_PX * getSelectedNodesAffordanceScale();
    }

    function getGroupSelectionHandleScreenPx() {
      return Math.max(
        MIN_GROUP_SELECTION_HANDLE_SCREEN_PX,
        GROUP_SELECTION_HANDLE_SCREEN_PX * getSelectedNodesAffordanceScale()
      );
    }

    function getNodeAnchorPaddingWorld(node) {
      const fontSize = getNodeRenderedFontSize(node);
      const affordanceScale = getScreenAffordanceScale(fontSize);
      const naturalPadding = fontSize * LINE_ANCHOR_ELLIPSE_PADDING_FONT_RATIO;
      const padding = clamp(
        Math.max(naturalPadding, MIN_LINE_ANCHOR_ELLIPSE_PADDING_SCREEN_PX * affordanceScale),
        0,
        Math.max(naturalPadding, MAX_LINE_ANCHOR_ELLIPSE_PADDING_SCREEN_PX * affordanceScale)

      return screenToWorldLength(padding);
    }

    function getLineEndpointGapWorld(node) {
      const fontSize = getNodeRenderedFontSize(node);
      const gap = Math.max(
        fontSize * 0.06,
        LINE_ENDPOINT_GAP_SCREEN_PX * getScreenAffordanceScale(fontSize)

      return screenToWorldLength(gap);
    }

    function getLineWidthWorldFromScreen(widthPx) {
      return screenToWorldLength(widthPx);
    }

    function getLineShadowExtraWidthWorld(startWidth, endWidth) {
      const maxLineWidthPx = Math.max(startWidth, endWidth) * getCameraScale();
      const equivalentFontSize = maxLineWidthPx / LINE_WIDTH_FONT_RATIO;
      const extraWidthPx = Math.min(
        LINE_SHADOW_EXTRA_WIDTH_SCREEN_PX * getScreenAffordanceScale(equivalentFontSize),
        maxLineWidthPx * 1.4
      );
      return screenToWorldLength(extraWidthPx);
    }

    function getDraftDashLengthWorld() {
      return screenToWorldLength(LINE_DRAFT_DASH_LENGTH_SCREEN_PX);
    }

    function getDraftGapLengthWorld() {
      return screenToWorldLength(LINE_DRAFT_GAP_LENGTH_SCREEN_PX);
    }

    function getNodeAnchorPoint(node, towardPoint) {
      const size = getNodeWorldSize(node);
      const center = getNodeWorldCenter(node);
      let dx = towardPoint.x - center.x;
      let dy = towardPoint.y - center.y;
      let length = Math.hypot(dx, dy);
      if (length < 0.001) {
        dx = 1;
        dy = 0;
        length = 1;
      }

      const normalX = dx / length;
      const normalY = dy / length;
      const rotation = getNodeRotation(node);
      const basis = getCameraBasis(rotation);
      const localDx = dx * basis.cos + dy * basis.sin;
      const localDy = -dx * basis.sin + dy * basis.cos;
      const padding = getNodeAnchorPaddingWorld(node);
      const radiusX = Math.max(size.width / 2 + padding, 0.5);
      const radiusY = Math.max(size.height / 2 + padding, 0.5);
      const ellipseScale = 1 / Math.max(
        0.001,
        Math.sqrt((localDx * localDx) / (radiusX * radiusX) + (localDy * localDy) / (radiusY * radiusY))
      );
      const endpointGap = getLineEndpointGapWorld(node);

      return {
        x: center.x + dx * ellipseScale + normalX * endpointGap,
        y: center.y + dy * ellipseScale + normalY * endpointGap
      };
    }

    function getLineAnchorPair(sourceNode, targetNode) {
      const sourceCenter = getNodeWorldCenter(sourceNode);
      const targetCenter = getNodeWorldCenter(targetNode);
      const centerDx = targetCenter.x - sourceCenter.x;
      const centerDy = targetCenter.y - sourceCenter.y;
      const centerDistance = Math.hypot(centerDx, centerDy);
      if (centerDistance * getCameraScale() < MIN_VISIBLE_LINE_LENGTH_SCREEN_PX) return null;

      const start = getNodeAnchorPoint(sourceNode, targetCenter);
      const end = getNodeAnchorPoint(targetNode, sourceCenter);
      const projectedDistance = ((end.x - start.x) * centerDx + (end.y - start.y) * centerDy) / centerDistance;
      if (projectedDistance * getCameraScale() < MIN_VISIBLE_LINE_LENGTH_SCREEN_PX) return null;

      return {
        start,
        end
      };
    }

    function getNodeLineWidth(node) {
      const fontSize = getNodeRenderedFontSize(node);
      const naturalWidth = fontSize * LINE_WIDTH_FONT_RATIO;
      const width = Math.min(
        Math.max(naturalWidth, MIN_LINE_WIDTH_SCREEN_PX * getScreenAffordanceScale(fontSize)),
        MAX_LINE_WIDTH_SCREEN_PX
      );
      return screenToWorldLength(width);
    }

    function getStableLineSeed(value) {
      const text = String(value || "");
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function formatLineNumber(value) {
      return Number.isFinite(value) ? Number(value.toFixed(3)) : 0;
    }

    function getNaturalLineGeometry(start, end, seedValue) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 0.5) {
        return {
          start,
          control1: start,
          control2: end,
          end,
          distance
        };
      }

      const unitX = dx / distance;
      const unitY = dy / distance;
      const seed = getStableLineSeed(seedValue);
      const direction = seed % 2 === 0 ? 1 : -1;
      const variation = ((((seed >>> 4) % 17) - 8) / 8) * Math.min(1, distance * 0.004);
      const bow = Math.min(distance * 0.026, 24) * direction + variation;
      const gravity = Math.min(distance * 0.01, 12);
      const bendX = -unitY * bow;
      const bendY = unitX * bow + gravity;
      const control1 = {
        x: start.x + dx * 0.34 + bendX,
        y: start.y + dy * 0.34 + bendY
      };
      const control2 = {
        x: start.x + dx * 0.66 + bendX,
        y: start.y + dy * 0.66 + bendY
      };

      return {
        start,
        control1,
        control2,
        end,
        distance
      };
    }

    function getNaturalLineCenterPath(geometry) {
      return [
        "M", formatLineNumber(geometry.start.x), formatLineNumber(geometry.start.y),
        "C", formatLineNumber(geometry.control1.x), formatLineNumber(geometry.control1.y),
        formatLineNumber(geometry.control2.x), formatLineNumber(geometry.control2.y),
        formatLineNumber(geometry.end.x), formatLineNumber(geometry.end.y)
      ].join(" ");
    }

    function appendCalcOperationMarker(group, geometry, operation) {
      const normalized = normalizeCalcOperation(operation);
      if (!normalized) return;
