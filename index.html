<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skydive</title>
  <script src="https://unpkg.com/@zenberry/quico@latest/dist/quico.js"></script>
  <quico>S</quico>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap");

    @font-face {
      font-family: "Myriad Pro";
      src: url("https://res.cloudinary.com/zenberry/raw/upload/v1752586755/fonts/myriadpro_light.woff2") format("woff2");
      font-display: swap;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      background: #fff;
      cursor: default;
    }

    #viewport.panning,
    #viewport.panning .text-node,
    #viewport.panning .external-link-card,
    #viewport.panning #group-selection-box,
    #viewport.panning #group-selection-handle {
      cursor: grabbing;
    }

    #viewport.line-drafting,
    #viewport.line-drafting .text-node,
    #viewport.line-drafting .external-link-card {
      cursor: crosshair;
    }

    #line-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      transform-origin: 0 0;
    }

    #line-hit-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      transform-origin: 0 0;
    }

    .connection-line {
      stroke: none;
      shape-rendering: geometricPrecision;
    }

    .connection-line-shadow {
      fill: rgba(255, 255, 255, 0.74);
    }

    .connection-line-stroke {
      fill: rgba(54, 59, 68, 0.5);
    }

    .connection-line-draft .connection-line-shadow {
      fill: rgba(255, 255, 255, 0.82);
    }

    .connection-line-draft .connection-line-stroke {
      fill: rgba(46, 52, 62, 0.42);
    }

    .connection-line-hit {
      fill: none;
      stroke: rgba(0, 0, 0, 0);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 14px;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: context-menu;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font: 400 16px/1.4 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }

    #loading-screen[hidden] {
      display: none;
    }

    .text-node {
      position: absolute;
      min-width: 12px;
      min-height: 1em;
      line-height: 1.25;
      color: #111;
      white-space: pre;
      width: max-content;
      max-width: none;
      overflow-wrap: normal;
      word-break: keep-all;
      user-select: none;
      cursor: grab;
      outline: none;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
    }

    .text-node.selected {
      outline: 1px solid rgba(29, 78, 216, 0.5);
      outline-offset: 2px;
    }

    .text-node.editing {
      user-select: text;
      cursor: text;
    }

    .command-node {
      min-width: 0;
      min-height: 0;
      white-space: normal;
      cursor: grab;
    }

    .command-node button {
      font: inherit;
    }

    .command-node [data-command-interactive] {
      cursor: pointer;
    }

    .internal-link {
      color: #6b7280;
      text-decoration: underline;
      cursor: pointer;
    }

    .text-node.editing .internal-link {
      cursor: text;
    }

    .external-link-card {
      display: inline-grid;
      gap: 0.35em;
      max-width: 18em;
      margin: 0 0.12em;
      padding: 0.45em 0.52em 0.42em;
      border: 0.04em solid #e4d7c5;
      border-radius: 0.55em;
      background: #fff8ed;
      box-shadow: 0 0.22em 0.8em rgba(82, 59, 36, 0.07);
      color: #3f3328;
      cursor: grab;
      vertical-align: middle;
      white-space: normal;
      user-select: none;
    }

    .external-link-label {
      display: none;
    }

    .external-link-card::before {
      content: attr(data-display-label);
      overflow: hidden;
      color: #4b3b2d;
      display: block;
      font: 500 0.78em/1.16 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      text-decoration: underline;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .external-link-actions,
    .external-link-editor-actions {
      display: flex;
      gap: 0.25em;
      align-items: center;
    }

    .external-link-card button {
      border: 0;
      border-radius: 0.38em;
      background: #eee1cf;
      padding: 0.26em 0.42em;
      color: #4b3b2d;
      font: 500 0.45em/1 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
    }

    .external-link-card button:hover {
      background: #e7d6bf;
    }

    .external-link-editor {
      display: grid;
      gap: 0.25em;
    }

    .external-link-editor[hidden] {
      display: none;
    }

    .external-link-editor input {
      width: 17em;
      max-width: 100%;
      box-sizing: border-box;
      border: 0.04em solid #e0d2c0;
      border-radius: 0.38em;
      background: #fffdf9;
      padding: 0.28em 0.38em;
      color: #3f3328;
      font: 400 0.46em/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      outline: none;
    }

    .text-node.navigation-target-highlight {
      animation: destination-text-glow 5000ms linear forwards;
    }

    @keyframes destination-text-glow {
      0% {
        text-shadow:
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0);
      }
      16% {
        text-shadow:
          0 0 0.22em rgba(255, 255, 255, 0.98),
          0 0 0.56em rgba(255, 255, 255, 0.9),
          0 0 1.28em rgba(255, 255, 255, 0.72);
      }
      74% {
        text-shadow:
          0 0 0.26em rgba(255, 255, 255, 0.88),
          0 0 0.66em rgba(255, 255, 255, 0.74),
          0 0 1.38em rgba(255, 255, 255, 0.52);
      }
      100% {
        text-shadow:
          0 0 0.36em rgba(255, 255, 255, 0),
          0 0 0.9em rgba(255, 255, 255, 0),
          0 0 1.7em rgba(255, 255, 255, 0);
      }
    }

    #node-context-menu,
    #line-context-menu {
      position: fixed;
      z-index: 1000;
      min-width: 190px;
      padding: 6px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
      display: grid;
      gap: 4px;
    }

    #node-context-menu[hidden],
    #line-context-menu[hidden] {
      display: none;
    }

    #node-context-menu button,
    #line-context-menu button {
      border: 0;
      background: transparent;
      padding: 8px 10px;
      text-align: left;
      border-radius: 6px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      cursor: pointer;
    }

    #node-context-menu button:hover:not(:disabled),
    #line-context-menu button:hover:not(:disabled) {
      background: #f2f4f7;
    }

    #node-context-menu button:disabled,
    #line-context-menu button:disabled {
      color: #999;
      cursor: not-allowed;
    }

    #link-node-dialog {
      position: fixed;
      z-index: 1100;
      width: min(300px, calc(100vw - 16px));
      padding: 6px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
      display: grid;
      gap: 4px;
    }

    #link-node-dialog[hidden] {
      display: none;
    }

    #link-node-dialog-title {
      padding: 8px 10px 6px;
      border-radius: 6px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      cursor: move;
      touch-action: none;
    }

    #link-node-dialog-input {
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      margin: 8px;
      padding: 8px 10px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      outline: none;
    }

    #link-node-dialog-input:focus {
      border-color: #d0d0d0;
      box-shadow: none;
    }

    #link-node-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    #link-node-dialog button {
      border: 0;
      background: transparent;
      padding: 8px 10px;
      text-align: left;
      border-radius: 6px;
      font: 500 14px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #111;
      cursor: pointer;
    }

    #link-node-dialog button:hover {
      background: #f2f4f7;
    }

    #slash-command-menu {
      position: fixed;
      z-index: 1200;
      width: min(240px, calc(100vw - 16px));
      padding: 6px;
      border: 1px solid #e2d7c7;
      border-radius: 10px;
      background: #fffaf3;
      box-shadow: 0 10px 28px rgba(83, 63, 43, 0.12);
      display: grid;
      gap: 3px;
    }

    #slash-command-menu[hidden] {
      display: none;
    }

    .slash-command-option {
      border: 0;
      border-radius: 7px;
      background: transparent;
      padding: 8px 9px;
      text-align: left;
      color: #3f3328;
      cursor: pointer;
    }

    .slash-command-option[aria-selected="true"],
    .slash-command-option:hover {
      background: #f2e6d7;
    }

    .slash-command-name {
      display: block;
      font: 500 13px/1.2 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    .slash-command-hint {
      display: block;
      margin-top: 2px;
      font: 400 12px/1.25 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      color: #7b6a58;
    }

    #marquee-selection {
      position: absolute;
      z-index: 430;
      border: 1px solid #2563eb;
      background: rgba(37, 99, 235, 0.16);
      pointer-events: none;
    }

    #marquee-selection[hidden] {
      display: none;
    }

    #group-selection-box {
      position: absolute;
      z-index: 420;
      border: 1px solid #1d4ed8;
      background: rgba(29, 78, 216, 0.05);
      cursor: move;
      touch-action: none;
      box-sizing: border-box;
    }

    #group-selection-box[hidden] {
      display: none;
    }

    #group-selection-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      right: -7px;
      bottom: -7px;
      border: 1px solid #fff;
      background: #1d4ed8;
      box-sizing: border-box;
      cursor: nwse-resize;
    }

    .fit-marker {
      position: fixed;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 1500;
    }

    .fit-marker.guide {
      background: #22c55e;
    }

    .fit-marker.target {
      background: #facc15;
    }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite">Loading... 0% done</div>
  <div id="viewport">
    <svg id="line-layer" aria-hidden="true"></svg>
    <div id="world"></div>
    <svg id="line-hit-layer" aria-hidden="true"></svg>
    <div id="marquee-selection" hidden></div>
    <div id="group-selection-box" hidden>
      <div id="group-selection-handle"></div>
    </div>
  </div>
  <div id="fit-guide-left" class="fit-marker guide" aria-hidden="true" hidden></div>
  <div id="fit-guide-right" class="fit-marker guide" aria-hidden="true" hidden></div>
  <div id="fit-target-left" class="fit-marker target" aria-hidden="true" hidden></div>
  <div id="fit-target-right" class="fit-marker target" aria-hidden="true" hidden></div>
  <div id="node-context-menu" hidden>
    <button id="copy-node-id-btn" type="button">Copy node ID</button>
    <button id="draw-line-btn" type="button">Line</button>
    <button id="link-selection-btn" type="button">Link selection to node ID...</button>
  </div>
  <div id="line-context-menu" hidden>
    <button id="delete-line-btn" type="button">Delete line</button>
  </div>
  <div id="link-node-dialog" hidden>
    <div id="link-node-dialog-title">Paste target node ID</div>
    <input id="link-node-dialog-input" type="text" autocomplete="off" spellcheck="false">
    <div id="link-node-dialog-actions">
      <button id="link-node-dialog-cancel-btn" type="button">Cancel</button>
      <button id="link-node-dialog-confirm-btn" type="button">Link</button>
    </div>
  </div>
  <div id="slash-command-menu" hidden></div>
  <input id="open-file-input" type="file" accept=".mind.json,.json,application/json" hidden>

  <script src="/commands/stw.js"></script>
  <script src="/commands/timer.js"></script>
  <script src="/commands/file.js"></script>
  <script>
    const viewport = document.getElementById("viewport");
    const lineLayer = document.getElementById("line-layer");
    const lineHitLayer = document.getElementById("line-hit-layer");
    const world = document.getElementById("world");
    const loadingScreen = document.getElementById("loading-screen");
    const marqueeSelection = document.getElementById("marquee-selection");
    const groupSelectionBox = document.getElementById("group-selection-box");
    const groupSelectionHandle = document.getElementById("group-selection-handle");
    const openFileInput = document.getElementById("open-file-input");
    const nodeContextMenu = document.getElementById("node-context-menu");
    const copyNodeIdBtn = document.getElementById("copy-node-id-btn");
    const drawLineBtn = document.getElementById("draw-line-btn");
    const linkSelectionBtn = document.getElementById("link-selection-btn");
    const lineContextMenu = document.getElementById("line-context-menu");
    const deleteLineBtn = document.getElementById("delete-line-btn");
    const linkNodeDialog = document.getElementById("link-node-dialog");
    const linkNodeDialogTitle = document.getElementById("link-node-dialog-title");
    const linkNodeDialogInput = document.getElementById("link-node-dialog-input");
    const linkNodeDialogCancelBtn = document.getElementById("link-node-dialog-cancel-btn");
    const linkNodeDialogConfirmBtn = document.getElementById("link-node-dialog-confirm-btn");
    const slashCommandMenu = document.getElementById("slash-command-menu");
    const fitGuideLeft = document.getElementById("fit-guide-left");
    const fitGuideRight = document.getElementById("fit-guide-right");
    const fitTargetLeft = document.getElementById("fit-target-left");
    const fitTargetRight = document.getElementById("fit-target-right");

    const BASE_TEXT_PX = 28;
    const ZOOM_SENSITIVITY = 0.012;
    const NAVIGATION_VIEWPORT_FILL = 0.98;
    const MIN_NAVIGATION_SCALE = 0.08;
    const MARQUEE_DRAG_THRESHOLD_PX = 3;
    const GROUP_SELECTION_PADDING_PX = 8;
    const LINE_ENDPOINT_GAP_WORLD = 4.5;
    const LINE_ANCHOR_ELLIPSE_PADDING_WORLD = 18;
    const LINE_WIDTH_FONT_RATIO = 0.04;
    const MIN_LINE_WIDTH_WORLD = 0.82;
    const MAX_LINE_WIDTH_WORLD = 3.8;
    const LINE_SHADOW_EXTRA_WIDTH_WORLD = 1.35;
    const LINE_DRAFT_THICKNESS_EASE = 0.18;
    const LINE_DRAFT_END_WIDTH_RATIO = 0.78;
    const LINE_DRAFT_DASH_LENGTH_WORLD = 8;
    const LINE_DRAFT_GAP_LENGTH_WORLD = 7;
    const LINE_DRAFT_SPRING = 0.24;
    const LINE_DRAFT_DAMPING = 0.66;
    const STORAGE_KEY = "mindmap.v1";
    const CLOUDINARY_SIGNATURE_URL = "/.netlify/functions/cloudinary-signature";
    const FILE_WIDGET_COMMAND_ID = "file";
    const SVG_NS = "http://www.w3.org/2000/svg";
    const RESERVED_SHARED_SPACE_SLUGS = new Set(["agents", "api"]);
    const SHARED_SPACE_SLUG = getSharedSpaceSlug();
    const SHARED_POLL_MS = 2000;
    const ALIGN_ANIMATION_DURATION_MS = 620;
    const FILE_TYPES = [{
      description: "Mind Map JSON",
      accept: { "application/json": [".mind.json", ".json"] }
    }];

    let fileHandle = null;
    let saveTimer = null;
    let suppressAutosave = false;
    let nextNodeNumber = 1;
    let nextLineNumber = 1;
    let cameraAnimationFrame = null;
    let nodeLayoutAnimationFrame = null;
    let lineRenderFrame = null;
    let lineDraftAnimationFrame = null;
    let contextMenuNode = null;
    let contextMenuLineId = null;
    let contextMenuSelectionRange = null;
    let pendingLinkSourceNode = null;
    let pendingLinkSelectionRange = null;
    let linkDialogDrag = null;
    let lineDraft = null;
    let marqueeSession = null;
    let panSession = null;
    let groupTransform = null;
    let selectionBoundsWorld = null;
    let navigationFitTargetNode = null;
    let navigationFitMarkersVisible = false;
    let latestSharedUpdatedAt = 0;
    let applyingSharedState = false;
    let savingSharedState = false;
    let sharedPollTimer = null;
    let slashCommandSession = null;
    let slashCommandSelectedIndex = 0;
    let externalLinkCardPointer = null;
    let loadingProgressValue = 0;
    let lineConnections = [];
    const nodeHighlightTimeouts = new WeakMap();
    const selectedNodes = new Set();
    const nodeResizeObserver = "ResizeObserver" in window
      ? new ResizeObserver(() => requestLineRender())
      : null;

    const camera = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      scale: 1
    };

    function getSharedSpaceSlug() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      if (parts.length !== 1 || parts[0] === "index.html") return "";

      let slug = "";
      try {
        slug = decodeURIComponent(parts[0]).trim();
      } catch (error) {
        slug = parts[0].trim();
      }
      return RESERVED_SHARED_SPACE_SLUGS.has(slug) ? "" : slug;
    }

    function getStorageKey() {
      return SHARED_SPACE_SLUG ? `${STORAGE_KEY}.${SHARED_SPACE_SLUG}` : STORAGE_KEY;
    }

    function setLoadingProgress(percent) {
      if (!loadingScreen) return;
      const value = Math.max(0, Math.min(100, Math.round(percent)));
      if (value < loadingProgressValue) return;
      loadingProgressValue = value;
      loadingScreen.textContent = `Loading... ${value}% done`;
    }

    function hideLoadingScreen() {
      setLoadingProgress(100);
      if (loadingScreen) loadingScreen.hidden = true;
    }

    function getNodeById(nodeId) {
      const id = typeof nodeId === "string" ? nodeId.trim() : "";
      if (!id) return null;
      for (const node of world.children) {
        if (node.dataset.nodeId === id) return node;
      }
      return null;
    }

    function updateNextNodeNumberFromId(nodeId) {
      const match = /^node-(\d+)$/.exec(nodeId);
      if (!match) return;
      const value = Number(match[1]);
      if (!Number.isFinite(value)) return;
      nextNodeNumber = Math.max(nextNodeNumber, value + 1);
    }

    function isNodeIdInUse(nodeId) {
      return Boolean(getNodeById(nodeId));
    }

    function generateNodeId() {
      let candidate = `node-${nextNodeNumber}`;
      while (isNodeIdInUse(candidate)) {
        nextNodeNumber += 1;
        candidate = `node-${nextNodeNumber}`;
      }
      nextNodeNumber += 1;
      return candidate;
    }

    function resolveNodeId(preferredId) {
      const requested = typeof preferredId === "string" ? preferredId.trim() : "";
      if (!requested) return generateNodeId();
      if (!isNodeIdInUse(requested)) {
        updateNextNodeNumberFromId(requested);
        return requested;
      }
      let suffix = 2;
      let candidate = `${requested}-${suffix}`;
      while (isNodeIdInUse(candidate)) {
        suffix += 1;
        candidate = `${requested}-${suffix}`;
      }
      return candidate;
    }

    function normalizeExternalHref(value) {
      const raw = typeof value === "string" ? value.trim() : "";
      if (!raw) return "";

      try {
        const url = new URL(raw);
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
      } catch (error) {
        return "";
      }
    }

    function getDefaultExternalLinkLabel(href) {
      const normalized = normalizeExternalHref(href);
      if (!normalized) return "";

      try {
        const url = new URL(normalized);
        if (url.search) {
          return `${url.origin}${url.pathname}...`;
        }
      } catch (error) {
        return normalized;
      }

      return normalized;
    }

    function getExternalLinkDisplayLabel(href, label) {
      const custom = typeof label === "string" ? label.trim() : "";
      return custom || getDefaultExternalLinkLabel(href);
    }

    function createExternalLinkCard(href, label = "", options = {}) {
      const normalizedHref = normalizeExternalHref(href);
      if (!normalizedHref) return null;

      const card = document.createElement("span");
      card.className = "external-link-card";
      card.contentEditable = "false";
      card.dataset.href = normalizedHref;
      card.dataset.label = typeof label === "string" ? label.trim() : "";
      attachExternalLinkCardPointerHandlers(card);

      renderExternalLinkCard(card, options);
      return card;
    }

    function renderExternalLinkCard(card, options = {}) {
      const href = normalizeExternalHref(card.dataset.href || "");
      const label = typeof card.dataset.label === "string" ? card.dataset.label : "";
      if (!href) return;

      const isEditing = Boolean(options.editing);
      card.dataset.displayLabel = getExternalLinkDisplayLabel(href, label);
      card.replaceChildren();

      const actions = document.createElement("span");
      actions.className = "external-link-actions";
      actions.hidden = isEditing;

      const openButton = document.createElement("button");
      openButton.type = "button";
      openButton.dataset.externalLinkAction = "open";
      openButton.textContent = "Open";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.dataset.externalLinkAction = "edit";
      editButton.textContent = "Edit";

      const flattenButton = document.createElement("button");
      flattenButton.type = "button";
      flattenButton.dataset.externalLinkAction = "flatten";
      flattenButton.textContent = "Flatten";
      actions.append(openButton, editButton, flattenButton);
      card.appendChild(actions);

      const editor = document.createElement("span");
      editor.className = "external-link-editor";
      editor.hidden = !isEditing;

      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.dataset.externalLinkField = "label";
      labelInput.placeholder = "Label";
      labelInput.value = label;

      const hrefInput = document.createElement("input");
      hrefInput.type = "url";
      hrefInput.dataset.externalLinkField = "href";
      hrefInput.placeholder = "Link";
      hrefInput.value = href;

      const editorActions = document.createElement("span");
      editorActions.className = "external-link-editor-actions";

      const saveButton = document.createElement("button");
      saveButton.type = "button";
      saveButton.dataset.externalLinkAction = "save";
      saveButton.textContent = "Save";

      const cancelButton = document.createElement("button");
      cancelButton.type = "button";
      cancelButton.dataset.externalLinkAction = "cancel";
      cancelButton.textContent = "Cancel";
      editorActions.append(saveButton, cancelButton);
      editor.append(labelInput, hrefInput, editorActions);
      card.appendChild(editor);
    }

    function sanitizeNodeHtml(rawHtml) {
      if (typeof rawHtml !== "string" || rawHtml.length === 0) return "";

      const source = document.createElement("div");
      source.innerHTML = rawHtml;
      const output = document.createElement("div");

      function walk(node, target) {
        if (node.nodeType === Node.TEXT_NODE) {
          target.appendChild(document.createTextNode(node.textContent || ""));
          return;
        }

        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const element = node;
        const tag = element.tagName;

        if (tag === "BR") {
          target.appendChild(document.createElement("br"));
          return;
        }

        if (tag === "SPAN" && element.classList.contains("internal-link")) {
          const targetId = (element.dataset.targetId || "").trim();
          if (targetId) {
            const link = document.createElement("span");
            link.className = "internal-link";
            link.dataset.targetId = targetId;
            link.textContent = element.textContent || "";
            target.appendChild(link);
            return;
          }
        }

        if (tag === "SPAN" && element.classList.contains("external-link-plain")) {
          const href = normalizeExternalHref(element.textContent || "");
          if (href) {
            const span = document.createElement("span");
            span.className = "external-link-plain";
            span.textContent = href;
            target.appendChild(span);
            return;
          }
        }

        if (tag === "SPAN" && element.classList.contains("external-link-card")) {
          const href = normalizeExternalHref(
            element.dataset.href ||
            (element.querySelector("a") && element.querySelector("a").getAttribute("href")) ||
            element.textContent ||
            ""
          );
          if (href) {
            const card = createExternalLinkCard(href, element.dataset.label || "");
            if (card) target.appendChild(card);
            return;
          }
        }

        for (const child of element.childNodes) {
          walk(child, target);
        }
      }

      for (const child of source.childNodes) {
        walk(child, output);
      }
      return output.innerHTML;
    }

    function normalizeNodeMarkup(node) {
      const cleanHtml = sanitizeNodeHtml(node.innerHTML);
      if (node.innerHTML !== cleanHtml) {
        node.innerHTML = cleanHtml;
      }
    }

    function getSelectionRangeWithinNode(node) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      if (range.collapsed) return null;
      if (!node.contains(range.startContainer) || !node.contains(range.endContainer)) return null;
      if (!range.toString()) return null;
      return range.cloneRange();
    }

    async function copyTextToClipboard(text) {
      if (!text) throw new Error("Nothing to copy.");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "true");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(textarea);
      if (!ok) throw new Error("Copy command failed.");
    }

    function closeNodeContextMenu() {
      contextMenuNode = null;
      contextMenuSelectionRange = null;
      nodeContextMenu.hidden = true;
    }

    function closeLineContextMenu() {
      contextMenuLineId = null;
      lineContextMenu.hidden = true;
    }

    function closeLinkNodeDialog() {
      pendingLinkSourceNode = null;
      pendingLinkSelectionRange = null;
      linkDialogDrag = null;
      linkNodeDialog.hidden = true;
    }

    function positionLinkNodeDialog(clientX, clientY) {
      const desiredX = Number.isFinite(clientX) ? clientX : window.innerWidth / 2;
      const desiredY = Number.isFinite(clientY) ? clientY : window.innerHeight / 2;
      const rect = linkNodeDialog.getBoundingClientRect();
      const left = clamp(desiredX, 8, Math.max(8, window.innerWidth - rect.width - 8));
      const top = clamp(desiredY, 8, Math.max(8, window.innerHeight - rect.height - 8));
      linkNodeDialog.style.left = `${left}px`;
      linkNodeDialog.style.top = `${top}px`;
    }

    function openLinkNodeDialog(sourceNode, selectionRange, clientX, clientY) {
      pendingLinkSourceNode = sourceNode;
      pendingLinkSelectionRange = selectionRange;
      linkNodeDialogInput.value = "";
      linkNodeDialog.hidden = false;
      positionLinkNodeDialog(clientX, clientY);
      linkNodeDialogInput.focus();
      linkNodeDialogInput.select();
    }

    function submitLinkNodeDialog() {
      const sourceNode = pendingLinkSourceNode;
      const selectionRange = pendingLinkSelectionRange;
      if (!sourceNode || !selectionRange) {
        closeLinkNodeDialog();
        alert("Select a word inside the node first.");
        return;
      }

      const targetNodeId = linkNodeDialogInput.value.trim();
      if (!targetNodeId) {
        alert("Target node ID is required.");
        linkNodeDialogInput.focus();
        return;
      }

      const targetNode = getNodeById(targetNodeId);
      if (!targetNode) {
        alert(`Node "${targetNodeId}" does not exist.`);
        linkNodeDialogInput.focus();
        return;
      }

      if (targetNode === sourceNode) {
        alert("Choose a different node ID.");
        linkNodeDialogInput.focus();
        return;
      }

      try {
        linkSelectionToTarget(sourceNode, selectionRange, targetNodeId);
        normalizeNodeMarkup(sourceNode);
        scheduleAutosave();
        closeLinkNodeDialog();
      } catch (error) {
        console.error("Linking failed:", error);
        alert("Could not link the selected text.");
      }
    }

    function openNodeContextMenu(node, clientX, clientY) {
      closeLineContextMenu();
      closeLinkNodeDialog();
      contextMenuNode = node;
      contextMenuSelectionRange = isCommandNode(node) ? null : getSelectionRangeWithinNode(node);
      linkSelectionBtn.disabled = !contextMenuSelectionRange;
      nodeContextMenu.hidden = false;

      const menuRect = nodeContextMenu.getBoundingClientRect();
      const clampedX = Math.min(clientX, window.innerWidth - menuRect.width - 8);
      const clampedY = Math.min(clientY, window.innerHeight - menuRect.height - 8);
      nodeContextMenu.style.left = `${Math.max(8, clampedX)}px`;
      nodeContextMenu.style.top = `${Math.max(8, clampedY)}px`;
    }

    function openLineContextMenu(lineId, clientX, clientY) {
      closeNodeContextMenu();
      closeLinkNodeDialog();
      contextMenuLineId = lineId;
      lineContextMenu.hidden = false;

      const menuRect = lineContextMenu.getBoundingClientRect();
      const clampedX = Math.min(clientX, window.innerWidth - menuRect.width - 8);
      const clampedY = Math.min(clientY, window.innerHeight - menuRect.height - 8);
      lineContextMenu.style.left = `${Math.max(8, clampedX)}px`;
      lineContextMenu.style.top = `${Math.max(8, clampedY)}px`;
    }

    function cancelCameraAnimation() {
      if (cameraAnimationFrame !== null) {
        cancelAnimationFrame(cameraAnimationFrame);
        cameraAnimationFrame = null;
      }
    }

    function cancelNodeLayoutAnimation() {
      if (nodeLayoutAnimationFrame !== null) {
        cancelAnimationFrame(nodeLayoutAnimationFrame);
        nodeLayoutAnimationFrame = null;
      }
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function easeInOutHeavy(t) {
      if (t < 0.5) {
        return 16 * Math.pow(t, 5);
      }
      return 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function easeInOutNatural(t) {
      const clamped = clamp(t, 0, 1);
      return clamped * clamped * clamped * (clamped * (clamped * 6 - 15) + 10);
    }

    function getNodeWorldSize(node) {
      const scale = camera.scale > 0 ? camera.scale : 1;
      const rect = node.getBoundingClientRect();
      const widthPx = Math.max(rect.width, node.scrollWidth, node.offsetWidth, 1);
      const heightPx = Math.max(rect.height, node.scrollHeight, node.offsetHeight, 1);
      return {
        width: widthPx / scale,
        height: heightPx / scale
      };
    }

    function updateNextLineNumberFromId(lineId) {
      const match = /^line-(\d+)$/.exec(lineId);
      if (!match) return;
      const value = Number(match[1]);
      if (!Number.isFinite(value)) return;
      nextLineNumber = Math.max(nextLineNumber, value + 1);
    }

    function isLineIdInUse(lineId) {
      return lineConnections.some((line) => line.id === lineId);
    }

    function generateLineId() {
      let candidate = `line-${nextLineNumber}`;
      while (isLineIdInUse(candidate)) {
        nextLineNumber += 1;
        candidate = `line-${nextLineNumber}`;
      }
      nextLineNumber += 1;
      return candidate;
    }

    function resolveLineId(preferredId) {
      const requested = typeof preferredId === "string" ? preferredId.trim() : "";
      if (!requested) return generateLineId();
      if (!isLineIdInUse(requested)) {
        updateNextLineNumberFromId(requested);
        return requested;
      }
      let suffix = 2;
      let candidate = `${requested}-${suffix}`;
      while (isLineIdInUse(candidate)) {
        suffix += 1;
        candidate = `${requested}-${suffix}`;
      }
      return candidate;
    }

    function normalizeLineEndpointId(value) {
      return typeof value === "string" ? value.trim() : "";
    }

    function getLineConnectionKey(fromId, toId) {
      return [fromId, toId].sort().join("\u0000");
    }

    function hasLineConnection(fromId, toId) {
      const key = getLineConnectionKey(fromId, toId);
      return lineConnections.some((line) => getLineConnectionKey(line.from, line.to) === key);
    }

    function createLineConnection(sourceNode, targetNode) {
      if (!(sourceNode instanceof HTMLElement) || !(targetNode instanceof HTMLElement)) return false;
      if (!world.contains(sourceNode) || !world.contains(targetNode) || sourceNode === targetNode) return false;

      const from = normalizeLineEndpointId(sourceNode.dataset.nodeId || "");
      const to = normalizeLineEndpointId(targetNode.dataset.nodeId || "");
      if (!from || !to || from === to || hasLineConnection(from, to)) return false;

      lineConnections.push({
        id: generateLineId(),
        from,
        to
      });
      renderLineConnections();
      scheduleAutosave();
      return true;
    }

    function removeLineConnection(lineId) {
      const id = typeof lineId === "string" ? lineId.trim() : "";
      if (!id) return false;
      const beforeLength = lineConnections.length;
      lineConnections = lineConnections.filter((line) => line.id !== id);
      if (lineConnections.length === beforeLength) return false;
      renderLineConnections();
      scheduleAutosave();
      return true;
    }

    function serializeLineConnection(line) {
      return {
        id: line.id || "",
        from: line.from || "",
        to: line.to || ""
      };
    }

    function loadLineConnections(entries) {
      lineConnections = [];
      nextLineNumber = 1;

      if (!Array.isArray(entries)) {
        renderLineConnections();
        return;
      }

      const seen = new Set();
      for (const entry of entries) {
        if (!entry || typeof entry !== "object") continue;
        const from = normalizeLineEndpointId(entry.from);
        const to = normalizeLineEndpointId(entry.to);
        if (!from || !to || from === to || !getNodeById(from) || !getNodeById(to)) continue;

        const key = getLineConnectionKey(from, to);
        if (seen.has(key)) continue;
        seen.add(key);

        lineConnections.push({
          id: resolveLineId(entry.id),
          from,
          to
        });
      }

      renderLineConnections();
    }

    function removeLineConnectionsForNodes(nodes) {
      const nodeIds = new Set(
        nodes
          .filter((node) => node instanceof HTMLElement)
          .map((node) => normalizeLineEndpointId(node.dataset.nodeId || ""))
          .filter(Boolean)
      );
      if (nodeIds.size === 0) return false;

      const beforeLength = lineConnections.length;
      lineConnections = lineConnections.filter((line) => !nodeIds.has(line.from) && !nodeIds.has(line.to));
      if (lineConnections.length === beforeLength) return false;
      renderLineConnections();
      return true;
    }

    function requestLineRender() {
      if (lineRenderFrame !== null) return;
      lineRenderFrame = requestAnimationFrame(() => {
        lineRenderFrame = null;
        renderLineConnections();
      });
    }

    function observeNodeForLines(node) {
      if (nodeResizeObserver && node instanceof HTMLElement) nodeResizeObserver.observe(node);
    }

    function unobserveNodeForLines(node) {
      if (nodeResizeObserver && node instanceof HTMLElement) nodeResizeObserver.unobserve(node);
    }

    function getNodeWorldCenter(node) {
      const size = getNodeWorldSize(node);
      return {
        x: Number(node.dataset.x) + size.width / 2,
        y: Number(node.dataset.y) + size.height / 2
      };
    }

    function getNodeAnchorPoint(node, towardPoint) {
      const size = getNodeWorldSize(node);
      const center = getNodeWorldCenter(node);
      let dx = towardPoint.x - center.x;
      let dy = towardPoint.y - center.y;
      let length = Math.hypot(dx, dy);
      if (length < 0.001) {
        dx = 1;
        dy = 0;
        length = 1;
      }

      const normalX = dx / length;
      const normalY = dy / length;
      const radiusX = Math.max(size.width / 2 + LINE_ANCHOR_ELLIPSE_PADDING_WORLD, 0.5);
      const radiusY = Math.max(size.height / 2 + LINE_ANCHOR_ELLIPSE_PADDING_WORLD, 0.5);
      const ellipseScale = 1 / Math.max(
        0.001,
        Math.sqrt((dx * dx) / (radiusX * radiusX) + (dy * dy) / (radiusY * radiusY))
      );

      return {
        x: center.x + dx * ellipseScale + normalX * LINE_ENDPOINT_GAP_WORLD,
        y: center.y + dy * ellipseScale + normalY * LINE_ENDPOINT_GAP_WORLD
      };
    }

    function getLineAnchorPair(sourceNode, targetNode) {
      const sourceCenter = getNodeWorldCenter(sourceNode);
      const targetCenter = getNodeWorldCenter(targetNode);
      return {
        start: getNodeAnchorPoint(sourceNode, targetCenter),
        end: getNodeAnchorPoint(targetNode, sourceCenter)
      };
    }

    function getNodeLineWidth(node) {
      if (!(node instanceof HTMLElement)) return MIN_LINE_WIDTH_WORLD;
      const baseFontSize = Number(node.dataset.baseFontSize);
      const fontSize = Number.isFinite(baseFontSize) && baseFontSize > 0 ? baseFontSize : BASE_TEXT_PX;
      return clamp(fontSize * LINE_WIDTH_FONT_RATIO, MIN_LINE_WIDTH_WORLD, MAX_LINE_WIDTH_WORLD);
    }

    function getStableLineSeed(value) {
      const text = String(value || "");
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function formatLineNumber(value) {
      return Number.isFinite(value) ? Number(value.toFixed(2)) : 0;
    }

    function getNaturalLineGeometry(start, end, seedValue) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 0.5) {
        return {
          start,
          control1: start,
          control2: end,
          end,
          distance
        };
      }

      const unitX = dx / distance;
      const unitY = dy / distance;
      const seed = getStableLineSeed(seedValue);
      const direction = seed % 2 === 0 ? 1 : -1;
      const variation = (((seed >>> 4) % 17) - 8) / 8;
      const bow = clamp(distance * 0.026, 3.5, 24) * direction + variation;
      const gravity = clamp(distance * 0.01, 1.2, 12);
      const bendX = -unitY * bow;
      const bendY = unitX * bow + gravity;
      const control1 = {
        x: start.x + dx * 0.34 + bendX,
        y: start.y + dy * 0.34 + bendY
      };
      const control2 = {
        x: start.x + dx * 0.66 + bendX,
        y: start.y + dy * 0.66 + bendY
      };

      return {
        start,
        control1,
        control2,
        end,
        distance
      };
    }

    function getNaturalLineCenterPath(geometry) {
      return [
        "M", formatLineNumber(geometry.start.x), formatLineNumber(geometry.start.y),
        "C", formatLineNumber(geometry.control1.x), formatLineNumber(geometry.control1.y),
        formatLineNumber(geometry.control2.x), formatLineNumber(geometry.control2.y),
        formatLineNumber(geometry.end.x), formatLineNumber(geometry.end.y)
      ].join(" ");
    }

    function getCubicPoint(geometry, t) {
      const inverse = 1 - t;
      const a = inverse * inverse * inverse;
      const b = 3 * inverse * inverse * t;
      const c = 3 * inverse * t * t;
      const d = t * t * t;
      return {
        x: geometry.start.x * a + geometry.control1.x * b + geometry.control2.x * c + geometry.end.x * d,
        y: geometry.start.y * a + geometry.control1.y * b + geometry.control2.y * c + geometry.end.y * d
      };
    }

    function getCubicTangent(geometry, t) {
      const inverse = 1 - t;
      const a = 3 * inverse * inverse;
      const b = 6 * inverse * t;
      const c = 3 * t * t;
      const tangent = {
        x:
          (geometry.control1.x - geometry.start.x) * a +
          (geometry.control2.x - geometry.control1.x) * b +
          (geometry.end.x - geometry.control2.x) * c,
        y:
          (geometry.control1.y - geometry.start.y) * a +
          (geometry.control2.y - geometry.control1.y) * b +
          (geometry.end.y - geometry.control2.y) * c
      };
      if (Math.hypot(tangent.x, tangent.y) > 0.001) return tangent;
      return {
        x: geometry.end.x - geometry.start.x,
        y: geometry.end.y - geometry.start.y
      };
    }

    function getTaperedLineShapePath(
      geometry,
      startWidth,
      endWidth,
      extraWidth = 0,
      startT = 0,
      endT = 1
    ) {
      const t0 = clamp(startT, 0, 1);
      const t1 = clamp(endT, t0, 1);
      const segmentDistance = Math.max(0.001, geometry.distance * (t1 - t0));
      const sampleCount = clamp(Math.round(segmentDistance / 18), 3, 46);
      const left = [];
      const right = [];

      for (let index = 0; index <= sampleCount; index += 1) {
        const t = t0 + (t1 - t0) * (index / sampleCount);
        const point = getCubicPoint(geometry, t);
        const tangent = getCubicTangent(geometry, t);
        const length = Math.max(0.001, Math.hypot(tangent.x, tangent.y));
        const normal = {
          x: -tangent.y / length,
          y: tangent.x / length
        };
        const eased = easeInOutNatural(t);
        const width = startWidth + (endWidth - startWidth) * eased + extraWidth;
        const halfWidth = Math.max(0.001, width / 2);
        left.push({
          x: point.x + normal.x * halfWidth,
          y: point.y + normal.y * halfWidth
        });
        right.push({
          x: point.x - normal.x * halfWidth,
          y: point.y - normal.y * halfWidth
        });
      }

      const parts = [
        "M", formatLineNumber(left[0].x), formatLineNumber(left[0].y)
      ];
      for (let index = 1; index < left.length; index += 1) {
        parts.push("L", formatLineNumber(left[index].x), formatLineNumber(left[index].y));
      }
      for (let index = right.length - 1; index >= 0; index -= 1) {
        parts.push("L", formatLineNumber(right[index].x), formatLineNumber(right[index].y));
      }
      parts.push("Z");
      return parts.join(" ");
    }

    function appendTaperedLineShape(group, className, geometry, startWidth, endWidth, extraWidth = 0, options = {}) {
      if (options.dashed) {
        const dashLength = LINE_DRAFT_DASH_LENGTH_WORLD;
        const gapLength = LINE_DRAFT_GAP_LENGTH_WORLD;
        const cycleLength = dashLength + gapLength;
        const distance = Math.max(1, geometry.distance);
        let cursor = 0;
        while (cursor < distance) {
          const segmentStart = cursor / distance;
          const segmentEnd = Math.min(cursor + dashLength, distance) / distance;
          if (segmentEnd > segmentStart) {
            const path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("class", className);
            path.setAttribute(
              "d",
              getTaperedLineShapePath(geometry, startWidth, endWidth, extraWidth, segmentStart, segmentEnd)
            );
            group.appendChild(path);
          }
          cursor += cycleLength;
        }
        return;
      }

      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("class", className);
      path.setAttribute("d", getTaperedLineShapePath(geometry, startWidth, endWidth, extraWidth));
      group.appendChild(path);
    }

    function appendConnectionPath(geometry, options = {}) {
      const group = document.createElementNS(SVG_NS, "g");
      group.setAttribute("class", options.draft ? "connection-line-draft" : "connection-line-persisted");
      if (options.id) group.dataset.lineId = options.id;
      const startWidth = Number.isFinite(options.startWidth) ? options.startWidth : MIN_LINE_WIDTH_WORLD;
      const endWidth = Number.isFinite(options.endWidth) ? options.endWidth : startWidth;

      appendTaperedLineShape(
        group,
        "connection-line connection-line-shadow",
        geometry,
        startWidth,
        endWidth,
        LINE_SHADOW_EXTRA_WIDTH_WORLD,
        { dashed: options.draft }
      );
      appendTaperedLineShape(
        group,
        "connection-line connection-line-stroke",
        geometry,
        startWidth,
        endWidth,
        0,
        { dashed: options.draft }
      );
      lineLayer.appendChild(group);

      if (options.id && lineHitLayer) {
        const hitPath = document.createElementNS(SVG_NS, "path");
        hitPath.setAttribute("class", "connection-line-hit");
        hitPath.setAttribute("d", getNaturalLineCenterPath(geometry));
        hitPath.dataset.lineId = options.id;
        lineHitLayer.appendChild(hitPath);
      }
    }

    function renderLineConnections() {
      if (!lineLayer) return;
      const width = Math.max(1, viewport.clientWidth);
      const height = Math.max(1, viewport.clientHeight);
      lineLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
      lineLayer.setAttribute("width", String(width));
      lineLayer.setAttribute("height", String(height));
      lineLayer.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
      lineLayer.replaceChildren();
      if (lineHitLayer) {
        lineHitLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
        lineHitLayer.setAttribute("width", String(width));
        lineHitLayer.setAttribute("height", String(height));
        lineHitLayer.style.transform = lineLayer.style.transform;
        lineHitLayer.replaceChildren();
      }

      for (const line of lineConnections) {
        const sourceNode = getNodeById(line.from);
        const targetNode = getNodeById(line.to);
        if (!sourceNode || !targetNode) continue;
        const points = getLineAnchorPair(sourceNode, targetNode);
        appendConnectionPath(getNaturalLineGeometry(points.start, points.end, line.id), {
          id: line.id,
          startWidth: getNodeLineWidth(sourceNode),
          endWidth: getNodeLineWidth(targetNode)
        });
      }

      if (!lineDraft || !world.contains(lineDraft.sourceNode)) return;
      const start = getNodeAnchorPoint(lineDraft.sourceNode, {
        x: lineDraft.displayX,
        y: lineDraft.displayY
      });
      const end = {
        x: lineDraft.displayX,
        y: lineDraft.displayY
      };
      const draftWidth = getNodeLineWidth(lineDraft.sourceNode);
      appendConnectionPath(getNaturalLineGeometry(start, end, `draft:${lineDraft.sourceId}`), {
        draft: true,
        startWidth: draftWidth,
        endWidth: lineDraft.displayEndWidth
      });
    }

    function requestLineDraftAnimation() {
      if (lineDraftAnimationFrame !== null) return;
      lineDraftAnimationFrame = requestAnimationFrame(updateLineDraftAnimation);
    }

    function updateLineDraftAnimation() {
      lineDraftAnimationFrame = null;
      if (!lineDraft) return;
      if (!world.contains(lineDraft.sourceNode)) {
        cancelLineDraft();
        return;
      }

      lineDraft.velocityX = (lineDraft.velocityX + (lineDraft.cursorX - lineDraft.displayX) * LINE_DRAFT_SPRING) * LINE_DRAFT_DAMPING;
      lineDraft.velocityY = (lineDraft.velocityY + (lineDraft.cursorY - lineDraft.displayY) * LINE_DRAFT_SPRING) * LINE_DRAFT_DAMPING;
      lineDraft.displayX += lineDraft.velocityX;
      lineDraft.displayY += lineDraft.velocityY;

      if (
        Math.abs(lineDraft.cursorX - lineDraft.displayX) < 0.02 &&
        Math.abs(lineDraft.cursorY - lineDraft.displayY) < 0.02 &&
        Math.abs(lineDraft.velocityX) < 0.02 &&
        Math.abs(lineDraft.velocityY) < 0.02
      ) {
        lineDraft.displayX = lineDraft.cursorX;
        lineDraft.displayY = lineDraft.cursorY;
        lineDraft.velocityX = 0;
        lineDraft.velocityY = 0;
      }

      lineDraft.displayEndWidth += (lineDraft.targetEndWidth - lineDraft.displayEndWidth) * LINE_DRAFT_THICKNESS_EASE;
      if (Math.abs(lineDraft.targetEndWidth - lineDraft.displayEndWidth) < 0.002) {
        lineDraft.displayEndWidth = lineDraft.targetEndWidth;
      }

      renderLineConnections();
      requestLineDraftAnimation();
    }

    function beginLineDraft(sourceNode, clientX, clientY) {
      if (!(sourceNode instanceof HTMLElement) || !world.contains(sourceNode)) return;
      cancelLineDraft();
      closeLinkNodeDialog();

      const center = getNodeWorldCenter(sourceNode);
      const startPoint = Number.isFinite(clientX) && Number.isFinite(clientY)
        ? screenToWorld(clientX, clientY)
        : center;
      const startWidth = getNodeLineWidth(sourceNode);
      lineDraft = {
        sourceNode,
        sourceId: normalizeLineEndpointId(sourceNode.dataset.nodeId || ""),
        cursorX: startPoint.x,
        cursorY: startPoint.y,
        displayX: startPoint.x,
        displayY: startPoint.y,
        velocityX: 0,
        velocityY: 0,
        hoverNode: null,
        baseEndWidth: startWidth * LINE_DRAFT_END_WIDTH_RATIO,
        displayEndWidth: startWidth * LINE_DRAFT_END_WIDTH_RATIO,
        targetEndWidth: startWidth * LINE_DRAFT_END_WIDTH_RATIO
      };
      viewport.classList.add("line-drafting");
      renderLineConnections();
      requestLineDraftAnimation();
    }

    function cancelLineDraft() {
      if (lineDraftAnimationFrame !== null) {
        cancelAnimationFrame(lineDraftAnimationFrame);
        lineDraftAnimationFrame = null;
      }
      if (!lineDraft) return;
      lineDraft = null;
      viewport.classList.remove("line-drafting");
      renderLineConnections();
    }

    function getLineDraftHoverNode(clientX, clientY) {
      if (!lineDraft) return null;
      const point = screenToWorld(clientX, clientY);
      let bestNode = null;
      let bestScore = Infinity;

      for (const node of world.children) {
        if (!(node instanceof HTMLElement) || node === lineDraft.sourceNode) continue;
        const center = getNodeWorldCenter(node);
        const size = getNodeWorldSize(node);
        const radiusX = Math.max(size.width / 2 + LINE_ANCHOR_ELLIPSE_PADDING_WORLD, 0.5);
        const radiusY = Math.max(size.height / 2 + LINE_ANCHOR_ELLIPSE_PADDING_WORLD, 0.5);
        const dx = point.x - center.x;
        const dy = point.y - center.y;
        const score = (dx * dx) / (radiusX * radiusX) + (dy * dy) / (radiusY * radiusY);
        if (score <= 1 && score < bestScore) {
          bestScore = score;
          bestNode = node;
        }
      }

      return bestNode;
    }

    function updateLineDraftPointer(event) {
      if (!lineDraft) return;
      const point = screenToWorld(event.clientX, event.clientY);
      lineDraft.cursorX = point.x;
      lineDraft.cursorY = point.y;
      lineDraft.hoverNode = getLineDraftHoverNode(event.clientX, event.clientY);
      lineDraft.targetEndWidth = lineDraft.hoverNode
        ? getNodeLineWidth(lineDraft.hoverNode)
        : lineDraft.baseEndWidth;
    }

    function completeLineDraft(targetNode) {
      const sourceNode = lineDraft ? lineDraft.sourceNode : null;
      if (!sourceNode || targetNode === sourceNode) return false;
      return createLineConnection(sourceNode, targetNode);
    }

    function getSelectedNodeLayoutItems() {
      return Array.from(selectedNodes)
        .filter((node) => node instanceof HTMLElement && world.contains(node))
        .map((node, index) => {
          const x = Number(node.dataset.x);
          const y = Number(node.dataset.y);
          const size = getNodeWorldSize(node);
          return { node, index, x, y, width: size.width, height: size.height };
        })
        .filter((item) =>
          Number.isFinite(item.x) &&
          Number.isFinite(item.y) &&
          Number.isFinite(item.width) &&
          Number.isFinite(item.height)
        );
    }

    function getColumnAlignmentTargets(items) {
      if (items.length < 2) return [];

      const ordered = items.slice().sort((a, b) =>
        a.y - b.y ||
        a.x - b.x ||
        a.index - b.index
      );
      const left = Math.min(...items.map((item) => item.x));
      const top = Math.min(...items.map((item) => item.y));
      const bottom = Math.max(...items.map((item) => item.y + item.height));
      const totalHeight = ordered.reduce((sum, item) => sum + item.height, 0);
      const gap = Math.max(0, (bottom - top - totalHeight) / (ordered.length - 1));
      let nextY = top;

      return ordered.map((item) => {
        const target = {
          node: item.node,
          x: left,
          y: nextY
        };
        nextY += item.height + gap;
        return target;
      });
    }

    function animateNodePositions(targets, durationMs = ALIGN_ANIMATION_DURATION_MS) {
      cancelNodeLayoutAnimation();

      const snapshots = targets
        .filter((target) => target.node instanceof HTMLElement && world.contains(target.node))
        .map((target) => ({
          node: target.node,
          startX: Number(target.node.dataset.x),
          startY: Number(target.node.dataset.y),
          targetX: target.x,
          targetY: target.y
        }))
        .filter((snapshot) =>
          Number.isFinite(snapshot.startX) &&
          Number.isFinite(snapshot.startY) &&
          Number.isFinite(snapshot.targetX) &&
          Number.isFinite(snapshot.targetY)
        );

      if (snapshots.length === 0) return false;

      const hasMovement = snapshots.some((snapshot) =>
        Math.abs(snapshot.targetX - snapshot.startX) > 0.001 ||
        Math.abs(snapshot.targetY - snapshot.startY) > 0.001
      );
      if (!hasMovement) return false;

      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / durationMs);
        const eased = easeInOutNatural(t);

        for (const snapshot of snapshots) {
          if (!world.contains(snapshot.node)) continue;
          setNodePosition(
            snapshot.node,
            snapshot.startX + (snapshot.targetX - snapshot.startX) * eased,
            snapshot.startY + (snapshot.targetY - snapshot.startY) * eased,
            { skipSelectionUpdate: true }
          );
        }
        refreshSelectionBounds();

        if (t < 1) {
          nodeLayoutAnimationFrame = requestAnimationFrame(tick);
          return;
        }

        for (const snapshot of snapshots) {
          if (!world.contains(snapshot.node)) continue;
          setNodePosition(snapshot.node, snapshot.targetX, snapshot.targetY, { skipSelectionUpdate: true });
        }
        nodeLayoutAnimationFrame = null;
        refreshSelectionBounds();
        scheduleAutosave();
      }

      nodeLayoutAnimationFrame = requestAnimationFrame(tick);
      return true;
    }

    function measureNodeRenderedSizePx(node, fontSizePx) {
      const probe = node.cloneNode(true);
      probe.classList.remove("selected", "navigation-target-highlight", "editing");
      probe.contentEditable = "false";

      // Measure in a hidden probe with node floors disabled for stable fitting math.
      probe.style.position = "fixed";
      probe.style.left = "-100000px";
      probe.style.top = "-100000px";
      probe.style.visibility = "hidden";
      probe.style.pointerEvents = "none";
      probe.style.minWidth = "0";
      probe.style.minHeight = "0";
      probe.style.width = "max-content";
      probe.style.maxWidth = "none";
      probe.style.fontSize = `${Math.max(0.001, fontSizePx)}px`;

      document.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();

      return {
        width: Math.max(0.001, rect.width),
        height: Math.max(0.001, rect.height)
      };
    }

    function solveNodeFitScale(node, guideWidthPx) {
      const baseFontSizeRaw = Number(node.dataset.baseFontSize);
      const baseFontSize = Number.isFinite(baseFontSizeRaw) && baseFontSizeRaw > 0
        ? baseFontSizeRaw
        : BASE_TEXT_PX;

      const rect = node.getBoundingClientRect();
      const startWidth = Math.max(0.001, rect.width);
      let scale = Math.max(MIN_NAVIGATION_SCALE, camera.scale * (guideWidthPx / startWidth));

      // Converges rapidly even when tiny-font glyph rasterization is non-linear.
      for (let i = 0; i < 6; i += 1) {
        const measured = measureNodeRenderedSizePx(node, baseFontSize * scale);
        const ratio = guideWidthPx / Math.max(0.001, measured.width);
        scale = Math.max(MIN_NAVIGATION_SCALE, scale * ratio);
        if (Math.abs(1 - ratio) < 0.0015) break;
      }

      return scale;
    }

    function getNavigationGuideBounds() {
      const viewWidth = Math.max(1, viewport.clientWidth);
      const viewHeight = Math.max(1, viewport.clientHeight);
      const guideWidth = Math.max(1, viewWidth * NAVIGATION_VIEWPORT_FILL);
      const left = (viewWidth - guideWidth) / 2;
      return {
        left,
        right: left + guideWidth,
        width: guideWidth,
        centerY: viewHeight / 2
      };
    }

    function placeFitMarker(marker, x, y, visible = true) {
      if (!marker) return;
      marker.hidden = !visible;
      if (!visible) return;
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
    }

    function renderNavigationFitMarkers() {
      if (!navigationFitMarkersVisible) {
        placeFitMarker(fitGuideLeft, 0, 0, false);
        placeFitMarker(fitGuideRight, 0, 0, false);
        placeFitMarker(fitTargetLeft, 0, 0, false);
        placeFitMarker(fitTargetRight, 0, 0, false);
        return;
      }

      const guide = getNavigationGuideBounds();
      placeFitMarker(fitGuideLeft, guide.left, guide.centerY, true);
      placeFitMarker(fitGuideRight, guide.right, guide.centerY, true);

      if (!navigationFitTargetNode || !world.contains(navigationFitTargetNode)) {
        placeFitMarker(fitTargetLeft, 0, 0, false);
        placeFitMarker(fitTargetRight, 0, 0, false);
        return;
      }

      const rect = navigationFitTargetNode.getBoundingClientRect();
      const centerY = rect.top + rect.height / 2;
      placeFitMarker(fitTargetLeft, rect.left, centerY, true);
      placeFitMarker(fitTargetRight, rect.right, centerY, true);
    }

    function getNavigationDuration(targetX, targetY, targetScale) {
      const dx = targetX - camera.x;
      const dy = targetY - camera.y;
      const panDistance = Math.hypot(dx, dy);
      const viewportDiagonal = Math.max(1, Math.hypot(viewport.clientWidth, viewport.clientHeight));
      const panFactor = clamp(panDistance / viewportDiagonal, 0, 2);
      const scaleFactor = clamp(Math.abs(Math.log(targetScale / camera.scale)), 0, 2);
      const duration = 620 + panFactor * 200 + scaleFactor * 220;
      return clamp(duration, 620, 1300);
    }

    function highlightNavigationTarget(node, durationMs = 5000) {
      const previousTimeout = nodeHighlightTimeouts.get(node);
      if (previousTimeout) clearTimeout(previousTimeout);
      node.classList.remove("navigation-target-highlight");
      void node.offsetWidth;
      node.classList.add("navigation-target-highlight");
      const timeoutId = setTimeout(() => {
        node.classList.remove("navigation-target-highlight");
        nodeHighlightTimeouts.delete(node);
      }, durationMs);
      nodeHighlightTimeouts.set(node, timeoutId);
    }

    function animateCameraTo(targetX, targetY, targetScale, durationMs = 760, onComplete = null) {
      cancelCameraAnimation();
      const startX = camera.x;
      const startY = camera.y;
      const startScale = camera.scale;
      const start = performance.now();

      function tick(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / durationMs);
        const eased = easeInOutHeavy(t);
        camera.x = startX + (targetX - startX) * eased;
        camera.y = startY + (targetY - startY) * eased;
        camera.scale = startScale + (targetScale - startScale) * eased;
        render();
        if (t < 1) {
          cameraAnimationFrame = requestAnimationFrame(tick);
        } else {
          cameraAnimationFrame = null;
          scheduleAutosave();
          if (typeof onComplete === "function") onComplete();
        }
      }

      cameraAnimationFrame = requestAnimationFrame(tick);
    }

    function focusNodeFullScreen(node) {
      const guide = getNavigationGuideBounds();
      const targetScale = solveNodeFitScale(node, guide.width);
      navigationFitTargetNode = node;

      const rect = node.getBoundingClientRect();
      const baseFontSizeRaw = Number(node.dataset.baseFontSize);
      const baseFontSize = Number.isFinite(baseFontSizeRaw) && baseFontSizeRaw > 0
        ? baseFontSizeRaw
        : BASE_TEXT_PX;
      const nodeXRaw = Number(node.dataset.x);
      const nodeYRaw = Number(node.dataset.y);
      const nodeX = Number.isFinite(nodeXRaw) ? nodeXRaw : (rect.left - camera.x) / camera.scale;
      const nodeY = Number.isFinite(nodeYRaw) ? nodeYRaw : (rect.top - camera.y) / camera.scale;
      const finalMeasured = measureNodeRenderedSizePx(node, baseFontSize * targetScale);
      const targetX = guide.left - nodeX * targetScale;
      const targetY = guide.centerY - nodeY * targetScale - finalMeasured.height / 2;
      const duration = getNavigationDuration(targetX, targetY, targetScale);

      // highlightNavigationTarget(node);
      animateCameraTo(targetX, targetY, targetScale, duration);
    }

    function linkSelectionToTarget(node, selectionRange, targetNodeId) {
      if (!selectionRange) {
        throw new Error("Select a word first.");
      }
      if (!node.contains(selectionRange.startContainer) || !node.contains(selectionRange.endContainer)) {
        throw new Error("Selection must stay inside one node.");
      }

      const text = selectionRange.toString();
      if (!text.trim()) {
        throw new Error("Selection is empty.");
      }

      const link = document.createElement("span");
      link.className = "internal-link";
      link.dataset.targetId = targetNodeId;
      link.textContent = text;

      selectionRange.deleteContents();
      selectionRange.insertNode(link);
    }

    function setCaretToEnd(node) {
      if (!node || !node.isContentEditable) return;
      const selection = window.getSelection();
      if (!selection) return;

      const range = document.createRange();
      range.selectNodeContents(node);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function trimExternalUrlMatch(rawUrl) {
      let href = rawUrl;
      let trailing = "";

      while (/[.,!?;:]$/.test(href)) {
        trailing = href.slice(-1) + trailing;
        href = href.slice(0, -1);
      }

      if (href.endsWith(")") && !href.includes("(")) {
        trailing = ")" + trailing;
        href = href.slice(0, -1);
      }

      return { href, trailing };
    }

    function autoLinkExternalUrls(node, options = {}) {
      if (!node || isCommandNode(node)) return false;
      const { force = false, moveCaretToEnd = false } = options;
      const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {
        acceptNode(textNode) {
          const parent = textNode.parentElement;
          if (!parent) return NodeFilter.FILTER_REJECT;
          if (parent.closest(".external-link-card, .external-link-plain, .internal-link")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const textNodes = [];
      let textNode = walker.nextNode();
      while (textNode) {
        textNodes.push(textNode);
        textNode = walker.nextNode();
      }

      let changed = false;
      const urlPattern = /https?:\/\/[^\s<>"']+/gi;

      for (const currentTextNode of textNodes) {
        const text = currentTextNode.textContent || "";
        let lastIndex = 0;
        urlPattern.lastIndex = 0;
        let match = urlPattern.exec(text);
        const fragment = document.createDocumentFragment();
        let textNodeChanged = false;

        while (match) {
          const rawUrl = match[0];
          const start = match.index;
          const end = start + rawUrl.length;
          const isStillBeingTyped = !force && end === text.length;
          const { href, trailing } = trimExternalUrlMatch(rawUrl);
          const normalizedHref = normalizeExternalHref(href);

          if (start > lastIndex) {
            fragment.appendChild(document.createTextNode(text.slice(lastIndex, start)));
          }

          if (normalizedHref && !isStillBeingTyped) {
            const card = createExternalLinkCard(normalizedHref);
            if (card) {
              fragment.appendChild(card);
              if (trailing) fragment.appendChild(document.createTextNode(trailing));
              textNodeChanged = true;
            } else {
              fragment.appendChild(document.createTextNode(rawUrl));
            }
          } else {
            fragment.appendChild(document.createTextNode(rawUrl));
          }

          lastIndex = end;
          match = urlPattern.exec(text);
        }

        if (!textNodeChanged) continue;
        if (lastIndex < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
        currentTextNode.replaceWith(fragment);
        changed = true;
      }

      if (changed) {
        if (moveCaretToEnd) setCaretToEnd(node);
        refreshSelectionBounds();
        scheduleAutosave();
      }

      return changed;
    }

    function getExternalLinkCardFromTarget(node, target) {
      if (!(target instanceof Element)) return null;
      const card = target.closest(".external-link-card");
      if (!card || !node.contains(card)) return null;
      return card;
    }

    function flattenExternalLinkCard(card) {
      const href = normalizeExternalHref(card.dataset.href || "");
      if (!href) return;
      const span = document.createElement("span");
      span.className = "external-link-plain";
      span.textContent = href;
      card.replaceWith(span);
    }

    function saveExternalLinkCardEdit(card) {
      const hrefInput = card.querySelector('[data-external-link-field="href"]');
      const labelInput = card.querySelector('[data-external-link-field="label"]');
      const nextHref = normalizeExternalHref(hrefInput ? hrefInput.value : "");
      if (!nextHref) {
        if (hrefInput) hrefInput.focus();
        return;
      }

      card.dataset.href = nextHref;
      card.dataset.label = labelInput ? labelInput.value.trim() : "";
      renderExternalLinkCard(card);
    }

    function isExternalLinkControlTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest("button, input, textarea, select"));
    }

    function attachExternalLinkCardPointerHandlers(card) {
      card.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || isExternalLinkControlTarget(event.target)) return;

        const node = card.closest(".text-node");
        if (!(node instanceof HTMLElement) || !world.contains(node)) return;

        closeNodeContextMenu();
        cancelCameraAnimation();
        cancelNodeLayoutAnimation();
        const pointer = screenToWorld(event.clientX, event.clientY);
        externalLinkCardPointer = {
          pointerId: event.pointerId,
          card,
          node,
          startClientX: event.clientX,
          startClientY: event.clientY,
          dragOffsetX: Number(node.dataset.x) - pointer.x,
          dragOffsetY: Number(node.dataset.y) - pointer.y,
          href: normalizeExternalHref(card.dataset.href || ""),
          moved: false
        };
        card.setPointerCapture(event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      });

      card.addEventListener("pointermove", (event) => {
        const session = externalLinkCardPointer;
        if (!session || session.card !== card || session.pointerId !== event.pointerId) return;

        if (!session.moved && Math.hypot(event.clientX - session.startClientX, event.clientY - session.startClientY) >= MARQUEE_DRAG_THRESHOLD_PX) {
          session.moved = true;
        }

        const pointer = screenToWorld(event.clientX, event.clientY);
        setNodePosition(session.node, pointer.x + session.dragOffsetX, pointer.y + session.dragOffsetY);
        event.preventDefault();
        event.stopPropagation();
      });

      function endExternalLinkCardPointer(event) {
        const session = externalLinkCardPointer;
        if (!session || session.card !== card || session.pointerId !== event.pointerId) return;

        if (card.hasPointerCapture(session.pointerId)) {
          card.releasePointerCapture(session.pointerId);
        }

        externalLinkCardPointer = null;
        if (event.type === "pointerup" && session.href && !session.moved) {
          openExternalHref(session.href);
          card.dataset.suppressNextVisit = "true";
        } else if (session.moved) {
          card.dataset.suppressNextVisit = "true";
        }
        scheduleAutosave();
        event.preventDefault();
        event.stopPropagation();
      }

      card.addEventListener("pointerup", endExternalLinkCardPointer);
      card.addEventListener("pointercancel", endExternalLinkCardPointer);
    }

    function handleExternalLinkAction(node, event) {
      const card = getExternalLinkCardFromTarget(node, event.target);
      if (!card) return false;

      const actionTarget = event.target instanceof Element
        ? event.target.closest("[data-external-link-action]")
        : null;
      if (!actionTarget || !card.contains(actionTarget)) return false;

      const action = actionTarget.dataset.externalLinkAction;
      event.preventDefault();
      event.stopPropagation();

      if (action === "open") {
        const href = normalizeExternalHref(card.dataset.href || "");
        openExternalHref(href);
      }

      if (action === "edit") {
        renderExternalLinkCard(card, { editing: true });
        const labelInput = card.querySelector('[data-external-link-field="label"]');
        if (labelInput) labelInput.focus();
      }

      if (action === "flatten") {
        flattenExternalLinkCard(card);
        refreshSelectionBounds();
      }

      if (action === "save") {
        saveExternalLinkCardEdit(card);
        refreshSelectionBounds();
      }

      if (action === "cancel") {
        renderExternalLinkCard(card);
      }

      scheduleAutosave();
      return true;
    }

    function handleExternalLinkVisit(node, event) {
      const card = getExternalLinkCardFromTarget(node, event.target);
      if (!card) return false;

      if (event.target instanceof Element && event.target.closest("button, input, textarea, select")) {
        return false;
      }

      if (card.dataset.suppressNextVisit === "true") {
        delete card.dataset.suppressNextVisit;
        event.preventDefault();
        event.stopPropagation();
        return true;
      }

      const href = normalizeExternalHref(card.dataset.href || "");
      if (!href) return false;

      event.preventDefault();
      event.stopPropagation();
      openExternalHref(href);
      return true;
    }

    function openExternalHref(href) {
      const normalizedHref = normalizeExternalHref(href);
      if (!normalizedHref) return;
      window.open(normalizedHref, "_blank", "noopener,noreferrer");
    }

    function handleExternalLinkKeydown(node, event) {
      const card = getExternalLinkCardFromTarget(node, event.target);
      if (!card) return false;

      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        saveExternalLinkCardEdit(card);
        refreshSelectionBounds();
        scheduleAutosave();
        return true;
      }

      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        renderExternalLinkCard(card);
        scheduleAutosave();
        return true;
      }

      event.stopPropagation();
      return true;
    }

    function isEditableTarget(target) {
      if (!(target instanceof HTMLElement)) return false;
      if (target.isContentEditable) return true;
      const tag = target.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    }

    function isCommandNode(node) {
      return node instanceof HTMLElement && node.dataset.kind === "command";
    }

    function isCommandInteractiveTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest("button, input, textarea, select, [data-command-interactive]"));
    }

    function getRegisteredCommands() {
      return Array.isArray(window.SkydiveCommands) ? window.SkydiveCommands : [];
    }

    function getCommand(commandId) {
      return getRegisteredCommands().find((command) => command && command.id === commandId) || null;
    }

    function cloneCommandState(state) {
      if (!state || typeof state !== "object") return {};
      try {
        return JSON.parse(JSON.stringify(state));
      } catch (error) {
        return {};
      }
    }

    function readCommandState(node) {
      try {
        const parsed = JSON.parse(node.dataset.commandState || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function writeCommandState(node, state) {
      node.dataset.commandState = JSON.stringify(cloneCommandState(state));
    }

    function destroyCommandNodeContent(node) {
      if (!isCommandNode(node)) return;
      const command = getCommand(node.dataset.commandId || "");
      if (command && typeof command.destroy === "function") {
        command.destroy(node);
      }
    }

    function renderCommandNodeContent(node) {
      const command = getCommand(node.dataset.commandId || "");
      destroyCommandNodeContent(node);
      node.replaceChildren();
      if (!command || typeof command.render !== "function") {
        const missing = document.createElement("div");
        missing.textContent = "Missing command";
        missing.style.padding = "0.55em 0.7em";
        missing.style.border = "1px solid #e2d7c7";
        missing.style.borderRadius = "0.5em";
        missing.style.background = "#fffaf3";
        missing.style.color = "#7b6a58";
        node.appendChild(missing);
        return;
      }

      const state = readCommandState(node);
      command.render(node, state, (nextState) => {
        writeCommandState(node, nextState);
        renderCommandNodeContent(node);
        refreshSelectionBounds();
        scheduleAutosave();
      });
    }

    function updateCommandNodeState(node, nextState, options = {}) {
      if (!isCommandNode(node) || !world.contains(node)) return;
      writeCommandState(node, nextState);
      renderCommandNodeContent(node);
      refreshSelectionBounds();
      if (options.autosave !== false) scheduleAutosave();
    }

    function serializeNode(node) {
      const base = {
        id: node.dataset.nodeId || "",
        x: Number(node.dataset.x),
        y: Number(node.dataset.y),
        baseFontSize: Number(node.dataset.baseFontSize)
      };

      if (isCommandNode(node)) {
        return {
          ...base,
          kind: "command",
          commandId: node.dataset.commandId || "",
          ...(node.dataset.commandVersion ? { commandVersion: node.dataset.commandVersion } : {}),
          commandState: readCommandState(node)
        };
      }

      return {
        ...base,
        kind: "text",
        html: sanitizeNodeHtml(node.innerHTML),
        text: node.textContent || ""
      };
    }

    function getCaretTextOffset(root, range) {
      const before = range.cloneRange();
      before.selectNodeContents(root);
      before.setEnd(range.endContainer, range.endOffset);
      return before.toString().length;
    }

    function getTextPositionAtOffset(root, offset) {
      const targetOffset = Math.max(0, offset);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let remaining = targetOffset;
      let textNode = walker.nextNode();

      while (textNode) {
        const length = textNode.textContent.length;
        if (remaining <= length) {
          return { node: textNode, offset: remaining };
        }
        remaining -= length;
        textNode = walker.nextNode();
      }

      return { node: root, offset: root.childNodes.length };
    }

    function getSlashQueryForNode(node) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      if (!range.collapsed || !node.contains(range.endContainer)) return null;

      const caretOffset = getCaretTextOffset(node, range);
      const textBeforeCaret = (node.textContent || "").slice(0, caretOffset);
      const match = /(^|\s)\/([a-z0-9_-]*)(?:\s+([\s\S]*))?$/i.exec(textBeforeCaret);
      if (!match) return null;
      if (match[3] !== undefined && !match[2]) return null;

      return {
        query: match[2].toLowerCase(),
        args: typeof match[3] === "string" ? match[3].trim() : "",
        hasArgs: match[3] !== undefined,
        tokenStart: match.index + match[1].length,
        tokenEnd: caretOffset,
        range
      };
    }

    function getMatchingCommands(query) {
      const normalized = (query || "").toLowerCase();
      return getRegisteredCommands().filter((command) => {
        if (!command || !command.id) return false;
        const fields = [
          command.id,
          command.title,
          command.description,
          ...(Array.isArray(command.aliases) ? command.aliases : [])
        ].filter(Boolean).map((value) => String(value).toLowerCase());
        return fields.some((field) => field.includes(normalized));
      });
    }

    function closeSlashCommandMenu() {
      slashCommandSession = null;
      slashCommandSelectedIndex = 0;
      slashCommandMenu.hidden = true;
      slashCommandMenu.replaceChildren();
    }

    function positionSlashCommandMenu(range, fallbackNode) {
      const rect = range.getBoundingClientRect();
