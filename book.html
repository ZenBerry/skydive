<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Book - Skydive</title>
  <script src="/assets/disable-native-zoom.js"></script>
  <script src="https://unpkg.com/@zenberry/quico@latest/dist/quico.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap");

    @font-face {
      font-family: "Myriad Pro";
      src: url("https://res.cloudinary.com/zenberry/raw/upload/v1752586755/fonts/myriadpro_light.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    #shell {
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(320px, 42vw);
      background: #fff;
    }

    #reader {
      min-width: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-right: 1px solid #d8d8d8;
      background: linear-gradient(#fbfbfb, #fff 88px);
    }

    #bar {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: max(10px, env(safe-area-inset-top, 0)) max(14px, env(safe-area-inset-right, 0)) 8px max(14px, env(safe-area-inset-left, 0));
      border-bottom: 1px solid #e7e7e7;
    }

    .nav {
      width: 32px;
      height: 28px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: linear-gradient(#fff, #ececec);
      color: #333;
      font: 400 18px/1 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
    }

    .nav:disabled {
      color: #aaa;
      cursor: default;
    }

    #title {
      overflow: hidden;
      color: #555;
      font-size: 14px;
      line-height: 1.2;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #page-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 54px);
    }

    #page {
      --page-gap: 44px;
      --page-width: 100%;
      width: min(640px, 100%);
      height: min(860px, 100%);
      outline: none;
      overflow: hidden;
      color: #111;
      font-size: clamp(19px, 2vw, 23px);
      line-height: 1.48;
      user-select: text;
      -webkit-user-select: text;
      contain: layout paint style;
    }

    #book-flow {
      width: var(--page-width);
      height: 100%;
      column-fill: auto;
      column-gap: var(--page-gap);
      column-width: var(--page-width);
      orphans: 2;
      widows: 2;
      transition: opacity 160ms ease, transform 180ms ease;
    }

    #book-flow.turning {
      opacity: 0;
    }

    #page::selection,
    #page *::selection {
      background: #cfe0ff;
    }

    .epub-chapter {
      break-after: column;
      color: inherit !important;
      font-family: inherit !important;
      margin: 0;
      padding: 0;
    }

    .epub-chapter * {
      color: inherit !important;
      font-family: inherit !important;
    }

    .epub-chapter > :first-child {
      margin-top: 0;
    }

    .epub-chapter h1,
    .epub-chapter h2,
    .epub-chapter h3,
    .epub-chapter h4,
    .epub-chapter h5,
    .epub-chapter h6 {
      break-after: avoid;
      line-height: 1.15;
    }

    .epub-chapter p,
    .epub-chapter blockquote,
    .epub-chapter figure,
    .epub-chapter ul,
    .epub-chapter ol,
    .epub-chapter pre {
      break-inside: avoid;
    }

    .epub-chapter img,
    .epub-chapter svg,
    .epub-chapter video {
      max-width: 100%;
      height: auto;
    }

    .epub-highlight {
      border-radius: 2px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    ::highlight(epub-highlight-peach) {
      background-color: #f4cbb9;
    }

    ::highlight(epub-highlight-beige) {
      background-color: #fff8ed;
    }

    ::highlight(epub-highlight-green) {
      background-color: #c9e1ce;
    }

    ::highlight(epub-highlight-blue) {
      background-color: #c8def1;
    }

    ::highlight(epub-highlight-purple) {
      background-color: #ddcfed;
    }

    ::highlight(epub-highlight-gray) {
      background-color: #dfddd9;
    }

    ::highlight(epub-highlight-yellow) {
      background-color: #fff3a3;
    }

    #status {
      min-height: 34px;
      padding: 0 20px max(14px, env(safe-area-inset-bottom, 0));
      color: #777;
      font-size: 13px;
      line-height: 1;
      text-align: center;
    }

    #mark {
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }

    #menu {
      position: fixed;
      z-index: 10;
      min-width: 142px;
      border: 1px solid #cfcfcf;
      border-radius: 7px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    #highlight-colors {
      display: grid;
      grid-template-columns: repeat(7, 22px);
      gap: 5px;
      padding: 5px;
    }

    .highlight-swatch {
      width: 22px;
      height: 22px;
      border: 1px solid rgba(0, 0, 0, 0.22);
      border-radius: 999px;
      background: var(--swatch-color);
      cursor: pointer;
    }

    .highlight-swatch:hover {
      box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.12);
    }

    #discuss {
      width: 100%;
      border: 0;
      border-radius: 4px;
      padding: 7px 9px;
      background: transparent;
      color: #111;
      font: 400 14px/1.1 "Myriad Pro", "Roboto", "Helvetica Neue", Arial, sans-serif;
      text-align: left;
      cursor: pointer;
    }

    #discuss:hover {
      background: #e8efff;
    }

    @media (max-width: 800px) {
      #shell {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(42vh, 1fr) minmax(280px, 42vh);
      }

      #reader {
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #d8d8d8;
      }

      #mark {
        height: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #page {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <quico hidden>B</quico>
  <main id="shell">
    <section id="reader" aria-label="Book reader">
      <div id="bar">
        <button id="prev" class="nav" type="button" aria-label="Previous page">&lsaquo;</button>
        <div id="title"></div>
        <button id="next" class="nav" type="button" aria-label="Next page">&rsaquo;</button>
      </div>
      <div id="page-wrap">
        <article id="page" tabindex="0" aria-live="polite">
          <div id="book-flow"></div>
        </article>
      </div>
      <div id="status"></div>
    </section>
    <iframe id="mark" title="Mark" src="/mark"></iframe>
  </main>
  <div id="menu" hidden>
    <div id="highlight-colors" role="group" aria-label="Highlight color">
      <button class="highlight-swatch" type="button" aria-label="Highlight peach" data-highlight-color="#f4cbb9" style="--swatch-color: #f4cbb9"></button>
      <button class="highlight-swatch" type="button" aria-label="Highlight beige" data-highlight-color="#fff8ed" style="--swatch-color: #fff8ed"></button>
      <button class="highlight-swatch" type="button" aria-label="Highlight green" data-highlight-color="#c9e1ce" style="--swatch-color: #c9e1ce"></button>
      <button class="highlight-swatch" type="button" aria-label="Highlight blue" data-highlight-color="#c8def1" style="--swatch-color: #c8def1"></button>
      <button class="highlight-swatch" type="button" aria-label="Highlight purple" data-highlight-color="#ddcfed" style="--swatch-color: #ddcfed"></button>
      <button class="highlight-swatch" type="button" aria-label="Highlight gray" data-highlight-color="#dfddd9" style="--swatch-color: #dfddd9"></button>
      <button class="highlight-swatch" type="button" aria-label="Highlight yellow" data-highlight-color="#fff3a3" style="--swatch-color: #fff3a3"></button>
    </div>
    <button id="discuss" type="button">Discuss with Mark</button>
  </div>

  <script>
    const BOOKS_KEY = "skydive:book-reader:books";
    const params = new URLSearchParams(window.location.search);
    const titleElement = document.getElementById("title");
    const pageElement = document.getElementById("page");
    const flowElement = document.getElementById("book-flow");
    const statusElement = document.getElementById("status");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const markFrame = document.getElementById("mark");
    const menu = document.getElementById("menu");
    const discussButton = document.getElementById("discuss");
    const highlightColors = document.getElementById("highlight-colors");

    const HIGHLIGHT_COLORS = new Map([
      ["#f4cbb9", "epub-highlight-peach"],
      ["#fff8ed", "epub-highlight-beige"],
      ["#c9e1ce", "epub-highlight-green"],
      ["#c8def1", "epub-highlight-blue"],
      ["#ddcfed", "epub-highlight-purple"],
      ["#dfddd9", "epub-highlight-gray"],
      ["#fff3a3", "epub-highlight-yellow"]
    ]);
    let sourceUrl = "";
    let requestedName = "Book";
    let bookTitle = "Book";
    let bookId = 0;
    let pageCount = 0;
    let pageIndex = 0;
    let lastSelection = "";
    let lastSelectionRange = null;
    let resizeTimer = 0;
    let saveTimer = 0;
    let suppressSessionSave = false;
    let markHistory = [];
    let highlights = [];
    const objectUrls = new Map();

    function cleanText(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function cleanName(value) {
      return cleanText(String(value || "").replace(/\.epub$/i, "")) || "Book";
    }

    function normalizeHighlightColor(value) {
      const color = String(value || "").trim().toLowerCase();
      return HIGHLIGHT_COLORS.has(color) ? color : "";
    }

    function normalizePosition(value) {
      if (!value || typeof value !== "object") return { pageIndex: 0 };
      const index = Number(value.pageIndex);
      return { pageIndex: Number.isInteger(index) && index >= 0 ? index : 0 };
    }

    function normalizeHighlights(value) {
      const list = Array.isArray(value) ? value : [];
      return list.map((highlight) => {
        if (!highlight || typeof highlight !== "object") return null;
        const id = String(highlight.id || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 80);
        const start = Number(highlight.start);
        const end = Number(highlight.end);
        const color = normalizeHighlightColor(highlight.color);
        if (!id || !Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end <= start || !color) return null;
        return {
          id,
          start,
          end,
          color,
          text: cleanText(highlight.text || "")
        };
      }).filter(Boolean);
    }

    function normalizeMarkHistory(value) {
      const list = Array.isArray(value) ? value : [];
      return list.map((message) => {
        if (!message || typeof message !== "object") return null;
        const role = message.role === "assistant" ? "assistant" : message.role === "user" ? "user" : "";
        const content = String(message.content || "").trim();
        return role && content ? { role, content } : null;
      }).filter(Boolean).slice(-80);
    }

    function applyBookSession(book) {
      if (!book || typeof book !== "object") return;
      bookId = Number.isInteger(Number(book.id)) ? Number(book.id) : bookId;
      highlights = normalizeHighlights(book.highlights);
      markHistory = normalizeMarkHistory(book.markHistory);
      const position = normalizePosition(book.position);
      pageIndex = position.pageIndex;
    }

    function normalizeUrl(value) {
      const raw = typeof value === "string" ? value.trim() : "";
      if (!raw) return "";
      try {
        const url = new URL(raw, window.location.href);
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
      } catch (error) {
        return "";
      }
    }

    function readBookRegistry() {
      try {
        const books = JSON.parse(localStorage.getItem(BOOKS_KEY) || "[]");
        return Array.isArray(books) ? books.filter((book) => book && normalizeUrl(book.src)) : [];
      } catch (error) {
        return [];
      }
    }

    function writeBookRegistry(books) {
      try {
        localStorage.setItem(BOOKS_KEY, JSON.stringify(books));
      } catch (error) {
        console.warn("Could not save book registry:", error);
      }
    }

    function registerBook(src, name) {
      const href = normalizeUrl(src);
      if (!href) return null;
      const books = readBookRegistry();
      const existingIndex = books.findIndex((book) => normalizeUrl(book.src) === href);
      const entry = {
        src: href,
        name: name || "Book",
        openedAt: new Date().toISOString()
      };
      if (existingIndex !== -1) {
        books[existingIndex] = { ...books[existingIndex], ...entry };
        writeBookRegistry(books);
        return { id: existingIndex + 1, book: books[existingIndex] };
      }
      books.push(entry);
      writeBookRegistry(books);
      return { id: books.length, book: entry };
    }

    async function registerBookGlobally(src, name) {
      const href = normalizeUrl(src);
      if (!href) return null;
      try {
        const response = await fetch("/api/books", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ src: href, name })
        });
        if (response.ok) {
          const data = await response.json();
          if (data && data.book && data.book.id && normalizeUrl(data.book.src)) {
            registerBook(data.book.src, data.book.name);
            applyBookSession(data.book);
            return data;
          }
        }
      } catch (error) {
        console.warn("Could not register book globally:", error);
      }
      const local = registerBook(href, name);
      return local ? { book: { id: local.id, src: local.book.src, name: local.book.name } } : null;
    }

    async function getGlobalBook(id) {
      if (!Number.isInteger(id) || id < 1) return null;
      try {
        const response = await fetch(`/api/books?id=${encodeURIComponent(id)}`);
        if (response.ok) {
          const data = await response.json();
          if (data && data.book && normalizeUrl(data.book.src)) {
            registerBook(data.book.src, data.book.name);
            applyBookSession(data.book);
            return data.book;
          }
        }
      } catch (error) {
        console.warn("Could not load global book:", error);
      }
      const local = readBookRegistry()[id - 1];
      return local ? { id, src: local.src, name: local.name } : null;
    }

    function sessionPayload() {
      return {
        id: bookId,
        position: { pageIndex, updatedAt: Date.now() },
        highlights,
        markHistory
      };
    }

    async function saveBookSessionNow() {
      if (!bookId || suppressSessionSave) return;
      try {
        const response = await fetch("/api/books", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(sessionPayload())
        });
        if (!response.ok) console.warn("Could not save book session:", await response.text());
      } catch (error) {
        console.warn("Could not save book session:", error);
      }
    }

    function saveBookSessionOnExit() {
      if (!bookId || suppressSessionSave) return;
      window.clearTimeout(saveTimer);
      try {
        fetch("/api/books", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(sessionPayload()),
          keepalive: true
        }).catch((error) => console.warn("Could not save book session:", error));
      } catch (error) {
        console.warn("Could not save book session:", error);
      }
    }

    function queueBookSessionSave() {
      if (!bookId || suppressSessionSave) return;
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(saveBookSessionNow, 500);
    }

    function getPathBookId() {
      const match = location.pathname.match(/^\/book\/(\d+)\/?$/);
      return match ? Number(match[1]) : 0;
    }

    async function initializeBookLocation() {
      const querySource = normalizeUrl(params.get("src") || "");
      const queryName = params.get("name") || decodeURIComponent(location.pathname.split("/").pop() || "Book");
      const id = getPathBookId();

      if (querySource) {
        const registered = await registerBookGlobally(querySource, queryName);
        sourceUrl = registered ? registered.book.src : querySource;
        requestedName = registered ? registered.book.name : queryName;
        if (registered) applyBookSession(registered.book);
        if (registered && registered.book.id && location.pathname !== `/book/${registered.book.id}`) {
          history.replaceState(null, "", `/book/${registered.book.id}`);
        }
      } else if (id) {
        const entry = await getGlobalBook(id);
        if (entry) {
          sourceUrl = normalizeUrl(entry.src);
          requestedName = entry.name || "Book";
          applyBookSession(entry);
        }
      } else {
        requestedName = queryName;
      }

      bookTitle = cleanName(requestedName);
      titleElement.textContent = bookTitle;
      document.title = `${bookTitle} - Skydive`;
    }

    function joinPath(base, href) {
      if (!base) return href;
      if (/^[a-z]+:/i.test(href) || href.startsWith("/")) return href.replace(/^\/+/, "");
      const stack = base.split("/").filter(Boolean);
      href.split("/").forEach((part) => {
        if (!part || part === ".") return;
        if (part === "..") stack.pop();
        else stack.push(part);
      });
      return stack.join("/");
    }

    function dirname(path) {
      const index = path.lastIndexOf("/");
      return index === -1 ? "" : path.slice(0, index);
    }

    function textFromBytes(bytes) {
      return new TextDecoder("utf-8").decode(bytes);
    }

    function mimeFromPath(path) {
      const extension = path.split("?")[0].split("#")[0].split(".").pop().toLowerCase();
      const types = {
        css: "text/css",
        gif: "image/gif",
        jpeg: "image/jpeg",
        jpg: "image/jpeg",
        otf: "font/otf",
        png: "image/png",
        svg: "image/svg+xml",
        ttf: "font/ttf",
        webp: "image/webp",
        woff: "font/woff",
        woff2: "font/woff2"
      };
      return types[extension] || "application/octet-stream";
    }

    function readUint16(view, offset) {
      return view.getUint16(offset, true);
    }

    function readUint32(view, offset) {
      return view.getUint32(offset, true);
    }

    async function inflateRaw(bytes) {
      if (!("DecompressionStream" in window)) {
        throw new Error("This browser cannot unpack compressed EPUB files yet.");
      }

      const formats = ["deflate-raw", "deflate"];
      let lastError = null;
      for (const format of formats) {
        try {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("Could not decompress this EPUB.");
    }

    function parseZip(buffer) {
      const view = new DataView(buffer);
      let eocd = -1;
      for (let offset = buffer.byteLength - 22; offset >= Math.max(0, buffer.byteLength - 66000); offset -= 1) {
        if (readUint32(view, offset) === 0x06054b50) {
          eocd = offset;
          break;
        }
      }
      if (eocd === -1) throw new Error("This does not look like an EPUB file.");

      const entryCount = readUint16(view, eocd + 10);
      let offset = readUint32(view, eocd + 16);
      const entries = new Map();

      for (let index = 0; index < entryCount; index += 1) {
        if (readUint32(view, offset) !== 0x02014b50) break;
        const method = readUint16(view, offset + 10);
        const compressedSize = readUint32(view, offset + 20);
        const uncompressedSize = readUint32(view, offset + 24);
        const nameLength = readUint16(view, offset + 28);
        const extraLength = readUint16(view, offset + 30);
        const commentLength = readUint16(view, offset + 32);
        const localOffset = readUint32(view, offset + 42);
        const nameBytes = new Uint8Array(buffer, offset + 46, nameLength);
        const name = textFromBytes(nameBytes);
        entries.set(name, { method, compressedSize, uncompressedSize, localOffset });
        offset += 46 + nameLength + extraLength + commentLength;
      }

      return {
        entries,
        async read(name) {
          const entry = entries.get(name);
          if (!entry) throw new Error(`Missing EPUB entry: ${name}`);
          const localNameLength = readUint16(view, entry.localOffset + 26);
          const localExtraLength = readUint16(view, entry.localOffset + 28);
          const start = entry.localOffset + 30 + localNameLength + localExtraLength;
          const compressed = new Uint8Array(buffer, start, entry.compressedSize);
          if (entry.method === 0) return compressed;
          if (entry.method === 8) return inflateRaw(compressed);
          if (entry.uncompressedSize === 0) return new Uint8Array();
          throw new Error("This EPUB uses an unsupported ZIP compression method.");
        },
        async text(name) {
          return textFromBytes(await this.read(name));
        }
      };
    }

    function parseXml(text, label) {
      const doc = new DOMParser().parseFromString(text, "application/xml");
      if (doc.querySelector("parsererror")) throw new Error(`Could not read ${label}.`);
      return doc;
    }

    function attr(element, name) {
      return element ? element.getAttribute(name) || "" : "";
    }

    function elementsByLocalName(root, name) {
      return Array.from(root.getElementsByTagName("*")).filter((element) => element.localName === name);
    }

    function firstByLocalName(root, name) {
      return elementsByLocalName(root, name)[0] || null;
    }

    async function makeResourceUrl(path, zip) {
      if (!path || !zip.entries.has(path)) return "";
      if (objectUrls.has(path)) return objectUrls.get(path);
      try {
        const bytes = await zip.read(path);
        const blobUrl = URL.createObjectURL(new Blob([bytes], { type: mimeFromPath(path) }));
        objectUrls.set(path, blobUrl);
        return blobUrl;
      } catch (error) {
        console.warn("Could not load EPUB resource:", path, error);
        return "";
      }
    }

    async function rewriteCssUrls(css, base, zip) {
      const source = String(css || "");
      const matches = Array.from(source.matchAll(/url\((['"]?)([^'")]+)\1\)/gi));
      let rewritten = source;
      for (const match of matches) {
        const rawUrl = match[2];
        const value = rawUrl.trim();
        if (!value || /^(data:|blob:|https?:|about:|#)/i.test(value)) continue;
        const resourcePath = joinPath(base, value);
        const url = await makeResourceUrl(resourcePath, zip);
        rewritten = rewritten.split(match[0]).join(url ? `url("${url}")` : "none");
      }
      return rewritten;
    }

    function stripReaderOverrides(css) {
      return String(css || "").replace(/(^|[;{])\s*(font-family|color)\s*:[^;{}]+;?/gi, "$1");
    }

    async function prepareChapterCss(css, base, zip) {
      return scopeCss(stripReaderOverrides(await rewriteCssUrls(css, base, zip)));
    }

    function scopeCss(css) {
      const scoped = [];
      let buffer = "";
      let depth = 0;
      for (const char of css) {
        buffer += char;
        if (char === "{") depth += 1;
        else if (char === "}") {
          depth -= 1;
          if (depth === 0) {
            scoped.push(scopeCssRule(buffer));
            buffer = "";
          }
        }
      }
      if (buffer.trim()) scoped.push(scopeCssRule(buffer));
      return scoped.join("\n");
    }

    function scopeCssRule(rule) {
      const index = rule.indexOf("{");
      if (index === -1) return rule;
      const selector = rule.slice(0, index).trim();
      const body = rule.slice(index);
      if (!selector) return rule;
      if (/^@(media|supports|container)\b/i.test(selector)) {
        return `${selector} {${scopeCss(body.slice(1, -1))}}`;
      }
      if (selector.startsWith("@")) return rule;
      const scopedSelectors = selector.split(",").map((part) => {
        const trimmed = part.trim();
        if (!trimmed) return "";
        if (/^(html|body)([\s.#:[>+~]|$)/i.test(trimmed)) {
          return trimmed.replace(/^(html|body)/i, ".epub-chapter");
        }
        return `.epub-chapter ${trimmed}`;
      }).filter(Boolean);
      return scopedSelectors.length ? `${scopedSelectors.join(", ")} ${body}` : rule;
    }

    async function rewriteSrcset(value, base, zip) {
      const parts = [];
      for (const part of String(value || "").split(",")) {
        const pieces = part.trim().split(/\s+/);
        const url = pieces.shift();
        if (!url || /^(data:|blob:|https?:|about:|#)/i.test(url)) {
          parts.push(part.trim());
          continue;
        }
        const resourceUrl = await makeResourceUrl(joinPath(base, url), zip);
        if (resourceUrl) parts.push([resourceUrl, ...pieces].join(" "));
      }
      return parts.join(", ");
    }

    async function sanitizeChapterHtml(html, path, zip, cssByPath) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const base = dirname(path);
      const chapter = document.createElement("section");
      chapter.className = "epub-chapter";

      doc.querySelectorAll("script, object, embed, iframe").forEach((node) => node.remove());
      doc.querySelectorAll("*").forEach((node) => {
        Array.from(node.attributes).forEach((attribute) => {
          if (/^on/i.test(attribute.name)) node.removeAttribute(attribute.name);
        });
        if (node.hasAttribute("style")) {
          node.style.removeProperty("font-family");
          node.style.removeProperty("color");
        }
      });

      for (const link of doc.querySelectorAll("link[rel~='stylesheet']")) {
        const href = attr(link, "href");
        const cssPath = href ? joinPath(base, href) : "";
        if (cssPath && cssByPath.has(cssPath)) {
          const style = document.createElement("style");
          style.textContent = await prepareChapterCss(cssByPath.get(cssPath), dirname(cssPath), zip);
          chapter.appendChild(style);
        }
        link.remove();
      }

      for (const styleNode of doc.querySelectorAll("style")) {
        styleNode.textContent = await prepareChapterCss(styleNode.textContent, base, zip);
      }

      for (const node of doc.querySelectorAll("img, image, source")) {
        const src = attr(node, "src") || attr(node, "href") || attr(node, "xlink:href");
        if (src && !/^(data:|blob:|https?:|about:|#)/i.test(src)) {
          const url = await makeResourceUrl(joinPath(base, src), zip);
          node.removeAttribute("xlink:href");
          if (url && node.hasAttribute("src")) node.setAttribute("src", url);
          else if (url) node.setAttribute("href", url);
          else {
            node.removeAttribute("src");
            node.removeAttribute("href");
          }
        }
        if (node.hasAttribute("srcset")) {
          const srcset = await rewriteSrcset(node.getAttribute("srcset"), base, zip);
          if (srcset) node.setAttribute("srcset", srcset);
          else node.removeAttribute("srcset");
        }
      }

      doc.querySelectorAll("a[href]").forEach((link) => {
        const href = attr(link, "href");
        if (/^(javascript:|data:)/i.test(href)) link.removeAttribute("href");
      });

      const body = doc.body || doc.documentElement;
      Array.from(body.childNodes).forEach((node) => chapter.appendChild(document.importNode(node, true)));
      chapter.querySelectorAll("img").forEach((image) => {
        image.addEventListener("load", recalculatePages, { once: true });
      });
      return chapter;
    }

    function setError(message) {
      flowElement.textContent = message || "Could not open this book.";
      statusElement.textContent = "";
      pageCount = 0;
      prevButton.disabled = true;
      nextButton.disabled = true;
    }

    function recalculatePages() {
      const width = pageElement.clientWidth || 1;
      const gap = Number.parseFloat(getComputedStyle(pageElement).getPropertyValue("--page-gap")) || 44;
      pageElement.style.setProperty("--page-width", `${width}px`);
      pageCount = Math.max(1, Math.ceil((flowElement.scrollWidth + gap) / (width + gap)));
      pageIndex = Math.max(0, Math.min(pageIndex, pageCount - 1));
      renderPage();
    }

    function textNodesInFlow() {
      const nodes = [];
      const walker = document.createTreeWalker(flowElement, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent || parent.closest("style, script")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      while (walker.nextNode()) nodes.push(walker.currentNode);
      return nodes;
    }

    function rangeOffsets(range) {
      const nodes = textNodesInFlow();
      let offset = 0;
      let start = -1;
      let end = -1;
      for (const node of nodes) {
        if (node === range.startContainer) start = offset + range.startOffset;
        if (node === range.endContainer) end = offset + range.endOffset;
        offset += node.nodeValue.length;
      }
      return start >= 0 && end > start ? { start, end } : null;
    }

    function rangeFromOffsets(start, end) {
      const nodes = textNodesInFlow();
      let offset = 0;
      let startNode = null;
      let endNode = null;
      let startOffset = 0;
      let endOffset = 0;
      for (const node of nodes) {
        const nextOffset = offset + node.nodeValue.length;
        if (!startNode && start >= offset && start <= nextOffset) {
          startNode = node;
          startOffset = start - offset;
        }
        if (!endNode && end >= offset && end <= nextOffset) {
          endNode = node;
          endOffset = end - offset;
          break;
        }
        offset = nextOffset;
      }
      if (!startNode || !endNode) return null;
      const range = document.createRange();
      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);
      return range;
    }

    function clearFallbackHighlights() {
      flowElement.querySelectorAll(".epub-highlight").forEach((node) => node.replaceWith(...node.childNodes));
      flowElement.normalize();
    }

    function highlightParts(start, end) {
      const parts = [];
      let offset = 0;
      for (const node of textNodesInFlow()) {
        const nextOffset = offset + node.nodeValue.length;
        const partStart = Math.max(start, offset);
        const partEnd = Math.min(end, nextOffset);
        if (partEnd > partStart) {
          const range = document.createRange();
          range.setStart(node, partStart - offset);
          range.setEnd(node, partEnd - offset);
          parts.push(range);
        }
        offset = nextOffset;
        if (offset >= end) break;
      }
      return parts;
    }

    function applyFallbackHighlight(highlight) {
      const parts = highlightParts(highlight.start, highlight.end).reverse();
      parts.forEach((range) => {
        const span = document.createElement("span");
        span.className = "epub-highlight";
        span.dataset.highlightId = highlight.id;
        span.style.backgroundColor = highlight.color;
        const fragment = range.extractContents();
        span.appendChild(fragment);
        range.insertNode(span);
      });
      return parts.length > 0;
    }

    function applySavedHighlights() {
      clearFallbackHighlights();
      normalizeHighlights(highlights)
        .sort((left, right) => right.start - left.start)
        .forEach(applyFallbackHighlight);
    }

    function createHighlight(color) {
      const selection = window.getSelection();
      const range = lastSelectionRange || (selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null);
      const normalizedColor = normalizeHighlightColor(color);
      if (!range || !normalizedColor || !pageElement.contains(range.commonAncestorContainer)) return;
      const offsets = rangeOffsets(range);
      if (!offsets) return;
      const highlight = {
        id: `h${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`,
        ...offsets,
        color: normalizedColor,
        text: cleanText(range.toString()).slice(0, 500)
      };
      highlights = [...highlights, highlight].slice(-500);
      applySavedHighlights();
      if (selection) selection.removeAllRanges();
      lastSelectionRange = null;
      hideMenu();
      queueBookSessionSave();
    }

    async function loadBook() {
      if (!sourceUrl) throw new Error("Missing book URL. Open an EPUB from a Skydive file card first so the reader can assign it a /book/number address.");
      statusElement.textContent = "Opening...";
      const response = await fetch(sourceUrl);
      if (!response.ok) throw new Error("Could not download this EPUB.");

      const zip = parseZip(await response.arrayBuffer());
      const container = parseXml(await zip.text("META-INF/container.xml"), "container.xml");
      const packagePath = attr(firstByLocalName(container, "rootfile"), "full-path");
      if (!packagePath) throw new Error("This EPUB has no package file.");

      const packageDoc = parseXml(await zip.text(packagePath), "the book package");
      const packageDir = dirname(packagePath);
      const titleNode = firstByLocalName(packageDoc, "title");
      bookTitle = cleanText(titleNode && titleNode.textContent) || bookTitle;
      titleElement.textContent = bookTitle;
      document.title = `${bookTitle} - Skydive`;

      const manifest = new Map();
      const cssPaths = [];
      elementsByLocalName(packageDoc, "item").forEach((item) => {
        const id = attr(item, "id");
        const href = attr(item, "href");
        const mediaType = attr(item, "media-type").toLowerCase();
        if (id && href) {
          const path = joinPath(packageDir, href);
          manifest.set(id, path);
          if (mediaType === "text/css" || /\.css(?:$|[?#])/i.test(path)) cssPaths.push(path);
        }
      });

      const spine = elementsByLocalName(packageDoc, "itemref")
        .map((item) => manifest.get(attr(item, "idref")))
        .filter(Boolean);
      if (!spine.length) throw new Error("This EPUB has no readable spine.");

      const cssByPath = new Map();
      for (const path of cssPaths) {
        try {
          cssByPath.set(path, await zip.text(path));
        } catch (error) {
          console.warn("Skipping EPUB stylesheet:", path, error);
        }
      }

      flowElement.textContent = "";
      for (const path of spine) {
        try {
          flowElement.appendChild(sanitizeChapterHtml(await zip.text(path), path, zip, cssByPath));
        } catch (error) {
          console.warn("Skipping EPUB chapter:", path, error);
        }
      }

      if (!cleanText(flowElement.textContent)) throw new Error("This book has no readable text.");
      applySavedHighlights();
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      recalculatePages();
      sendBookContext();
    }

    function renderPage() {
      flowElement.classList.add("turning");
      window.setTimeout(() => {
        const width = pageElement.clientWidth || 1;
        const gap = Number.parseFloat(getComputedStyle(pageElement).getPropertyValue("--page-gap")) || 44;
        flowElement.style.transform = `translateX(${-pageIndex * (width + gap)}px)`;
        statusElement.textContent = pageCount ? `${pageIndex + 1} / ${pageCount}` : "";
        prevButton.disabled = pageIndex <= 0;
        nextButton.disabled = pageIndex >= pageCount - 1;
        flowElement.classList.remove("turning");
      }, 80);
    }

    function movePage(delta) {
      const nextIndex = Math.max(0, Math.min(pageCount - 1, pageIndex + delta));
      if (nextIndex === pageIndex) return;
      pageIndex = nextIndex;
      hideMenu();
      renderPage();
      void saveBookSessionNow();
    }

    function sendBookContext() {
      markFrame.contentWindow.postMessage({
        type: "skydive:book-context",
        book: { id: bookId, title: bookTitle, markHistory }
      }, window.location.origin);
    }

    function currentPageText() {
      const pageRect = pageElement.getBoundingClientRect();
      const visible = [];
      const walker = document.createTreeWalker(flowElement, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (!cleanText(node.nodeValue)) continue;
        const range = document.createRange();
        range.selectNodeContents(node);
        const intersects = Array.from(range.getClientRects()).some((rect) => (
          rect.right > pageRect.left &&
          rect.left < pageRect.right &&
          rect.bottom > pageRect.top &&
          rect.top < pageRect.bottom
        ));
        range.detach();
        if (intersects) visible.push(node.nodeValue);
      }
      return cleanText(visible.join(" ")) || cleanText(pageElement.textContent || "");
    }

    function hideMenu() {
      menu.hidden = true;
    }

    function selectedText() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed) return "";
      if (!pageElement.contains(selection.anchorNode) || !pageElement.contains(selection.focusNode)) return "";
      return cleanText(selection.toString());
    }

    function discussSelection() {
      const selection = lastSelection || selectedText();
      if (!selection) return;
      markFrame.contentWindow.postMessage({
        type: "skydive:mark-attachments",
        book: { title: bookTitle },
        attachments: [
          { title: "Selected passage", text: selection },
          { title: `Page ${pageIndex + 1}`, text: currentPageText() }
        ]
      }, window.location.origin);
      hideMenu();
    }

    prevButton.addEventListener("click", () => movePage(-1));
    nextButton.addEventListener("click", () => movePage(1));
    discussButton.addEventListener("click", discussSelection);
    highlightColors.addEventListener("click", (event) => {
      const swatch = event.target.closest(".highlight-swatch");
      if (!swatch || !highlightColors.contains(swatch)) return;
      createHighlight(swatch.dataset.highlightColor || "");
    });

    pageElement.addEventListener("contextmenu", (event) => {
      const text = selectedText();
      if (!text) return;
      event.preventDefault();
      lastSelection = text;
      const selection = window.getSelection();
      lastSelectionRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
      menu.hidden = false;
      menu.style.left = `${Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 10)}px`;
      menu.style.top = `${Math.min(event.clientY, window.innerHeight - menu.offsetHeight - 10)}px`;
    });

    document.addEventListener("click", (event) => {
      if (!menu.contains(event.target)) hideMenu();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") movePage(-1);
      else if (event.key === "ArrowRight") movePage(1);
      else if (event.key === "Escape") hideMenu();
    });

    markFrame.addEventListener("load", sendBookContext);
    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin || !event.data || typeof event.data !== "object") return;
      if (event.data.type !== "skydive:mark-history") return;
      markHistory = normalizeMarkHistory(event.data.history);
      queueBookSessionSave();
    });
    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(recalculatePages, 140);
    });
    window.addEventListener("pagehide", saveBookSessionOnExit);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") saveBookSessionOnExit();
    });

    initializeBookLocation().then(loadBook).catch((error) => {
      console.error(error);
      setError(error.message || "Could not open this book.");
    });
  </script>
</body>
</html>
